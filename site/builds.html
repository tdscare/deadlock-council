<title>Rizuhble Build Browser</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@700;800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: dark game-menu shell, hero list on the left, in-game style build panel on the right */
:root{
  --shell:#1b2027; --shell2:#252c35; --line:#38424e;
  --panel:#cdbf9f; --panel-dark:#bfae8a; --box:#a8977a; --boxhead:#5e5140; --boxbody:#b3a284;
  --teal:#3a9fbf; --tealdeep:#2b7d98; --ink:#f3ede1; --inkdim:#c9c1b2; --dark:#1d1a16;
  --weapon:#e0913a; --weapon-lab:#e7c792; --spirit:#a58ad6; --spirit-lab:#d2c5ec; --vit:#7cbc45; --vit-lab:#c4dca6;
  --opt:#4a86c8; --focus:#ffd36b;
  --display:"Alegreya Sans SC", "Trebuchet MS", sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", sans-serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--shell);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
.side h1{font-family:var(--display);font-size:26px;letter-spacing:.04em;margin:0 0 4px;text-transform:uppercase}
.side p{color:var(--inkdim);font-size:13px;margin:0 0 14px;line-height:1.4}
.tabs{display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){.tabs{flex-direction:row;flex-wrap:wrap}}
.tab{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;
  padding:8px 10px;border-radius:4px;background:var(--shell2);border:1px solid var(--line);font-family:var(--cond);font-size:16px;font-weight:600}
.tab small{font-family:var(--body);font-size:11px;color:var(--inkdim);font-weight:500}
.tab[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.tab[aria-selected="true"] small{color:#e6f6fb}
.tab:focus-visible{outline:2px solid var(--focus)}
.grp{font-family:var(--cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--inkdim);margin:12px 0 4px}

.win{min-width:0;background:var(--panel);border-radius:4px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bar{background:var(--teal);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.bar h2{font-family:var(--display);color:#14181d;font-size:clamp(20px,2.4vw,28px);margin:0;flex:1;min-width:0;text-wrap:balance}
.pill{font-family:var(--cond);font-weight:700;font-size:15px;background:#1f5d72;color:#e7f7fc;border-radius:20px;padding:5px 14px;border:2px solid #154555}
.desc{background:var(--panel-dark);color:var(--dark);padding:10px 18px;font-size:15px;font-weight:500;border-bottom:1px solid #a8967a}
.canvas{padding:14px;overflow-x:auto;
  background-image:radial-gradient(rgba(80,60,30,.07) 1px,transparent 1px);background-size:6px 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-start}
.cat{background:var(--boxbody);border:1px solid #8c7b60;border-radius:2px;flex:none}
.cat.optional{background:#9fa7b3;border-color:#7e8796}
.cat .hd{background:var(--boxhead);color:#fff;padding:5px 9px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cat.optional .hd{background:#4c5767}
.hd b{font-family:var(--cond);font-size:16px;font-weight:700}
.hd .o{font-family:var(--cond);font-size:11px;letter-spacing:.06em;color:#9dc4f2;font-weight:700}
.hd i{font-style:normal;font-size:12.5px;color:#e8e1d3}
.items{display:flex;gap:4px;padding:6px;flex-wrap:nowrap}

.it{all:unset;cursor:pointer;width:58px;height:86px;border-radius:3px;position:relative;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 2px 3px rgba(0,0,0,.35)}
.it:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.it{background-size:cover}
.it .ic{flex:none;height:56px;display:grid;place-items:center;padding:3px 3px 0}
.it .ic img{width:52px;height:52px;border-radius:2px;display:block}
.w .ic,.s .ic,.v .ic{background:none!important;filter:none!important}
.it .nm{flex:1;font-size:10px}
.t4 .nm{color:#f3ede1;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.it .gl{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:15px;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.6)}
.it .nm{font-family:var(--cond);font-weight:700;font-size:10.5px;line-height:1.05;color:var(--dark);text-align:center;padding:2px 2px 4px;min-height:27px;display:grid;place-items:center}
.it .tr{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 20px 20px 0}
.it .tn{position:absolute;top:1px;right:2px;font-family:var(--cond);font-size:10px;font-weight:700;color:#fff}
.it .imb{position:absolute;left:0;right:0;top:40px;text-align:center;font-family:var(--cond);font-size:9px;font-weight:700;color:#fff;letter-spacing:.06em}
.it .imb span{background:#1d1a16;padding:0 3px;border-radius:2px}
.it.hasnote::after{content:"";position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--dark);opacity:.55}
.w{background:var(--weapon-lab)} .w .ic{background:linear-gradient(#f2dcb3,#e8c88e)} .w .gl{background:var(--weapon)} .w .tr{border-color:transparent var(--weapon) transparent transparent}
.s{background:var(--spirit-lab)} .s .ic{background:linear-gradient(#e2d8f4,#cdbfe9)} .s .gl{background:var(--spirit)} .s .tr{border-color:transparent var(--spirit) transparent transparent}
.v{background:var(--vit-lab)} .v .ic{background:linear-gradient(#dbe9c9,#c3da9f)} .v .gl{background:var(--vit)} .v .tr{border-color:transparent var(--vit) transparent transparent}
.t3 .ic,.t4 .ic{filter:saturate(1.15) brightness(.86)}
.t4 .gl{box-shadow:0 0 0 2px rgba(255,255,255,.55)}

.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:0 14px 16px}
@media (max-width:1100px){.lower{grid-template-columns:minmax(0,1fr)}}
.card{background:#2a2622;color:var(--ink);border-radius:4px;padding:12px 14px;min-width:0}
.card h3{font-family:var(--cond);font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px;color:var(--inkdim)}
.ao{display:grid;grid-template-columns:110px repeat(16,minmax(18px,1fr));gap:3px;align-items:center;overflow-x:auto;font-family:var(--cond)}
.ao .an{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.ao .c{height:22px;border-radius:2px;background:#3a342e;display:grid;place-items:center;font-size:11px;font-weight:700}
.ao .c.on{background:var(--teal);color:#fff}
.ao .c.un{background:#d6a940;color:#1d1a16}
.ao .hdr{font-size:10px;color:var(--inkdim);text-align:center}
.legend{font-size:12px;color:var(--inkdim);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .l1::before{background:#d6a940}.legend .l2::before{background:var(--teal)}
.note{font-size:14px;line-height:1.45;min-height:84px}
.note .ttl{font-family:var(--cond);font-size:20px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.note .meta{font-size:12px;color:var(--inkdim);font-family:var(--cond);letter-spacing:.05em;text-transform:uppercase}
.note p{margin:6px 0 0;max-width:62ch}
.sim h3{display:flex;justify-content:space-between;align-items:center}
.reset{all:unset;cursor:pointer;font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:.06em;background:#3a342e;color:var(--ink);padding:4px 12px;border-radius:12px}
.reset:focus-visible{outline:2px solid var(--focus)}
.simtop{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.spent{display:flex;flex-direction:column;font-family:var(--cond)}
.spent b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}.spent span{font-size:12px;color:var(--inkdim);letter-spacing:.08em;text-transform:uppercase}
.bars{flex:1;min-width:240px;display:grid;gap:6px}
.ib{display:grid;grid-template-columns:62px 1fr 58px;gap:8px;align-items:center;font-family:var(--cond);font-size:14px}
.track{position:relative;height:12px;background:#3a342e;border-radius:6px;overflow:hidden}
.track .fill{height:100%}
.track.w .fill{background:var(--weapon)}.track.s .fill{background:var(--spirit)}.track.v .fill{background:var(--vit)}
.track .tick{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;opacity:.8}
.iv{font-variant-numeric:tabular-nums;text-align:right}.iv.hit{color:#9be36b}
.slots{display:grid;grid-template-columns:repeat(12,minmax(0,40px));gap:4px;margin-top:12px}
.slot{aspect-ratio:1;max-width:100%;border-radius:3px;background:#3a342e;display:grid;place-items:center;font-family:var(--cond);font-size:11px;font-weight:700;overflow:hidden}
.slot img{width:100%;height:100%;display:block}
.warn{color:#ff9a7a;font-size:13px;margin:8px 0 0}
.hint{color:var(--inkdim);font-size:12px;margin:8px 0 0}
.it.owned{filter:brightness(.55)}
.it.owned::before{content:"OWNED";position:absolute;left:0;right:0;top:22px;text-align:center;font-family:var(--cond);font-weight:800;font-size:12px;color:#9be36b;z-index:2;text-shadow:0 1px 2px #000}
.changes{font-size:13.5px;line-height:1.45;color:var(--inkdim);margin:0;padding-left:18px}
.changes li{margin-bottom:3px}
@media (prefers-reduced-motion:no-preference){.it{transition:transform .08s}.it:hover{transform:translateY(-2px)}}

/* closer to in-game boxes */
.cat{width:min-content;background:rgba(70,62,54,.78);border:1px solid rgba(40,34,28,.5);border-radius:3px}
.cat.optional{background:rgba(66,76,96,.82);border-color:rgba(36,42,56,.6)}
.cat .hd{background:rgba(255,255,255,.07);padding:6px 9px 5px;display:block;line-height:1.15}
.cat.optional .hd{background:rgba(255,255,255,.06)}
.hd b{font-family:var(--cond);font-size:16px;font-weight:700;color:#f5efe4;letter-spacing:.01em}
.hd .o{margin-left:6px;font-size:11px;color:#8fb8ee}
.hd i{display:block;margin-top:2px;font-size:12px;color:#ddd5c6}
.items{gap:5px;padding:6px 7px 8px}
.it{width:60px;height:88px}
.it .ic{height:58px;padding:4px 4px 0}
.it .ic img{width:52px;height:52px}
.t3 .nm,.t4 .nm{color:#f3ede1;text-shadow:0 1px 2px rgba(0,0,0,.75)}
.row{gap:8px;margin-bottom:8px}
.cat{min-width:170px}
.it .nm.sm{font-size:8.6px;letter-spacing:-.01em}
.tip{position:fixed;z-index:50;width:320px;max-width:calc(100vw - 16px);background:#1e1b18;border:1px solid #4a423a;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;overflow:hidden}
.tip .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 10px;font-family:var(--cond)}
.tip .th b{font-size:20px}.tip .th span{font-size:15px;color:#7fe0c4;font-weight:700}
.tip.w .th{background:#9a5a1c}.tip.s .th{background:#5d4691}.tip.v .th{background:#4c7a25}
.tip .ts{display:flex;flex-direction:column;gap:2px;padding:8px 12px;font-size:14px;color:#e8e1d3;border-bottom:1px solid #3a342e}
.tip .tm{padding:6px 10px 0;font-family:var(--cond);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#d6a940}
.tip .tn2{padding:10px 12px 12px;font-size:15.5px;line-height:1.45;color:#fff;background:#2a2622}
.pill.copy{cursor:pointer;background:#c8a24a;color:#1a1408;border-color:#8a6d2a}
.pill.copy:hover{filter:brightness(1.1)}
#codebox{width:100%;height:70px;margin:6px 0;font:11px monospace;background:#111;color:#ddd;border:1px solid #444;border-radius:4px}
/* editor + dock */
body{padding-bottom:150px}
.desc{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.desc .hero{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:#2a2622;color:var(--ink);padding:2px 8px;border-radius:3px}
.bdesc{flex:1;min-width:200px}
[contenteditable="true"]{outline:1px dashed rgba(255,255,255,.35);outline-offset:2px;border-radius:2px;cursor:text}
.desc [contenteditable="true"]{outline-color:rgba(0,0,0,.35)}
[contenteditable="true"]:focus{outline:2px solid var(--focus)}
.ed-d:empty::before{content:attr(data-ph);opacity:.5}
.ed-d{display:block;min-height:1.2em}
.pill{cursor:pointer}
.pill.del{background:#7a2e22;border-color:#4e1b13}
.tab.newb{justify-content:center;background:#2c3a30;border-color:#3f5a46;margin-top:10px}
.tab small{max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boxctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-family:var(--cond);font-size:13px;color:#e8e1d3}
.boxctl label{display:flex;gap:4px;align-items:center;cursor:pointer}
.boxctl .mv{display:flex;gap:2px}
.boxctl button{all:unset;cursor:pointer;background:rgba(0,0,0,.35);color:#fff;font-size:11px;padding:3px 6px;border-radius:3px;font-family:var(--cond);font-weight:700}
.boxctl button:hover{background:rgba(0,0,0,.55)}
.boxctl .xbox{margin-left:auto;background:#7a2e22}
.editing .cat{min-width:260px}
.items.over{outline:2px dashed var(--focus);outline-offset:-3px}
.it.dragging{opacity:.4}
.editing .canvas .it{cursor:grab}
.it.addit{background:rgba(0,0,0,.25);border:2px dashed rgba(255,255,255,.4);box-shadow:none;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:300;cursor:pointer}
.it.addit:hover{background:rgba(0,0,0,.4)}
.addbox{all:unset;cursor:pointer;display:inline-block;margin-top:4px;padding:8px 14px;border:2px dashed rgba(60,45,25,.5);border-radius:4px;font-family:var(--cond);font-weight:700;color:#3a2e20}
.addbox:hover{background:rgba(0,0,0,.06)}
.ao.edit .c{all:unset;cursor:pointer;height:22px;border-radius:2px;background:#3a342e;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--cond)}
.ao.edit .c:hover{background:#544b42}
.ao.edit .c.on{background:var(--teal);color:#fff}.ao.edit .c.un{background:#d6a940;color:#1d1a16}
.ao .c.bad{background:#b0402c;color:#fff}
.reset.clr{margin-left:8px}
/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#1e1b18f2;border-top:1px solid #4a423a;box-shadow:0 -6px 20px rgba(0,0,0,.45);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(4px)}
#dock .dk{max-width:1500px;margin:0 auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#dock .bars{flex:1;min-width:220px;gap:4px}
#dock .slots{margin:0;grid-template-columns:repeat(12,34px);gap:3px}
#dock .slot{width:34px;height:34px;border:0;padding:0;cursor:default}
#dock .slot.full{cursor:pointer}
#dock .warn{max-width:1500px;margin:6px auto 0}
@media (max-width:860px){#dock .slots{grid-template-columns:repeat(12,minmax(0,1fr));width:100%}#dock .slot{width:auto;height:auto;aspect-ratio:1}body{padding-bottom:210px}}
@media (prefers-reduced-motion:no-preference){#dock.pop{animation:pop .35s ease-out}@keyframes pop{0%{box-shadow:0 -6px 20px rgba(0,0,0,.45),inset 0 3px 0 var(--focus)}100%{box-shadow:0 -6px 20px rgba(0,0,0,.45),inset 0 0 0 transparent}}}
/* dialogs */
dialog{background:#24201c;color:var(--ink);border:1px solid #4a423a;border-radius:6px;padding:18px;max-width:min(760px,calc(100vw - 32px));width:100%;max-height:calc(100vh - 40px);box-shadow:0 20px 50px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{font-family:var(--cond);font-size:22px;margin:0 0 10px}
dialog .dx{all:unset;cursor:pointer;position:absolute;top:10px;right:14px;font-size:18px;color:var(--inkdim)}
dialog .meta{color:var(--inkdim);font-family:var(--cond);margin:-6px 0 12px}
.stabs{display:flex;gap:6px;margin-bottom:10px}
.st{all:unset;cursor:pointer;font-family:var(--cond);font-weight:700;padding:6px 14px;border-radius:3px;background:#3a342e}
.st.w.on{background:#9a5a1c}.st.s.on{background:#5d4691}.st.v.on{background:#4c7a25}
.tier{margin-bottom:10px}.tl{font-family:var(--cond);font-size:13px;color:var(--inkdim);margin-bottom:4px}
.tg{display:flex;flex-wrap:wrap;gap:5px}
.fl{display:flex;flex-direction:column;gap:4px;font-family:var(--cond);font-size:14px;color:var(--inkdim);margin-bottom:12px}
.fl textarea,.fl select{font:15px var(--body);background:#151310;color:var(--ink);border:1px solid #4a423a;border-radius:4px;padding:8px}
.frow{display:flex;justify-content:space-between;gap:10px}
.itemdlg{max-width:440px}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.hb{all:unset;cursor:pointer;padding:9px 10px;background:#3a342e;border-radius:3px;font-family:var(--cond);font-weight:700;font-size:15px}
.hb:hover{background:var(--teal)}
/* phone */
@media (max-width:600px){
 body{padding-top:10px;padding-bottom:120px}
 .side h1{font-size:20px;margin-bottom:6px}
 .grp{display:none}
 .tabs{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .tabs::-webkit-scrollbar{display:none}
 .tab{flex:none;padding:7px 10px;font-size:15px}
 .tab.newb{margin-top:0}
 .app{gap:10px}
 .bar{padding:8px 12px;gap:8px}
 .bar h2{font-size:19px;flex-basis:100%}
 .pill{font-size:14px;padding:4px 12px}
 .desc{padding:8px 12px;font-size:14px}
 .canvas{padding:8px;overflow-x:visible}
 .row{gap:8px;margin-bottom:8px}
 .cat,.editing .cat{width:100%;min-width:0}
 .items{flex-wrap:wrap;gap:4px}
 .it{width:calc((100% - 20px)/6);min-width:48px;height:auto;aspect-ratio:58/86}
 .it .ic{height:auto;aspect-ratio:1}
 .it .ic img{width:100%;height:auto}
 .lower{padding:0 8px 12px;gap:10px}
 .ao{grid-template-columns:70px repeat(16,minmax(0,1fr));gap:2px}
 .ao .an{font-size:12px}
 .ao .c{height:18px;font-size:10px}
 .ao .hdr{font-size:9px}
 #dock{padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
 #dock .dk{gap:6px 10px;flex-wrap:wrap}
 #dock .spent b{font-size:20px}
 #dock .spent span{font-size:10px}
 #dock .bars{min-width:0;gap:2px}
 #dock .ib{grid-template-columns:44px 1fr 40px;font-size:12px;gap:6px}
 #dock .track{height:8px}
 #dock .bars{flex:1}
 #dock .slots{flex:1;min-width:0;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px}
 #dock .reset{padding:3px 8px;font-size:11px}
 body{padding-bottom:150px}
}
/* desktop: names list and build scroll independently */
@media (min-width:861px){
 html,body{height:100%;overflow:hidden}
 body{padding-block:16px 0}
 .app{height:calc(100vh - 16px - var(--dockh,96px) - 8px);align-items:stretch}
 .side,.win{min-height:0;overflow-y:auto;overscroll-behavior:contain}
 .side{padding-right:6px;scrollbar-width:thin}
 .win{scrollbar-width:thin}
}
.duo{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line,#ffffff22);border-radius:10px;background:#ffffff0a}
.duo .dh{font-weight:700}.duo .dc{flex:1 1 320px;opacity:.85}.duo .dst{font-size:12px;opacity:.7;padding:2px 8px;border:1px solid currentColor;border-radius:99px}
</style>

<div class="app">
  <aside class="side">
    <h1>Rizuhble Builds</h1>
    <div class="tabs" id="tabs" role="tablist"></div>
  </aside>
  <main class="win" id="win"></main>

 changes:["Base: Kieran's in-game build, items, order and spikes untouched (gun 4.8k at Sharpshooter 11.2k souls, spirit 5.6k at Tankbuster 13.6k, health 6.4k at Stamina Mastery 16.8k, 12.8k at Kevlar 30.4k; core 12 slots, 48k).","False facts fixed: Opening Rounds works on enemies above half health, not you; Silence stops abilities, not dashes; Enchanter's Emblem doesn't build into Spellbreaker (Spellbreaker = Debuff Reducer) — it's now sold for Witchmail; Witchmail/Focus Lens/Divine Barrier have no such components, so 'expensive late upgrade' → 'pricier version of' (Divine Barrier paired with the Dispel Magic counter).","Mystic Burst/Tankbuster checked: Chimera 70 + 1.5×spirit = 95 at Mystic Burst (Extra Spirit 10 + Opening Rounds 7 = 17 spirit) and 227 with the +120 T3 by Tankbuster, so both clear their thresholds.","Sells added because core is full: counters sell Opening Rounds (1600, conditional damage, weakest late), rich items name Enchanter's / Opening Rounds / Sharpshooter / Silence Wave; Extra Regen says it goes for Kevlar; lane box set optional. 'Can't land the dive?' items now name what they replace (Mystic Expansion / Greater Expansion / Spirit Burn).","Counters description in the new wording; 'Upgrade.' added where true (Improved Spirit, Boundless, Superior Cooldown, Compress→Superior).","Mid box had 9 items; split into Mid · L-R (8) + Mid · cont. per the layout rule, order unchanged.","Ability order: Data: unlock 1 first, take Strix T1/T2 early, then max Chimera (the most common first max), ult mid, Jettison last. Ours is that path exactly. Danny data is mixed and he's a low-WR hero, so this is the weakest consensus.","Round 10: Spike order changed: spirit 4.8k first (Compress Cooldown moved up, 8k souls), then health (Stamina Mastery, 12.8k), then gun (Sharpshooter, 16k). Before: gun at 11.2k, spirit at 13.6k, health at 16.8k. Why: at 6.4k souls the build already has 3.2k spirit and 1.6k gun, so one 1.6k item finishes the spirit spike while the gun needs a 3.2k item. +19 spirit power is +93 on the ult (70+1.0x plus 3+0.09x per metre over ~43m), +28 on Chimera, +14 per missile and +21 per marked shot. The gun spike (+34% weapon damage) is +43 on Chimera's bullet part and about +37% gun damage. tracklock.gg pro Danny (last 30 days to Oct 19, 182 games): Improved Spirit 93%, Mystic Expansion 86%, Mystic Burst 72% early and Compress Cooldown 60% mid, before their 3.2k gun item (Express Shot 68% mid); Sharpshooter isn't in their top 8.","Round 10: 'Can't land the dive?' notes fixed: Toxic Bullets and Spiritual Overflow build up from your gun (0.25s per shot), not from your 3.","Round 11: 'Can't land the dive?' is the pivot (gun flyer, a real second job: Jettison Fuel maxed and the gun items). Desc now says when to take it; 'max your 3' moved into it. No new box: a lost lane doesn't change the dive plan. No 6.4k run (Kevlar 30.4k, Boundless 35.2k, then Superior Cooldown).","Round 12: 'Can't land the dive?' role pivot removed (a gun Danny becomes its own build next round). Sharpshooter note: the +60% only works past 15m (while flying); what makes Chimera's landing hit harder is the 4.8k gun spike (landing = 70 + 1.4x weapon damage bonus), so the note says that. Dispel Magic no longer lists Geist bomb; Spirit Resilience no longer lists Haze, spells Vyper. Checked all 10 types: imbues (Mystic Expansion on Chimera = the landing radius; Compress Cooldown on the 135s ult saves far more than on the 21s Chimera; Mystic Reverb on Chimera clears 100), thresholds, no duplicates, no late dead-end 800s.","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability).","Round 14: ability order now seemeta's most popular Danny order exactly (Strix T1 before unlocking Chimera, Strix T3 before ult T2/T3). Cursed Relic out of Counters (it cuts your own damage 25% while the curse lasts, so 'curse them before you dive' weakened the dive). Arctic Blast out of rich (not a pricier version of anything in the build; its sell was Sharpshooter, the gun spike). Sells made unique: Divine Barrier now replaces Dispel Magic (Opening Rounds was already the Counters sell), Mystic Reverb falls back to Sharpshooter. Notes: Opening Rounds and Enchanter's emptied (repeated the Counters/Witchmail sells), Sharpshooter cut to the interaction, Silence Wave no longer claims it stops going invulnerable (silence only blocks abilities, not items), Focus Lens says part of the damage (35%) repeats, Dispel Magic no longer lists Yamato's grapple, Unstoppable wording.","Round 15: Counters description shortened to 109 characters (was 119; the game rejects box descriptions over 112) by writing Kevlar for Diviner's Kevlar, Kieran's own wording in his in-game build ('After Kevlar').","Round 19: checked against the real Danny styles (seemeta Oct 5-19 most popular order maxes Chimera then the ult; dive/ult builds He's a phantom Oct 15, FLY LIKE DEADMAN DANNY Oct 14). Kieran's dive+ult main with his HV > Opening Rounds > Sharpshooter gun line; no item changes. Round 20: late list ordered by impact (Mystic Reverb first), 76.8k total; Focus Lens note cut to 102 characters (was 116).","Round 23: kit re-read item by item; no change (see log).","Round 25: ability order 1123124242144333 → 1122324412441333 (kit-based for this playstyle, no idle early points). Silence Wave out of the core (Kieran: only for dodgers, that is the Jettison build) → Surge of Power on the dive (same 3.2k spirit slot; 14s Surge vs ~17s dive). Compress Cooldown moved from the ult to the dive (extra dives inside a fight; the 100s ult rarely gets a second cast). Focus Lens note no longer names Silence Wave.","Cost pass: Sharpshooter right after Opening Rounds (gun 4.8k at 4.8k souls); Surge of Power before Greater Expansion; counters sell Enchanter's Emblem, Reverb sells Greater Expansion, Witchmail sells Reactive Barrier (Opening Rounds stays so gun 4.8k holds)."]},

 changes:["Round 13: new gun build — sources (gun-led Danny builds, post Oct 14 patch): lockbuilds official 'Gun/Spirit Danny' (Oct 17, from pro games: High-Velocity, Opening Rounds, Express Shot, 'rush to a 4.8k gun, then spirit and HP', Grit, Reactive Barrier, Extra Health; core Improved Spirit, Sharpshooter, Fortitude, Toxic Bullets, Warp Stone, Superior Cooldown, 'main damage comes from your 3rd ability'; late Diviner's Kevlar, Indomitable; it marks a full no-spirit gun build 'please avoid', so this keeps the cooldown spirit for Jettison Fuel); lockbuilds 'He's a phantom' (Oct 15: High-Velocity, Rapid Rounds, Express Shot, Grit, Toxic Bullets 'applied with the 3', Compress Cooldown, Superior Cooldown, Spirit Lifesteal, Spiritual Overflow; Lucky Shot optional). Order: seemeta's most popular Danny order with Jettison Fuel taking Chimera's early points (kit: T2 +18% fire rate on a backblast hit, T3 25% bullet resist shred, and its 30 + 0.8x weapon-damage DPS, so it's the gun build's ability; lockbuilds official calls the 3 your main damage).","Round 14: Lucky Shot out (lockbuilds' official Gun/Spirit Danny lists it under 'Testing a Complete Gun Build — Please Avoid'), Tankbuster in as the first Late buy (official core 'don't skip Toxic Bullets and TB', also in 'He's a phantom' and 'Best Damn Salesman'): spirit lands exactly on 8k at 28.8k; Jettison backblast ~198 and a T3 Strix mark ~247 vs 165 there. Divine Barrier added to rich (Dispel Magic is in Counters). Echo Shard falls back to Express Shot when Warp Stone was sold for a counter. Toxic Bullets note emptied (it was a Jettison tip; Toxic Bullets has no shred). Lane box caption 'Losing lane?' (one item) and its sell names Diviner's Kevlar (the 12th slot). Dispel Magic no longer lists Yamato's grapple.","Round 15: ability order is now seemeta's most popular Danny order (Oct 5-19, 3,155 matches) with Jettison Fuel and Chimera swapped, as the log already claimed (the old order unlocked all four first and didn't match it). Tankbuster still clears 165 at 28.8k.","Round 19/20: rebuilt as the Jettison Fuel gun/spirit Danny so it shares nothing with the dive main after lane (Kieran: builds of one hero mustn't look the same). Renamed Rizuhble's Jettison Danny, desc Gun-spirit Danny. Own gun line HV > Express Shot + Rapid Rounds > Swift Striker (official 882708 early; 884964 lane). Mid/late from 882708's core and gun box plus 884964: Fortitude, Spirit Shielding, Duration Extender > Superior Duration and Surge of Power on Jettison Fuel, Toxic Bullets, Warp Stone, Mystic Vulnerability > Escalating Exposure, Spirit Lifesteal > Spiritual Overflow, Lucky Shot, Siphon Bullets. Dropped the main's items (Opening Rounds, Sharpshooter, Reactive Barrier > Indomitable, Improved Spirit > Boundless, Tankbuster, Compress > Superior Cooldown, Kevlar). Late list Inhibitor, Silencer, Divine Barrier, Echo Shard (luxury last).","Round 23: kit re-read item by item; no change (see log).","Round 25: ability order 1132134343144222 → 3311234213244142 (kit-based for this playstyle, no idle early points).","Cost pass: renamed Smoking Gun Danny; Spirit Shielding names its sell (Spirit Resilience)."]},

 changes:["Base: Kieran's in-game build. '#Citadel_HeroBuilds_Late' box renamed 'Late · L-R' so it counts as core. Crippling Headshot is built from Weakening Headshot, not Headhunter (components checked), so it takes a slot: with it the core is 12 at Crippling (46.4k) and Lucky Shot would be a 13th item, so Lucky Shot moved to the top of the rich box with his 'Sell Stalker for this' kept.","Fortitude added after Spirit Snatch as the upgrade his Extra Health note already promised ('Upgrades to Fortitude' but Fortitude wasn't in the build): +2400 lands health at exactly 8k (20.8k souls); gun Bebop public builds (Stormy core, tracklock defensives) run it. Spikes: gun 4.8k at Headhunter (7.2k souls), 8k at Hunter's Aura (10.4k), health 5.6k at Veil Walker (16k), spirit 4.8k at Spirit Snatch (18.4k), health 8k at Fortitude (20.8k). Core 12 slots at 46.4k.","'4th buy: Hex or Shredder, not both' kept as a real choice: Slowing Hex stays in Early (his first pick), Bullet Resist Shredder moved to a one-item swap box 'Nobody dodging the bomb?' saying it replaces Slowing Hex (two items in Early would make the core 13).","False facts fixed: Spirit Strike/Snatch proc on light or heavy melee and Uppercut is flagged DFLAG_LIGHT_MELEE in the game files, so 'procs on hook' → 'procs on uppercut'; Stalker has no spirit scaling (flat 17 dps wound) — note rewritten; Witchmail's cooldown refund is from taking hits, not hook; Siphon steals 1 max HP per hit on a 1.2s cooldown, not 'every bullet'; Divine Barrier is not an upgrade of Counterspell (built from Guardian Ward) — now 'pricier Dispel Magic'.","Sells added for a full core: counters sell Slowing Hex (cheapest non-component), rich items name Stalker / Slowing Hex / Hunter's Aura; Counters and Slot locked descriptions in the standard wording; Slowing Hex/Shredder pick notes restored from his earlier version.","Ability order: The overall data includes bomb Bebop, which unlocks bomb first. Our build has no bomb items, so we use the four gun builds, which agree: Uppercut T1 and T2 first, then bomb T1 and T2, hook, Uppercut T3, and ult last. The unlock order (1, then hook second 77%) comes from the actual leveling data.","Round 8: Veil Walker note fixed. Since Sep 16 it no longer builds from Sprint Boots and lost its +2 sprint and regen (6 spirit now); the move speed (3.5m) only comes with the veil. Kept as the health spike: tracklock.gg Bebop pro builds, last 30 days to Oct 19 (post-Sep 16), Veil Walker 61% mid.","Round 9: Hunter's Aura moved from straight after Headhunter to after Veil Walker. Bebop has to be in their face, so the health spike comes before more big damage (rule): health 4.8k now at Veil Walker (12.8k souls, was 16k), gun 8k at Hunter's Aura (16k). tracklock pro Bebop, last 30 days to Oct 19: Hunter's Aura 31% late, Veil Walker 61% mid. Old note ('buy before team fights') replaced; the aura doubles on one target, which is what a hook gives you.","Round 10: Crippling Headshot moved before Witchmail. By Vampiric Burst you have 20.8k in health and 8k in gun, so the damage item comes first (rule: damage, health, damage, health); -16% bullet and spirit resist on every headshot helps the whole team on whoever you hook. Witchmail is now the last core item.","Round 10: Notes fixed: Siphon Bullets steals once every 1.2s whatever your fire rate, so 'fires so fast this is needed' was wrong; Inhibitor builds up from bullets only (this build has no bomb); Colossus note now says what it does.","Round 11: Bullet Resist Shredder is the 4th buy (Kieran: the hook into uppercut 1v1, the uppercut's spirit hit applies the shred) and Slowing Hex moved to a 'They dash out of the hook?' swap box (replaces 'Nobody dodging the bomb?'). Spirit still 4.8k at Spirit Snatch (18.4k). Fortitude moved after Vampiric Burst so the 6.4k buys don't run four in a row from 27.2k (now Siphon 24.8k, Vampiric Burst 31.2k, Fortitude 33.6k, Crippling 40k, Witchmail 46.4k). New pivot box 'Behind, or team full of gun heroes?': support Bebop keeps Shredder and Spirit Snatch, takes Spirit Snatch instead of Headhunter (spirit 4.8k at 7.2k souls), Heroic Aura right after Hunter's Aura instead of Siphon, Superior Cooldown instead of Crippling Headshot, Rescue Beam instead of Witchmail. Sells that named Slowing Hex now name Stalker (counters) or Shredder (rich).","Round 12: support pivot box removed (support Bebop becomes its own build next round), which also removes the duplicate Spirit Snatch and the Rescue Beam his hook already does. 'They dash out of the hook?' trigger now names who (Dynamo, Shiv, Lash, Mirage). Notes: Vampiric Burst said 'you use abilities all fight, so it's up a lot' (its 30s cooldown isn't cut by abilities) - now says when to pop it; Veil Walker 'free hooks' now says what it means; Inhibitor builds from bullets on anyone you shoot, not only who you hook; Dispel Magic no longer lists Geist bomb (damage, not a debuff); Spirit Resilience no longer lists Haze (gun) and spells Vyper.","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability); name says the style (1v1 gun); desc no longer claims 'no bombs'.","Round 14: Spellslinger out of rich (not a pricier version of anything in the build). Sells made unique: Counters keep Stalker; Lucky Shot replaces Shredder/Slowing Hex (his old in-game note), Inhibitor replaces Veil Walker, Colossus replaces Fortitude, Divine Barrier replaces Dispel Magic (Inhibitor, Divine Barrier and Colossus all said 'Sell Bullet Resist Shredder'). Notes: Stalker emptied (repeated the sell), Vampiric Burst emptied (how-to), Bullet Resilience no longer claims Haze/Wraith/Vindicta shred bullet resist (none of them do), Plated Armor follows it, Slowing Hex swap note no longer says 'nobody gets away' (the hex doesn't stop stamina dashes). Dispel Magic no longer lists Yamato's grapple.","Round 15: ability order is now seemeta's highest-win-rate Bebop order exactly (uppercut first, Oct 4-18, 819 matches); the rank-1 gun Bebop (Erebus) and Gun-Burst in-game builds upgrade in the same sequence. Notes: Spirit Strike 'Procs' -> 'Works on your uppercut.' (no proc jargon); Veil Walker says you need to walk through a veil first (the stealth only triggers from a veil); Hunter's Aura drops the 'win most 1v1s' claim.","Round 17: swap box caption 'Swap for Bullet Resist Shredder' (trigger kept in its description); Slowing Hex note 'Instead of Bullet Resist Shredder.'","Round 19: verified as the public gun Bebop (Lockbuilds official GUNBOP Oct 19: Headshot Booster, Spirit Strike, Slowing Hex, Headhunter, Veil Walker, Spirit Snatch, Siphon Bullets, Crippling Headshot, Vampiric Burst, Lucky Shot; fargareko Sep 9: Headshot Booster, Extra Health, Spirit Strike, Bullet Resist Shredder, Fortitude, Enduring Speed, Spirit Snatch, Headhunter, Siphon Bullets, Vampiric Burst, Crippling Headshot, Spellslinger, Colossus, Juggernaut, Lucky Shot). No item changes; counters caption uses Kieran's exact wording.","Round 20: late list reordered by impact and extended: Inhibitor, Lucky Shot, Colossus, Spellslinger (Kieran's in-game rich box, fargareko late; sell Spirit Snatch), Divine Barrier; slot-locked Juggernaut. Core 46.4k, with the late list 70.4k without Divine Barrier. Spellslinger listed last as a luxury (Kieran 13:01).","Round 20 (update 2): Slowing Hex moved from the lane swap for Bullet Resist Shredder into Counters (bought after Veil Walker): in lane they run under their Guardian, the dash-away problem starts when you roam (Kieran 13:06). Lucky Shot now just sells Bullet Resist Shredder.","Round 23: kit re-read item by item; no change (see log).","Round 25: ability order 1132224131332444 → 1133214221334442 (kit-based for this playstyle, no idle early points).","Cost pass: renamed Lane Bully Bebop; Fortitude right after Spirit Snatch (spikes unchanged); Lucky Shot sells Headshot Booster and Spellslinger sells Crippling Headshot so spirit 4.8k holds."]},

 changes:["Round 13: new support build from Kieran's spec (Heroic Aura + Hunter's Aura, hook enemies to your carry, keep Bullet Resist Shredder and Spirit Snatch, early spirit invest) and kit numbers; no public support-Bebop build exists to copy (the in-game/lockbuilds/tracklock Bebop builds are gun or bomb). Kit: uppercut counts as melee so Spirit Strike/Snatch proc on it, the Strike hit is spirit damage so Shredder's -10% bullet resist applies, hook and uppercut both work on allies, hook 23s cooldown (Compress Cooldown target). Health items are the ones deadlocked.gg's in-game Bebop build uses for a hook-in Bebop (Sprint Boots, Trophy Collector, Fortitude, Veil Walker, Witchmail, Unstoppable). Order: seemeta highest-WR order 1324122131332444 (65.9% WR, 819 games; uppercut and hook maxed). No Rescue Beam: the hook already moves teammates.","Round 14: Divine Barrier added to rich (Dispel Magic is in Counters). Counters now sell Trophy Collector (Echo Shard also sold Shredder). Notes: Slowing Hex emptied ('can't dash away' was false: the hex doesn't stop stamina dashes), Vortex Web emptied ('pulls their whole team' overclaims a 12m capture), Heroic Aura emptied (explanation/how-to), Hunter's Aura cut to how it changes your play, Echo Shard cut to the imbue and sell. Lane box caption 'Losing lane?' and its sell names Unstoppable (the 12th slot). Dispel Magic no longer lists Yamato's grapple.","Round 15: ability order is now seemeta's highest-win-rate Bebop order exactly (the log claimed it but the build had moved all unlocks first). Counters now sell Veil Walker (description was 114 characters, over the game's 112 limit). Spirit Strike note 'Works on your uppercut.' (no proc jargon).","Round 17: Heroic Aura says 'Only if your team has gun heroes.'; new 'Swap for Heroic Aura' box: Knockdown (same 3.2k; the uppercut launches them, and Knockdown's stun lasts longer on airborne targets). Lane box caption 'Losing lane? Buy 1'.","Round 21: put back (Kieran's spec, he likes it); style unchanged. Slowing Hex out of lane (catching people isn't a lane problem) into Mid; Compress Cooldown on the hook moves into lane in its place (more hooks in lane now; spirit 4.8k and health 4.8k land at the same souls as before). New full late list to ~72k net: Echo Shard on the hook, Transcendent Cooldown (moved up from Slot locked), Scourge cast on your carry (40% spirit resist, debuff resist and a 10m damage aura on them), Divine Barrier as a real support buy (barrier + cleanse on a teammate, half cooldown on others), Refresher as the luxury last. Counters caption in the required format.","Round 23: kit re-read item by item; no change (see log).","Round 25: ability order 1132224131332444 → 3311234223441142 (kit-based for this playstyle, no idle early points).","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: Spirit Rend (gun) replaces Knockdown in the Heroic Aura swap so gun 4.8k holds."]},

 changes:["Base = Kieran's in-game Babysitter Dynamo. Items, order and boxes kept; gun spike restored and slot/upgrade rule breaks fixed.","Added Opening Rounds (800) at the end of Early: his in-game build left High-Velocity as an untouched 800 and gun stopped at 4000. With Opening Rounds, Heroic Aura lands 4.8k gun exactly at 11.2k souls (his older in-game build did the same: 'With Opening Rounds this is 4.8k gun').","Core now ends at exactly 12 slots: Boundless Spirit was slot 13 with no sell, so it sells Sprint Boots (weakest 800 at 40k). Health 4.8k still lands on Sprint Boots at 8k souls, spirit 4.8k passes at Compress Cooldown (5.6k, a bit over).","Removed Enduring Speed from Slot locked: rule says Enduring Speed is core or not in, never optional. Sprint Boots now has a named sell instead.","Note wording: Enchanter's Emblem/Witchmail, Divine Barrier/Counterspell were called upgrades but Witchmail has no components and Divine Barrier builds from Guardian Ward; reworded as pricier versions of the same job. Counters box uses the standard wording; every rich item names what to sell.","Public check: tracklock (60% WR) and lockbuilds support builds run Compress/Superior Cooldown, Duration Extender/Superior Duration, Greater Expansion, Warp Stone, Refresher, which this build has. They skip Heroic Aura/Rescue Beam as core, but those are his support style, so kept. Total core 40.8k.","Ability order: Strong consensus: unlock 1, 3, 2, ult, max Kinetic Pulse first (91-99% at points 5-7), then ult T1-T2, then Aurora. Ours is that path exactly.","Round 9: High-Velocity Rounds > Opening Rounds swapped for Headshot Booster > Headhunter. Opening Rounds was a lone 1.6k gun item only there to round the gun spike up with Heroic Aura. tracklock pro Dynamo, last 30 days to Oct 19: Headshot Booster 89% and Headhunter 57% early; HV and Opening Rounds aren't in the top 8. Headhunter's heal on headshots keeps a support in lane. Gun now 3.2k at Headhunter (7.2k souls), 6.4k at Heroic Aura (12k). Core 42.4k (was 40.8k). Colossus and Boundless now sell Headhunter instead of Opening Rounds.","Round 9: Mystic Expansion (on the stomp) moved from lane (3.2k souls) to Mid after Rapid Recharge (15.2k). +20% radius on the stomp barely matters in a 1-2 hero lane; it's for team fights. tracklock pro Dynamo (last 30 days to Oct 19): Mystic Expansion 64% mid. Warp Stone moved into Late to keep Mid at 8.","Round 12: notes made true: Compress Cooldown 'Ult up for every fight' and Superior Cooldown 'Ult every fight' were false (250s ult, 205s with Compress, 200s with Superior) - now give the real numbers; Warp Stone 'teleport out' after the ult is impossible (16s cooldown, one charge) - now 'teleport in, then ult' with its 30% bullet resist; Dispel Magic no longer lists Geist bomb; Spirit Resilience no longer lists Haze. Checked all 10 types: imbues (Compress + Duration Extender on the 250s ult; Mystic Expansion on Kinetic Pulse, his most-cast damage ability; Echo Shard on Aurora), no dead items, no duplicates, no pivots needed (full support already).","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability). Extra Charge checked: Kinetic Pulse has charges in the files (1, 5s between).","Round 14: Sprint Boots now upgrades to Trophy Collector (support Dynamo builds: KRJ 'healing and vacuum cleaning' early, Yxoko's Black Hole lane; Kieran: pure supports want it) instead of being sold; Sprint Boots moved to the end of Early so Mid stays at 8. Boundless now sells Headhunter. Colossus out of rich (nothing in the build it's a pricier version of). Sells made unique: Counters sell Warp Stone, Divine Barrier replaces Dispel Magic (it sold Healing Booster, which Healing Tempo in Slot locked upgrades). Notes: Unstoppable says stuns (silence doesn't interrupt channels), Debuff Reducer drops 'Upgrades to Unstoppable', Heroic Aura/Enchanter's/Sprint Boots emptied, Mystic Expansion names Kinetic Pulse, Echo Shard cut to imbue and sell. Dispel Magic no longer lists Yamato's grapple.","Round 15: ability order is now Kieran's in-game order 1132141443332242, which is also seemeta's most popular Dynamo order (Oct 5-19, 2,090 matches); the build had all unlocks moved first while the log claimed it matched. Counters description shortened to 110 characters (was 117, over the game's 112 limit) using Kieran's own 'Enchanter's'.","Round 17: Heroic Aura says 'Only if your team has gun heroes.'; new 'Swap for Heroic Aura' box: Knockdown (same 3.2k; its stun lasts longer on airborne targets and Kinetic Pulse launches them). Counterspell added to Counters (the build had none). Counters desc names Enchanter's Emblem in full. Witchmail and Echo Shard sell notes say 'for this'.","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: late list to 76.8k: Healing Tempo moved up from Slot locked (heals give allies fire rate), Lightning Scroll and Cheat Death added (Hard Support Dynamo 718141 late box), Echo Shard after them.","Round 23 (kit): Healing Tempo gives +35% fire rate and +1.25m/s for 7s to whoever you heal (not innate regen or passive lifesteal), so Rejuvenating Aurora (8m, 30+0.4x spirit per second, +2.5% max health/s at T3) hands it to every ally standing in it, every second. That is a team-wide fire rate buff in every fight, so it moves from the late list into Late core (upgrade of Healing Booster, no slot) in Refresher's place. Refresher (300s cooldown luxury for a second Singularity) goes to the end of the late list and sells Headhunter; Boundless Spirit is now the 12th slot and needs no sell.","Round 25: ability order 1132141443332242 -> 1133234143422421 (playstyle-based; see a25/log/dynamo.md).","Cost pass: Spirit Rend (gun) replaces Knockdown in the Heroic Aura swap; Heroic Aura moved after Compress Cooldown so spirit 4.8k lands earlier (18.4k to 15.2k); Refresher sells Greater Expansion instead of Headhunter."]},

 changes:["Round 13: new damage build (Kieran: Mystic Reverb etc. on his 1) — source (damage-style only): lockbuilds official 'Gun/Stomp DYNAMO' (Oct 18, built from top Dynamo players, updated daily): lane Headshot Booster, Mystic Burst, Extra Regen, Headhunter, Extra Charge, Sprint Boots, Recharging Rush; mid Enduring Speed, Tankbuster, Warp Stone, Superior Cooldown, Mercurial Magnum (Rapid Recharge optional); late Mystic Reverb, Spirit Burn, Unstoppable, Refresher, Witchmail (Juggernaut, Echo Shard optional). Imbues all on Kinetic Pulse (26s, 2 charges, 115 + 1.55x spirit, +135 at T3): it's the damage and the most-cast ability. Order: seemeta's most popular Dynamo order (60.9% WR, 2,090 games), pulse maxed first; the lockbuilds page shows no level-by-level order. Thresholds: pulse clears Mystic Burst's 80 from the first point (132 at 1.6k souls) and Mystic Reverb's 100; Tankbuster at 13.6k: pulse T3 about 315 vs 165; Spirit Burn at 38.4k: one T3 pulse (250 + 1.55x 142 spirit = 470) plus its Reverb echo (235) is about 700 vs 500.","Round 14: Witchmail out of rich (nothing in the build it's a pricier version of; its sell, Recharging Rush, was also the Counters sell). Divine Barrier added (Dispel Magic is in Counters). Lane box caption 'Losing lane?' and its sell names Unstoppable (the 12th slot). Dispel Magic no longer lists Yamato's grapple.","Round 15: ability order is now seemeta's most popular Dynamo order exactly (1132141443332242, Oct 5-19, 2,090 matches). Unstoppable moved to second in Late (32k instead of 51.2k): health sat at 4.8k from 11.2k to 44.8k souls on a hero that warps into the middle of fights; the official Gun/Stomp build also has it before Refresher. Counters now sell Headhunter and Echo Shard sells Recharging Rush (same job: refilling the pulse); the Counters description was 114 characters, over the game's 112 limit.","Round 17: Counterspell added to Counters (the build had none). Lane box caption 'Losing lane? Buy 1' like every other build.","Round 19: renamed to the public style name (Stomp Dynamo); items already match Lockbuilds' Gun/Stomp Dynamo (582936, Oct 19).","Round 20: late list to 78.4k: Boundless Spirit, Juggernaut (second health step) and Witchmail added from Gun/Stomp DYNAMO 582936's late boxes; Echo Shard last.","Round 23 (kit): checked Kinetic Pulse (115 + 1.55x spirit, +135 at T3, 2 charges at T1, -15% bullet resist at T2), Singularity T3 (+6% max health per second, 3.5s with T2). Spirit Burn and Mystic Reverb on Pulse meet their thresholds off two pulses; Lightning Scroll considered and rejected (its stun lands at 3s, inside the 3.5s Singularity). No changes.","Round 25: ability order 1132141443332242 -> 1132141444332232 (playstyle-based; see a25/log/dynamo_damage.md).","Slot locked: Juggernaut moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: renamed Dyson Dynamo; counters sell Rapid Recharge, Witchmail sells Superior Cooldown, Boundless sells Rapid Recharge (gun 4.8k holds; Headhunter and Recharging Rush stay)."]},

 changes:["High-Velocity Rounds moved from Mid (12.8k) to Early as the 3rd buy: the rules name it as the lane fix for slow-bullet heroes, pro Grey Talon buys it 88% in the first 10 minutes, and Kieran's in-game build had it in Early. It still upgrades into Sharpshooter, so nothing else moves. Spirit 4.8k now lands at 5.6k (was 4.8k).","Everything else kept: tracklock's core is the same Mystic Burst (98%), Extra Charge (94%), Extra Spirit, Compress Cooldown, Improved Spirit, Enchanter's, Extra Stamina → Stamina Mastery (84%/86% mid), Rapid Recharge (85%), Tankbuster (92%), Recharging Rush (77%), Boundless (66%), Superior Cooldown, Spirit Burn (44%), Mystic Reverb (32%). Pros rush Long Range + Sharpshooter early (59%/61%); ours waits for the 4.8k green first since the arrow is the damage, not the gun.","Infuser (33.6k) kept from last round in place of Fortitude. Spikes: spirit 4.8k at 5.6k, health 4.8k at 10.4k (was 9.6k), gun 4.8k at 16.8k. Core 48k, 12 slots.","Ability order: Consensus: unlock 2, 1, 3, ult, Rain of Arrows T1 early, max Owl at points 7-9, then Charged Shot. We follow it, with one swap: Charged Shot T1 (+1 charge) comes one point before Rain of Arrows T1, because Extra Charge is our first item. 38% of players take it there.","Item fit: Infuser → Indomitable (both 6.4k vitality, same slot at 33.6k). Infuser wants lots of separate spirit hits in its 7s, but Grey Talon's damage is one Charged Shot per charge (80 + 2x spirit at T3, 1s between charges, 3 charges), so the 70% lifesteal is a couple of heals per window. Indomitable's barrier is 325 + 2.0x spirit (spirit invest is 17.6k by then) and fires when stunned/silenced, which is how a charging sniper dies. Public: tracklock pro buys its component Reactive Barrier 31% late, deadlocked.gg lists Indomitable as the late optional vs CC; Infuser isn't in tracklock pro, tracklock core or deadlocked.gg for Grey Talon.","Item fit, kept: Mystic Burst 98%, Extra Charge 94%, HV 88%, Extra Spirit 83%, Compress Cooldown 51%, Improved Spirit 89%, Extra Stamina 84%/Stamina Mastery 86%, Enchanter's 41%, Tankbuster 92% (arrow 134 + spirit clears 165), Long Range 59%/Sharpshooter 61%, Recharging Rush 77%, Rapid Recharge 85%, Boundless 66%, Superior Cooldown 50%, Spirit Burn 44% (two arrows inside 5s clear 500 late), Mystic Reverb 32% (54% WR lockbuilds, Kieran's own), Surge of Power (tracklock late situational; +28 spirit on the arrow is +56 damage with the 2x T3 scaling). All tracklock pro/lockbuilds or Kieran's in-game build.","Round 12: Unstoppable note: it doesn't stop Phantom Strike's pull-down; now names what it does stop (stuns and silences that cancel the charged shot). Checked all 10 types: every imbue (Compress Cooldown, Surge of Power, Mystic Reverb) is on Charged Shot, the ability that does the killing; Extra Charge works because Charged Shot is a charge ability; Long Range/Sharpshooter fit a back-line sniper (pros 59%/61%); Tankbuster, Spirit Burn and Mystic Reverb thresholds met; no duplicates, no swaps, no pivots.","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability). Extra Charge checked: Charged Shot has charges in the files (1, 4s between), so it really is a second arrow.","Round 14: name shortened to 31 characters (was 35, over the 32 limit); ability order now seemeta's highest-win-rate Grey Talon order (61.8% WR, 615 matches, Oct 5-19), which maxes Charged Shot first, the same max path as tracklock's top Grey Talon skill path (Charged Shot, Owl, Snare, Rain; 454 games); notes emptied that only explained (High-Velocity 'bullets are slow', which is also wrong at 19,500 bullet speed; Indomitable barrier scaling); Unstoppable note no longer says silences cancel the shot (silence doesn't interrupt channels); Bullet Resilience (its note claimed Haze, Wraith and Vindicta reduce bullet resist; they don't, and no Grey Talon source lists it) replaced by Plated Armor from MikaelS's defense list; Counterspell example is Lash's ult only; Dispel Magic examples are item debuffs it really purges (Knockdown before it lands, Slowing Hex, Disarming Hex); Divine Barrier added as Dispel Magic's rich upgrade.","Round 15: Counters desc was 122 characters (game limit 112): now 'Get after Tankbuster ... Sell Enchanter's for it.' (110). Enchanter's Emblem note emptied (repeated the Counters desc).","Round 17: Counters desc names Enchanter's Emblem in full; lane sell and Divine Barrier notes use the standard wording.","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: late list to 76.8k: Spiritual Overflow, Witchmail, Echo Shard, Refresher added (MikaelS 581110 late boxes), Transcendent moved in from Slot locked; Refresher last.","Round 23 (kit): checked Charged Shot (spirit damage, 80 + 1.0x spirit, 2.0x at T3, 2 charges, so Boundless/Surge of Power/Mystic Reverb are the right multipliers and Recharging Rush refills it off gun damage), Owl kills give +8 spirit permanently. Worth testing (not changed): Rain of Arrows T3 gives +30% spirit lifesteal while airborne, so arrows fired from the glide heal; this order takes Rain T3 last. No item changes.","Round 25: ability order 1123144414223332 -> 1123141434422233 (playstyle-based; see a25/log/greytalon.md).","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: Superior Cooldown bought before Indomitable; Refresher sells Stamina Mastery instead of Sharpshooter (gun 4.8k holds)."]},

 changes:["Round 13: new gun build — sources (gun-style builds only): lockbuilds SwoleBenji 'BULLET Carry Backlaner Sniper' (High-Velocity, Swift Striker, Quicksilver Reload on Rain of Arrows, Surge of Power, Enduring Speed, Stamina Mastery, Long Range, Sharpshooter, Hollow Point; late Lucky Shot, Ricochet, Spiritual Overflow, Mercurial Magnum) and 'HYPER FARM MOST DMG Gun Sniper' (Rapid Rounds, High-Velocity, Long Range, Sharpshooter, Lucky Shot, Ricochet, Spiritual Overflow, Vampiric Burst 'the key item', Mercurial Magnum, Juggernaut); both Sep 4, and the Oct 14 patch changed no Grey Talon numbers. Kit: Rain of Arrows gives +3/+6 weapon damage, 5-way multishot and (T3) 30% bullet lifesteal while airborne, cooldown 25s to 13s at T2, so the gun build maxes it and imbues it. Order: seemeta's most popular Grey Talon order (56.6% WR, 663 games) 2134224441113332, the one that maxes Rain of Arrows first (the gun style; spirit Talon maxes Charged Shot).","Round 14: Grit and Reactive Barrier out (in neither SwoleBenji gun build; without them health lands exactly on 4.8k at Stamina Mastery, 12k souls); Burst Fire in (both SwoleBenji gun builds), gun 8k after Hollow Point and 11.2k after Burst Fire, bought after the two lifesteal pieces so no fresh T2 comes after 20.8k. Ability order fixed: the old order maxed Rain of Arrows last, not first; now seemeta's most popular opening (Rain, Rain, Charged Shot, Snare, Rain, Owl) then tracklock's Rain-first skill path (Rain, Owl, Snare, Charged Shot), so Rain T3's air lifesteal comes at point 7. Counters sell Swift Striker (SwoleBenji's sell) instead of Hollow Point; notes trimmed (Quicksilver how-to, Hollow Point threshold explanation); Metal Skin/Counterspell/Unstoppable/Dispel notes fixed; Divine Barrier added as Dispel Magic's rich upgrade.","Round 15: Counters desc was 117 characters (game limit 112): 'if you need it' shortened to 'if needed' (112).","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: late list to 75.2k: Glass Cannon and Juggernaut (SwoleBenji 91462 late box), Crippling Headshot and Cheat Death added; Divine Barrier note standardised.","Round 20 (update 2): Long Range and Sharpshooter moved from lane to Mid (SwoleBenji 91462 'Roam and Defense' box; range is a later problem); Hollow Point takes the lane slot for the gun 4.8k, Burst Fire opens Late.","Round 23 (kit): checked Rain of Arrows (multishot 5, +3/+6 weapon damage, 4s glide that scales with duration items, 13s at T2, +30% bullet lifesteal at T3); Quicksilver/Mercurial and Surge on Rain, Vampiric Burst in the air, Ricochet per split all fit. Duration Extender on Rain (+0.9s glide) considered, not clearly better than any core pick. No changes.","Round 25: ability order 2213242444333111 -> 2213242334414311 (playstyle-based; see a25/log/greytalon_gun.md).","Slot locked: Juggernaut moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: renamed Bow Optional Grey Talon; no item changes needed."]},

 changes:["Alchemical Fire (3.2k) and Boundless Spirit (4.8k) out of core; Spirit Shredder (1.6k at 22.4k) into Spirit Rend (1.6k) in their place. Pros take Shredder 46% / Rend 33% against Boundless 20% and never Alchemical Fire; the lockbuilds official build has both Shredder and Rend. Core drops from 49.6k to 44.8k, still 12 slots.","Boundless Spirit moved to the rich box as the upgrade of Improved Spirit; Spirit Burn added there after it (sells Titanic Magazine).","Rest kept from the round-5 rebuild of the in-game build: 4.8k spirit at 5.6k, 4.8k health at 10.4k (Bullet Lifesteal + Spirit Lifesteal + Battle Vest, no Fortitude), 4.8k gun at 14.4k. Pro core still Extra Spirit, Improved Spirit, Mystic Vulnerability, Rapid Rounds, Swift Striker, Toxic Bullets, Spirit Lifesteal, Superior Duration, Escalating Exposure, Spiritual Overflow, Ricochet.","Healbane (96% pro) not added: Toxic Bullets already cuts their healing by the same 35%.","Ability order: Near-unanimous: unlock Afterburn (100%), then 2, 1, ult, Afterburn T1 (100%), Flame Dash T1, then max Afterburn by point 8, Napalm/Flame Dash next, ult last. Ours is that path exactly.","Item fit: Battle Vest → Healbane (both 1.6k vitality, same slot, health still 4.8k at 10.4k). Afterburn is spirit damage every 0.5s, so Healbane's -35% healing is up the whole fight from ~9 min instead of waiting for Toxic Bullets at 14.4k, and +7 spirit feeds the burn. Public: tracklock pro 96%, tracklock core, deadlocked.gg early core, lockbuilds 15.6k buys; Battle Vest only shows as a 328-buy counter on lockbuilds (50.3% WR) and in no core list.","Item fit: Berserker → Burst Fire (both 3.2k gun T3, same slot at 20.8k). Berserker needs 120 sustained damage taken per stack, which a mid-range gun Infernus doesn't want to soak. Afterburn ignites at 8.1% per bullet hit (about 13 hits) and the gun fires 9.5 shots/s with 27 rounds, so Burst Fire's +10% and +32% fire rate on hit puts the burn on sooner. Public: tracklock late situational, lockbuilds 6.6k buys 50.7% WR; Berserker isn't in tracklock, deadlocked.gg or lockbuilds' top 30.","Item fit, kept: Extra Spirit 99% / Improved 96%, Rapid Rounds 77% → Swift Striker 82%, Duration Extender 40% → Superior Duration 70% (on Afterburn), Mystic Vulnerability 93% → Escalating Exposure 69% (burn ticks every 0.5s, stack cooldown 0.7s), Bullet Lifesteal + Spirit Lifesteal 71% → Leech (lockbuilds 55% WR, deadlocked.gg core; heals off both gun and burn), Toxic Bullets 88%, Titanic Magazine 45%, Spirit Shredder 46% → Spirit Rend 33%, Spiritual Overflow 60%, Ricochet (tracklock core, 14.2k lockbuilds).","Round 9: Worth a try: Suppressor (1.6k). Afterburn ticks spirit damage every 0.5s, so Suppressor's -28% fire rate (4.5s) never drops on a burning target; also +6 spirit, +8% bullet resist. Same price and slot as Titanic Magazine. Core kept: matches tracklock.gg pro builds, last 30 days, checked 2026-10-19 (Extra/Improved Spirit 97%, Swift Striker 93%, Mystic Vulnerability 81%, Toxic 73%, Superior Duration 71%).","Round 12: 'Worth a try' box removed (Suppressor; not Kieran's pick, no current pro Infernus buys it). Checked all 10 types: Duration Extender on Afterburn works (its burn duration uses the spirit-duration scale in the game files, BurnDuration 3s to 3.7s); Mystic Vulnerability, Toxic Bullets, Titanic Magazine, Spirit Shredder, Superior Duration, Escalating Exposure and Spiritual Overflow are all in pro Infernus top lists (tracklock, last 30 days, 139 games); Burst Fire and Ricochet feed the burn build-up; no duplicates, no colour-changing swaps, no pivots.","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability).","Round 14: Extended Magazine added at the end of Early so Titanic Magazine is an upgrade instead of a fresh T2 at 16k (Extended Magazine 81.6% early on seemeta Oct 5-19, 70% early on tracklock pro, Gunfernus Perfected lane); spirit 4.8k still at 5.6k, health 4.8k moves to 11.2k, gun 4.8k passes at 15.2k (5.6k) and lands 6.4k at Titanic. Spirit Rend bought straight at 24k instead of a fresh Spirit Shredder at 22.4k (no fresh T2 late; same 3.2k total). Spirit Burn now sells Healbane (so Healbane's 'second counter' note moves to Titanic Magazine, and the third-counter note is gone) (its pricier version) instead of Titanic Magazine; Divine Barrier added as Dispel Magic's rich upgrade. Notes: Spirit Shredder explanation emptied; Unstoppable and Armor Piercer notes rewritten without jargon; Counterspell example is Lash's ult; Dispel Magic examples are item debuffs it purges; Spirit Resilience lists Vyper instead of Infernus.","Round 15: Armor Piercer moved out of Counters into its own 'Swap for Ricochet' box (it replaces Ricochet late, which contradicted the Counters desc 'get after Healbane, sell Swift Striker'). Swift Striker note emptied (repeated the Counters desc).","Round 17: Renamed \"Rizuhble's Burn Gun Infernus\" (style in the name); rich Boundless Spirit note \"Upgrade of Improved Spirit.\"; lane sell and Divine Barrier notes use the standard wording.","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: late list to 75.2k: Indomitable (second health step), Crippling Headshot and Witchmail added (Gunfernus 579362 late boxes).","Round 23 (kit): Duration Extender on Afterburn rechecked: Afterburn's max burn duration uses the tech-duration scale (abilities.vdata BurnDuration scale_function_tech_duration), so it works. Napalm T2 +15% lifesteal and T3 +33% damage taken fit the lifesteal/Healbane items. Ballistic Enchantment on Napalm considered and rejected (walked: Titanic Magazine is the Extended Magazine upgrade, swapping it strands Extended Magazine; afterburn damage is spirit, so +weapon power helps only the 5.5-damage bullets). No changes.","Round 25: ability order 3214323312112444 -> 3322134312114424 (playstyle-based; see a25/log/infernus.md).","Cost pass: renamed Slow Roast Infernus; Toxic Bullets right after Extended Magazine so gun 4.8k lands at 9.6k souls instead of 15.2k."]},

 changes:["Round 13: new dash build (Kieran: lots of greens, Bruber's dash Infernus as reference) — sources (dash-style only): lockbuilds 'Ignornus BrooberGaming.ttv (City Never Sleeps Edit)' (Oct 6, 'the build on my main account'): lane Sprint Boots, Rapid Rounds, Mystic Vulnerability, Extra Charge, Swift Striker, Spirit Lifesteal ('4.8k spike'); mid Rapid Recharge, Shadow Weave (he says he's testing it; Enduring Speed instead, which he also lists, keeps it green and leaves Juggernaut as the slot-locked upgrade), Reactive Barrier, Dispel Magic, Duration Extender; then Superior Duration, Escalating Exposure, Debuff Reducer; 'Infernus' Trinity' Cheat Death, Unstoppable, Echo Shard; capstones Indomitable, Juggernaut, Spiritual Overflow, Divine Barrier. lockbuilds Omuk 'Hybrid (Afterburn and Dash)' (Oct 1) for Spirit Burn. Kit: Flame Dash 38s to 26s at T1, +20 DPS at T2, 2 charges at T3; Extra Charge adds a Napalm charge in lane (Napalm has 1 charge) and a dash charge once Flame Dash is T3. Duration Extender on Afterburn: BurnDuration uses the game's duration scaling (the dash trail's GroundFlameDuration doesn't). Order: seemeta's highest-WR Infernus order (58.0% WR, 1,823 games), the one that maxes Flame Dash by point 8. Spirit Burn at 41.6k: afterburn (30 + 0.66x) plus trail (50 + 0.7x) at ~120 spirit is ~240 a second, well over 500 in 5s.","Round 14: Duration Extender moved from Afterburn to Flame Dash. The old reason was wrong: the dash trail's GroundFlameDuration does scale with duration items (ETechDuration in abilities.vdata), so Duration Extender makes the dash 3s to 3.66s and the trail 5s to 6.1s (T2), on the ability this build casts most (3 charges); Afterburn only burns after weapon hits, and this build has little gun. Counterspell example is Lash's ult only.","Round 15: Counters desc was 118 characters (game limit 112). Reactive Barrier (10.4k) and Enduring Speed (11.2k) swapped so Enduring Speed lands the 4.8k health spike; desc now 'Get after Enduring Speed if needed ... Sell Swift Striker for it.' (111). Same items, same totals.","Round 17: Divine Barrier note uses the standard wording (Dispel Magic is core). Empty Dispel Magic/Debuff Reducer/Unstoppable notes stay empty (site defaults fixed globally).","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: late list to 75.2k: Juggernaut moved in from Slot locked, Boundless Spirit added (Broober 844812 luxury box).","Round 23 (kit): Concussive Combustion stuns 1.25s (+0.9 T3 = 2.15s) and can't be interrupted once cast. Lightning Scroll's stun lands 3s after your ult first damages them (DelayBeforeStun 3, 0.75s stun, 64% slow, 150 damage), so after the ult stun ends they get stunned a second time while you're still in the middle of them. Added 3rd in the late list (worth testing; sells Swift Striker); Boundless Spirit now sells Rapid Recharge.","Round 25: ability order 3214322214441133 -> 3322124214441133 (playstyle-based; see a25/log/infernus_dash.md).","Slot locked: Juggernaut moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: renamed Dine And Dash Infernus; Spiritual Overflow before Escalating Exposure so gun 4.8k lands at 24.0k instead of 51.2k."]},

 changes:["Divine Barrier (fresh T4 at 49.6k, a support item) swapped for Spirit Burn at the same price: this is a damage build and Spirit Burn is the last core item on both tracklock's and deadlocked.gg's Kelvin build. Divine Barrier moves to Counters (pro Kelvin buys it 52% mid, so it's there when the team needs it).","Spirit Burn is no longer in rich, so Healbane stays core as the 4.8k green piece (its note now says it gets sold for a counter). Rich is now Echo Shard on the beam (sell Enchanter's) and Mystic Reverb on the grenade (sell Healbane), both from Kieran's in-game rich box.","No other item changes: Extra Spirit → Improved Spirit (pro 96%/89%), Healing Booster (93%), Healbane (59%), Mystic Expansion and Compress Cooldown (56%), Superior Cooldown (63%), Boundless (52%), Greater Expansion (44%), Superior Duration (33%) all match tracklock pro. Pro also likes Arcane Surge (59% early) and tracklock's core has Torment Pulse; both left out, Torment Pulse because it wants you in melee range and Arcane Surge because Enchanter's already fills that slot.","Spikes unchanged: spirit 4.8k at 4.8k, health 4.8k at 9.6k. Core 12 slots, 49.6k.","Suppressor dropped from Counters to keep the box at 8 after adding Divine Barrier: the beam already cuts fire rate by 20% on its own.","Ability order: Consensus: unlock 1, 3, 2, ult, Grenade T1/T2, then the cheap Beam T1 and Ice Path T1/T2, Grenade max at point 10, Beam T2/T3, ult last. Ours is that path exactly.","Round 9: Mystic Expansion moved out of lane (2.4k) to Mid (~12.8k); Compress Cooldown on the beam moved into its lane slot (13.6k to 3.2k). +20% range on a 25m beam doesn't win lane trades, a 28s beam coming back faster does. tracklock.gg pro builds, last 30 days, checked 2026-10-19: Mystic Expansion 56% mid. Spirit still 4.8k at 4.8k (Extra Spirit, Improved, Compress Cooldown, Mystic Vulnerability); Extra Charge moves to after the health spike, right before its Rapid Recharge upgrade. Same items, same 49.6k total.","Round 11: 6.4k run fixed: Escalating Exposure 24k, Boundless 28.8k and Refresher were three in a row from 24k, so Superior Duration (the 1.6k upgrade) now sits between Boundless and Refresher. New pivot 'No other support?': healer Kelvin (grenade heals 60+0.8x spirit, dome 90+0.2x regen) with Rescue Beam instead of Healbane, Healing Tempo instead of Escalating Exposure (moved out of Slot locked, no duplicate), Healing Nova instead of Spirit Burn.","Round 12: 'No other support?' role pivot removed (healer Kelvin becomes its own build next round). Duration Extender note: the beam itself lasts longer (5s to 6.1s), which is more damage, not only a longer slow. Refresher note: also resets the beam. Vyper spelt right. Checked all 10 types: Compress/Mystic Expansion/Duration Extender/Echo Shard on Arctic Beam (the damage, cast every 28s), Mystic Reverb on the grenade (only ability clearing its 100 per hit), Healbane fed by beam and grenade, no duplicates, no late 800s.","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability). Extra Charge checked: Frost Grenade has 2 charges in the files, so it makes 3.","Round 14: rebuilt as the tank damage-dealer Kelvin Kieran asked for (old build ended at 11.2k health). Base: the current tanky beam builds on lockbuilds, Julien 'Carry Beam Kelvin' (Oct 2: Extra Charge, Extra Spirit, Torment Pulse, Healing Booster, Healbane, Spirit Lifesteal, then Mystic Vulnerability, Escalating Exposure, Mystic Expansion, Rapid Recharge, Improved/Boundless, Greater Expansion, Superior Cooldown, Infuser, Spirit Burn, Transcendent, greens) and Radinal's carry beam (Oct 1: Extra Charge, Extra Spirit, Extra Regen, Torment Pulse, Healing Booster, Healbane, Mystic Expansion, Rapid Recharge, Superior Cooldown, Escalating Exposure, Spirit Lifesteal, Boundless, Greater Expansion, Superior Duration, Infuser, Duration Extender, Compress Cooldown), plus Witchmail and Bullet Resilience from Aspartagoose's tank Kelvin (Sep 29). Spikes: spirit 4.8k at 4.8k (Extra Charge, Extra Spirit, Torment Pulse), health 4.8k at 10.4k, then Infuser, Witchmail and Bullet Resilience take health to 19.2k. Out: Enchanter's Emblem (needs you above 65% health, wrong for a tank), Refresher, Spirit Burn moved to rich as Healbane's pricier version, Mystic Slow and Divine Barrier out of Counters (Divine Barrier is now Dispel Magic's rich upgrade), Echo Shard and Mystic Reverb out of rich (not pricier versions of anything in the build). Ability order: seemeta's highest-win-rate Kelvin order (63.4% WR, 1,084 matches, Oct 5-19), which maxes the beam first and takes Ice Path T1 (35% bullet resist for Kelvin on the path) at point 6. Name/desc now say tanky.","Round 15: Tankier mid game for the tank damage-dealer: Infuser moved ahead of Rapid Recharge (8k health at 20.8k, was 23.2k after 12.8k of straight spirit buys) and Bullet Resilience ahead of Boundless (11.2k health at 32.8k, was 40.8k); Duration Extender before Infuser so no fresh T2 comes after 16k; Spirit Lifesteal before Healbane (health 4.8k still at 10.4k). Counters desc was 120 characters (limit 112): now 'Get after Healbane ... Sell Healing Booster for it.' (112). Same items and totals.","Round 17: Divine Barrier rich note unified: 'If you bought Dispel Magic, sell it for this.' (Dispel Magic is in Counters).","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: Late list filled to ~75k: rich is now Spirit Burn, Mystic Reverb on the grenade, Scourge, Echo Shard on the beam, then Divine Barrier, each selling the weakest item left; Healing Tempo added to Slot locked so Healing Booster upgrades.","Round 23: Mystic Expansion moved from Arctic Beam to Frost Grenade: beam range (25m) rarely matters for a Kelvin standing in them, a bigger grenade (+44% area) hits more of them and heals more mates on every charge.","Round 25: order 1132124333212444 → 1132124332312444: Ice Path T2 (cd 50→25, more uptime of its 35% bullet resist) before Arctic Beam T3.","Cost pass: renamed Fridge Tank Kelvin; no item changes."]},

 changes:["Round 13: new support build — sources (support-style only): lockbuilds 'Aethergic's (Annotated) Support Kelvin' (Sep 7; no Kelvin numbers changed in the Oct 14 patch): lane High-Velocity, Extra Regen, Opening Rounds, Extra Charge, Healing Booster, Extra Spirit, Mystic Expansion, Compress Cooldown, Improved Spirit, Enchanter's Emblem, Healbane; core Superior Cooldown, Rapid Recharge, Duration Extender, Warp Stone, Boundless, Cursed Relic, Refresher; upgrades Greater Expansion, Superior Duration, Transcendent, Healing Tempo. Kit: Frost Grenade heals allies 60 + 0.8x spirit (+30 and +0.9 scaling at T3) and has 2 charges (Extra Charge makes 3), Frozen Shelter regen 90 + 0.2x (+65, +1.0x), Ice Path T2 gives your team 35% bullet resist. So the heal imbues go on the grenade (cast most) and Duration Extender on the dome. Order: kit-based (no support Kelvin order is published): grenade maxed first for its heal scaling, Ice Path T1-T2 for the team speed and bullet resist, then beam, dome last; seemeta's most popular Kelvin order also opens grenade, grenade.","Round 14: High-Velocity Rounds and Opening Rounds (own-gun lane trades) out; Sprint Boots into Trophy Collector in (support lane items should help the team; Trophy Collector is on Kieran's pure-support list and in Aethergic's mobility list, seemeta 52.3% early). Spirit 4.8k now at 6.4k (was 8k), health 4.8k at 9.6k. Ability order: dome maxed right after grenade T1-T2 (Aethergic's stated goal is max dome; mobalytics shows a dome-max-first Kelvin group, 995 matches): Frozen Shelter T2 is +1.5s, +65 regen and +1.0x spirit scaling for everyone inside, T3 purges your team. Changes-log fix: Ice Path T1's 35% bullet resist is for Kelvin only, not the team. Cursed Relic note emptied (explained its penalty); Unstoppable note now says what it stops (stuns before the dome), the dome isn't a channel; Counterspell example is Lash's ult; Dispel Magic examples are item debuffs it purges; Divine Barrier note now says it is Dispel Magic's pricier version; Counters sell Trophy Collector, then Enchanter's Emblem, then Healbane, so every T2 left in the last 12 has a named sell (Opening Rounds is gone).","Round 15: Counters desc was 123 characters (game limit 112): now 'Get after Healbane if needed ... Sell Trophy Collector for it.' (108).","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: Late list filled to ~72k: Divine Barrier, Diviner's Kevlar, Scourge, Rescue Beam (Aethergic's support Kelvin late boxes), each selling the weakest item left.","Round 25: order 1324114441223323 → 1132141224443233: Frost Grenade T1 no longer waits for the ult unlock, grenade maxed first (heal scaling), Ice Path T1/T2 before the ult tiers. Duration Extender moved from Frozen Shelter to Ice Path (25s path vs 165s dome).","Cost pass: renamed Ice Pack Kelvin; no item changes."]},
