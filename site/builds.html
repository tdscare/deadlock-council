 changes:["High-Velocity Rounds into Opening Rounds added in lane (98% / 97% of pro Doorman games, FaxFox and deadlocked.gg cores): he shoots his own bells and pokes with the gun early. Spirit 4.8k now lands at 6.4k souls (was 4.8k); Rapid Recharge still the spike item.","Spirit Burn (6.4k) and Mystic Reverb (6.4k) out of core into the rich box; Enchanter's Emblem now stays in the build (it was being sold for Vortex Web) and is the Spirit Burn sell, Opening Rounds is the Reverb sell. Core drops from 57.6k to 46.4k, 12 slots.","Health spike unchanged: Grit, Spirit Lifesteal, Enchanter's Emblem, Guardian Ward = 4.8k at 11.2k. Guardian Ward is 67% pro early; Fortitude/Extra Health not used.","Counters now sell Opening Rounds (was Radiant Regeneration). Mid split into Mid / Mid cont. to keep boxes at 8.","Ability order: mobalytics build-stats grid: Bell 1 then 5-6 (91-99%), Hotel Guest unlocked at 4 (97%); kept our burst plan (Bell T1 charge for Extra Charge/Rapid Recharge, Bell maxed by 7, Cart 8-9 and T3 at 12 for wall stun, ult T1-T2 at 10-11 for the +150 damage) with unlocks moved first and Doorway raised above ult T3.","Item fit: Infuser out (Spirit Lifesteal stays as plain sustain). It isn't in the lockbuilds top 30, FaxFox's or Doxi's build, and Doorman throws his bells from range rather than staying in the fight for 7s. Late slot goes to Cheat Death (FaxFox and Doxi core, 19.0% lockbuilds pick, 52.2% WR), the only health after the 4.8k spike.","Item fit: Mystic Regeneration → Radiant Regeneration swapped for Slowing Hex → Vortex Web (Vortex Web builds from Slowing Hex). Neither regen item is in any Doorman list we checked; Slowing Hex is 27.8% lockbuilds pick (FaxFox debuff list, Doxi situational) and Vortex Web 23.3% (FaxFox core), and the slow is what lets a 28% bell slow plus the cart land.","Item fit: Mystic Vulnerability → Escalating Exposure swapped for Spirit Burn, moved from the rich box into the late core (20.1% lockbuilds pick, 53.7% WR, FaxFox and Doxi core). EE isn't in the lockbuilds top 30 or either build, and two bells at that spirit (each ~165 + 2.6x spirit with the T2/T3 damage) clear Spirit Burn's 500 in 5s. Enchanter's Emblem no longer sells for Spirit Burn. Core 44.8k (was 46.4k), 12 slots. Kept: Extra Charge 50.9%, Mystic Burst 50.7%, Mystic Expansion 49.5%, Rapid Recharge 47.4%, Tankbuster 46.3%, Greater Expansion 43.8%, Improved Spirit 41.7%, Boundless 32.6%, HV 32.2%, Superior Cooldown 30.2%, Opening 27.5%, Compress 26.4%, Grit 18.5% → Guardian Ward 10.9% (lockbuilds pick); Spirit Lifesteal and Emblem are in Doxi's / FaxFox's builds. tracklock was down, so no pro percentages this round.","Sell notes redone so every T1/T2 has a named sell: Opening Rounds → counter, Spirit Lifesteal → Mystic Reverb, Enchanter's Emblem → Refresher (was Tankbuster). Divine Barrier note now says it's the expensive late upgrade to Guardian Ward.","Threshold: Mystic Burst at 2.4k: Call Bell T2 explosion 95+1.2x(16.5+7 charged) = 123 vs 80. Tankbuster at 16.8k: bell explosion 306 vs 165. Spirit Burn at 32k: one bell (impact 258 + explosion 372) = 630 vs 500 in 5s. Mystic Reverb (rich, on Call Bell): 372+ vs 100. No change.","Round 10: Extra Charge note said \"Two bells\"; Call Bell already has 2 charges from its first upgrade (point 2), so Extra Charge makes it 3 (game files 6795). Note fixed, no item change.","Round 11: Superior Cooldown moved up to right after Boundless Spirit and Greater Expansion moved to between Spirit Burn and Vortex Web, so the 6.4k buys from 20.8k are no longer three in a row (Boundless 23.2k, Superior Cooldown 24.8k, Spirit Burn 31.2k, Greater Expansion 33.6k, Vortex Web 38.4k, Cheat Death 44.8k). Added \"No other support?\" pivot (cart and Doorway are team tools): Rescue Beam, Heroic Aura, Disarming Hex, Divine Barrier.","Round 12: Compress Cooldown moved from Hotel Guest to Call Bell. Bells are the damage and the most-cast ability: at its buy point (18.4k souls, 130 spirit, T3 bell) one bell is about 500 (206 impact + 296 explosion) and you hold 4, so 18% faster bells is about 18% more of your damage; on Hotel Guest (still T0 then) it only took the ult from 140s to 115s. Superior Cooldown later still shortens the ult.","Round 12: Removed the \"No other support?\" role pivot (support Doorman becomes its own build); that also removes the second Divine Barrier.","Round 12: Notes: Spirit Burn no longer explains its trigger; Grit and Divine Barrier say why.","Round 13: notes cut to niche tips, timings, imbue targets, sells and upgrades only (Kieran 00:05); desc is now just the style label.","Round 14: notes cut to the allowed kinds: every 'Upgrade.' removed; Mystic Reverb, Refresher and Divine Barrier no longer explain the item (Divine Barrier keeps 'Upgrade of Guardian Ward.' so the site doesn't fall back to the default counter text). Items, order and spikes unchanged; every item re-sourced to bell/spirit Doorman builds (FaxFox, JoeFuck, Doxi) in the log.","Round 15: Counters desc was 116 characters (game limit 112): now 'Get after Grit … Sell Opening Rounds for it.' (107). Notes emptied: HV (restated Call Bell's own 'can be shot to detonate early'), Opening Rounds/Spirit Lifesteal/Enchanter's (repeated the sell already on the counters desc, Mystic Reverb and Refresher), Guardian Ward (restated the item's half-cooldown line; carting allies isn't this build's style), Divine Barrier (upgrade of Guardian Ward, no sell needed; site no longer fills empty notes).","Round 17: Divine Barrier (rich) note restored to 'Upgrade of Guardian Ward.' plus the standard Dispel Magic sell; Spirit Resilience counter no longer says 'ticking'. The support build now drops this build's bell damage line (Mystic Burst/Tankbuster, Mystic Expansion/Greater Expansion), so the two Doorman builds differ; no item change here.","Round 19: checked against the real Doorman bell-nuke style (FaxFox Aug 26, Bell Nukes Aug 23, Doorclyv Oct 17, SleepiJack lane core Sep 30; lockbuilds top items Extra Charge, Mystic Burst, Mystic Expansion, Rapid Recharge, Tankbuster). OK, no item changes. Round 20: Cursed Relic added (FaxFox late, SleepiJack late), Refresher moved last as the luxury, total 72k.","Round 23 (kit): every Doorman hit is a separate spirit hit (localization: SpiritDamage on bell impact, bell explosion, cart, wall impact, Hotel stay and late checkout), and Call Bell T1 has 2 charges (Rapid Recharge makes 4). Escalating Exposure stacks on each spirit hit (0.7s lockout, 12 stacks = +54% to that target), so one bell pair + cart already gives several stacks before Hotel Guest. Added as 2nd in the late list (worth testing; sells Enchanter's Emblem). Spirit Lifesteal now upgrades into Infuser (+30 spirit and 70% spirit lifesteal for 7s, which covers a full bell + cart + ult combo) instead of being sold. Mystic Reverb now sells Opening Rounds, Cursed Relic sells Tankbuster, Refresher (luxury, last) sells Greater Expansion. Late list gross 83.2k with Transcendent Cooldown.","Round 25: ability order 1132124213332444 -> 1132134221334442 (playstyle-based; see a25/log/doorman.md).","Cost audit: Renamed from Ding Dong Doorman."]},

 changes:["Round 13: new support build — items from support-style builds only: lockbuilds SleepiJack's Soft Support Doorman (Sep 30: HV, Extra Charge, Mystic Burst, Opening Rounds, Mystic Expansion lane; Tankbuster, Enchanter's Emblem, Rapid Recharge, Greater Expansion; support Guardian Ward, Heroic Aura, Divine Barrier; disruptive Slowing Hex, Knockdown; late Boundless, Vortex Web, Cheat Death, Transcendent; greens Trophy Collector) and steezycat's Majestic Doorman (Sep 12, 'cart teammates': HV, Extra Charge, Sprint Boots, Trophy Collector, Grit, Mystic Burst, Guardian Ward; Mystic Expansion, Slowing Hex, Vortex Web, Rapid Recharge, Tankbuster; Heroic Aura; Cheat Death, Compress/Superior/Transcendent Cooldown, Greater Expansion; Enchanter's Emblem, Divine Barrier; Knockdown; Refresher). Ability order: steezycat says max Luggage Cart or Doorway for utility and Bell only if the team needs damage, so Cart T2 (friendly cart range 20m→45m) and Doorway T2 (ally barrier) come before Bell T2/T3; ult T1 at 10.","Round 14: Heroic Aura now says when to buy it (only with gun carries on your team, Kieran's rule). Notes cut to the allowed kinds: every 'Upgrade.' removed, Trophy Collector's explanation emptied, Divine Barrier given a real tip instead of 'Upgrade.' (an empty note shows the site's default counter text). Items, order and spikes unchanged.","Round 15: Counters desc was 116 characters (game limit 112): now 'Get after Guardian Ward … Sell Knockdown for it.' (111). Heroic Aura was a core item with an 'Only if' note, leaving a hole in the core without gun carries: its condition moved to a 'Swap for Heroic Aura' box with Alchemical Fire (same price and colour; steezycat's '1 of these' pairs exactly Heroic Aura and Alchemical Fire, SleepiJack lists both under Support Utility). Guardian Ward note said 'Throw it' (it's a targeted cast) and restated the half-cooldown line: now 'Put it on the mate you're about to cart in.' Notes emptied: HV (restated Call Bell's desc + duplicate sell), Enchanter's (duplicate sell), Divine Barrier (restated the item's cleanse).","Round 17: made a real support build instead of the DPS build plus support items: the bell damage line is gone (Mystic Burst → Tankbuster, Mystic Expansion → Greater Expansion). In its place Healing Rite in lane (heals your lane mate from 30m) → Healing Nova (325 heal to you and allies within 18m), and Warp Stone (SleepiJack's support core). Rescue Beam not used: the cart already moves a mate, the same reason support Solomon skips it. Compress Cooldown on the cart moved into Early, so spirit 4.8k lands at 7.2k (was 6.4k); health 4.8k at 11.2k (was 10.4k); Healing Nova after Improved Spirit so spirit 8k (17.6k) comes before more health; core 48.8k, 12 slots. Heroic Aura now says 'Only if your team has gun heroes.' (the Swap box covers the core without it). Divine Barrier note 'Upgrade of Guardian Ward.' + Dispel Magic sell. Spirit Resilience counter no longer says 'ticking'.","Round 19: checked against the real support/utility Doorman (steezycat's Majestic Doorman Sep 12, SleepiJack's Soft Support Sep 30). Healing Nova (no public support build has it) replaced by Rescue Beam (Bell Nukes support box, steezycat misc), same Healing Rite upgrade. Round 20: High-Velocity Rounds now upgrades to Opening Rounds (steezycat, SleepiJack lane core) instead of being sold; Cheat Death sells Opening Rounds. Late list adds Cursed Relic and Witchmail (steezycat late, SleepiJack late), Refresher last as the luxury; total 72k.","Round 23 (kit): checked Doorway T2 barrier (250 + 1.5x spirit for 12s to everyone passing through the first time, abilities.vdata), Luggage Cart alt-cast on allies (Guardian Ward note), Call Bell charges for Extra Charge/Rapid Recharge. The build's spirit items already feed the door barrier; nothing in the item list multiplies these better than what's here. No changes.","Round 25: ability order 1324133224312144 -> 1132224333442141 (playstyle-based; see a25/log/doorman_support.md).","Cost audit: Rescue Beam moved to right after Trophy Collector (12.8k instead of 20.8k). Cheat Death sells Warp Stone instead of Opening Rounds, keeping the gun 4.8k tier."]},

 changes:["Lined up with the crayon build Kieran plays, which is tankier than the site build: Extra Health, Reactive Barrier, Hunter's Aura and Siphon Bullets out; Spirit Shielding (Grit upgrade, 46% pick), Bullet Resist Shredder (53%, 49.6% WR, best T2 on Billy), Spirit Resilience (54%) and Scourge (18% pick, 57% WR) in. Zizis' top build and tracklock's core use the same green 4.8k (Lifestrike + Spirit Shielding) and purple 4.8k (Bullet Resist Shredder + Spirit Snatch).","Spikes: gun 5.6k at 7.2k souls (Monster, Close Quarters, Stalker, Cultist; same as before, 800 over because Close Quarters is a 91% pick lane item), health 4.8k exactly at 11.2k (Lifestrike + Spirit Shielding), spirit 4.8k exactly at 15.2k (Spirit Strike to Snatch + Bullet Resist Shredder), spirit 8k on Rapid Recharge, health 8k on Spirit Resilience at 23.2k, gun 16k exactly on Berserker once Stalker is sold.","Colossus bought straight (6.4k) instead of upgrading a lane Extra Health; Berserker sits between Colossus and Scourge so the two 6.4ks aren't back to back. Total 46.4k (was 51.2k), core 12 slots.","Counters sell Bullet Resist Shredder (the T2 that never upgrades); Bullet Resilience and Warp Stone added from the crayon 'buy 2 or 3 to not die' box, Spirit Resilience moved out of counters into core. Rich is Witchmail (56% WR) and Divine Barrier; the slot-locked box is gone (Indomitable needs Reactive Barrier, which is out).","Ability order: Mobalytics Billy grid and Kieran's in-game crayon build agree: Blasted T1/T2 at 5-6, Ram T1/T2 at 7-8, Bashdown 9-11, ult 13-15, Ram T3 last; for the tanky style the 1-AP Chain Gang T1 (+40% resists) is pulled to 9 and Blasted T3 (+50 melee bonus health) before Bashdown T3.","Threshold: no damage-threshold items. Extra Charge (17.6k) and Cultist Sacrifice (7.2k) bought after Bashdown T2 charge (Bashdown T2 by 7.2k). Witchmail only in the rich box. No change.","Round 9 (Worth a try): Diviner's Kevlar — Chain Gang 135s at T1, -10%; 1000 barrier while pulling; +40 spirit = +36 chain DPS (0.9x) per chained hero and +48 Blasted melee health (1.2x at T3). Lightning Scroll — chain damage counts as ult damage; Scroll stuns 0.75s 3s after the hit, and the yank comes at 2.8s, so they land stunned for Bashdown.","Round 10: Extra Charge note said \"Two Bashdowns\"; Bashdown already has 2 charges from its second upgrade by the time you buy it (17.6k, Bashdown fully upgraded), so it adds a third. Note fixed, no item change.","Round 11: Added \"Lost lane?\" reorder box (Cultist before Stalker to farm sooner). No T4 run before 30k.","Round 12: Removed the \"Worth a try\" box (Lightning Scroll instead of Scourge was not Kieran's pick and no pro Billy builds it, tracklock last 30 days).","Round 13: notes cut to niche tips, timings, imbue targets, sells and upgrades only (Kieran 00:05); desc is now just the style label.","Round 13: tank Billy made properly tanky so it's clearly apart from Brawler Billy, using SwoleBenji's UNBEATABLE Melee MEGA TANK (lockbuilds, Sep 4: Extra Health, Close Quarters, Sprint Boots, Melee Lifesteal; Enduring Speed, Fortitude, Spirit Resilience, Bullet Resilience, Lifestrike, Melee Charge, Crushing Fists; Extra Charge, Rapid Recharge, Unstoppable, Siphon Bullets; Colossus, Cheat Death, Juggernaut). Health 4.8k now at 6.4k (was 11.2k), 8k at Fortitude. Out: Stalker, Spirit Strike→Spirit Snatch, Bullet Resist Shredder, Spirit Shielding, Point Blank, Berserker, Scourge (those are the Brawler build's). Kept from Kieran's tank: Monster Rounds→Cultist (slow farmer), Grit in lane. Witchmail dropped from rich (not a pricier version of anything in the build).","Round 14: Debuff Reducer (a fresh T2 at 49.6k whose default note said 'Upgrades to Unstoppable') removed; Unstoppable is bought outright as the last core item. Counters sold Melee Charge, which is already Crushing Fists by the time slots fill: now Close Quarters. Spirit Resilience and Unstoppable got situational notes (an empty note showed the site default with 'Viper' and Haze). 'Upgrade.' notes removed; Divine Barrier note is now the sell. Items otherwise unchanged; health 4.8k still at 6.4k.","Round 15: Close Quarters was sold twice (Counters desc and Cheat Death). Counters now 'Get after Fortitude … Sell Enduring Speed for it.' (112; old desc was 113, over the game's 112 limit). Close Quarters and Grit notes emptied (they repeated the sells on Cheat Death and Bullet Resilience).","Round 17: Lifestrike note 'trigger' (no 'proc'). Counters no longer sell Enduring Speed (Slot locked upgrades it to Juggernaut); they sell Cultist Sacrifice, the farm item, since Sprint Boots is already inside Enduring Speed by then. Lane sell note standard; Divine Barrier note now 'If you bought Dispel Magic, sell it for this.'.","Round 19: verified as the public tank Billy (SwoleBenji UNBEATABLE Melee MEGA TANK Sep 4 and FAST FARM Tempo Brawler Tank Oct 4: Melee Lifesteal, Extra Health, Sprint Boots, Enduring Speed, Fortitude, Lifestrike, Spirit/Bullet Resilience, Crushing Fists, Rapid Recharge, Unstoppable, Siphon Bullets, Cheat Death, Colossus, Juggernaut). Counters caption uses Kieran's exact wording (sell Close Quarters for it, to stay within 112 characters); Cheat Death now sells Cultist Sacrifice so no item is sold twice.","Round 20: Grit now upgrades to Reactive Barrier (mid, after Spirit Resilience) instead of being sold for Bullet Resilience; Bullet Resilience moves to Counters (Siphon Bullets, Colossus, Cheat Death and Unstoppable already make the core tanky). Late list: Indomitable (upgrade of Reactive Barrier), Witchmail (Zizis luxuries, SALMAN very late; sell Spirit Resilience), Divine Barrier; slot-locked Juggernaut. Core 52k, with the late list 68k without Divine Barrier.","Round 20 (update 2): checked Restorative Shot and lane timing: every lane item helps in lane now, no Slowing Bullets or Weighted Shots; no changes.","Round 23: kit re-read item by item; no change (see log).","Round 25: ability order 3124332211134442 → 1133214341222434 (kit-based for this playstyle, no idle early points)."]},

 changes:["Round 13: new brawler build — items from damage-style builds only: lockbuilds BILLY-DPS BUILD by SALMAN (Oct 12: Grit, Close Quarters, Melee Lifesteal, Stalker; Monster Rounds optional; Point Blank as the 4.8k gun spike; Spirit Shielding; Lifestrike, Bullet Resist Shredder, Spirit Snatch, Melee Charge, Rapid Recharge, Crushing Fists, Colossus; late Scourge, Silencer, Lucky Shot, Inhibitor) and Zizis Billy (Oct 15 patch, damage: Monster Rounds, Melee Lifesteal, Stalker, Close Quarters; Lifestrike + Spirit Shielding; Bullet Resist Shredder + Spirit Snatch; Melee Charge, Rapid Recharge, Berserker, Scourge, Colossus; Point Blank/Crushing Fists slot locked; Silencer luxury). Ability order: SALMAN maxes Blasted first; mobalytics' grid (Blasted 5-6 at 94-95%, Ram 7-8, Bashdown 9-11, ult 12-15) matches it, same as the tank build.","Round 14: Colossus moved from rich into the late core (it's core in both damage builds, SALMAN mid and Zizis late, and gives the brawler health after 10.4k); Inhibitor out (optional in both). Monster Rounds now upgrades to Cultist Sacrifice by ~7k (Kieran's crayon carry build, Zizis' lane extra; Kieran's rule: Cultist on slow farmers like Billy) instead of being sold; Point Blank moved after Spirit Snatch; Silencer now sells Stalker. Rich: Lucky Shot out (not a pricier version of anything in the build); Spellbreaker in as the pricier Spirit Shielding (SALMAN late optional, Zizis luxuries), so Spirit Shielding has a named sell; Divine Barrier in (Dispel Magic is in Counters). Bullet Resist Shredder note emptied (explained its trigger); 'Upgrade.' notes removed; Lifestrike gets Kieran's light-melee/trooper tip.","Round 15: Counters desc was 127 characters (game limit 112): now sells Stalker (112), and Silencer sells Bullet Resist Shredder instead of Stalker, so each is sold once.","Round 17: name 'Rizuhble's Damage Billy', desc 'Damage Billy' ('Brawler' now only Yamato). Lifestrike, Spirit Strike and Spirit Resilience notes without 'proc'/'ticking'. Lane sell note standard; Divine Barrier note now 'If you bought Dispel Magic, sell it for this.'.","Round 19: verified as the public melee Billy (Zizis Oct 17, SALMAN BILLY-DPS Oct 12, HERESY Lomein Edit Sep 17, Kieran's in-game crayon build: Monster Rounds, Melee Lifesteal, Stalker, Close Quarters, Grit, Lifestrike, Spirit Shielding, Bullet Resist Shredder, Spirit Snatch, Melee Charge, Rapid Recharge, Crushing Fists, Point Blank, Berserker, Scourge, Colossus). No item changes; counters caption uses Kieran's exact wording.","Round 20: late list: Spellbreaker, Phantom Strike (SALMAN late, Zizis luxuries; sell Cultist Sacrifice), Witchmail (SALMAN very late, Zizis luxuries; sell Spirit Snatch), Divine Barrier. Core 49.6k, with the late list 68.8k without Divine Barrier.","Round 20 (update 2): checked Restorative Shot and lane timing: every lane item helps in lane now, no Slowing Bullets or Weighted Shots; no changes.","Round 23: kit re-read item by item; no change (see log).","Round 25: ability order 3124332211134442 → 1133214231422434 (kit-based for this playstyle, no idle early points)."]},

 changes:["Base = Kieran's in-game Bar Brawl Abrams. Every item, the order and the tanky curve kept (health 4.8k at 12.8k right after the gun spike, Witchmail, Colossus, Phantom Strike; 24k in health by the end). Fixes are the gun spike landing, a slot-count bug in the sell notes, and rich/counter wording.","Gun spike never landed: Close Quarters + Melee Charge + Stalker = 4000, then Hunter's Aura jumped to 7200. Added Restorative Shot (800) after Stalker, so gun is exactly 4.8k at 5.6k souls; Restorative Shot is allowed on him (shotgun hero) and every public Abrams build opens it (tracklock 58% WR core #1, Gorilla/Case Closed lanes). It's sold for Phantom Strike, so it never sits as an untouched 800. Hunter's Aura note no longer claims the spike.","Slot bug: his Stalker note sold it for Phantom Strike, which would leave the core at 11. Now Restorative Shot is what Phantom Strike replaces, Stalker stays core (12th slot) and is the named sell for counters and the first rich buy. Core total 48.8k (48.0k before; Restorative Shot sells back half).","Spirit Burn and Divine Barrier were called 'expensive late upgrades' of Healbane/Counterspell; neither builds from those (Spirit Burn has no components, Divine Barrier builds from Guardian Ward). Reworded as pricier versions of the same job, dropped the proc talk, and every rich item names a sell. Counters box uses the standard wording.","Public check: tracklock core (Restorative Shot, Close Quarters, Melee Lifesteal, Melee Charge, Stalker, Hunter's Aura, Lifestrike, Duration Extender > Superior Duration, Phantom Strike, Crushing Fists) matches this build almost item for item; they add Bullet Resist Shredder/Warp Stone/Berserker and skip Witchmail/Colossus, but Witchmail and health are the point of his tanky version, so kept.","Ability order: Unlock 3/2/1, +200hp on 3 early, max Shoulder Charge first, then the ult straight after (maxed by point 11 for mid-boss), then Infernal Resilience, Siphon last. This is the shape of every top public Abrams: seemeta most-popular (61.8% WR, 7.6k matches: 3221242344433111), tracklock Gun-CC 60%, Iphonz/Rumples/Adam (3214322244433111); Kieran's in-game order maxed the ult last and Siphon before 3.","Threshold: no damage-threshold items in core. Witchmail at 31.2k souls (late), Spellbreaker counter is damage taken. No change.","Round 9: Hunter's Aura (3.2k gun) moved from Early (9.6k souls) to right after Enduring Speed. Abrams has to be in their face, so the health spike comes before more big damage (rule); health 4.8k now lands at 10.4k souls (was 13.6k), Hunter's Aura at 13.6k. tracklock pro Abrams, last 30 days to Oct 19: Hunter's Aura 65% mid, not early.","Round 11: Witchmail now before Point Blank, so the 6.4k buys from 24.8k aren't four in a row (Witchmail 28.8k, Point Blank 31.2k, then Crushing Fists, Colossus, Phantom Strike late). Added \"Lost lane?\" reorder box: health before more gun.","Round 12: Restorative Shot is now the first buy (was 5th, at 5.6k souls). It is sold later and upgrades into nothing, so it only pays off if you have it for the whole lane. Gun 4.8k still lands at 5.6k (on Stalker).","Round 12: Removed the \"Lost lane?\" reorder box (Lifestrike and Enduring Speed earlier). Lifestrike only heals when your heavy lands, and a losing Abrams is the one not landing heavies, so it does not fix a lost lane. Replaced with a \"Losing lane? Buy 1\" box: Extra Regen (63% of pro Abrams buy it early, tracklock last 30 days), which heals whether you win trades or not.","Round 12: Note fixes: Witchmail triggers on any hit over 75 (not only spirit hits); Crushing Fists does not knock up, it refills ammo and stacks a shred to a stun; Melee Charge adds heavy damage, it does not make the heavy faster; Restorative Shot heals 50 every 6s, not every shot; Superior Cooldown note made concrete.","Round 13: notes cut to niche tips, timings, imbue targets, sells and upgrades only (Kieran 00:05); desc is now just the style label.","Round 13: Counters Dispel Magic no longer lists Geist's bomb (it's damage, not a debuff) or Yamato's grapple; now Slowing Hex, Infernus burn, Knockdown before it lands.","Round 13: 'Lost lane?' reorder restored in place of the Extra Regen box: Lifestrike procs on light punches too (1.5x cooldown) and heals 40% off troopers (game files), and Shoulder Charge pins them for a guaranteed heavy, so it does heal you through a lost lane.","Round 13: tank build made the tank one now that melee Abrams is its own build. Point Blank, Crushing Fists and Phantom Strike (punch items, not in tank builds) replaced with Spirit Resilience, Scourge and Bullet Resilience from SwoleBenji's PURE TANK Abrams (lockbuilds, Oct 4: Duration Extender/Superior Duration and Compress/Superior Cooldown on Siphon, Enduring Speed, Spirit Resilience, Bullet Resilience, Scourge, Colossus, Witchmail, Juggernaut). Close Quarters, Melee Charge and Restorative Shot are lane items now, sold for them.","Round 14: ability order now takes Siphon T1 (-20s cooldown, 1 point) at point 5 and maxes Siphon before Infernal Resilience T2/T3, because the tank build puts Duration Extender, Superior Duration, Compress and Superior Cooldown (6.4k) on Siphon from 17.6k souls while the old order left it at T0 until 28.8k; ult still maxed by ~16k for mid-boss. Divine Barrier now sells Dispel Magic (its cheaper version).","Round 15: verified, no changes.","Round 17: Lifestrike note drops \"Upgrade.\" and \"proc\"; Divine Barrier note uses the standard wording (Dispel Magic is a counter); \"Lost lane?\" box moved to its own last row.","Round 19: rebuilt as the public spirit-tank (Siphon) Abrams (SwoleBenji PURE TANK, Blue Hellboy, Its Called Aura Bruh, vtitan spirit punch): the old build mixed the melee opener (Restorative Shot, Close Quarters, Melee Lifesteal, Melee Charge, Stalker, Lifestrike, Hunter's Aura) with Siphon imbues and looked like Melee Abrams. Now Extra Regen, Spirit Strike, Arcane Surge, Duration Extender, Extra Spirit, Healing Booster, Healbane, Enduring Speed, then Siphon imbues, Spirit Snatch, Witchmail, Scourge, Boundless, Escalating Exposure.","Round 19: name is now \"Rizuhble's Spirit Tank Abrams\" so the style is obvious (was Chiropractor Abrams). Counters caption uses Kieran's exact wording (get after Healbane, to stay within 112 characters).","Round 20: late list: Spirit Burn (sell Healbane), Colossus (sell Spirit Snatch; SwoleBenji PURE TANK, vtitan, Aura Bruh), Divine Barrier; slot-locked Healing Tempo, Juggernaut, Transcendent Cooldown. Core 44.8k, with the late list 70.4k without Divine Barrier.","Round 20 (update 2): checked Restorative Shot and lane timing: every lane item helps in lane now, no Slowing Bullets or Weighted Shots; no changes.","Round 23: Infuser added first in the late list (Siphon Life ticks 4 times a second on every enemy in range, so the 70% active lifesteal stacks on top of Siphon's own heal). Spirit Burn now sells Arcane Surge.","Round 25: ability order 3214122234441133 → 3311214221444332 (kit-based for this playstyle, no idle early points).","Ability order 3311214221444332 -> 3312224444111332: ult maxed at point 10 (was 13), Siphon Life (1) low priority and maxed at 13 (was 10)."]},

 changes:["Round 13: new melee build — items from punch builds only: lockbuilds Lebruh Abrams (melee, Oct 17: Restorative Shot, Extra Regen, Close Quarters, Melee Charge, Stalker, Bullet Resist Shredder, Healing Booster, Warp Stone, Hunter's Aura; Phantom Strike, Spirit Snatch, Superior Duration; Point Blank, Crushing Fists; Berserker; Spirit Resilience optional; Colossus late), Green Abrams (MINICUBANT, Sep 10, melee: Melee Lifesteal, Close Quarters, Extra Health, Melee Charge, Point Blank, Crushing Fists, Lifestrike, Colossus, Berserker) and punching boi (Aug 28: Close Quarters, Melee Lifesteal, Spirit Strike, Melee Charge, Sprint Boots, Enduring Speed, Spirit Snatch, Bullet Resist Shredder, Point Blank). Ability order: mobalytics grid (current Abrams is mostly punch: Close Quarters 92%, Melee Charge 82% early), same as the tank build.","Round 14: \"Lost lane?\" box removed (only Melee Charge and Stalker sit between Melee Lifesteal and Lifestrike (8k souls), so the reorder changed almost nothing). Replaced by a \"Losing lane? Buy 1\" Extra Regen box (first buy in Lebruh, Green Abrams and punching boi). Lifestrike note trimmed to the interaction. Added the rich box with Divine Barrier (pricier Dispel Magic, which is in Counters).","Round 15: Spirit Resilience had an empty note, so the site showed the default (lists Haze, misspells Vyper); now its own note.","Round 17: Lifestrike and Colossus notes drop \"Upgrade.\" and \"proc\"; Divine Barrier note uses the standard wording.","Round 19: verified as the public punch Abrams (Lebruh Oct 17, Saiah/Lystic edit, sadness74gun; lockbuilds item table: Melee Charge 57.9%, Close Quarters 52.6%, Melee Lifesteal 51.8%, Stalker 42.5%, Lifestrike 39.4%, Crushing Fists 38.2%). No item changes; counters caption uses Kieran's exact wording; Extra Regen names what it's sold for.","Round 20: late list: Witchmail (sell Hunter's Aura), Weighted Shots (sell Bullet Resist Shredder), Scourge (sell Spirit Snatch), Divine Barrier; slot-locked Juggernaut. Core 44k, with the late list 68k without Divine Barrier. Bullet Resist Shredder's old 'sell it for a second counter' note dropped (it's now the named sell for Weighted Shots).","Round 20 (update 2): Weighted Shots dropped from the late list: Shoulder Charge slows and pins, Point Blank slows and the ult stuns, so the kit already catches people (Kieran 13:06). Unstoppable takes its place (Lebruh late actives; sell Bullet Resist Shredder) and Ethereal Shift is added last as the luxury (Lebruh late actives). Core 44k, with the late list 74.4k without Divine Barrier. Restorative Shot stays first (spread gun, one pellet lands it).","Round 23: Unstoppable moved below Scourge in the late list: maxed Seismic Impact already gives 5s of Unstoppable when you ult in (T3 by ~28k).","Round 25: ability order 3214222344433111 → 2233124344243111 (kit-based for this playstyle, no idle early points).","Round 26 (cost): Crushing Fists moved after Hunter's Aura (it delayed the spirit 4.8k to 21.6k, now 16.8k); Unstoppable sells Spirit Resilience instead of Bullet Resist Shredder (kept the spirit 4.8k); Extra Health bought next to Colossus."]},

 changes:["Base: Kieran's in-game build; 11-slot core needed one more item and had no sustain at all (rule: sustain must exist; Holliday's kit has none). Added Leech (T4, 6400) after Glass Cannon: 28% bullet + 28% spirit lifesteal, +180 health, +12% gun, +12 spirit — the build is half spirit (11.2k) so it out-heals Vampiric Burst (13% bullet only, +100 health) which the Luentii gun build takes; it also covers Glass Cannon's -13% max health. Core now 12 slots, 44.8k.","Fortitude and Surge of Power swapped: his order put spirit at 8.8k (16k souls) with health still at 800, the exact overshoot the rules call wrong; now Fortitude at 16k (health 4k), Surge at 19.2k. Other spikes unchanged: gun 4.8k at Long Range (8k souls), spirit 4.8k at Rapid Recharge (10.4k), health 6.4k at Stamina Mastery (23.2k), 12.8k at Leech (38.4k).","Crippling Headshot is built from Weakening Headshot, not Headhunter (components checked), so 'Upgrades Headhunter' was false and it isn't a slot-locked upgrade — moved to the rich box as a full-price item with a sell; Slot locked box removed (nothing fits).","Threshold check from the game files: Crackshot is 55 (+49.5 at T2) +1.116×spirit ability damage, so Mystic Burst (>80) procs on it from his 3rd ability point; Tankbuster (>165) only clears on lasso (80+80 T1 +0.93×spirit ≈ 190) in this gun build — Crackshot sits ~125 with 18 spirit — so the Tankbuster note now says lasso, not barrel (barrel is 80+0.775×60 ≈ 127).","Sells added for a full core: counters and Mercurial Magnum/Crippling sell Recharging Rush (1600, never upgrades), other rich items name Surge / Tankbuster / Rapid Recharge / Stamina Mastery; empty notes on Extra Stamina and Long Range filled; Counters description in the standard wording.","Ability order: Kieran's order with Crackshot maxed at 10 (T3 = -6s cooldown per headshot, the Headhunter engine) before Bounce Pad T1/T2, which is what the gun builds do: Luentii Gun Holliday / Slopaday (3124331113222444) and FUG rank-1 gun (1324111233324442) both max Keg then Crackshot, bounce pad and ult after; seemeta highest-WR (65.2%) also maxes Crackshot second. Keg T2 (+1 charge) at 7 lands before Rapid Recharge.","Item fit: Leech → Vampiric Burst (both 6400 green, same slot after Glass Cannon). Leech isn't in any public Holliday build (lockbuilds item tables, tracklock pro top-24, the 6 saved public builds); Vampiric Burst is late core in Luentii's gun Holliday. Her gun is a 10-round, 0.47s revolver, so 5s of +34% fire rate, 75% reload and 70% lifesteal is a whole extra magazine of burst.","Threshold: Mystic Burst at 4k (SP 33.8): Powder Keg T2 impact 40+0.525x40.8 = 61, under 80, so it doesn't proc on the barrel then; Crackshot 55+1.116x33.8 = 93 and Lasso 111 do. Item kept, note changed from barrel to Crackshot. Recharging Rush at 12k: gun 40.3 per bullet at lvl 19 x ~7 shots in 3.5s = ~280 vs 200. Tankbuster at 25.6k: Keg T3 impact 80+0.775x120.7 = 174, Crackshot 174, Lasso 259 vs 165.","Round 9 (Worth a try): Ballistic Enchantment on Powder Keg — 6m barrel with 3 charges; each unique hero hit gives +20 weapon power for 20s, for a gun Holliday. Kinetic Dash (builds from Extra Stamina like Stamina Mastery) — +6 clip on a 10-round revolver and +25% fire rate until reload.","Round 10: Fortitude note said \"You never have to go back to base\", which overclaims; it is 2.25% max health a second after 10s without damage plus 1.5m/s move speed. Note reworded, no item change.","Round 10: Extra Charge note said \"Two barrels\"; Powder Keg starts with 2 charges, so Extra Charge makes it 3 (game files 6795). Note fixed.","Round 11: Glass Cannon moved before Tankbuster, so the 6.4k buys from 25.6k are no longer three in a row (Glass Cannon 29.6k, Tankbuster 32k, then Vampiric Burst and Lucky Shot). Added \"Team full of gun heroes?\" pivot to barrel Holliday: Mystic Expansion, Greater Expansion, Mystic Reverb (barrel hit about 178 at that point, needs 100), Boundless Spirit.","Round 12: Removed the \"Worth a try\" box (Kinetic Dash instead of Stamina Mastery pushed the health spike to about 32k souls) and the \"Team full of gun heroes?\" role pivot (spirit Holliday becomes its own build).","Round 12: Surge of Power stays on the barrel by the numbers: one barrel is 80 + 1.05x spirit (impact + burn) and you throw 5 per cycle with Rapid Recharge, so +28 spirit adds about 29 per barrel, about 147 per cycle; Crackshot (55 + 1.116x spirit, 20s cooldown) would gain about 31 per 20s. Each throw also triggers its fire-rate buff.","Round 12: Notes fixed: Silencer does not add spirit damage (it silences and cuts their spirit damage 25%); Recharging Rush refills charges, not bounce pads; Lucky Shot, Mercurial Magnum, Spellslinger and Long Range notes made concrete. Crippling Headshot now sells Improved Spirit (Recharging Rush was already the sell for counters and Mercurial Magnum).","Round 13: notes cut to niche tips, timings, imbue targets, sells and upgrades only (Kieran 00:05); desc is now just the style label.","Round 14: ability order was the hero-wide (spirit-style) grid; now Slopaday's gun order (Kieran's saved gun Holliday: 3124331131222444: Crackshot T1-T2, Keg T1-T2, Crackshot T3, Keg T3, then Bounce Pad, Lasso last). Long Range and Vampiric Burst notes emptied (proc explanation / generic tip). Rich box: notes cut to imbue target and sell, each sell unique (Mercurial Magnum and Counters both sold Recharging Rush); Silencer and Spellslinger dropped (not a pricier version of anything in the build, and no free sell left); Divine Barrier added since Dispel Magic is in Counters. Metal Skin added to Counters (no answer to a diving gun carry).","Round 15: Extra Spirit and Mystic Burst moved after Headhunter and Long Range so the gun 4.8k lands at 6.4k (was 8k after 1.6k of spirit first). Counters caption shortened to fit the 112-character limit.","Round 17: Added Spirit Resilience and Plated Armor to Counters; Divine Barrier note uses the standard wording.","Round 19: rebuilt as a real gun Holliday (the old one was a spirit/gun hybrid: Mystic Burst, Improved Spirit, Surge, Tankbuster, Recharging Rush). Core now Headhunter, Swift Striker, Titanic Magazine, Sharpshooter, Bullet Resist Shredder, Fortitude, Bullet Lifesteal → Vampiric Burst, Stamina Mastery, Lucky Shot, Glass Cannon, Ricochet (Kieran's saved Slopaday + zerggy/Teveon/Muffin Man gun builds).","Round 20: late list to 78.4k: Siphon Bullets and Inhibitor added (Teveon 787474 late box), Magic Carpet dropped (no gun Holliday build uses it).","Round 20 (update 2): Long Range moved out of lane into Mid (range helps later, not in lane); Extended/Titanic Magazine take its lane slot, gun 4.8k now lands at Headhunter.","Round 23 (kit): Powder Keg is a 6m AoE with 2 charges (3 with Extra Charge, more with Rapid Recharge). Ballistic Enchantment on it gives +20 weapon power for 20s per unique hero the barrel hits (WeaponPowerPerStack 20, AbilityDuration 20) and +22% barrel radius; Bullet Resist Shredder also triggers off the barrel (spirit damage) but gives a flat -10%. Added as a swap for Bullet Resist Shredder (worth testing). Also checked: Crackshot's bonus is bullet damage that scales 1.116x with spirit power and ignores falloff (abilities.vdata: bullet_damage class, scale_function_tech_damage), too small at this build's spirit (~11 dps) to change anything.","Round 25: ability order 3124331131222444 -> 3311234312441422 (playstyle-based; see a25/log/holliday.md).","Round 26 (cost): Ballistic Enchantment swap now replaces Long Range + High-Velocity Rounds + Sharpshooter (same gun colour, same cost) so the spirit 4.8k stays; counters sell Stamina Mastery instead of Rapid Recharge; Crippling Headshot sells Sharpshooter instead of Bullet Resist Shredder; Siphon Bullets sells Vampiric Burst so Stamina Mastery is free for the counters; renamed Long Shot Holliday."]},

 changes:["Round 13: new spirit/pick build — items from spirit builds only: lockbuilds ILYDekker Holly - NEW ('spirit holly', Oct 11: Headshot Booster, Extra Charge, Extra Spirit, Improved Spirit, Trophy Collector, Rapid Recharge, Mystic Burst, Recharging Rush; Tankbuster, Superior Duration, Boundless, Superior Cooldown; Stamina Mastery, Fortitude optional; Cursed Relic, Spirit Burn, Transcendent, Escalating Exposure) and Dingus' Spirit Holiday (Sep 30). Ability order: mobalytics grid; current Holliday is mostly spirit (Extra Charge 99%, Rapid Recharge, Extra/Improved Spirit, Tankbuster and Superior Duration lead every phase), so the grid is this style: Keg 1 and 5-7, Crackshot 2, Bounce Pad 3/8/12-13, Lasso 4 and 9-11, Crackshot 14-16.","Round 14: ability order from seemeta's most popular Holliday order (Oct 5-19, 4,286 matches; its top items are this build's: Extra Charge 99%, Rapid Recharge 96%, Tankbuster, Superior Duration, Boundless). Cursed Relic note no longer claims they could item out of the lasso. Added the rich box with Divine Barrier (pricier Dispel Magic, which is in Counters).","Round 15: Counters caption was 119 characters (game limit 112); now after Tankbuster with the short wording.","Round 17: Added Spirit Resilience and Plated Armor to Counters; Divine Barrier note uses the standard wording; lane sell note standard wording.","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: late list to 71.2k: Diviner's Kevlar first (second health step on lasso), Crippling Headshot, Refresher last (ILYDekker 395839, Lomein 652348); Transcendent moved in.","Round 23 (kit): Powder Keg is the ability this build casts most (2 charges, +1 at T2, +2 from Rapid Recharge, 2.5s between charges at T3) and its impact is 80 + 0.775x spirit at T3 (157 at 100 spirit), over Mystic Reverb's 100. Reverb on the barrel repeats 50% of the hit 3s later in a 16m area with a 32% slow, every 6.25s. Added 2nd in the late list (sells Recharging Rush; Crippling Headshot then falls back to Rapid Recharge as its note already says). Also checked: Crackshot's headshot bonus scales 1.116x with spirit and ignores falloff, so at 150 spirit it is ~220 bullet damage; this build maxes Crackshot last (order from same-style builds), worth testing earlier.","Round 25: ability order 1132141244422333 -> 1132141244433223 (playstyle-based; see a25/log/holliday_spirit.md).","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked)."]},

 changes:["Base: Kieran's in-game build, items and order kept through Escalating Exposure. His late box sold Grit for Ricochet (Grit had already become Spirit Shielding), Spirit Lifesteal for Siphon (while Leech in Slot locked still upgraded it) and ended on 11 slots at 57.6k. Fixed with the components: Spiritual Overflow is built from Spirit Lifesteal (so it's a +4800 upgrade, no sell needed, and Leech can't also upgrade it — Leech dropped), Siphon now sells Spirit Shielding, Ricochet sells only a lane item. Core = 12 slots at 49.6k: Ricochet 32k, Escalating Exposure 38.4k, Siphon 44.8k, Spiritual Overflow 49.6k.","Silencer (6400) moved from core to the top of the rich box with his 'sell Healbane' note — it was the 13th item and took the build to 56k. Divine Barrier moved from rich to Counters (pricier Dispel Magic, rule 27) so rich stays at 8.","Surge of Power imbue moved from Essence Theft (3) to Jar of Dead (1): Essence Theft is a passive (no cast in the ability data), so Surge's active half (+20% fire rate, full speed while shooting for 8s on cast) never fired and its +28 spirit only added 0.25×28 = 7 stolen damage; on the jar (4 charges, 13s) the buff is up almost always and the skulls get +7 per hit.","Lane box is survival-only: Close Quarters (pure damage) removed, Point Blank with it. Improved Spirit's 'Upgrade.' was false (Extra Spirit had already become Surge) — now a fresh T2 at 11.2k, and Boundless Spirit added to Slot locked so it isn't a T2 held forever. Active Reload's 'every 13th shot hits double' claim isn't in the weapon data (no hit counter on Graves' gun), so the note is just 'quick reloads keep you shooting'.","Spikes unchanged: gun 4.8k at Active Reload (7.2k souls), spirit 4.8k at Improved Spirit (11.2k), gun 8k at Toxic (14.4k), health 5.6k at Healbane (18.4k) and 8k at Stamina Mastery (20.8k), gun 11.2k at Capacitor (24k). Sells added for the full core (Split Shot / Active Reload / Toxic / Healbane), Mercurial Magnum given its imbue target, 'beam' → 'shoot', Witchmail/Divine Barrier no longer called upgrades.","Mid box had 9 items; split into Mid · L-R (8) + Mid · cont. per the layout rule, order unchanged.","Ability order: Kieran's in-game order kept for the first 7 points (Jar, Hands, Essence Theft T1+T2 = +20 stolen weapon damage for the gun), then ult T1/T2 at 8-9 like both seemeta orders (most-popular 61.5%: 112344422234331; highest-WR 65%: 112314413332224), Theft maxed at 11 (skulls apply it), Jar maxed before Hands because Surge/Mercurial sit on the jar, ult T3 (5% current-health) last as in Kieran's and the highest-WR order.","Threshold: no damage-threshold items. Spiritual Overflow/Toxic Bullets are build-up on shooting (40-round, 0.1s gun). Witchmail only in the rich box. No change.","Round 10: Toxic Bullets (3.2k) moved from 14.4k to right after Healbane, so the 4.8k health spike lands at 15.2k (was 18.4k) and Toxic at 18.4k. Graves fights close (gun falloff starts at about 8m, Grit/Extra Stamina notes say walk onto people), so by the rule the health spike comes before more big damage once the gun (7.2k) and spirit (11.2k) spikes are in. seemeta Graves, Oct 5-19 2026: Toxic Bullets bought at 19:56 on average, after Grit (10:17) and Spirit Shielding (15:19). Toxic note: \"Stacks instantly\" was not true (it builds up per shot), reworded.","Round 10: notes made true: Capacitor said \"Your spirit spike\" (it is a gun item; spirit 4.8k is Improved Spirit), Healbane and Escalating Exposure work off spirit damage (Tesla, skulls), not bullets, and Ricochet now says why (bounces carry Tesla/Toxic procs).","Round 11: Ricochet now before Split Shot, so the 6.4k buys from 25.6k are no longer four in a row (Ricochet 30.4k, Split Shot 32k, then Escalating Exposure, Siphon Bullets, Spiritual Overflow late). Added \"Lost lane?\" reorder box: farm items earlier.","Round 12: Split Shot moved from 32k (a fresh 1.6k item bought late and sold later) to right after Toxic Bullets at 20k, next to the other farm items. Lost lane? reorder updated to match.","Round 12: Rich box trimmed to pricier versions of what the build does: removed Refresher (\"not needed\"), Cursed Relic and Phantom Strike (different jobs) and Witchmail (it was the pricier Spirit Shielding, but Spirit Shielding is sold for Siphon Bullets). Lucky Shot and Mercurial Magnum both sold Active Reload; Lucky Shot now sells Split Shot.","Round 12: Lane notes say these are first buys: Restorative Shot and Extra Regen are sold later and upgrade into nothing, so they only pay off bought first.","Round 13: notes cut to niche tips, timings, imbue targets, sells and upgrades only (Kieran 00:05); desc is now just the style label.","Round 13: Surge of Power checked by kit: on Jar of Dead (4 charges, 13s between) every throw gives +20% fire rate and full speed while shooting for 8s, so it's up almost all fight; that's a gun item for Graves. Kept. Improved Spirit (+18 spirit only adds ~3 per Tesla chain at 0.19x) swapped for Mystic Slow, same colour and price so spikes don't move, from SWZTCH's Graves Slurp (lockbuilds, Oct 14, gun: Restorative Shot, Opening Rounds; Tesla, Stamina Mastery, Titanic; Mystic Slow/Burst Fire/Toxic; Ricochet, Inhibitor; Silencer; Siphon/Spiritual Overflow). Boundless Spirit slot-locked line removed with it.","Round 14: notes cut to triggers and sells: lane items, Split Shot (Tesla is a 15% chance, not every bullet), Mystic Slow (proc explanation), Bullet Resilience ('cheap', it's 3.2k). False counter notes fixed: Counterspell blocks, it doesn't send the burst back (now 'Lash ult, Infernus ult.'); Spellbreaker isn't a dispel (now 'big spirit hits'). Rich notes cut to sells; Inhibitor builds up per shot (0.77 a shot), it isn't instant; Lucky Shot now sells Mystic Slow (Split Shot was also the Counters sell). Divine Barrier moved from Counters to the rich box as the pricier Dispel Magic. 'Lost lane?' said to move Toxic and Split Shot, which already come right after Healbane; it now moves Ricochet ahead of Stamina Mastery and Capacitor (32k to 26.4k).","Round 15: Restorative Shot removed (Kieran dislikes it except on shotgun heroes; Graves is not one), lane box is Extra Regen only. Spirit Shielding, Spirit Lifesteal and Healbane moved before Surge of Power and Mystic Slow so health 4.8k lands at 11.2k (was 15.2k, after the spirit spike) on a close-range hero. Silencer removed from rich (not a pricier version of anything in the build); Inhibitor is now the pricier anti-heal and sells Healbane. \"Lost lane?\" box removed: the reorder only took effect at 20k souls, long after lane.","Round 17: Spirit Shielding and Surge of Power notes drop \"Upgrade.\"; Dispel Magic note drops \"DoTs\"; Divine Barrier note uses the standard wording.","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: late list to 81.6k: Inhibitor first, Silencer and Cheat Death added (FaxFox 404608), Mercurial Magnum now sells Surge of Power (both on Jar of Dead).","Round 23 (kit): Jar of Dead T2 already slows 24% for 1s on every Deadhead hit (ab.py ability_necro_hauntingskull SlowPercent 24), and Jar T2 is taken at 7.2k, before Mystic Slow (24%, 15.2k), so Mystic Slow added almost nothing. Replaced by Mystic Vulnerability (same 1.6k, same spirit colour, spikes unchanged): -8% spirit resist from every Deadhead and ghoul hit, and it upgrades into Escalating Exposure, which the build already buys (now +4.8k instead of 6.4k). That freed a core slot, so Lucky Shot moves from the late list to the end of Late (25% of beam bullets deal double). Late list: Inhibitor, Silencer, Mercurial Magnum, Cheat Death, Divine Barrier.","Round 25: ability order 1123433441322214 -> 1123433441321224 (playstyle-based; see a25/log/graves.md)."]},

 changes:["Round 13: new ult build — items from ult builds only: lockbuilds ULT SPAM GRAVES (Lockbuilds Team, Oct 19: Restorative Shot, Extra Spirit, Improved Spirit, Extra Stamina, Arcane Surge, Enchanter's Emblem; Duration Extender, Heroic Aura, Superior Duration, Magic Carpet, Boundless; Spirit Shielding situational; Spirit Burn, Refresher, Transcendent, Diviner's Kevlar; Echo Shard, Leech, Escalating Exposure optional). Spirit Lifesteal is by kit: all of Graves' ult damage is spirit (13% back) and it's the half of Leech that build lists. Ability order: that build stacks a T3 ult; mobalytics (current Graves is mostly this style: Arcane Surge 54%, Duration Extender, Echo Shard 32%) has ult at 6-8 for 25-48%, taken here before Hands.","Round 14: ability order from seemeta's most popular Graves order (Oct 5-19, 2,434 matches; its top items are this build's: Arcane Surge, Enchanter's Emblem, Heroic Aura, Duration Extender, Boundless). Counters now sell Arcane Surge (Mystic Vulnerability upgrades into Escalating Exposure). Counterspell note was false (it blocks, it doesn't send the burst back). Divine Barrier added to the rich box (Dispel Magic is in Counters).","Round 15: Restorative Shot removed (Kieran dislikes it except on shotgun heroes); core still fills 12 slots. Counters caption was 117 characters (limit 112); now after Heroic Aura.","Round 17: Arcane Surge note drops \"Upgrade.\"; Dispel Magic note drops \"DoTs\"; Divine Barrier note uses the standard wording.","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: late list to 76.8k: Transcendent Cooldown moved up from Slot locked (ult cooldown), Cursed Relic (farmingbip 567619) and Cheat Death (580942) added; Refresher moved last as the luxury.","Round 23 (kit): checked Borrowed Decree (16 + 0.04x spirit s, +10 at T2, up to 3 gravestones, so Echo Shard + Refresher give 3), Duration Extender/Arcane Surge both lengthen it (ETechDuration), Heroic Aura buffs ghouls (NonHeroMult 2), Jar of Dead's death cost scales with cooldown reduction (ResourceCost x ETechCooldown) so Superior Cooldown also means more jars. No changes.","Round 25: ability order 1123444222343311 -> 1123444224231133 (playstyle-based; see a25/log/graves_ult.md).","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked)."]},

 changes:["Round 19: new build. Tank/frontline Graves from Jamlex Tank Graves (lockbuilds 848784, Oct 10) and metabot.gg Graves 6795 data (Oct 20, 29,212 matches: Torment Pulse 26.0% pick / 61.1% WR, Escalating Exposure 35.5%, Siphon 23.2%, Scourge 5.7% / 66.1%). Torment Pulse + resists (Emblem, Spirit Resilience, Escalating Resilience, Scourge) + Siphon/Leech sustain; skull/Torment spirit damage with Mystic Vulnerability → Escalating Exposure and Toxic Bullets.","Round 19 fix: Restorative Shot (shotgun heroes only, Kieran rule) → Extra Regen, bought first and sold for Spirit Resilience; Scourge note emptied (item text already says it can be self-cast).","Round 20: Spirit Shredder now upgrades into Spirit Rend; late list to 72.8k with Indomitable and Boundless Spirit (Jamlex 848784 optionals); Counters now sell Enchanter's Emblem.","Round 23 (kit): Graves' gun fires every 0.102s (heroes.vdata citadel_weapon_necro_set, ~9.8 shots/s, 40 rounds) and Escalating Resilience gives one stack per bullet that hits a hero (30 stacks x 2% bullet resist, 24s), so it maxes in ~3s of shooting, faster than on any slow gun. Kept, note added because it's the reason this item is here. No item changes.","Round 25: ability order 1123144413222334 -> 1123314334412224 (playstyle-based; see a25/log/graves_tank.md).","Round 26 (cost): Escalating Exposure moved after Escalating Resilience (tank defence first; spirit 6.4k/8k and gun 6.4k/8k land at 28.0k/23.2k, 4.8k spikes unchanged)."]},

 changes:["Toxic Bullets (3.2k at 25.6k) out for Spirit Strike (800 at 11.2k) into Spirit Snatch (2.4k at 19.2k). Rend's last upgrade makes it a heavy melee, so both proc on every swipe: Snatch adds 50 + 0.84x spirit damage and steals 25 spirit power and 12% spirit resist. Pros buy Spirit Strike 99% and Snatch 99%, lockbuilds' Bloodlust gun build and deadlocked.gg's core both rush it; Toxic isn't in any Drifter list, and Stalker's Mark already cuts healing 40% at its last upgrade. Core stays 45.6k, 12 slots.","Fortitude kept on purpose (checked against the rule): Drifter resets between picks, so the out-of-combat regen and 1.5 m/s sprint are what he uses, and deadlocked.gg lists it core for roaming. Veil Walker (51% pro) would land the health spike 2.4k over at 12.8k instead of exactly 4.8k at 10.4k.","Spikes unchanged: 4.8k gun at 6.4k (Close Quarters, Stalker, Point Blank), 4.8k health at 10.4k. Spirit ends at 6.4k (Surge on Rend + Snatch).","Counters still sell Stalker; Glass Cannon still sells Monster Rounds.","Ability order: mobalytics build-stats grid: Rend 5-6, Stalker's Mark 7-8, Rend 9, ult 13-15, Bloodscent last; kept that shape with unlocks first (90-99%), alternating Rend/Mark so Mark T1 bullet shred lands at 6 for the gun, both maxed by 10, ult 13-15 as public.","Item fit: Glass Cannon → Silencer (both 6.4k gun T4, same slot, Monster Rounds still sold for it). Drifter has a 12-round magazine with a 2.44s reload, so Glass Cannon's +7% fire rate and +2 rounds per kill do little, and its -13% max health hurts a hero who brawls. Silencer works off the same short 1v1 pickoffs (Bloodscent +15% vs isolated, Hunter's Aura doubled on one target): the target is silenced 2.5s and deals 25% less spirit damage, so they can't escape or fight back. Public: deadlocked.gg late core ('always good'), tracklock late situational, lockbuilds official Bloodlust build late, lockbuilds 60.4% WR over 5.9k buys. Glass Cannon is in none of them.","Item fit: Extra Spirit → Surge of Power swapped for Duration Extender (on Stalker's Mark) → Superior Duration. Surge isn't in tracklock pro, tracklock core, deadlocked.gg, lockbuilds' official build or its top-30 table. Superior Duration: tracklock pro 57% late (Duration Extender 24%), lockbuilds 55.4% WR over 7.8k, deadlocked.gg late core. Kit: Stalker's Mark is the pickoff tool (5s +3s at T2, bleed 2% +1.5% at T3, -40% healing), Eternal Night 6.5s +2.5s, and Silencer's 2.5s silence all get longer. Spirit invest stays 6.4k (800 more early, 800 less on the upgrade), core still 45.6k.","Item fit, melee items checked: Rend's T3 makes it a heavy melee on an 8s cooldown, and with a 12-round magazine and 2.44s reload Drifter melees every reload, so Melee Lifesteal (100% pro, 23k lockbuilds) → Lifestrike (35% pro, 12k), Spirit Strike (99% pro) → Spirit Snatch (99% pro, 6s cooldown, procs on every Rend) all stay. Monster Rounds stays as Kieran's named lane-fixer for Drifter. Rest kept: Close Quarters/Point Blank (33% pro, 12.5k lockbuilds; 15m range matches his 22m falloff), Stalker 100%, Bullet Lifesteal → Vampiric Burst (56% WR; its 75% reload fixes the small magazine), Sprint Boots/Enduring Speed, Extra Health/Fortitude (deadlocked core for roaming, 53.7% WR 13k), Burst Fire (lockbuilds official mid #1, 13k), Hunter's Aura 66%, Lucky Shot (61% WR, +30% magazine).","Threshold: no damage-threshold items. No change.","Round 9 (Worth a try): Crushing Fists — Rend T3 counts as heavy melee (55%, the same reason Spirit Snatch procs on it), so every Rend (8s) refills ammo on a 12-round gun and applies 2 of the 6 stun stacks. Kinetic Dash — +6 clip and +25% fire rate after a dash-jump until reload, on a 12-round magazine with a 2.44s reload.","Round 12: Removed the \"Worth a try\" box (Crushing Fists instead of Lucky Shot). Lucky Shot note made concrete.","Round 13: notes cut to niche tips, timings, imbue targets, sells and upgrades only (Kieran 00:05); desc is now just the style label.","Round 13: checked against gun Drifter builds (lockbuilds BLOODLUST DRIFTER, Lockbuilds Team Oct 18, fire-rate; Blood's BIRD OF HERMES: REBIRTH, Oct 16, Rend/gun; cheese bread's gun pivot). Bullet Lifesteal→Vampiric Burst is Bird of Hermes core: kept. Monster Rounds is in its jungling section and Drifter farms slowly: kept. Close Quarters→Point Blank is only a niche option in two of them: swapped for Slowing Bullets→Weighted Shots (Bird of Hermes core, +30% weapon damage and a slow so they can't run), same 3.2k total, gun 4.8k still at 6.4k.","Round 13: Monster Rounds out (Drifter gets souls from picks: Bloodscent gives +15% vs isolated heroes and +3 weapon damage per isolated kill, Monster Rounds only helps vs creeps/camps). Sprint Boots now upgrades to Trophy Collector (+16 souls/min per kill/assist stack up to 16, keeps through death; Trophy Collector 28.9% on lockbuilds Drifter stats) instead of Enduring Speed; Juggernaut slot-locked line removed with it. Gun 4.8k now at 5.6k (Stalker + Slowing Bullets→Weighted Shots).","Round 14: notes cut to the allowed kinds: \"Upgrade.\" notes, card-restating notes (Trophy Collector, Hunter's Aura), the Vampiric Burst usage tip and Stalker's duplicate sell note emptied; Spirit Snatch note reworded without proc wording (deadlock.wiki/Rend: T3 enables heavy-melee item interactions such as Spirit Snatch); Divine Barrier note now says what to sell. Items, order and spikes unchanged (checked against BIRD OF HERMES Oct 16, Hybrid Drifter Oct 18, cheese bread gun Aug 27, Swan Oct 4).","Round 19/20 (Kieran Oct 20: 'Gun Drifter has a lot of melee, it's more a hybrid'): rebuilt as a genuine gun Drifter from the public gun builds (BLOODLUST official 751433 Oct 18, Bird of Hermes 705427 Oct 16, Swan 830360 Oct 4; seemeta Oct 5-19). Gun line Close Quarters > Point Blank, Rapid Rounds > Swift Striker, Kinetic Dash, Hunter's Aura, Hollow Point, Lucky Shot, Silencer; health Melee Lifesteal (lane sustain), Sprint Boots > Trophy Collector, Bullet Lifesteal > Vampiric Burst, Battle Vest. Out: Slowing Bullets > Weighted Shots (rule 9), Spirit Strike > Spirit Snatch, Duration Extender > Superior Duration, Lifestrike, Extra Health > Fortitude, Burst Fire (all spirit/melee items, now only in the spirit build). Late list: Crippling Headshot, Leech, Armor Piercer, Divine Barrier, Siphon Bullets, Frenzy (76k).","Round 23 (kit): Rend T3 deals 55% heavy melee (ab.py drifter_blood_blast UseHeavyMelee, DamageHeavyMelee 0.55; its base hit is 1.2x light melee), so it triggers melee items on every target in the 16m cone. Melee Lifesteal now upgrades into Lifestrike after Point Blank (16k): +125 health, heal 120 + 1.75x spirit + 35% of the melee hit, 48% slow for 2.5s on everyone Rend hits, every 8s (Rend T2). Health 4.8k now at 11.2k still, 12.8k by Vampiric Burst. Armor Piercer sells Swift Striker (Melee Lifesteal is now Lifestrike).","Round 25: ability order 1122324113234443 -> 1122324131244334 (playstyle-based; see a25/log/drifter.md).","Round 26 (cost): Lifestrike bought straight after Bullet Lifesteal (was 16.0k, now 12.0k)."]},

 changes:["Round 13: new spirit build — items from spirit builds only: lockbuilds \"I'm gonna burst\" by Bog (spirit Drifter, Oct 17: Melee Lifesteal, Stalker, Spirit Strike, Extra Health, Cold Front, Spirit Snatch, Hunter's Aura, Sprint Boots; Lifestrike, Fortitude; Melee Charge, Tankbuster, Crushing Fists, Superior Duration, Spirit Burn, Arctic Blast; Enduring Speed/Trophy Collector situational; Silencer late). Ability order by kit (no spirit-only order data): Rend maxed first (T1 +40 close damage, T3 counts as a heavy melee so Spirit Snatch procs on it), then Mark, Bloodscent, ult 13-15.","Round 14: Silencer out, Veil Walker in (Mid, after Tankbuster). Spirit-style evidence: tracklock pro Drifter (148 games, Tankbuster 76%, Spirit Burn 38%) buys Veil Walker 51%, tracklock core lists it, sigma, im da dwifta, cheese bread spirit and BLOODLUST all have it; Silencer is only a late pick in Bog/BLOODLUST and maxed Rend already silences 2s up close. Health now 8k at 23.2k (was 5.6k until 41.6k). Crushing Fists moved to Late (Mid was 9 items). Added the rich box with Divine Barrier (Dispel Magic is in Counters). Ability order now the seemeta most-popular Drifter order (63.1%, 3,974 matches; Rend maxed first, same as the kit order) instead of an unsourced kit order. \"Upgrade.\"/card-restating notes emptied; Spirit Snatch note reworded.","Round 19/20: checked against the real spirit/melee Drifter (Bog 761760 Oct 17, LordNM 787882 Sep 28, Brick Goblin 702822 Oct 12). Renamed Rizuhble's Spirit Melee Drifter (desc Spirit melee Drifter) so the pair reads gun vs spirit/melee. Hunter's Aura (a gun-build item, now only in the gun Drifter) replaced by Mystic Vulnerability, which upgrades to Escalating Exposure in the late list (LordNM, Brick Goblin). Cold Front stays in lane for its damage; its gank-slow note emptied (rule 9). Late list: Escalating Exposure, Boundless Spirit, Cursed Relic, Divine Barrier, Ethereal Shift last (73.6k).","Round 23 (kit): Stalker's Mark bleeds as spirit damage every 0.5s for 8s (T2) (localization: SpiritDPS; ab.py TickRate 0.5, Duration 5 +3), and Escalating Exposure stacks on spirit damage every 0.7s (12 stacks = +54% spirit damage to that target). One Mark fills it by itself, then Rend, Spirit Snatch, Tankbuster and Spirit Burn all hit 54% harder. Escalating Exposure (upgrade of Mystic Vulnerability, +4.8k) moves into Late in Arctic Blast's slot (same 4.8k on top of Cold Front, same colour, spikes unchanged); Arctic Blast moves to the top of the late list as the Cold Front upgrade. Mark's bleed scales with your health regen, not spirit (EHealthRegen x0.015), so spirit items don't raise it.","Round 25: ability order 1122324113234443 -> 1123124122443334 (playstyle-based; see a25/log/drifter_spirit.md).","Round 26 (cost): Fortitude moved right after Lifestrike (Extra Health sat idle until the last buy; health 6.4k/8k now at 15.2k, 4.8k spikes unchanged); renamed Cold Cuts Drifter."]},

 changes:["Added Stalker second (100% of pro Calicos, Kieran's build: 85 damage on slash, +1.5m speed, wallhack, +50 hp) and Spirit Shredder → Spirit Rend (61% pro mid, procs on the slash since it's a light melee). Both are gun-slot, so they don't disturb spirit.","Spirit 4.8k now lands exactly on Spirit Snatch at 8k souls (Spirit Strike + Cold Front + Snatch), Kieran's order. Health 4.8k at 11.2k with Enduring Speed + Lifestrike (was 9.6k; Stalker is the extra early buy). Compress Cooldown moved to Return to Shadows (Kieran: 78s ult).","Arctic Blast moved up to 20.8k as the mid power spike (92% pro late, Kieran: 'Power Spike') instead of 46k. Dispel Magic into core at 24k (80% pro, Kieran's pick over Counterspell).","Cut Mystic Vulnerability/Escalating Exposure, Spirit Lifesteal/Leech and Mystic Expansion/Greater Expansion (none in the pro top-8; Rend covers the shred). Hunter's Aura and Trophy Collector from Kieran's build skipped: bullet-resist aura does nothing for spirit burst, and Kieran's own note prefers Enduring Speed over Trophy.","Core 12 slots, 48k (was 54.4k): Lifestrike, Stalker, Snatch, Arctic, Enduring, Rend, Boundless, Superior Cooldown, Dispel, Torment, Scourge, Spirit Burn. Ability order is Kieran's (bombs maxed once Arctic is in).","Ability order: Mobalytics grid exactly (Ava 5-6, ult 7-9 at 83-96%, bombs 10-12 at 78-94%, slash last 83-95%), = seemeta most-popular (56.1%, 11.3k); Kieran's Maldox order is the same shape but unlocked the ult at 6 and split ult T3 (heal 450 + refund all cooldowns) after bombs; bombs maxed 10-12 still lands with Arctic Blast mid.","Item fit: Spirit Shredder → Mystic Vulnerability (both 1600, same slot at 12.8k). Shredder's only upgrade, Spirit Rend, isn't in any public Calico build (tracklock pro top-24, lockbuilds top-30; Maldox lists it only for a gun Calico), so Shredder would sit as a dead-end T2. Mystic Vulnerability is the same -8% spirit resist but procs on every spirit hit (slash, bombs, ult), upgrades to Escalating Exposure, and has more spirit-build support: Maldox core, lockbuilds 31.4% pick / 50.6% WR (Shredder 18.3%), tracklock pro late 42%.","Item fit: Spirit Rend removed (no public Calico build has it; Maldox only for a gun Calico). Rich Refresher → Escalating Exposure: Refresher isn't in any public Calico build, EE is lockbuilds 57% WR (16% pick) and Maldox's teamfight path, and it's built from Mystic Vulnerability. Total 46.4k (was 48k).","Fortitude (Kieran: good on roamers, Calico included; it's in the public Calico build he plays): Torment Pulse (3.2k) → Extra Health → Fortitude (3.2k), same price and slot. Health now ends at 11.2k. Counters now sell Stalker.","Threshold: Spirit Burn at 46.4k (SP 167): Gloom Bombs T3 ~470 on one target + Return to Shadows T3 327 = ~800 vs 500 in 5s. No change.","Round 9 (Worth a try): Refresher — Return to Shadows T3 deals 225 + 0.61x spirit twice (cast and return), heals 450 and refunds all cooldowns; Refresher (300s) resets it for a second full combo. It was removed earlier for no public support, but Kieran now wants kit ideas to test.","Escalating Exposure removed (Kieran): it stacks once per 0.7s per hit and Calico's damage comes in short bursts with no Torment Pulse to keep stacks up, so it never gets near 12 stacks. Mystic Vulnerability stays as a flat spirit-resist cut on every hit.","Round 10: Dispel Magic note said \"Nearly every Calico buys it\"; seemeta Oct 5-19 2026 has it at 44%, so the claim is gone. No item change.","Round 12: Removed the \"Worth a try\" box with the Refresher idea.","Round 12: Compress Cooldown moved from Return to Shadows to Gloom Bombs. Bombs come back every 11s and do about 133 + 1.9x spirit to one target per throw (4 bombs, 65% for extra hits), about 12 + 0.17x spirit a second; the ult is about 450 + 1.2x spirit every 95s, about 5 a second. 18% off the bombs adds more damage. Superior Cooldown later still shortens the ult.","Round 13: notes cut to niche tips, timings, imbue targets, sells and upgrades only (Kieran 00:05); desc is now just the style label.","Round 14: name Alley Cat → Burst Calico (Kieran's style for her; the old name only restated the cat theme). Ability order now exactly seemeta most-popular (56.3%, 11,054 matches: Slash, Bombs, Ava T1/T2 before the ult unlock); the old one unlocked the ult before Ava's points. Reactive Barrier note said slows, but it only triggers on stun, chain, immobilize, sleep or silence (game files): fixed. Ethereal Shift out of Counters (it doesn't cleanse a silence; Unstoppable, already there, makes you immune to silences, so its note now names both). Counterspell note: dropped the unverified 'lift or long channel'. Added the rich box with Divine Barrier (Dispel Magic is core). 'Mid · cont.' (Fortitude only) merged into Late, same buy order. \"Upgrade.\" and the duplicate Stalker sell note emptied; Compress Cooldown note \"On Gloom Bombs.\" added.","Round 15: Arctic Blast note emptied (it repeated Cold Front's slash-then-slow combo; Arctic Blast is its upgrade).","Round 17: Spirit Resilience note drops \"ticking\"; Divine Barrier and lane sell notes use the standard wording; Slot locked moved beside the rich box.","Round 19: checked against the real Calico styles (spirit burst: Bog's I'm gonna burst REBORN Oct 7, eido Sep 11, SkeletonHoney 2.0 Sep 16; seemeta Oct 5-19). Genuinely the burst style, no item changes. Round 20: late list now runs to 78.4k: Escalating Exposure (upgrade of Mystic Vulnerability), Diviner's Kevlar, Cursed Relic, Divine Barrier, then Transcendent Cooldown and Juggernaut.","Round 23: Mystic Reverb on Gloom Bombs added to the late list (each bomb hits for 150+ by then, and the ult refunds the bombs for a second reverb).","Round 25: ability order 2133344441113222 → 1122314341434322 (kit-based for this playstyle, no idle early points)."]},

 changes:["Mystic Reverb (6.4k) and Spirit Burn (6.4k) out of core into the rich box. In their place Mystic Burst (800, 2nd buy) into Tankbuster (2.4k, last buy) and Quicksilver Reload on Scorn (1.6k at 11.2k). Core drops from 54.4k to 46.4k, 12 slots.","Mystic Burst: 100% of pro Mo games. Scorn is 85 damage after its first upgrade (50 + 35), so it clears the 80 every cast for +40 on everyone in 9m. Tankbuster needs 165: Scorn only gets there at 107 spirit power, which this build never reaches, so it's bought last, after Arctic Blast (175 base) is in to proc it. Pros buy Tankbuster 89%.","Quicksilver Reload: 100% of pro Mo games, deadlocked.gg 'super good early/mid'. On Scorn it adds 44 + 0.16x spirit to every charged Scorn and refills the gun. Mercurial Magnum is its upgrade in the rich box.","Spirit spike still 4.8k at 4.8k (Extra Spirit, Mystic Burst, Cold Front, Compress Cooldown); Improved Spirit moves to mid. Health 4.8k at 9.6k (Sprint Boots, Enduring Speed, Healbane, Spirit Lifesteal), was 10.4k. Torment Pulse still after health (82% pro).","Rich box sells: Spirit Burn sells Torment Pulse, Reverb sells Healbane. Refresher dropped from rich (no slot left to sell for it that isn't a core upgrade).","Ability order: mobalytics build-stats grid: Scorn 5-6 (90-100%), Burrow 7-9 (65-92%), Combo 10-13, Sand Blast last; same order with unlocks first, Scorn T3 (+15% damage debuff) at 12 between ult points.","Item fit: Spirit Lifesteal → Enchanter's Emblem (both 1600 green, still the 4.8k health spike at 9.6k). Scorn already heals 120% of its hero damage and Combo T1 adds 100% lifesteal, so 13% spirit lifesteal is wasted on him; no public Mo build buys it (tracklock pro top-24, wander, LordNM, Saint). Emblem is in tracklock's 59% WR Mo build (Early) and wander's mid core, and its +15 spirit / 5% cooldown hits Scorn (0.75x spirit) and the spin (1.488x).","Item fit: Infuser → Colossus (sell Emblem for it). Infuser's 70% lifesteal for 7s stacks on top of Scorn's 120% self-heal and Combo lifesteal, so it adds little, and no public Mo build buys it. Colossus (35% resists + slow for 7s) covers the 2.4-3.1s Combo channel where you're stuck in the middle of them; it's late core in wander's and LordNM's builds. Health ends at 9.6k as before; total 48.0k.","Item fit: rich Mystic Reverb → Scourge. Reverb isn't in any public Mo build; Scourge is #16 in tracklock's 59% WR core, 37% pro late buy, lockbuilds 58.7% WR (6.2k buys), and his kit sits in their face for the 10s aura.","Fortitude (Kieran: good on Mo & Krill as a roamer): Healbane (1.6k) → Extra Health (800) → Fortitude (+2.4k) first in Mid, so 4.8k health still lands at 11.2k (was 9.6k). Counters now sell Torment Pulse; Scourge sells Superior Duration.","Threshold: Mystic Burst at 1.6k: Scorn T1 85+0.75x25.4 = 104 vs 80. Tankbuster at 49.6k: Scorn 211 vs 165. Spirit Burn (rich): Scorn 211 + Burrow spin ~560 vs 500. No change.","Round 8: Spirit Burn note fixed. Since Jul 28 the explosion (110 to 50) hits only the burned enemy, not everyone round you (game files 6795).","Round 9: Quicksilver Reload on Scorn moved from 12.8k into the lane (3.2k), Compress Cooldown from 4.8k to Mid. tracklock.gg pro builds, last 30 days, checked 2026-10-19: Quicksilver 100% early, Compress Cooldown not in the top 24. Spirit still 4.8k at 4.8k.","Round 9: Torment Pulse moved from 17.6k to right after the health spike (14.4k). Pros buy it early (88%), but before health it would put spirit at 8k with no health, so it goes first thing after Fortitude.","Round 9: Tankbuster moved from last (49.6k) to Mid (19.2k). The old 'never reaches 107 spirit' was wrong: Scorn 85 + 0.75x spirit clears 165 from 107 spirit, and the build has ~117 at 19.2k (Scorn ~173). tracklock.gg pro builds, last 30 days, checked 2026-10-19: Tankbuster 88% mid. Mystic Burst no longer sits as an 800 for the whole game. Mid box split (was 9 items).","Round 9: Worth a try: Phantom Strike. 25m teleport that pulls them to the ground, disarms and slows 40%; Combo only has 4m range, so it makes the ult land. tracklock.gg pro builds, last 30 days, checked 2026-10-19: 18% late.","Round 11: Added \"Team full of gun heroes?\" pivot: Hunter's Aura, Heroic Aura, Bullet Resist Shredder so Combo and Scorn set up your gun carries. No T4 run before 30k.","Round 12: Enchanter's Emblem swapped for Healbane (same colour and price, same spot). No pro Mo & Krill builds Enchanter's Emblem; Healbane is 64% mid (tracklock, last 30 days), and Scorn and Burrow hit everyone round you, so their healing is cut all fight. Health 4.8k still lands at 11.2k.","Round 12: Removed the \"Worth a try\" box (Phantom Strike) and the \"Team full of gun heroes?\" role pivot (support Mo & Krill becomes its own build).","Round 13: notes cut to niche tips, timings, imbue targets, sells and upgrades only (Kieran 00:05); desc is now just the style label.","Round 14: Duration Extender moved from Sand Blast to Burrow: Burrow's spin (the build's main damage, 75+50 + 1.488x spirit DPS) lasts SpinDuration 1.5s, which scales with ability duration (abilities.vdata ETechDuration), and Burrow is maxed by 8.8k (20s cooldown), while Sand Blast only gets its first upgrade at 29.6k. Tankbuster moved to the end of Mid (23.2k): at 19.2k Scorn hit 167.8 vs 165 with no room for enemy spirit resist; now 175 with Mystic Vulnerability already on them. Colossus moved to the front of Late (36k, was 42.4k) so health doesn't sit at 6.4k from 11.2k to 42.4k. Desc 'Spirit tank' → 'Spirit Mo & Krill' (health ends 11.2k, the build is spirit). Counterspell note: unverified 'lift or long channel' dropped. \"Upgrade.\", card-restating and duplicate sell notes emptied. Ability order unchanged; it is exactly seemeta's highest-WR Mo order (54.4%, 4,968 matches).","Round 15: Spirit Burn now sells Tankbuster (both damage procs); Torment Pulse was named as the sell for both Spirit Burn and the Counters box.","Round 17: Desc '' (only Mo & Krill build, and it's how he's played). Spirit Resilience note drops 'ticking'. Rich Mercurial Magnum note 'Upgrade of Quicksilver Reload.'. Lane Grit sell note unified ('Sell it once you're out of slots.').","Round 19: style check, no change. Spirit roam Mo & Krill is the only public style (lockbuilds MAX SPIRIT MO official, SAINT, wander, LordNM, meowth's GRAND HEIST; seemeta Oct 5-19).","Round 20: late list to ~82k: Spirit Burn, Mercurial Magnum, Transcendent, Scourge, Juggernaut, Witchmail (MAX SPIRIT MO late core). Slot locked merged in.","Round 25: order 1132124224414333 → 1132124422133434: Combo T1 (100% lifesteal) right at the ult unlock, Scorn T3 earlier, Sand Blast tiers before Combo T2/T3. Duration Extender moved from Burrow to Sand Blast (Burrow time doesn't scale with duration, only the 1.5s spin; disarm 2.5s does).","Slot locked: Transcendent Cooldown, Juggernaut moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Round 26 (cost): Superior Duration bought straight after Duration Extender (it idled 21.6k souls)."]},
