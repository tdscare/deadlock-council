 changes:["Style change: spirit-knife bleed build to a Slice and Dice dash build. Renamed. Slice and Dice is maxed first (T1 takes the cooldown from 16s to 10s, T3 adds +50 impact and -2s per hero hit); knives are maxed last. No mine/shiv.txt exists, so the style reference is the public dash build (lockbuilds 'MONK LORD SHIV': Cold Front, Radiant Regeneration, Torment Pulse core; Spirit Lifesteal, Compress Cooldown, Ethereal Shift, Mystic Reverb; Escalating Exposure, Transcendent Cooldown, Arctic Blast as upgrades) plus tracklock item rates.","Out: Extra Charge/Rapid Recharge (knife charges, not needed for dashes), Bullet Lifesteal/Leech, Veil Walker, Spirit Burn. In: Mystic Burst to Tankbuster on the dash (impact 75 + 1.2x spirit clears both thresholds with Extra Spirit, and 75 + 50 + 1.2x spirit at T3), Cold Front to Arctic Blast (public dash core; 9% pick, 51% WR), Grit to Reactive Barrier, Infuser, Improved to Boundless (54% WR). Mystic Reverb moves from last to mid-late (56% WR, highest-WR Shiv item at 16.6% pick).","Spikes: spirit 4.8k at 4.8k souls (Mystic Regen, Extra Spirit, Mystic Burst, Radiant Regen), health 4.8k at 9.6k (Enduring Speed, Spirit Lifesteal, Reactive Barrier; before it was 12k), spirit 6.4k and 8k land exactly on Cold Front and Compress Cooldown, 16k exactly on Tankbuster at 20.8k. Infuser at 25.6k takes health to 9.6k before the first fresh 6.4k (Reverb at 36.8k).","Core 12 slots at 51.2k (was 52.8k): Radiant, Boundless, Tankbuster, Enduring Speed, Infuser, Reactive Barrier, Arctic Blast, Superior Cooldown, Torment Pulse, Escalating Exposure, Mystic Reverb, Decay. Decay kept as the 12th/sell slot (16.7% pick) for the Killing Blow threshold. Counters sell Decay; Ethereal Shift (55% WR, 13% pick) added to counters as the no-dash-left escape. Echo Shard on the dash and Refresher in rich, Transcendent Cooldown and Juggernaut slot locked.","Ability order: Dash style: Slice and Dice maxed first (T1 -6s CD, T3 +50 dmg and CD refund per hero hit), knives T1 kept cheap for bleed uptime, Killing Blow T1/T2 by 10 like the mobalytics grid (ult T2 at 9 = 83%), Bloodletting and remaining knife points last; public grid is knife-build dominated (knives 5-7) so only its unlock order and ult timing were used. Note cur_shiv.js is still the spirit-knife item plan.","Item fit: Extra Spirit + Mystic Burst (early 800s) → Cold Front moved into lane. Dash impact is 75 +1.2x spirit, so Mystic Burst/Tankbuster and the Extra/Improved/Boundless line aren't what the public dash builds buy: neither MONK LORD dash (17.8k) nor Spirit Shiv Perfected has them, and none appear in tracklock's pro top-24. MONK LORD's core is Cold Front + Radiant Regen; Mystic Regen + Cold Front + Radiant still lands 4.8k spirit at 4.8k souls.","Item fit: Cold Front's old mid slot → Healbane (1600). Both public dash builds have it core (MONK 'main 4.8', Perfected lane), tracklock pro 44%; Killing Blow executes and the heal on kill fires off it.","Item fit: Improved Spirit + Tankbuster upgrades → Dispel Magic (3200, mid). Tracklock pro 80% (mid), MONK LORD core; dash range is 12m, so slows/hexes/silences stop him getting in. Divine Barrier added to rich as its pricier version.","Item fit: Infuser → Leech (same Spirit Lifesteal upgrade, same +4800). His spirit damage comes in bursts (one dash every ~10s after cooldowns, knife bleed 1/s), so a 7s window on a 30s cooldown is mostly wasted; Leech is always on and is late core in Spirit Shiv Perfected (Infuser is only an optional there).","Item fit: Boundless Spirit removed (no public dash build has it core, and it took the build to 51.2k); total now 46.4k. Rich Echo Shard and Refresher → Spirit Burn (Perfected late core) and Scourge (MONK upgrades): neither old item shows in any public Shiv build. Indomitable kept (MONK), note fixed to the rich wording.","Spikes now: spirit 4.8k at 4.8k (Mystic Regen, Cold Front, Radiant), health 4.8k at 9.6k (Reactive Barrier), spirit 11.2k on Mystic Vulnerability, 16k on Decay, health 14.4k after Leech.","Threshold: Mystic Reverb on Slice and Dice at 36.8k: dash T2 75+1.2x136 = 238 vs 100. Spirit Burn (rich, after core, SP 164+): dash 272 + Reverb echo 136 + knife bleeds vs 500 in 5s. No change.","Round 8: Decay kept, note fixed. Sep 16 cut Decay's DPS 25%: now 1.95% +0.003x spirit of current health per second for 12s, non-lethal, so at its 22.4k buy (114 spirit) it takes about 24% of their current health and can't take them under Killing Blow's 28% (T3) on its own. Old note 'Gets them low enough for Killing Blow' was false. Still mid core in lockbuilds 'Spirit Shiv Perfected' (updated Oct 17, after Shiv's last change Sep 16).","Round 8: Spirit Burn (rich) note fixed. Since Jul 28 it hits one target (explosion 50), so 'whoever you dash through' was false.","Round 8: Radiant Regeneration kept after its Aug 22 / Sep 16 / Oct 14 nerfs (65 +1.7 per boon heal, 6s cooldown): tracklock pro Shiv, last 30 days (Sep 19-Oct 19, 358 games) buys it in 100% of games; MONK LORD dash build (Sep 20) has it core. Healbane (tracklock 44%) and Dispel Magic (80%) also confirmed.","Round 9: kept the spirit dash build (Kieran: Spirit Shiv). Same-style check against Spirit Shiv Perfected (lockbuilds 800426, Oct 17) and MONK LORD (339573, Sep 20): Mystic Regen → Radiant, Healbane, Decay, Torment Pulse, Compress → Superior Cooldown, Mystic Vulnerability → Escalating Exposure, Mystic Reverb and Leech all match; no token items or early items that do nothing.","Round 11: Leech now before Dispel Magic, so the 6.4k buys from 25.6k are no longer four in a row (Leech 27.2k, Dispel Magic 30.4k, then Mystic Reverb, Escalating Exposure, Arctic Blast late). No pivot: dash assassin, no other job in the kit.","Round 13: notes cut to niche tips, timings, imbue targets, sells and upgrades only (Kieran 00:05); desc is now just the style label.","Round 13: items not in spirit Shiv builds swapped for ones that are, from Spirit Shiv Perfected (lockbuilds, Lockbuilds Team, Oct 17, top Shiv players: Monster Rounds, Mystic Regeneration, Extra Charge, Healbane, Enchanter's Emblem, Radiant Regeneration; Healing Booster, Decay, Torment Pulse, Compress Cooldown, Mystic Vulnerability, Superior Cooldown; Spirit Shielding, Dispel Magic optional; Escalating Exposure, Mystic Reverb, Spirit Burn, Transcendent, Leech). Cold Front→Arctic Blast out (Extra Charge on Serrated Knives, which has 2 charges, plus Compress Cooldown take its spirit; Spirit Burn takes Arctic Blast's late slot), Sprint Boots→Enduring Speed out for Enchanter's Emblem, Grit→Reactive Barrier now Grit→Spirit Shielding. Indomitable, Scourge, Spirit Burn (now core) and Juggernaut left the optional boxes.","Round 14: notes cut to the allowed kinds (\"Upgrade.\" notes, Extra Charge's duplicate sell note, Mystic Reverb's card restatement and Divine Barrier's item explanation emptied; sells and imbue targets kept). Counterspell note: unverified 'lift or long channel' dropped. Items re-checked against Spirit Shiv Perfected (Oct 17/18), PREDATOR HUNTER SHIV (Oct 16) and MONK LORD (Sep 20): all in at least one; no item changes.","Round 15: ability order now seemeta's most popular Shiv order through point 10 (Knives, Knives, Slice, Bloodletting, Knives, Slice, ult, Knives, ult, ult; 3,319 matches, Oct 5-19), then Slice T2/T3 before Bloodletting because Compress Cooldown and Mystic Reverb sit on Slice. The old order unlocked the ult at point 4 and left Slice locked at tier 0 until 9.6k souls, and its log claim that it followed seemeta was false.","Round 17: Spirit Resilience note drops 'ticking'. Lane sell note unified ('Sell it once you're out of slots.'). Dispel Magic note left empty (the site no longer fills empty notes).","Round 20: Extra Charge now upgrades to Rapid Recharge (knives have 2 charges) instead of being sold; Spirit Burn sells Healbane. Late list: Boundless, Witchmail, Cheat Death (Spirit Shiv Perfected late box), Divine Barrier last. Total ~78k.","Round 23: kit check. Killing Blow's rage hold (12s), the knife bleed (7s at T1), Bloodletting's deferred damage (6s) and Slice and Dice's spirit resist debuff (14s) all scale with duration, so Superior Duration goes into the late list before Divine Barrier, selling Torment Pulse.","Round 25: points reordered for spirit dash Shiv: Slice T1 at L4, Bloodletting T1 (-15s) and Killing Blow T1/T2 (+16% all damage in full rage) before Slice T2/T3, Knives T3 after, Bloodletting T2/T3 and ult T3 last.","Round 26 (cost): Rapid Recharge moved up after Superior Cooldown (Extra Charge sat idle until the last buy; spirit 16k now at 24.0k); Healbane to Mid cont.","Rule G: removed T3 Superior Duration from the rich box."]},

 changes:["Round 13: new gun build — items from gun builds only: lockbuilds Lomein's One Shot Shiv (Lockbuilds Team, Oct 17: Restorative Shot, Close Quarters, Bullet Resist Shredder, Battle Vest, Mystic Regeneration, Radiant Regeneration, Hunter's Aura, Dispel Magic; Fleetfoot, High-Velocity Rounds, Express Shot, Lucky Shot, Vampiric Burst, Silencer, Berserker, Inhibitor). Ability order: Knives first is universal (100% at 1 and 5 on mobalytics); rest follows that grid (ult 8-10).","Round 14: added the rich box with Divine Barrier (Dispel Magic is core). Ability order now seemeta's most-popular Shiv order (52.9%, 3,319 matches: Knives maxed first, Slice T1 at 6, ult T1/T2 at 9-10, Bloodletting 11-13), replacing the mobalytics-grid order that couldn't be re-checked. Duplicate sell notes on Restorative Shot and Close Quarters (Lucky Shot and Inhibitor already say them) and \"Upgrade.\" notes emptied; Bullet Resist Shredder note reworded as a tip (it triggers on spirit damage, which the knives' bleed is); Counterspell note fixed. Items re-checked against tracklock pro Shiv (358 games: Restorative 96%, Close Quarters 88%, Shredder 82%, Battle Vest 65%, Express Shot 84%, Hunter's Aura 84%, Dispel 80%, Berserker 53%, Lucky Shot 44%) and Lomein's One Shot Shiv (Oct 17).","Round 15: Counters desc was 123 characters (the game rejects over 112): it now sells Fleetfoot (the cheapest item that stays in the last 12 slots) instead of Bullet Resist Shredder.","Round 17: Spirit Resilience note drops 'ticking'. Divine Barrier 'Sell Dispel Magic for this.' (was 'for it'). Lane sell note unified ('Sell it once you're out of slots.').","Round 20: Late list filled to ~74k from Lomein's One Shot Shiv: Glass Cannon, Crippling Headshot, Colossus, then Divine Barrier.","Round 23: kit check, no changes.","Round 25: points reordered for gun Shiv: Bloodletting T1 at L6, Killing Blow T1/T2 (+16% all damage in full rage, -25s) right at unlock, ult T3 (execute at 28%) before Knives T3, Slice T2/T3 last.","Round 26 (cost): Crippling Headshot sells Berserker instead of Bullet Resist Shredder (kept the spirit 4.8k)."]},

 changes:["Style change to SUPPORT (Kieran): Headhunter + Healing Tempo through the tether. Headshot Booster → Headhunter heals 4% max health per headshot, Kudzu passes 35% (more with levels) of your heals to the tethered ally, and Healing Tempo gives that ally 35% fire rate and 1.25m speed on every heal. Out: Rapid Rounds/Burst Fire, Hollow Point, Toxic Bullets, Escalating Resilience, Ricochet, Lucky Shot, Hunter's Aura, Silencer, Bullet Lifesteal/Vampiric Burst, Battle Vest, Frenzy.","Gun 4.8k at 6.4k from only two slots: Extended → Titanic Magazine (1.6k, pro 92%/94%) + Headshot Booster → Headhunter (3.2k, pro 27% mid). Health 4.8k at 10.4k with Extra Regen → Healing Booster (pro 66%) + Healing Nova (pro 29%), 6.4k on Guardian Ward at 12k, 8k on Enduring Speed. Healing Tempo lands at 24.8k as the first T4 (pro 32% late, highest win rate on lockbuilds at 59%).","Heroic Aura (3.2k at 15.2k, 8k gun) is core: it's the first item of the Lapdog support Ivy on lockbuilds and gives the carry 17% bullet resist. Mystic Expansion → Greater Expansion on Kudzu (lockbuilds 34%/30%, Lapdog core) for tether range.","Tesla → Capacitor kept but pushed to late (28k/35.2k): it's still the universal Ivy item (pro 94%/88%) and the Capacitor active protects the carry. Compress → Superior Cooldown on Air Drop (100s cooldown). Bullet Resist Shredder (1.6k at 20k, pro 81% mid) and Siphon Bullets (pro 40% late) fill the last two slots.","Core 46.4k (was 54.4k), 12 slots. Rich box removed (nothing T4 left that's a pricier version of what's in). Counters sell Bullet Resist Shredder.","Ability order: Mobalytics Ivy skill grid: Stone Form T1/T2 right after the unlocks (78-90%), Kudzu maxed 8-10, Air Drop 11-13, Thorns last; for the support style the tether is unlocked first and maxed straight after the two cheap Stone Form points so the always-on tether (T3) carries the Healing Tempo/Headhunter plan, ult upgrades next, Thorns last.","Threshold: no damage-threshold items (Healing Tempo minimum heal 1). No change.","Round 9: Mystic Expansion moved out of lane (4.0k) to Mid (~15k). In lane your mate stands next to you, so +20% on Kudzu's 16m cast range does nothing yet; tracklock.gg pro builds, last 30 days, checked 2026-10-19: Mystic Expansion 34% mid, not early.","Round 9: Tesla Bullets moved from 28.0k to right after the 4.8k health spike (~12.8k), Capacitor from 35.2k to ~19k. tracklock.gg pro builds, last 30 days, checked 2026-10-19: Tesla 94% early, Capacitor 88% mid; they don't wait for late. Headhunter still first (his stated style). Gun hits 8k at Tesla, then health; core total unchanged (46.4k).","Round 9: Worth a try: Rescue Beam (upgrade of Healing Rite). 20% max-health heal on the mate and on you; Kudzu shares 35%+ of your healing to the tethered mate, so they get both, and it counts as a heal for Healing Tempo's 35% fire rate.","Round 12: Removed the \"Worth a try\" box (Rescue Beam instead of Healing Nova).","Round 12: Bullet Resist Shredder moved from 23.2k to right after Tesla Bullets (14.4k). It is a 1.6k item you sell later, so buying it at 23k wasted it; pros buy it mid (81%, tracklock last 30 days), and Tesla procs are what put it on them. Heroic Aura note now says the active gives your team fire rate.","Round 13: notes cut to niche tips, timings, imbue targets, sells and upgrades only (Kieran 00:05); desc is now just the style label.","Round 13: carry Ivy is now its own build, so the gun-carry items left support Ivy: Extended Magazine→Titanic Magazine and Tesla Bullets→Capacitor out, and Healing Nova with them. In from Lapdog Ivy (lockbuilds, Oct 10, support: Heroic Aura, Extra Regen, Healing Booster, Healing Tempo, Cursed Relic, Mystic Expansion, Greater Expansion; Guardian Ward, Divine Barrier, Rapid Recharge, Compress/Superior Cooldown, Enduring Speed, Siphon Bullets; Monster Rounds lane): Monster Rounds, Grit→Guardian Ward earlier, Extra Charge→Rapid Recharge (Entangling Thorns has 1 charge), Cursed Relic, Duration Extender→Superior Duration on Air Drop. Headhunter and Healing Tempo kept (Kieran). Healing Tempo note emptied: the item excludes passive lifesteal and I couldn't confirm the tether share counts.","Round 14: notes cut to the allowed kinds (\"Upgrade.\" notes, Monster Rounds' duplicate sell note and Mystic Expansion's card restatement emptied; Headhunter's tether tip kept: Kudzu replicates your healing to the tethered mate, TetherSharedHealPct 35 + 0.85 per boon). Counterspell note fixed. Duration Extender stays on Air Drop: its damage buff (8s), slow and silence all scale with ability duration (abilities.vdata), while Kudzu becomes always-on at T3. Items re-checked against Lapdog Ivy (Oct 10) and THETA ZERO's gunless support Ivy (Oct 1); no item changes.","Round 15: Bullet Resist Shredder out (only in gun/carry Ivy data: tracklock pro and seemeta are carry builds; neither support source, Lapdog Ivy nor THETA ZERO's support build, has it), Healbane in at the same 1.6k (Lapdog optional, THETA 'Extra Antiheal'); Thorns and Air Drop's bomb apply it. Counters desc was 125 characters (over the game's 112): now sells Healbane. Ability order now seemeta's highest-win-rate Ivy order (65.1%, 802 matches, Oct 5-19: Thorns, Stone, Stone, Kudzu, Stone, Air Drop x3, Kudzu, Air Drop, Kudzu x2, Stone, Thorns x3): Air Drop maxed early for its Compress Cooldown/Duration Extender and Kudzu maxed by 12; the old order was unsourced.","Round 17: Heroic Aura note 'Only if your team has gun heroes.' and a 'Swap for Heroic Aura' box: Rescue Beam (same 3.2k, upgrade of the lane Healing Rite; 20% max-health heal on the mate and you, Kudzu shares your heals and it counts as a heal for Healing Tempo) so the core works without gun heroes. Spirit Resilience note drops 'ticking'. Lane sell note unified ('Sell it once you're out of slots.').","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: new late list to 76k: Juggernaut, Lightning Scroll, Transcendent Cooldown, Echo Shard, Refresher last (THETA ZERO 512596, Lapdog 708206).","Round 23: Echo Shard out of the late list: Kudzu Connection has no cooldown once maxed, so Echo Shard on it did nothing. Scourge in its place (cast on your tethered mate). Lightning Scroll now sells Rapid Recharge instead of Headhunter, which the build is built around.","Round 25: order 1332344424223111 → 3321344221244311 (Stone Form T1/T2 first for the heal that Kudzu passes on, Kudzu unlocked 3rd and always-on by 12k for Headhunter heals, Thorns T1 before Extra Charge). Compress Cooldown moved from Air Drop to Stone Form (15s heal+stun cast ~7x as often as the 100s ult).","Slot locked: Juggernaut, Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Round 26 (cost): Monster Rounds replaced by Titanic Magazine so the Rescue Beam swap keeps the gun at 4.8k (gun 4.8k now at 5.6k instead of 12.0k); Cursed Relic sells Titanic Magazine (Healbane if Rescue Beam was taken, so the gun stays at 4.8k); Refresher sells Siphon Bullets instead of Heroic Aura (kept gun 4.8k)."]},

 changes:["Round 24: Burst Fire to Swift Striker + Long Range. Burst Fire only fires fast for 4.5s after hitting an enemy and the needle swap takes 1.3s, so it barely sped up healing; Swift Striker's +20% fire rate is always on, so it speeds the needles too. Long Range (+40 weapon power beyond 15m, where a backline healer stands) completes the 4.8k gun spike.","Round 22: Ricochet note: Kieran tested it in game, the healing needles ricochet to extra allies (the item text only mentions enemies).","New hero (released Oct 20, build 6801). Spirit healer: leeches for stacks, Healing Needles on your carry, Wretched Vapors on whoever is being focused, ult for the fight.","Base: Valve's default Harrow build (valve_builds.kv3, build 6801) plus Kieran's calls (Titanic Magazine, Healing Booster, mostly spirit, Duration Extender then Echo Shard on Vapors, Escalating Exposure, Ricochet, no Rapid Recharge). Ability order is Valve's.","Round 23: rebuilt from the kit instead of Valve (Kieran: Valve builds are slop). Surge of Power on Healing Needles, Rapid Rounds → Burst Fire for the gun spike (fire rate = more hits = faster needle charge), Debuff Reducer → Unstoppable before the ult, Rescue Beam, Spirit Lifesteal → Infuser for the ult channel; Echo Shard to the late list; Grit/Reactive/Indomitable, Fortitude, Compress Cooldown, Greater Expansion, Headshot Booster/Headhunter out. Own ability order (needles and vapors first, ult last). Spikes: spirit 4.8k at 8.8k, gun 4.8k at 11.2k, health 4.8k at 14.4k. Core 12 slots at 56.0k; late list to 84.8k (Transcendent Cooldown, Echo Shard, Spiritual Overflow, Divine Barrier, Refresher).","Round 25: points reordered for a healer: Healing Needles T1 (2nd clip) at L3 and Vapors T1 before anything else, ult T1 before Needles T3, Vapors T3 (dispels your carry) before ult T2/T3.","Round 25b: Long Range and Rescue Beam out (Kieran: no use on Harrow, her kit already heals). Burst Fire back in after Swift Striker: it procs when you shoot teammates, so healing needles get the fast fire rate, and 3 skips the reload. Spirit Rend replaces Rescue Beam. Recharging Rush does not proc on teammates, so it stays out.","Round 25c: Kieran tested Vampiric Burst on the needles: every use stacks extra needle ammo (11 to 20 to 30 to 47), so it joins the core. Spiritual Overflow procs on healing teammates, so it moves into the core (upgrade of Spirit Lifesteal); Mercurial Magnum goes late. Order: Leech maxed first, 2 pts Needles, 1 Vapors, 1 ult, then Needles.","Round 25d: Infuser out (Spiritual Overflow takes the Spirit Lifesteal upgrade).","Round 25e: Vampiric Burst moves to the late list (30s cooldown, 5s, +34% fire rate, ammo past the mag). Guardian Ward (250 barrier, 60s, 30s on others) takes the old Burst slot and becomes Divine Barrier. Toxic Bullets stays out: it procs fast but is only 1.9% max health over 4s, so it adds little damage.","Round 25f: Swift Striker out. Burst Fire gives +10% fire rate always and +32% for 4.5s after a hit (9s cooldown), and it procs on teammates, so it is about +26% in a fight against Swift Striker's flat +20%.","Round 25g: Toxic Bullets in. She has no gun damage otherwise; it scales with spirit (1.9% + 0.006 per spirit of max health over 4s), procs fast, cuts enemy healing 35% and feeds Escalating Exposure with the leeches.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Review 2: Duration Extender → Compress Cooldown on Wretched Vapors, Superior Duration out. Vapors lasts 4s (5s at T2) and Healing Needles T3 already stretches ally buffs up to 200% (6% per needle), so Duration Extender only added 1.1s and a longer rush also banks more crash damage; Compress cuts Vapors from 40s to 32.8s (25s to 20.5s after T1) for a fresh rush and dispel more often, and Superior Cooldown becomes its upgrade (1.6k instead of 3.2k, frees a slot). Spirit now lands 6.4k at 16.0k and 8.0k exactly at 17.6k (was 9.6k). Escalating Exposure no longer sells Burst Fire (core still 12 slots); Echo Shard sells Burst Fire. Echo Shard stays on Vapors (resets 20s of cooldown vs Leech 16s; second rush on another teammate vs 4 more leeches once stacks are capped). Surge of Power stays on Healing Needles (needles have no cooldown and recharge every ~11–16s in fights vs Surge 14s; +28 spirit is +16.8 heal per needle at T3 vs +13.7 leech DPS). Mercurial note: no \"over\" wording."]}
