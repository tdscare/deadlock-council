 changes:["Witchmail (6.4k) and Mystic Reverb (6.4k) out of core; Melee Charge (1.6k at 14.4k) and Cold Front (1.6k at 18.4k) in. Core drops from 56k to 46.4k, 12 slots. Reverb goes to the rich box and sells Melee Charge; Arctic Blast sits there as the Cold Front upgrade.","Melee Charge: 55% of pro Apollo games, lockbuilds CD123 (most common Phantom+ path) and tracklock core. Riposte's dash lands a heavy melee that Spirit Snatch and Lifestrike already key off, so +25 heavy damage and +50% melee range go straight into the combo.","Cold Front: 49% pro early, deadlocked.gg early core. 95 + 0.47x spirit AoE for wave clear and a 48% slow before the lunges.","Spikes unchanged: 4.8k spirit at 5.6k, 4.8k health at 9.6k (Melee Lifesteal, Lifestrike, Healing Booster), Boundless at 36.8k. Pro core still Extra Spirit 99%, Mystic Expansion 99%, Improved Spirit 99%, Mystic Burst 98%, Healing Booster 97%, Spirit Snatch 80%, Boundless 91%, Tankbuster 80%.","Extra Regen in the lane box now says it upgrades to Healing Booster (it does).","Ability order: mobalytics build-stats grid: unlocks 1-3-2-4, Flawless Advance maxed 5-7 (85-94%), Riposte 8-10; kept that, then ult T1/T2/T3 interleaved by 13 for the finishing slash; Sigil last since its T1 fire rate does nothing for the spirit build.","Item fit: Spirit Lifesteal -> Infuser out. Apollo's spirit hits come in a few big chunks (Sigil 1 hit / 12s, up to 3 stabs per Flawless Advance / 26s, ult), not lots of separate hits over 7s; neither item is on the tracklock pro list or build page. Replaced by Extra Stamina (800) -> Stamina Mastery (+2.4k): pro 19% Stamina Mastery, Extra Stamina on the tracklock early list; Sigil T2 restores stamina and resets air dash on hit. Health ends at 8k instead of 11.2k (4.8k health spike unchanged at Healing Booster).","Item fit: Mystic Vulnerability -> Escalating Exposure out. Escalating Exposure stacks once per 0.7s per spirit hit and Apollo lands few separate hits; neither is in the pro top list (EE only on tracklock's counter-pick list). Replaced by Slowing Hex (1.6k, 29% pro, tracklock actives) then Torment Pulse (3.2k T3, tracklock late list; 9m pulse, 18% melee resist for a duellist who lives in melee range), selling Slowing Hex for it so slots stay at 12.","Item fit: kept Extra Spirit/Improved Spirit/Boundless 99/99/91% pro, Mystic Burst 98%/Tankbuster 80%, Mystic Expansion 99%/Greater Expansion 27%, Healing Booster 97%, Spirit Strike 75%/Spirit Snatch 80%, Melee Charge 55%, Melee Lifesteal 41%/Lifestrike 38%, Cold Front 49%, Compress Cooldown 24%/Superior Cooldown 38%, Spirit Burn 34%.","Item fit: Counters Metal Skin -> Plated Armor (Metal Skin is on no public Apollo list; Plated Armor is on tracklock's counter picks).","Order: ability order set to the a7 data-first order 1324333224124114.","Threshold: checked with the new order. Mystic Burst at 1.6k souls, 25.4 spirit: Sigil 85 + 1.3 x 25.4 = 118, perfect stab 65 + 1.55 x 25.4 = 104, vs 80. Tankbuster at 12.0k (after the 4.8k spirit and health spikes), 82.8 spirit, Flawless Advance T3: perfect stab 130 + 1.55 x 82.8 = 258, Sigil 193, vs 165. Spirit Burn at 31.2k, 124.9 spirit: one perfect stab 324 + Sigil 247 = 571 vs 500 in 5s. Mystic Reverb (rich, on Flawless Advance) late: one stab 324+ vs 100. Nothing moved.","Round 9: Cold Front (Mid, 18.4k) and Compress Cooldown (Early, 5.6k) swapped. Same 1.6k, so spirit still hits 4.8k at 5.6k souls. tracklock pro Apollo, last 30 days to Oct 19: Cold Front 48% early, Compress Cooldown 27% late (Superior Cooldown 41% late). Pros make the 4.8k spirit with Extra/Improved Spirit, Mystic Burst, Mystic Expansion and Cold Front, which is now exactly ours. Cold Front's slow and wave clear do something in lane; a shorter lunge cooldown matters in fights.","Round 11: added empty 'Lost lane?' box (Lifestrike right after Mystic Expansion). A duelist has no other job; behind, the duels need the heal first. Health 4.8k still lands on Healing Booster. No T4 run.","Round 12: Lost lane note now says why: Lifestrike heals 120 + 1.75 per spirit on heavy melee and still heals at 40% off troopers, so moving it from 8k to 5.6k souls is lane sustain when you're behind.","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 13 (UPDATE 5): rebuilt as a real spirit build from spirit-style Apollo builds only: lockbuilds Twenty Eight Stab Wounds (Oct 4), APOLLO NEVER DIES (Oct 14, 'max Flawless Advance first', melee items only in a 'Melee-dependent, only if you can secure melees after Riposte' box), Sevoh's stabby sustain spirit (Oct 3), stabby stabby (Oct 13) and SwoleBenji SPIRIT JOUSTER (Oct 4). In all 5: Mystic Burst, Extra Spirit, Mystic Expansion, Improved Spirit, Spirit Lifesteal, Tankbuster, Greater Expansion, Boundless, Spirit Burn; in 3-4 of 5: Compress/Superior Cooldown, Healing Booster, Mystic Vulnerability/Escalating Exposure, Torment Pulse, Stamina Mastery, Leech, Mystic Reverb; Enchanter's Emblem in 2 (Twenty Eight Stab Wounds: 'always buy two 1.6k greens'). Removed Melee Lifesteal/Lifestrike, Melee Charge, Spirit Strike/Snatch, Cold Front, Slowing Hex, Mystic Expansion box 'Lost lane?' (it moved Lifestrike) — they came from hero-wide rates driven by melee Apollo.","Round 13: kit: Mystic Burst (>80) works off Sigil (85 + 1.3 spirit) from the start; Tankbuster (>165) and Mystic Reverb (>100) off a perfect Flawless Advance stab (65 + 1.55 spirit, T3 +65 with better scaling), which is maxed first (order unchanged, matches the spirit builds). Spirit Burn (500 in 5s) is three perfect stabs late.","Round 14: ability order 1324333224124114 -> 1324333222114144, the per-point best fit of the mobalytics Archon+ grid (Flawless Advance maxed first in 17.7K of 19.3K games): Riposte T3 at point 10 (69%), Sigil 11-12, ult 13/15/16. Counters now come after Tankbuster (Healing Booster came before Enchanter's Emblem, the item it sells). Divine Barrier added to rich (Dispel Magic is in Counters). Unstoppable and Counterspell notes made concrete.","Round 15: Counters caption was 117 characters (game limit 112) and sold Enchanter's Emblem, which Witchmail also sells: Counters now sell Torment Pulse (112 chars). Divine Barrier now sells Dispel Magic instead of Torment Pulse.","Round 19: verified as the public spirit Apollo (SwoleBenji SPIRIT JOUSTER Oct 4, Sevoh Oct 3, FREDTHEFINCH Sep 18, CD123 ranked Oct 17; lockbuilds table: Mystic Burst 52.6%, Mystic Expansion 49.8%, Improved Spirit 47.4%, Tankbuster 47.2%). No item changes; counters caption uses Kieran's exact wording; Grit names what it's sold for.","Round 20: late list: Witchmail (sell Enchanter's Emblem), Ethereal Shift (FREDTHEFINCH mid core, Sevoh; sell Stamina Mastery), Divine Barrier; slot-locked Transcendent Cooldown, Healing Tempo. Core 51.2k, with the late list 70.4k without Divine Barrier. Ethereal Shift is a luxury, so it's listed last (Kieran 13:01).","Round 20 (update 2): checked Restorative Shot and lane timing: every lane item helps in lane now, no Slowing Bullets or Weighted Shots; no changes.","Round 23: Echo Shard on Flawless Advance added to the late list (a second full set of stabs, and Mystic Reverb is on the same ability).","Round 25: ability order 1324333222114144 → 3312324113441422 (kit-based for this playstyle, no idle early points).","Cost audit: Renamed from Magic Missile Apollo. Ethereal Shift sells Torment Pulse (spirit for spirit) so it no longer cuts the 11.2k health tier; Echo Shard sells Tankbuster."]},

 changes:["Round 13: new melee build — sources: lockbuilds Infest Melee Apollo (6,199, Oct 15: Melee Lifesteal, Close Quarters, Melee Charge, Healing Booster, Hunter's Aura early; Reactive Barrier, Berserker, Witchmail, Crushing Fists, Phantom Strike mid; Unstoppable, Indomitable, Point Blank late; 'upgrade Sigil instead of Flawless Advance' for melee); tracklock pro Apollo last 30 days (208 games): Healing Booster 90%, Melee Charge 74%, Melee Lifesteal 65%, Lifestrike 59%, Hunter's Aura 38%, Close Quarters 37%.","Round 13 (style check): every item is from Infest's melee build (core, defensive or endgame boxes); Spirit Strike/Spirit Snatch (only in Infest's spirit/hybrid box) replaced by Spirit Resilience from Infest's mid core. Tracklock pro rates are hero-wide and mostly spirit Apollo, so they're not used to justify items.","Round 13: ability order: Riposte maxed first (cooldown 22s to 14s, -50% melee resist, longer stun, 75% lifesteal on the target), then Sigil (stamina reset on hit, recast) per the Infest melee note, then ult, Flawless Advance last. Restorative Shot from the Infest opener left out: Apollo's gun isn't a many-pellet gun (Kieran's rule).","Round 13 (notes policy): notes cut to tips, situational calls and sells; every remaining claim checked in the game files.","Round 14: Melee Charge note fixed: Infest's own note says heavy melee after Riposte only lands once Riposte has the T2 stun (+0.4s), and Melee Charge is bought at 2.4k before that point. Divine Barrier added to rich (Dispel Magic is in Counters). Counterspell note made concrete.","Round 15: Divine Barrier now sells Dispel Magic (it replaces it) instead of Point Blank.","Round 17: Lane sell note and Divine Barrier note use the standard wording.","Round 19: verified as the public melee Apollo (Infest Melee Apollo Oct 15: Restorative Shot, Melee Lifesteal, Stalker, Close Quarters, Melee Charge, Extra Regen, Healing Booster, Hunter's Aura, Reactive Barrier, Spirit Resilience, Berserker, Witchmail, Crushing Fists, Phantom Strike, Indomitable, Unstoppable; wander frontline Oct 15). No item changes; counters caption uses Kieran's exact wording; Spirit Resilience and Unstoppable get their own notes (empty ones showed the site default); Extra Health names what it's sold for.","Round 20: late list: Colossus (sell Hunter's Aura), Scourge (Infest endgame; +40% spirit resist on self-cast, so it replaces Spirit Resilience), Divine Barrier; slot-locked Healing Tempo. Core 51.2k, with the late list 68.8k without Divine Barrier.","Round 20 (update 2): checked Restorative Shot and lane timing: every lane item helps in lane now, no Slowing Bullets or Weighted Shots; no changes.","Round 23: kit re-read item by item; no change (see log).","Round 25: ability order 1324222111444333 → 2231234324411431 (kit-based for this playstyle, no idle early points).","Cost audit: Healing Booster moved after Lifestrike: gun 4.8k now lands at 6.4k instead of 7.2k."]},

 changes:["Silencer (6.4k at 49.6k) out of core into the rich box; Duration Extender on Lycan Curse (1.6k at 20k) into Superior Duration (1.6k at 36.8k) in its place. Wolf form is 15s, so +28% is about 4s more wolf per ult, plus longer kick mark and bola root and 8% bullet resist. Pros take Superior Duration 25% late and the gun-tank builds (V1, Animals) have it core; Silencer is a late optional for them. Core drops from 49.6k to 46.4k, 12 slots.","Spikes unchanged: 4.8k gun at 5.6k (Close Quarters, Stalker, Point Blank), 4.8k health at 9.6k (Melee Lifesteal, Bullet Lifesteal, Lifestrike). Pro core still Stalker 98%, Melee Lifesteal 96%, Hunter's Aura 94%, Lifestrike 70%, Weighted Shots 43%, Berserker 54%.","Debuff Reducer (63% pro late) not added: no slot left without dropping a gun item, and Unstoppable is in counters.","Rich box is now Lucky Shot (sells Toxic Bullets) then Silencer (sells Weighted Shots).","Ability order: mobalytics build-stats grid: unlocks 1-2-3-4, Slam Fire 5-7, Lycan Curse 8-10 (54-91%), Bola last; same for the brawler style (wolf early), with Boot Kick T1-T2 and T3 (-35% enemy damage) around ult T3, Bola last.","Item fit: Bullet Lifesteal (1.6k) -> Grit + Spirit Shielding (800+800). Bullet Lifesteal/Vampiric Burst are on none of the tracklock Silver lists; Grit 68% and Spirit Shielding 42% pro. Same 4.8k health spike at Lifestrike. Lane box Grit -> Extra Health (29% pro, tracklock defensives) since Grit is core now.","Item fit: Rapid Rounds -> Burst Fire out (not on any tracklock Silver list; 0.85s cycle, 7-shell mag). Weighted Shots was bought fresh; now Slowing Bullets (37% pro) -> Weighted Shots (48% pro) in that slot, its real component.","Item fit: Toxic Bullets -> Debuff Reducer (56% pro), Vampiric Burst -> Unstoppable (38% pro, tracklock core). Silver has to get on top of people (bola/kick range 10.6m, Point Blank 15m) and stuns are how they stop her. Unstoppable moved out of Counters.","Item fit: Spellslinger (not on any public Silver list; her 4 cooldowns are 21-60s) -> Silencer (tracklock late list). Slowing Hex (49% pro) added in the freed slot; it also takes spirit to 4.8k with Superior Duration.","Item fit: rich box removed: Lucky Shot isn't on any Silver list and Silencer moved into core. Kept: Stalker 98%, Melee Lifesteal 96%/Lifestrike 75%, Close Quarters 60% (Point Blank on the late list), Hunter's Aura 95%, Berserker 59%, Duration Extender (early list)/Superior Duration 36%, Frenzy (late list). Core 43.2k, 12 slots.","Order: ability order set to the a7 data-first order 1234121442431233.","Threshold: no damage-threshold items in the build. Duration Extender is on Lycan Curse (15s duration), Berserker/Spirit Shielding trigger on damage taken, which a frontline wolf takes plenty of. Nothing moved.","Round 9: Restorative Shot added first in lane (tracklock.gg pro Silver, last 30 days to Oct 19: 91% early, 3rd most bought item; RULES: good on spread guns). Slowing Bullets moved into Early to land the 4.8k gun spike (Restorative 800 + Close Quarters 800 + Stalker 1.6k + Slowing Bullets 1.6k, at 5.6k souls, same timing as before) and Point Blank moved to Mid, since pro Silver doesn't buy Point Blank early (Close Quarters 60% early, Point Blank not in the top 8 of any phase). Silencer now sells Restorative Shot. Core 44k.","Round 9: Worth a try box: Melee Charge (Lycan Curse BonusDurationOnHeavyMelee 1.5s, light melee 0.5s, on a 15s form; Melee Charge is +25 heavy melee damage and +10% melee every 5s, same 1.6k as Slowing Hex).","Round 11: added empty 'Lost lane?' box (Lifestrike right after Stalker, to heal off troopers and camps while you catch up). No role pivot: every Silver ability and wolf form feed the gun brawler job. No T4 run (Unstoppable, then Superior Duration breaks it; Frenzy → Silencer is after 30k).","Round 12: Worth a try box removed (Melee Charge: not an item Kieran picked).","Round 12: Lost lane note now says why: Lifestrike heals on heavy melee and still heals at 40% off troopers, so moving it from 9.6k to 6.4k souls is lane sustain when you're behind.","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 14: Silencer out of Late core, Inhibitor in before Frenzy (Inhibitor is in all 6 checked Silver builds: LordNM, Silver's Silver, V1's Gun-Tank, EAT RAW FLESH, Animals, silver is solved; Silencer only as a late option). Frenzy now sells Restorative Shot. Rich box added: Phantom Strike (sells Slowing Hex), Diviner's Kevlar (sells Spirit Shielding), Divine Barrier (Dispel Magic is in Counters). Ability order 1234121442431233 -> 1234121444213323, the per-point best fit of the mobalytics grid (Lycan Curse T3 by point 10, Bola 13/14/16). Lost lane caption shortened; Spirit Resilience and Counterspell notes made concrete.","Round 15: Stalker was sold twice (Counters and Divine Barrier): Divine Barrier now sells Dispel Magic (it replaces it).","Round 17: Lane sell notes unified ('Sell it once you're out of slots.'). Divine Barrier rich note 'If you bought Dispel Magic, sell it for this.' (was a restatement of the item). 'Lost lane?' desc ends ', then carry on.' like the other reorder boxes. Debuff Reducer/Unstoppable notes left empty (site no longer fills empty notes).","Round 20: Slowing Bullets and Weighted Shots out (Kieran: never Slowing Bullets; Bola and Slowing Hex already catch people): Hunter's Aura moves into lane after Stalker for the gun 4.8k spike, Express Shot (LordNM core) takes Weighted Shots' Mid slot. Late list filled to ~76k from LordNM's late options: Silencer, Diviner's Kevlar, Phantom Strike, Colossus, then Divine Barrier, each selling the weakest item left.","Round 23: Diviner's Kevlar moved to the top of the late list. Lycan Curse is the ult on a 60s cooldown, so every wolf form gives 1000 barrier and +40 spirit for 20s, and wolf fire rate scales with spirit (60 + 0.45x).","Round 25: ability order 1234121444213323 -> 1122314443224133 (worked out from the kit for this build's playstyle).","Cost audit: Phantom Strike sells Berserker instead of Slowing Hex, so spirit 4.8k is kept."]},

 changes:["Boundless Spirit (4.8k at 52.8k) moved out of core into the rich box as the Improved Spirit upgrade. Core drops to 48k, 12 slots, nothing else moves: 4.8k gun at 5.6k (Opening Rounds + Burst Fire), 4.8k health at 12.8k, 4.8k spirit at 14.4k.","Gun side kept heavy: Opening Rounds, Burst Fire, Mercurial Magnum on daggers, Spiritual Overflow, Healing Tempo. Public gun Celeste (Kahri hybrid, go go juice hyper carry) run the same Magnum + Overflow core; pros (59% WR) rush Extra Regen, Radiant Regeneration, Healing Booster, HVR, Mystic Regeneration, Mystic Expansion, Greater Expansion, Stamina Mastery - all in.","Torment Pulse (89% pro) and Witchmail (59%) still skipped: both are for a Celeste that stands in their face, not a gun kiter.","Ability order: mobalytics build-stats grid: unlocks 1-2-3-4 (70%/99%), Light Eater maxed and Dazzling Trick/Wonder in 10-15; for heavy gun the Daggers go first instead: T1 extra charge at 5 for Extra Charge/Rapid Recharge, maxed by 8 for the T3 fire rate per stack, then Light Eater, Dazzling Trick, ult last like the public grid.","Item fit: Burst Fire (+2.4k) -> Swift Striker (+800) plus Extended Magazine -> Titanic Magazine (800+800). Burst Fire isn't on any tracklock Celeste list or in the public gun build (lockbuilds 609237 'Hyper Carry' runs Swift Striker); Celeste has an 8-round mag at 0.58s, and Titanic Magazine is in that build's alternatives. Gun still hits 4.8k at 5.6k.","Item fit: Extra Spirit -> Improved Spirit out (not in the public gun builds; only deadlocked's spirit build) to keep 12 slots; spirit now lands 4.8k at Extra Charge. Rich Boundless Spirit removed since it was the upgrade of Improved Spirit. 'Mid' box: Extra Stamina and Healing Booster moved up from Early so boxes stay at 8 (order unchanged).","Item fit: kept HVR 96%/Opening Rounds 46%, Mystic Regen 97%/Radiant 99%, Healing Booster 98%, Mystic Expansion 88%/Greater Expansion 89%, Mystic Vulnerability 32%/Escalating Exposure 40% (daggers, Light Eater 0.5s ticks and Mercurial bullets give lots of spirit hits), Quicksilver -> Mercurial Magnum, Extra Charge -> Rapid Recharge and Spirit Lifesteal -> Spiritual Overflow from the public gun build 609237 (and pub/celeste_9), Stamina Mastery and Superior Cooldown on tracklock late, Healing Tempo in 609237. Core 46.4k.","Healing Tempo moved from core to Slot locked (Kieran: small gain over Healing Booster for a lot of money).","Order: ability order set to the a7 data-first order 1234113312224443.","Threshold: no damage-threshold items in the build. Extra Charge/Rapid Recharge need a charged ability: Radiant Daggers has its T1 (2 charges) from 3.2k souls, before Extra Charge at 14.4k. Quicksilver Reload/Mercurial Magnum, Mystic Expansion and Compress Cooldown are on Radiant Daggers (33s cooldown, 8m blast). Mystic Regeneration, Mystic Vulnerability and Escalating Exposure get spirit hits from Light Eater and the daggers. Nothing moved.","Round 8: Radiant Regeneration kept (Aug 22 / Sep 16 / Oct 14 nerfs: heal 65+1.7 per boon, 6s cooldown, regen scaling 0.035). Still bought post-patch: tracklock.gg probuild last 30 days, 104 games: 99%; mobalytics current patch Archon+: 73% early (read Oct 19). Note 'Every cast heals you' was false with the 6s cooldown → 'Casting heals you'. Mercurial Magnum (64 spirit per bullet at our 28k buy point, SP 116.8, was 82) and Spiritual Overflow kept: both core in the gun-carry lockbuilds build 609237 'HYPER CARRY CELESTE 3000 DPS', updated Sep 18 (after Celeste's Sep 16 change); mobalytics current patch Overflow 24% late. Most post-patch Celeste data is a support/spirit build, so heavy gun stays Kieran's call.","Round 9: playstyle now copies current top Celeste (Kieran, Oct 19): HV Rounds → Opening Rounds early, light gun, then spirit/support. Desc 'Heavy gun Celeste.' → 'Spirit support Celeste with a light gun.'","Round 9: in from tracklock pro Celeste (last 30 days, 104 games, read Oct 19): Extra Regen 100% → Healing Booster 98%, Mystic Burst 71% → Tankbuster 47%, Mystic Expansion 88% (now on Light Eater, 10m → 12m cone, so it matters in lane) → Greater Expansion 89%, Torment Pulse 88%, Grit 66% → Spirit Shielding 72%, Suppressor 61%, Restorative Locket 58%, Witchmail 60% (late, 30.4k, per the heavy-hit rule). Also core in Horn Sounding (lockbuilds 438915, Oct 18), ttv lordnm (763029, Sep 28), FRESH AS HELL (656313, Oct 15).","Round 9: out: Rapid Rounds → Swift Striker, Extended → Titanic Magazine, Extra Stamina → Stamina Mastery, Quicksilver → Mercurial Magnum, Extra Charge → Rapid Recharge, Compress → Superior Cooldown (heavy-gun parts; none in the pro top 24). Kept light gun: Opening Rounds (pro 46%) and Spirit Lifesteal → Spiritual Overflow (mobalytics late 24%, FRESH AS HELL core). Superior Cooldown/Transcendent removed with Compress Cooldown.","Round 9: spikes: spirit 4.8k at 7.2k (Mystic Burst), health 4.8k at 11.2k (Restorative Locket), spirit 8k on Torment Pulse, 16k on Tankbuster. Mystic Burst at 7.2k: daggers T2 125+0.63x58 = 162 vs 80. Tankbuster at 22.4k: daggers 125+0.63x106 = 192 vs 165. Core 40k, 12 slots. Spirit Shielding left Counters (now core); counters come after Restorative Locket.","Round 11: added 'Team full of spirit heroes?' (gun Celeste: Hollow Point, Toxic Bullets, Lucky Shot). Light Eater's bonus damage and Radiant Daggers' fire rate stacks work with bullets, so the gun can carry when the team already has spirit. No T4 fix: Witchmail → Escalating Exposure → Spiritual Overflow starts at 30.4k.","Round 12: 'Team full of spirit heroes?' role-pivot box removed (gun Celeste becomes its own build next round). It held Hollow Point (bonus while above 65% health, noted 'from range') and Lucky Shot; Celeste fights inside Light Eater's 10-12m cone, so the gun build should use close-range items (Point Blank's 15m bonus) instead. The core has no range items: High-Velocity Rounds is bullet speed for her 50m/s bullets, not range.","Round 12: Mystic Regeneration note said 'keep it on them'; it's a buff on you, so the note now says the hits keep the regen going.","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 14: Opening Rounds out (optional in all 5 checked same-style builds: Horn Sounding, ttv lordnm, FRESH AS HELL, AOE BIOHAZARD, adofan; mobalytics 19%), Superior Cooldown in as first Late item (core in Horn Sounding and ttv lordnm, AOE BIOHAZARD, mobalytics late 20%). Spirit Lifesteal moved from Late (fresh T2 at 24k) to Mid. Witchmail is now the 13th slot and sells High-Velocity Rounds; Counters sell Suppressor. Rich box added: Refresher (in 4 of 5 builds, sells Spirit Shielding), Divine Barrier (Dispel Magic is in Counters, sells Restorative Locket). Mystic Regeneration/Suppressor notes now say the spirit bullet damage only applies to targets hit by Light Eater. Name 'Stack 'Em Up' -> 'Spirit Stack' so the style shows.","Round 15: Opening Rounds back in Early right after High-Velocity Rounds (its upgrade): current Celeste players mostly buy it (tracklock usage 61.7% vs HVR 93.4%; mobalytics 19% early + 18% mid + 18% late). Grit moved to the top of Mid, Tankbuster to the top of Late (box sizes). Witchmail now sells Opening Rounds. Counters caption was 117 characters (limit 112): now \"Get after Tankbuster ... Sell Suppressor\". Mystic Regeneration and Suppressor notes emptied (they explained proc conditions). Divine Barrier now sells Dispel Magic.","Round 17: Divine Barrier note uses the standard wording; added Transcendent Cooldown (Upgrade of Superior Cooldown) to Slot locked.","Round 19: checked against the real Celeste styles (spirit/Torment Pulse: Horn Sounding Oct 18, ttv lordnm Sep 28, adofan Sep 25; seemeta Oct 5-19). It is the main public style, no item changes; the gun carry style is now its own build (celeste_carry). Round 20: Boundless Spirit added to the late list (seemeta late 18%, Horn Sounding encore), Refresher moved last as the luxury, total 70.4k. Mystic Regeneration kept: it upgrades to Radiant Regeneration and Celeste lands many separate spirit hits.","Round 23: Rapid Recharge added to the late list: Radiant Daggers is Celeste's only charged ability, so it is two more daggers and +14 spirit on them.","Round 25: ability order 1234113312224443 → 1133234131224442 (kit-based for this playstyle, no idle early points).","Cost audit: Renamed from Star Spammer Celeste. Restorative Locket swapped for Enchanter's Emblem (same price and colour, adds spirit power). Removed Rapid Recharge from the T4-only rich box (it is a T3)."]},

 changes:["Alchemical Fire out: its shred is bullet resist, but Baba's bullets do spirit damage (8 + 0.26x spirit per bullet while holding stolen spirit, +8 at T1), so it only helped the small base bullet. Replaced with Spirit Shredder to Spirit Rend from the GILF build Kieran plays: -8% then stacking -15% spirit resist on every bullet plus 10% ability lifesteal. Rend's old note claim is gone with it.","Rapid Rounds to Swift Striker added mid (GILF lane core): +20% fire rate is +20% spirit bullets for 1.6k, and with Spirit Rend it lands gun 4.8k exactly at 27.2k souls instead of a lone 3.2k gun pocket. Spirit lands 4.8k at 4.8k, 6.4k on Quicksilver Reload and 8k on Mystic Vulnerability (Rapid Recharge moved after them); health 4.8k at 9.6k, 9.6k on Healing Tempo, 14.4k on Infuser.","Spirit Burn moved from core to rich (sell Torment Pulse) so the full build is 48k (was 52.8k). Core still 12: Rapid Recharge, Radiant, Snatch, Healing Tempo, Reactive Barrier, Infuser, Swift Striker, Mercurial Magnum, Escalating Exposure, Superior Duration, Torment Pulse, Spirit Rend. Counters now sell Swift Striker.","Kept against the GILF build: Quicksilver Reload to Mercurial Magnum (+20 + 0.38x spirit per bullet and 22% fire rate, the biggest gun item for her stolen spirit) and Healing Tempo (35% fire rate on every Radiant heal). GILF's Extra Spirit/Boundless, Greater Expansion and Spiritual Overflow didn't fit the 12 slots over those. Public Baba data is too thin to weigh (tracklock has under 30 games); the two in-game public builds open the same way (Extra Charge, Mystic Regen, Spirit Strike, Radiant, Healing Booster, Reactive Barrier).","Ability order: Mobalytics Baba grid (97% Threadsap first, T1/T2 at 5-6, Brew T1/T2 at 7-8, Threadsap T3 at 9) matches Kieran's in-game GILF order; Threadsap T1 is the +8 spirit per bullet the gun plan is built on and T3 adds the charge for Extra Charge/Rapid Recharge; ult T1/T2 at 10-11 (Kieran takes the ult 9-11, public 14-16), Legs and Brew T3 late.","Item fit: Quicksilver Reload -> Mercurial Magnum out (on no tracklock Baba list, not in Kieran's own build mine/baba.txt or the public baba builds). Replaced by Extra Spirit -> Improved Spirit (same 1.6k) -> Boundless Spirit (same +4.8k): Kieran's build has Extra Spirit and Boundless, pro 18%/27%. Kit: her bullets deal 8 (+0.26x spirit) spirit each with 3 pellets at 0.31s, so raw spirit scales every bullet. Torment Pulse moved to 'Mid · cont.' to keep Mid at 8 (order unchanged).","Item fit: Infuser kept: in Kieran's own build, and Baba's spirit bullets are ~9-10 separate spirit hits a second (3 pellets / 0.31s) for the full 7s. Kept: Extra Charge 100%, Mystic Regen 97%/Radiant 98%, Healing Booster 91%, Spirit Strike 88%/Spirit Snatch 77%, Grit 71%/Reactive Barrier 89%, Torment Pulse 91%, Duration Extender 57%/Superior Duration 45%, Mystic Vulnerability 20% + Escalating Exposure (Kieran's build), Rapid Rounds -> Swift Striker, Spirit Shredder -> Spirit Rend, Spirit Lifesteal, Healing Tempo (all in Kieran's build).","Healing Tempo moved from core to Slot locked (Kieran: small gain over Healing Booster for a lot of money).","Order: ability order set to the a7 data-first order 1324113312223444.","Threshold: Extra Charge at 800 souls goes on Threadsap, which is already a charged ability (1 charge, T3 adds another). Duration Extender on Granny Long Legs (10s). Spirit Burn (rich box, after 43.2k, ~172 spirit): Threadsap T1 bullets 16 + 0.26 x 172 = 61 each, stomp 75 + 0.6 x 172 = 178, thread 50, so stomp + thread + 5 bullets = 533 vs 500 in 5s. Nothing moved.","Round 8: Bullet Resilience added to counters (box now 8). Oct 14 gave Baba -7% base bullet resist and cut spirit resist scaling 0.12 to 0.1; NA #1 Shmuckyo build (lockbuilds, updated Oct 17) lists Bullet Resilience first in its counter buys.","Round 8: Radiant Regeneration kept, note softened ('You cast loads, so it heals a lot' to 'Every cast heals you'). Oct 14 cut its scaling 0.04 to 0.035 and raised Threadsap 26 to 28s, Legs 30 to 32s, Brew 25 to 27s. Shmuckyo (Oct 17) still has Mystic Regen > Radiant Regen in early core. Rest of the build (Extra Charge, Spirit Strike > Snatch, Spirit Shredder > Rend, Mystic Vulnerability > Escalating Exposure, Torment Pulse, Boundless) matches Shmuckyo Oct 17; tracklock (last 30 days, 250 games) is mostly pre-Oct 14.","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 14: renamed 'Steal And Stomp' to 'Spirit Bullets Baba' (the style is spirit damage through her gun, not stomping). Infuser moved to the start of Late (32k, was 43.2k) so health goes past 4.8k before Boundless instead of staying at 4.8k from 9.6k to 43.2k. Notes emptied: Extra Charge (restated the item; 'twice as often' wasn't accurate), Spirit Lifesteal and Spirit Shredder (proc explanations). Melee Lifesteal note cut to its lane condition and sell. Bullet Resilience note no longer claims it answers shred (it's flat bullet resist, more under 50% health). Counterspell example changed from 'a lift or a long channel' (a 0.8s parry can't block a channel) to Bebop's hook / Apollo's ult. Ability order checked: identical to mobalytics Archon+ Baba grid.","Round 15: Melee Lifesteal out of the losing-lane box (melee item on a gun Baba, no named sell). Counters desc cut to 111 chars (game limit 112). Divine Barrier added to rich (Dispel Magic is in Counters). Healbane note no longer says 'stomping'; Infuser note names Granny Long Legs.","Round 17: Lane box caption \"Losing lane? Buy 1\"; rich Indomitable note \"Upgrade of Reactive Barrier.\"; Slot locked moved beside the rich box.","Round 19: rebuilt as the public gun Baba (SN|P3R Hex Marks the Spot, mock default/lightbringer edit; mobalytics early Rapid Rounds 18%, Swift Striker 14%): the old build was the green Torment Pulse / Granny Long Legs build with two gun items, which is now its own build (baba_tank). Gun core: Rapid Rounds, Titanic Magazine, Burst Fire, Spiritual Overflow, Ricochet on top of the Extra Charge / Mystic Regeneration / Spirit Strike base every Baba build shares.","Round 19: name is now \"Rizuhble's Gun Baba\" (\"Spirit Bullets\" read like the spirit build). Compress Cooldown moved from Threadsap to Granny Long Legs: Threadsap's stolen spirit lasts 22s (30s at T2) while its cooldown is 16s at T2, so a shorter cooldown adds almost nothing there; Granny Long Legs (32s, 10s duration, shoot while moving at full speed) gets more uptime. Counters caption uses Kieran's exact wording (get after Burst Fire, sell Fortitude, to stay within 112 characters).","Round 20: late list: Indomitable (upgrade of Reactive Barrier, SN|P3R late), Spirit Burn (SN|P3R, Eido's, Shmuck late; sell Radiant Regeneration), Leech (Eido's, Shmuck late; sell Titanic Magazine), Divine Barrier; slot-locked Transcendent Cooldown. Core 48k, with the late list 71.2k without Divine Barrier. Mystic Regeneration kept (core, not a lane box): Baba's 1 has 2 charges and it upgrades to Radiant Regeneration (65 + 1.7x heal per cast, 6s cooldown).","Round 20 (update 2): checked Restorative Shot and lane timing: every lane item helps in lane now, no Slowing Bullets or Weighted Shots; no changes.","Round 23: Spirit Rend added to the late list (worth testing): Threadsap makes every pellet deal spirit damage, so bullet-applied spirit resist drops raise gun damage.","Round 25: ability order 1324113312223444 → 1132134231242434 (kit-based for this playstyle, no idle early points).","Cost audit: Healbane sells Reactive Barrier (T2 for T2) so health 4.8k is kept. Removed Spirit Rend from the T4-only rich box (it is a T3)."]},

 changes:["Battle Vest added in lane (8k) as in crayon's build Kieran plays (3rd item there), and it's the first sell when slots fill (Spellslinger at 46.4k takes its slot). Health 4.8k now lands on Enduring Speed at 11.2k with Battle Vest + Bullet Lifesteal (was Spirit Lifesteal at 11.2k).","Fleetfoot added mid (12.8k): crayon core and 83% of pro Warden builds. It's the counter sell. Bullet Resist Shredder added (crayon core; Flask, Binding Word and Last Stand are all spirit damage so it applies before the gun) and sells for Crippling Headshot in rich.","Late unchanged in role: Vampiric Burst 28.8k, Spiritual Overflow 33.6k (pro 69%), Siphon 40k (crayon core, pro 28%), Spellslinger 46.4k. Mercurial Magnum now at 24k (was 25.6k).","Core 12 slots, 46.4k (was 48k). No note talks about proc conditions.","Ability order: Exact mobalytics grid (Flask 99/100/95/90% at 1,5-7; Binding Word 8-10; Willpower 11-13; Last Stand 14-16), which is Kieran's crayon order with the ult unlocked at 4 instead of 5; Flask maxed first for Quicksilver/Mercurial on it, Binding Word T1 +20% bullet damage to trapped heroes before Willpower.","Toxic Bullets out (no Warden build we checked buys it, crayon included) → Spirit Resilience, which crayon does buy.","Item fit: all items kept. Warden's gun is 17 rounds at 3.8 shots/s with slow bullets (11,417 speed), so HV (100% pro) → Opening (100%), Rapid → Swift Striker (85%), Ext → Titanic (81%) all fit; Flask is 12s (5s at T3) so Quicksilver (89% pro) → Mercurial (70%) reloads every throw. Battle Vest 59%, Fleetfoot 78%, Spirit Resilience 70%, Enduring Speed 56%, Spirit Lifesteal 48% → Spiritual Overflow 56%, Bullet Resist Shredder 37%, Siphon 19% (tracklock pro, 27 games). Bullet Lifesteal (lockbuilds META core, deadlocked mid core), Vampiric Burst and Spellslinger (deadlocked late core) kept on that. Spirit Resilience note reworded so it doesn't restate the card.","Order: a7 data-first order 1234111333222444 (same as before).","Threshold: no damage-threshold items in the build. Quicksilver Reload (6.4k) and Mercurial Magnum (24.0k) are on Alchemical Flask, which is T3 (5s cooldown) by 6.4k, so the reload is up every trade. Nothing moved.","Round 8: Mercurial Magnum and Spiritual Overflow kept (both nerfed Sep 16). Mercurial now 20+0.38 per bullet = 58 spirit per bullet at our 24k buy point (SP 100.6), was 74 (-22%); Overflow 25% fire rate / 30 spirit, builds 35% slower. Post-patch Warden players still buy both: tracklock.gg probuild, last 30 days (Sep 19-Oct 19), 27 games: Mercurial 70%, Overflow 56%; mobalytics build-stats, current patch, Archon+: Mercurial 46% mid / 44% late, Overflow 59% late (both read Oct 19). Mercurial note 'Every bullet hits way harder' overclaimed → reworded to what it does.","Round 8: Frenzy note fixed — since Jul 28 its 10% bullet lifesteal is always on (game files: BulletLifestealPercent 10, +15% fire rate; below 50% health +40% fire rate); 'lifesteal when they get you low' was false.","Round 11: T4 fix — Spirit Resilience moved after Mercurial Magnum, so Mercurial (20.8k) no longer starts a five-T4 run; the run now starts at Vampiric Burst after 30k. Added 'Team full of gun heroes?' + '· late' (spirit Warden: Binding Word 110 + 2.44 per spirit, Last Stand 70 + 1.3 DPS healing 75%): Extra Spirit → Improved → Boundless, Mystic Vulnerability → Escalating Exposure, Infuser.","Round 12: 'Team full of gun heroes?' and its late box removed: spirit Warden becomes its own build next round.","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 14: renamed 'Don't Move Warden' to 'Gun Carry Warden' (the old name restated Binding Word, not the style) and desc emptied ('Tanky' was false: 11.2k health of 46.4k; gun is how he's played). Armor Piercer added to rich, selling Opening Rounds (crayon's own swap 'instead of opening'), so Opening Rounds has a named sell. Bullet Resist Shredder note emptied (proc explanation). Spirit Resilience gets an explicit note (an empty note shows the site default, which misspells Vyper and lists Haze): swap to Bullet Resilience vs gun-heavy teams, same 3.2k green. Extra Regen note cut to the sell. Counterspell example fixed. Order checked: identical to mobalytics Archon+ Warden grid.","Round 15: desc 'Gun Warden'. Divine Barrier added to rich (Dispel Magic is in Counters). Counters desc matches the other builds' shortened sell line.","Round 17: Lane sell note unified ('Sell it once you're out of slots.'). Desc 'Gun Warden' kept (Kieran).","Round 20: checked, no change (late list already reaches 76.8k).","Round 23: kit re-read, no item change (see log).","Round 25: ability order 1234111333222444 -> 1123143122443432 (worked out from the kit for this build's playstyle).","Cost audit: Counters sell Bullet Lifesteal instead of Fleetfoot, which held the gun 6.4k spike."]},

 ],
 changes:["Added the gun side Kieran plays (axl's Stylish Lash) and pros buy: Headshot Booster (68% early) → Headhunter (63% mid), Mystic Shot (54% mid). Mystic Shot sits right after the 4.8k spirit spike (weapon-tree spirit item rule).","Spirit 4.8k still at 5.6k (Cold Front). Health 4.8k moved from 9.6k to 12k: Extra Stamina, Enchanter's Emblem, Stamina Mastery. Emblem (tracklock core, 39% pro, Kieran's pick-one) replaces Spirit Lifesteal → Infuser; Flog already heals 40% of its damage. Gun also lands 4.8k at 16.8k with Headhunter.","Mystic Expansion and Compress Cooldown now imbue Death Slam (Kieran's build: ult range and 'look for fights when ult up'); Compress → Superior Cooldown instead of a fresh T3 late.","Cut Mystic Vulnerability/Escalating Exposure and Infuser (neither in Kieran's build or the pro top-8); Arctic Blast and Mystic Reverb moved to the rich box, Refresher added there (Kieran: very strong late).","Core 12 slots, 40k (was 46.4k). Ability order changed to Kieran's played order (Flog T1/T2 early for lane heal and fire-rate slow, then Ground Strike).","Ability order: Kieran's played order (axl's Stylish Lash) kept: Flog T1/T2 at 5-6 like mobalytics (92-93%) and seemeta (60.3%, 5.5k), Ground Strike maxed by 11 (T3 +120% damage per meter = the slam damage for Tankbuster), Death Slam 12-13 (seemeta 12-14) for Compress Cooldown/Expansion on it, Grapple T2/T3 last.","Item fit: Rapid Recharge → Mystic Reverb (late, on Ground Strike, sells Extra Charge). Grapple is Lash's only charged ability and does no damage, so Rapid Recharge's 14% spirit for charged abilities is wasted and it only adds grapples; it's not in the tracklock pro top 24 (183 games), the lockbuilds top 30 or axl's build Kieran plays, only ABL's optional list. Mystic Reverb is in axl's build ('a damage printer'), 19% pro late, 60.7% WR on lockbuilds (8,720 buys), and Ground Strike's single slam hit clears its 100 minimum easily. Core 44k (was 40k), 12 slots. Rest kept: Mystic Burst 99%, Extra Charge 96%, Improved/Extra Spirit 93/91%, Tankbuster 92%, Headshot Booster 68% → Headhunter 63%, Extra Stamina 65% → Stamina Mastery 58%, Mystic Shot 54%, Warp Stone 54%, Boundless 65%, Greater Expansion 59%, Enchanter's Emblem 39%, Spirit Burn 37%, Superior Cooldown 36%, Cold Front 29%, Compress 22% (pro).","Order: ability order set to the a7 data-first order 1324131213443422.","Threshold: checked with the new order. Mystic Burst at 800 souls, 9.2 spirit: Ground Strike 60 + 0.79 x 9.2 = 67 plus 5.5 per metre fallen, so anything from 3m up clears it (a 10m slam = 122) vs 80. Extra Charge at 3.2k goes on Grapple, already a charged ability. Tankbuster at 14.4k (after the 4.8k spirit and health spikes), 107 spirit, Ground Strike T3: 145 + ~20.7/m, a 5m slam = 249; Death Slam 105 + 0.975 x 107 = 209, vs 165. Spirit Burn at 37.6k, 161 spirit: 10m Ground Strike ~437 + Flog T3 282 = ~719 vs 500 in 5s. Mystic Reverb at 44.0k on Ground Strike: 187+ per slam vs 100. Nothing moved.","Round 11: added empty 'Lost lane?' box (Enchanter's Emblem and Stamina Mastery before Mystic Shot, so you survive landing while behind). No role pivot: the kit is all dive and slam. No T4 run (Boundless 27.2k is alone; Spirit Burn → Mystic Reverb is after 30k).","Round 12: Mystic Shot note said 'your first shot after a slam'; it's your next bullet every 8s, not tied to the slam. Note fixed.","Round 12: Lost lane note now says what it does: health 4.8k lands at 10.4k instead of 12k, before the gun item.","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 13: Unstoppable counter note listed hooks and knockdowns; Unstoppable blocks stun, silence, sleep, root and disarm (game files), so the note now says stuns and sleeps.","Round 14: ability order now mobalytics Archon+ Lash column leaders 1324131133244422 (Flog maxed by 10, Grapple T1 at 11, Death Slam 12-14, Grapple 15-16). 'Lost lane?' reorder box removed: Stamina Mastery needs Extra Stamina, which comes after Mystic Shot, and the gain was 1.6k souls. Refresher now sells Mystic Shot (Counters already sold Enchanter's Emblem). Cold Front note emptied ('throw it' was wrong: it's a blast around you) and Stamina Mastery note emptied (repeated the Extra Charge tip). Lane notes cut to condition + sell. Counterspell and Spirit Resilience notes fixed.","Round 15: Counters desc was 122 chars (game limit 112): now 'Get after Tankbuster ... Sell Enchanter's Emblem.' (109). Divine Barrier added to rich (Dispel Magic is in Counters).","Round 19: style check, no change. Spirit slam is the only post-patch public Lash style (lockbuilds ABL official Oct 19, eido, AShires, Swan, LordNM; seemeta Oct 5-19); this build has its shared core. Mystic Shot kept: a real pick of this style (seemeta mid 51.5%, in 4 of 5 lockbuilds builds).","Round 20: late list to ~78k from ABL's Spirit Lash late game: Witchmail first (second health step; core only had 8k health), Arctic Blast, Transcendent, Cheat Death, Lightning Scroll, Divine Barrier, Refresher last (luxury). Slot locked merged in.","Round 23: Added a Majestic Leap swap for Warp Stone: Ground Strike damage grows with fall height (up to 25m), and Leap gives height anywhere plus a barrier. Worth testing.","Round 25: order 1324131133244422 → 1312421133443422: Ground Strike T1 before the ult unlock, Grapple T1 early (cd 35→18, more high drops), Flog T3 (the heal) before Death Slam T3. Compress Cooldown moved from Death Slam to Ground Strike.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost audit: Mystic Burst bought after Extra Spirit (3rd item) so its threshold is met when you buy it. Cheat Death sells Warp Stone and Lightning Scroll sells Greater Expansion, keeping the gun 4.8k spike. Ethereal Shift sells Cold Front (spirit for spirit) so health 4.8k stays on time."]},

 changes:["Style moved to the hybrid Pocket Kieran plays (cosmetical's copy), which is the tracklock core: Restorative Shot (48% pro), Mystic Burst (97%), Monster Rounds (95%) → Cultist (96%), Battle Vest (61%), Rapid Rounds → Swift Striker (87%), Majestic Leap (73%), Tankbuster (96%), Superior Cooldown (83%), Spirit Burn (86%), Superior Duration (79%), Greater Expansion (56%), Dispel Magic (67%), Warp Stone (46%). Renamed.","Gun 4.8k at 7.2k (Restorative Shot + Cultist at ~8 min + Rapid Rounds), health 4.8k at 11.2k (Battle Vest + Majestic Leap), then spirit. Old build was spirit 4.8k at 5.6k / health at 12.8k.","Cut Extra Spirit, Cold Front, Mystic Vulnerability/Escalating Exposure, Improved/Boundless Spirit, Spirit Lifesteal/Infuser, Mystic Reverb and Enchanter's Emblem from core (Emblem is now a lane option). Close Quarters from Kieran's copy skipped (22% tracklock, not in the pro top-8).","Imbues: Compress Cooldown and Mystic Expansion follow Kieran's copy (Cloak, Barrage). Duration Extender goes on Affliction instead of Cloak: 22% on a 13s ult at ~90 DPS is ~260 extra damage per target plus longer heal block, versus +1.2s of cloak flight.","Restorative Shot sells for Diviner's Kevlar late (Kieran's copy has Kevlar), Battle Vest is the counters sell slot. Core 12 slots, 42.4k (was 51.2k).","Ability order: Kieran's cosmetical order = mobalytics through point 9 (Cloak, Satchel maxed by 9); for the burst-ult style the split 10-12 (Barrage 42-50% vs Affliction 30-48%) goes to Affliction T1 (-35s) at 10 and T2 (+3s/+4m, with Duration Extender on it) at 12 around Barrage, Barrage maxed by 14 for Expansion, ult T3 15, Satchel T3 last (16th point is Satchel on mobalytics too).","Item fit: core kept. Pocket fires 7 pellets a shot (11 rounds), so Restorative Shot (49% pro) fits; Monster Rounds 95% → Cultist 96%, Mystic Burst 97% → Tankbuster 96% (Satchel's pop-out is 155 + 1.1x spirit once T2 is in, over 165), Swift Striker 87%, Superior Cooldown 83%, Spirit Burn 87%, Superior Duration 80%, Majestic Leap 72%, Dispel 67%, Battle Vest 64%, Mystic Expansion 60%, Greater Expansion 56%, Compress 55%, Warp Stone 46% (tracklock pro, 225 games), all in Kieran's cosmetical copy. Counters: Spirit Resilience → Spirit Shielding (in Kieran's copy; Spirit Resilience isn't in it or any Pocket list we checked), Spellbreaker cut (same reason).","Order: a7 data-first order 2314233224141143 (same as before).","Threshold: Mystic Burst was 2nd at 1.6k souls with 11.4 spirit and every ability at base: Satchel 65 + 1.1 x 11.4 = 78, Flying Cloak 60 + 1.3 x 11.4 = 75, Barrage 37 per shot, all under 80. Moved it to right after Battle Vest: at 4.0k souls (11.4 -> 15.8 spirit, Satchel T2, Cloak T1) Satchel hits 155 + 1.1 x 15.8 = 172 and Cloak 130 + 1.3 x 15.8 = 151 vs 80. Tankbuster at 15.2k (after the gun and health spikes), 61.1 spirit: Satchel 222, Cloak T3 209 vs 165. Spirit Burn at 28.8k, 89.8 spirit: Cloak 247 + Satchel 254 = 501 before Barrage (4 x 90) vs 500 in 5s.","Round 10: Spirit spike moved before the health spike: Compress Cooldown and Tankbuster now come before Majestic Leap, so 4.8k spirit lands at 12k (was 15.2k) and 4.8k health at 15.2k (was 11.2k). +38 spirit power 3k souls sooner is about +240 damage per full combo (Barrage 4 x 0.465, Cloak 1.3, Satchel 1.1, Affliction 0.21 x 10s per 1 spirit). Pocket already has two escapes in his kit (Cloak teleport, Satchel), and Kieran's own spirit Pocket reference goes 4.8k spirit then Majestic Leap. Tankbuster threshold still met: Satchel T2 155 + 1.1 x 58 = 219 vs 165 at 12k.","Round 11: added 'Team full of spirit heroes?' (gun Pocket, Kieran's own second Pocket: Close Quarters → Point Blank, Toxic Bullets, Hollow Point, Berserker; Restorative Shot, Battle Vest, Cultist and Swift Striker are already core). No 'Lost lane?' box: Cultist is already at 7.2k. No T4 run.","Round 12: 'Team full of spirit heroes?' role-pivot box removed: gun Pocket becomes its own build next round.","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 14: ability order now 2314233221113444, mobalytics Archon+ Pocket column leaders and Kieran's own cosmetical order (Barrage maxed 10-12, Affliction 14-16). Enchanter's Emblem out of the losing-lane box (it only works above 65% health and is a damage item) for Grit. Cultist note made concrete (it eats one NPC for 170% souls). Dispel Magic gets an explicit note (empty showed a site default naming Yamato's grapple). Counterspell example fixed. Extra Regen note cut.","Round 15: Warp Stone out of core (Kieran: Majestic Leap OR Warp Stone, and Leap is already core); Ethereal Shift (in cosmetical's core list) takes the late slot and leaves Counters. Counters desc cut to 106 chars (was 113, limit 112). Divine Barrier added to rich (Dispel Magic is core).","Round 19: style check, no change. Spirit nuke Pocket is the public style (lockbuilds LordNM, SPIRIT GLOCKET Oct 9, Pocketo Oct 15; seemeta Oct 5-19).","Round 20: late list to ~81k: Transcendent, Escalating Exposure, Divine Barrier, Arctic Blast, Spiritual Overflow, Refresher last (LordNM Rank 1 late options). Battle Vest and Cultist now have named sells. Slot locked merged in.","Round 23: kit check. Spiritual Overflow (charges up from shooting heroes) is out of the late list for Mystic Reverb on Enchanter's Satchel: the Satchel is your most frequent big AoE (12s at T1, 155 + 1.1x spirit at T2), so every cast echoes half its damage around it and slows.","Round 25: points reordered for the burst ult: Affliction T1 at unlock, T2 at point 10 and T3 at point 12 (were the last three points), Barrage T1/T2 before Cloak T2/T3.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost audit: Escalating Exposure sells Greater Expansion and Mystic Reverb sells Superior Duration, keeping the gun 4.8k spike."]},

 changes:["Diviner's Kevlar (6.4k), Mystic Reverb (6.4k) and Infuser (4.8k over Spirit Lifesteal) out of core. Core drops from 60.8k to 47.2k, 12 slots. Reverb goes to the rich box.","In their place: Mystic Regeneration core first buy (95% pro, was lane box), Healbane (94% pro; -35% healing, 275 heal when the target dies) as the second green so the 4.8k health spike is Healbane + Veil Walker at 12k (was 11.2k with Spirit Lifesteal), and Headshot Booster into Headhunter (61% / 65% pro, deadlocked core): 75 bonus headshot damage, 4% heal per headshot. Spirit spike is 5.6k at 5.6k souls because Mystic Regeneration is spirit-tree (800 over).","Gun spike moved to exactly 4.8k: Spirit Shredder + Toxic Bullets at 15.2k (was 14.4k), then Headhunter takes gun to 8k. Toxic 89%, Ricochet 82%, Escalating Exposure 71%, Superior Cooldown 46% of pro games all kept.","Spirit Lifesteal dropped: Scarabs steal health already and Shredder/Rend give spirit lifesteal; pros take Spirit Lifesteal 19%, Infuser not at all. Boundless kept as the last buy.","Counters and Reverb sell Mystic Regeneration; Spirit Burn sells Healbane.","Ability order: mobalytics build-stats grid: Djinn's Mark maxed 5-8 (68-80%), Dust Devil 9-12, Traveler 13-15, Scarabs last; same order with Mark unlocked first for the gun/mark style, one Scarab point at 11 for lane damage/heal before the ult.","Item fit: Quicksilver Reload → Compress Cooldown (on Dust Devil). Quicksilver only reloads when you cast Dust Devil (36s), and Mirage's 16-round mag isn't the problem; neither it nor Mercurial Magnum is in the tracklock pro top 24 (93 games) or the lockbuilds top 10. Compress is 58% pro early, 42.2% lockbuilds pick, deadlocked mid core, and turns Superior Cooldown (44% pro) into its upgrade.","Item fit: Surge of Power → Extra Spirit into Improved Spirit (38% pro, deadlocked core) plus Mystic Vulnerability moved into lane (73% pro, 53.4% lockbuilds pick, lockbuilds official lane). Surge isn't in any Mirage list we checked. Spirit 4.8k now lands exactly on Mystic Vulnerability at 4.8k souls (was 5.6k on Surge).","Item fit: Veil Walker → Dispel Magic for the 4.8k green (Healbane + Dispel at 11.2k, was 12k). Dispel is 88% pro mid; Veil Walker is only a lockbuilds optional. Dispel left the counters box.","Item fit: Mercurial Magnum → Extended Magazine into Titanic Magazine (66% pro, 36.2% lockbuilds pick; Extended 51% pro): 16 rounds at 2.7 shots/s empties in about 6s, and every bullet is a mark, Toxic and Ricochet hit. Inhibitor added as the 12th item late (30% pro, deadlocked late core): your bullets build it up, and it's the only health after the 4.8k spike.","Item fit: Mystic Reverb out of the rich box (not in any Mirage list we checked); Transcendent Cooldown added as Slot locked (lockbuilds official and deadlocked late core). Kept: Healbane 98%, Toxic 98%, Mystic Regeneration 94%, Ricochet 83%, Escalating Exposure 68%, Headshot Booster 61% → Headhunter 53%, Boundless 16% (pro); Spirit Shredder → Spirit Rend from the lockbuilds official build (bullets drop spirit resist before the marks pop). Core 45.6k, 12 slots.","Order: ability order set to the a7 data-first order 1324313322124441.","Threshold: no Mystic Burst/Tankbuster in the build. Compress Cooldown is on Dust Devil (36s cooldown). Mystic Regeneration, Mystic Vulnerability and Escalating Exposure get spirit hits from Scarabs (ticking) and Djinn's Mark from 800 souls. Spirit Burn (rich box, after 45.6k, ~140 spirit): Djinn's Mark T3 one mark 31 + 0.35 x 140 = 80, doubling per mark, so 4 marks popped = 640, plus Dust Devil T3, vs 500 in 5s. Nothing moved.","Round 9: Worth a try: Mystic Reverb on Djinn's Mark. 4 marks pop for 8x (11 + 0.35x spirit), ~370 at 100 spirit, well over Reverb's 100 minimum; Reverb echoes 50% of it plus 10% max health to everyone within 16m. Core kept: matches tracklock.gg pro builds, last 30 days, checked 2026-10-19 (Healbane 98%, Mystic Regen 94%, Toxic 98%, Dispel 88%, Ricochet 83%, Escalating Exposure 68%).","Round 11: added empty 'Lost lane?' box (Ricochet right after Toxic Bullets, about 20.8k instead of 25.6k, to clear camps and catch up). No role pivot: marks already split the damage between gun and spirit. No T4 run (Escalating Exposure 32.8k onward is late).","Round 12: Worth a try box removed (Mystic Reverb: not an item Kieran picked).","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 14: ability order now 3124333222444111 (mobalytics Archon+ columns 1-10 and tracklock's most common path Mark > Dust Devil > Traveler > Scarabs); the old one put Scarabs T1 at 6. Inhibitor moved to the start of Late (34.4k, was 45.6k) so health doesn't sit at 4.8k from 11.2k to 45.6k. Crippling Headshot added to rich (pricier resist cut than Spirit Rend; lockbuilds official and apacycle late) selling Titanic Magazine, so Titanic has a named sell. Spirit Shredder note emptied (proc explanation). Dispel Magic gets an explicit note. Unstoppable note no longer says stuns cancel Traveler (any damage does). Counterspell example fixed.","Round 15: Counters desc was 120 chars (limit 112): now anchored on Healbane, 109 chars. Divine Barrier added to rich (Dispel Magic is core). Spirit Resilience note: 'hitting' (it's flat spirit resist).","Round 19: style check, no change. Gun/spirit mark Mirage is the only public style (lockbuilds GUN/SPIRIT official Oct 19, apacycle, Arctic, Playwithme; seemeta Oct 5-19).","Round 20: Mystic Regeneration removed (Kieran Oct 20: not worth it in lane; Radiant Regeneration heals on ability casts and Mirage casts few). Improved Spirit moved up to right after Mystic Vulnerability so the spirit 4.8k still lands early. Leech added to core as the second health step and the sustain (LB GUN/SPIRIT official + apacycle late). Late list to ~86k: Spirit Burn, Transcendent, Crippling Headshot, Siphon Bullets, Divine Barrier, Cheat Death.","Round 23: Compress Cooldown moved from Dust Devil to Djinn's Mark: the per-target mark cooldown is a cooldown stat, so marks stack about 22% faster and each mark doubles the hit. Mystic Reverb on Djinn's Mark added to the late list (a 3-mark pop is 300+). Worth testing.","Round 25: order 3124333222444111 → 3132343212121444: Djinn's Mark T1 no longer waits for the ult unlock; Fire Scarabs (the heal and damage cut) and Dust Devil tiers before the ult tiers.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Review 2: the 7-item gun run (Toxic → Headshot Booster → Headhunter → Extended Magazine → Ricochet → Titanic → Spirit Rend) left spirit invest at 4.8k from 4.8k to 38.4k souls, but marks are her main damage: a 5-mark pop is 16 × (31 + 0.35 × spirit), about 990 at 88 spirit, and each spirit point adds 5.6 to it. Escalating Exposure (+54% spirit damage at 12 stacks, stacked by Toxic Bullets bleed and Scarabs) and Superior Cooldown now come right after Ricochet, as in the lockbuilds official, apacycle and Arctic Mirage builds; Headhunter (Arctic buys it late) and Titanic Magazine move to Late as upgrades of the cheap Headshot Booster and Extended Magazine bought after Toxic. Inhibitor goes first in Late. Spirit invest now 9.6k at 27.2k and 11.2k exactly at 28.8k, 16k exactly on Boundless; gun 4.8k on Toxic unchanged. Lost lane? box removed: Ricochet already follows Toxic after only two 800s."]},

 changes:["More spirit, as asked: Mystic Burst → Tankbuster (Venom is 140 + 2.79x spirit at full missing health and the bola's petrify hit is 180 + 2.05x, both well over 165), Mystic Vulnerability → Escalating Exposure (Magnum bullets, daggers, Tesla and Venom all stack it) and Tesla Bullets → Capacitor (Tbird's Tesla route; pro Tesla 59% mid, Capacitor 27% late). Spirit spend goes from 9.6k to 19.2k.","Extra Spirit moved into lane (pro 92%) and Bullet Lifesteal/Spirit Shielding come straight after Burst Fire, so the 4.8k health spike is Grit → Spirit Shielding, Bullet Lifesteal, Sprint Boots → Enduring Speed at 12k (was 9.6k with Battle Vest). Enduring Speed is in pro mid builds (42%) and Rey's core; Battle Vest dropped.","Spirit 4.8k lands exactly on Surge of Power at 14.4k (same as before), with Mystic Burst bought after it. Spirit Lifesteal added at 20.8k so Leech (pro 39%, Rey/deadlocked core) replaces Vampiric Burst: Leech costs 3.2k with both lifesteals owned instead of 4.8k and keeps the lifesteal on Venom too.","Toxic Bullets, Ricochet, Lucky Shot and Silencer out of core (slots and 48k cap). Hunter's Aura kept as the 12th item and is the counter sell. Crippling Headshot moved to rich (Tbird's 'next best for raw damage').","Core 12 slots, 48k (was 51.2k). Gun spike unchanged at 6.4k souls on Burst Fire (pro 98%).","Ability order: Mobalytics grid and Kieran's Tbird order both max Slither and Lethal Venom first and leave the dagger last; for the spirit style the dagger's T1 (+1 charge) is pulled to 6 because Quicksilver, Surge of Power and Mercurial all sit on it, Venom maxed by 10 (T3 bullets build venom), Slither T3 barrier at 13, bola 11-14 (public 11-13), dagger T2/T3 last.","Item fit: Mystic Burst → Tankbuster swapped for Improved Spirit (mid) → Boundless Spirit (last core buy). Mystic Burst/Tankbuster isn't in the tracklock pro top 24 (66 games), the lockbuilds top 30, Tbird's build Kieran plays, Rey's or WildPatch's hybrid build; Venom only clears 165 once they're already hurt (20 + 0.65x spirit at full health). Improved Spirit is 62% pro early and 31.3% lockbuilds pick, Boundless is in Tbird's ('really like it if I run tesla'), Rey's and WildPatch's builds. Spirit spend 19.2k → 22.4k, still more spirit as asked.","Item fit: Capacitor moved from late core to the rich box (27% pro, Tbird: 'only buy if going tesla early') to keep the total at 48k; Tesla Bullets (59% pro) stays core. Kept: Close Quarters 100%, Burst Fire 98%, Mercurial Magnum 95% and Quicksilver 92% (dagger 10s cooldown with 2-3 charges, 24-round mag at 14 shots/s empties in under 2s), Extra Spirit 92%, Rapid Rounds 83%, Spirit Shielding 82%, Grit 80%, Enduring Speed 42%, Bullet Lifesteal 39%, Leech 39%, Spirit Lifesteal 35% (pro). Escalating Exposure kept for the spirit style: Mercurial bullets are spirit damage at 14 shots/s, so it stacks to 12 almost at once (only public support: WildPatch's hybrid build). Point Blank (Rey's #1 pick, 23% lockbuilds), Extended → Escalating Resilience and Hunter's Aura (Rey's optionals) kept. 12 slots, 48k. Divine Barrier note shortened (it explained the card).","Order: ability order set to the a7 data-first order 3214323322444111.","Threshold: no Mystic Burst/Tankbuster/Spirit Burn in the build. Quicksilver Reload (10.4k), Surge of Power (14.4k, +28 spirit on it) and Mercurial Magnum (29.6k) are all on Screwjab Dagger, a 2-charge ability with a 10s cooldown, so the reload and speed come up every trade. Mystic Vulnerability/Escalating Exposure get spirit hits from the dagger and Venom. Nothing moved.","Round 8: Frenzy note fixed. Since Jul 28 its 10% bullet lifesteal is always on (game files 6795). Mercurial Magnum and Tesla Bullets kept after the Sep 16 nerf: tracklock.gg Vyper pro builds, last 30 days to Oct 19 (post-Sep 16): Mercurial 95%, Quicksilver 92%, Tesla 59%.","Round 9: Worth a try box: Mystic Reverb on Lethal Venom (Venom is 20 + 0.65x spirit at full health up to 140 + 2.79x at 30% health; at Hunter's Aura's slot (38.4k, 131 spirit by sp.js) that's 105 at full health to 506 at 30%, so it clears Reverb's 100 minimum on any target; Reverb repeats 50% 3s later with a 32% slow).","Round 10: Capacitor note: 'Expensive late upgrade to Tesla Bullets' -> 'Upgrade.' (it builds from Tesla Bullets; rich-box wording rule).","Round 12: Worth a try box removed (Mystic Reverb: not an item Kieran picked).","Round 12: Desc said 'with a Tesla route', but there's no separate Tesla route (Tesla Bullets is just in the core). Now 'Spirit Vyper with a close-range gun.'","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 14: Counters now sell Spirit Shielding (Crippling Headshot also sold Hunter's Aura, so both couldn't be bought). Spirit Resilience note no longer says 'ticking'. Extra Regen note cut. Order checked: identical to mobalytics Archon+ Vyper grid; tracklock's most common max order (Slither > Venom > Bola > Dagger, 1,015 games) agrees.","Round 15: Counters desc was 119 chars (limit 112): now 112. Veil Walker note is now the situation to buy it, not a description of the item.","Round 17: spirit first, per Kieran's 'Vyper more spirit invest': Extra Spirit, Quicksilver Reload and Surge of Power on Screwjab Dagger now open the build (spirit 4.8k at 5.6k souls, was 14.4k behind a gun 4.8k at 6.4k); greens next (Bullet Lifesteal, Spirit Shielding, Sprint Boots, Enduring Speed: health 4.8k at 10.4k); the close-range gun items (Close Quarters, Rapid Rounds, Extended Magazine, Burst Fire) come after (gun 4.8k at 15.2k), so it no longer opens like Gun Vyper. Same items, Late box now fits one row. Capacitor note 'Upgrade of Tesla Bullets.'; Divine Barrier note 'If you bought Dispel Magic, sell it for this.'; lane sell 'Sell it once you're out of slots.'; Counters after Burst Fire.","Round 19: rebuilt to the real public spirit-spike style (Rey's Compy Wizard Lizard, lockbuilds 196233, Oct 16): Extra Spirit → Improved Spirit, Quicksilver and Cold Front for the 4.8k spirit spike, then Opening Rounds, Close Quarters, Rapid Rounds, the lifesteal greens with Enduring Speed, Burst Fire, Point Blank, Mercurial Magnum, Leech, Spiritual Overflow, Frenzy, Ricochet, Unstoppable, Boundless. Dropped the invented mix (Grit, Surge of Power, Spirit Shielding, Extended Magazine, Mystic Vulnerability → Escalating Exposure, Tesla, Escalating Resilience, Hunter's Aura). Ability order = seemeta most popular (Oct 5–19).","Round 20: late list Silencer, Arctic Blast (Cold Front now upgrades), Vampiric Burst; core+late 78.4k.","Round 23: kit re-read, no item change (see log).","Round 25: ability order 3322134322444111 -> 1123241421333244 (worked out from the kit for this build's playstyle).","Cost audit: Boundless Spirit moved to right after Leech (spirit 11.2k tier 25k souls earlier). Counters sell Bullet Lifesteal instead of Cold Front, which held spirit 4.8k."]},

 changes:["Round 13: new gun build — sources: lockbuilds 'I got a gun. This baby writes itself.' (Strike, 10,121, Oct 10: Close Quarters, Rapid Rounds, Grit, Split Shot lane; Ricochet, Burst Fire, Quicksilver Reload, Mercurial Magnum mid; Silencer, Vampiric Burst, Lucky Shot late); mobalytics Archon+ Vyper: Burst Fire 73%, Split Shot 43% mid, Ricochet 23%, Silencer 22%, Vampiric Burst 27% (hero-wide, used only as a trend check), Unstoppable 32%, Mercurial Magnum 50% late; tracklock pro Vyper (66 games): Close Quarters 100%, Burst Fire 98%, Mercurial Magnum 95%, Split Shot 56%. Ability order: same consensus as the spirit build (mobalytics: Slither maxed first in 9.4K of 12.4K matches, Venom next, dagger last).","Round 13 (style check): every item is in Strike's gun build except Bullet Lifesteal and Spirit Shielding (the parts Vampiric Burst and Grit build into, both in Strike's lists). Frenzy, Sprint Boots/Enduring Speed and Extended/Titanic Magazine (not in gun Vyper builds) replaced by Lucky Shot, Extra Stamina/Stamina Mastery and Intensifying Magazine from Strike's lane and mid core.","Round 13: Split Shot goes next to Ricochet (farm items together), not in lane. No Swift Striker: it and Burst Fire both build from Rapid Rounds, and pros take Burst Fire (98%).","Round 13 (notes policy): notes cut to tips, situational calls and sells; every remaining claim checked in the game files.","Round 14: Divine Barrier added to rich (Dispel Magic is in Counters). Crippling Headshot out of rich (not a pricier version of anything in this build); Glass Cannon (pricier raw weapon damage than Intensifying Magazine, in Strike's gun build) now sells Intensifying Magazine and Spellbreaker (pricier Spirit Shielding) sells Spirit Shielding, so both dead-end T2s have named sells. Unstoppable gets an explicit note (it can't be used while stunned). Extra Regen note cut. Order same as the spirit build (mobalytics grid, tracklock max order).","Round 15: Counters desc was 114 chars (limit 112): now 107. Veil Walker note is now the situation to buy it, not a description of the item.","Round 17: Divine Barrier note 'If you bought Dispel Magic, sell it for this.' (one wording across builds); lane sell 'Sell it once you're out of slots.'.","Round 20: Crippling Headshot added to the late list; core+late 72k.","Round 23: kit re-read, no item change (see log).","Round 25: ability order 3214323322444111 -> 1123141332232444 (worked out from the kit for this build's playstyle).","Cost audit: Counters sell Spirit Shielding instead of Split Shot, so the Split Shot + Ricochet pairing and gun tiers are kept."]},

 changes:["Style change: spirit bolt sniper to melee, built from the 'rabbit backshots' build Kieran plays. Renamed. Whole item list replaced: Monster Rounds to Cultist (~8 min, +1 charge), Stalker (sold later), Melee Charge to Crushing Fists, Shadow Weave, Duration Extender to Superior Duration on hex, Arctic Blast, Point Blank, Hollow Point (the public build's first choice-of-three; Weighted Shots and Hunter's Aura in a swap box), Alchemical Fire, Colossus, Echo Shard and Diviner's Kevlar in rich. Ability order follows the public build's (assistant and ult first, rabbit maxed last).","Greens: the public build's Extra Health + Fortitude replaced with Extra Health (to Colossus: +30% melee damage, +15% weapon damage, 35% resists), Melee Lifesteal to Lifestrike (heals 120 + 35% on heavy punch, 48% slow for 2.5s, +16% melee damage) and Grit to Reactive Barrier (parries and stuns). Health 4.8k lands exactly at 9.6k souls. Fortitude only gave 375 health and 1.5 move speed; Lifestrike's slow is what keeps a rabbit (+36% move speed) in punch range.","Gun 4.8k lands exactly at 6.4k souls (Monster, Stalker, Cultist), 6.4k with Melee Charge, 16k with Hollow Point. Spirit: Cold Front (1.6k) bought before Arctic Blast so the slow is there early and Duration Extender + Cold Front + Superior Duration land 4.8k spirit exactly at 20.8k; Arctic Blast (the public build's 'IMPORTANT ITEM') is the upgrade at 32.8k, so no fresh 6.4k before 20 min.","Enduring Speed added mid (public build optional) as the 12th core slot: Sinclair must chase rabbits through slows. Total 46.4k, core 12 slots. Stalker sold for Alchemical Fire (the public build's 'better than Torment Pulse for us' pick). Counters sell Enduring Speed.","No public site lists a melee Sinclair (tracklock/lockbuilds/deadlocked are all bolt or gun builds), so the only style evidence is the in-game build itself; items were checked against the kit instead (rabbits take +15% to +22% damage and can't act, so heavy melee is the finisher).","Ability order: Exact order of the public 'rabbit backshots' melee build Kieran plays (mine/sinclair.txt): assistant and ult early, Rabbit Hex maxed 8-10, bolt last; mobalytics grid is bolt-build dominated (bolt 7-9) so it was not followed. Note cur_sinclair.js is still the spirit Triple Bolt item plan, not the melee one.","Item fit: Melee Lifesteal → Lifestrike out, Extra Health → Fortitude in (Colossus now bought outright late). No public site has a melee Sinclair (tracklock, lockbuilds' top 30 and its 6 top builds are all bolt, gun or hybrid), so the rabbit backshots build Kieran plays is the only style evidence, and it has Extra Health → Fortitude ('keeps you healthy on the map') and Reactive Barrier as the 4.8k green, never Lifestrike. Health 4.8k still lands at 9.6k: Extra Health, Grit, Fortitude, Reactive Barrier (Reactive moved up from 28k). Gun 4.8k now lands at 5.6k (was 6.4k) because Melee Lifesteal no longer sits in front of Cultist. Total 46.4k unchanged, 12 slots.","Item fit: Spirit Resilience cut from Counters (not in Kieran's build, no public melee Sinclair to back it). Indomitable rich note now says it's the expensive late upgrade to Reactive Barrier; Juggernaut slot-locked note fixed to 'Upgrade of Enduring Speed.'. Everything else is in Kieran's build: Monster Rounds → Cultist, Stalker, Melee Charge → Crushing Fists, Shadow Weave, Duration Extender → Superior Duration on the hex, Cold Front → Arctic Blast ('IMPORTANT ITEM'), Point Blank, Hollow Point, Enduring Speed, Alchemical Fire, Colossus; rich Echo Shard, Diviner's Kevlar, Indomitable. Kit: rabbits can't act, so heavy melee (Melee Charge +25 heavy damage, 50% longer reach) is the finisher.","Order: a7 data-first order 2134244333242111 (same as before).","Threshold: no damage-threshold items in the build. Duration Extender (17.6k) and the rich-box Echo Shard are on Rabbit Hex (2s hex, 26s cooldown), Melee Charge/Crushing Fists proc on the punches the build is about. Nothing moved.","Round 8: Sprint Boots added before Shadow Weave. Since Sep 16 Shadow Weave builds from Sprint Boots (cooldown 37s, 2m sprint), so the same 3.2k now gives 2m sprint and out-of-combat regen two buys earlier. No post-Oct 5 public melee Sinclair data (lockbuilds Sinclair builds updated to Oct 17 are all gun/spirit; Shadow Weave not listed), so this is on kit numbers. Health stays at 4.8k on Reactive Barrier (9.6k souls).","Round 9: Melee Charge moved from 13.6k (after Enduring Speed and Sprint Boots) to 11.2k, straight after the 4.8k health spike on Reactive Barrier. Kieran's rabbit backshots build puts it right after the 4.8k green item ('most of the time your melee won't catch up to the rabbits without this item'), and before it the build had no melee item at all after lane. Same items, same total.","Round 10: Indomitable note: 'Expensive late upgrade to Reactive Barrier' -> 'Upgrade.' (rich-box wording rule).","Round 11: added 'Team full of gun heroes?' (bolt Sinclair: Vexing Bolt 120 + 1.86 per spirit; Mystic Burst → Tankbuster, Mystic Reverb and Echo Shard on the bolt). No T4 run (Arctic Blast 32k onward is late).","Round 12: 'Team full of gun heroes?' role-pivot box removed (bolt Sinclair becomes its own build next round). This also ends Echo Shard being in the build twice (rich box and pivot).","Round 12: Swap for Hollow Point notes made checkable: 'lots of slows and stuns' → '2 or more heroes that slow or stun you'; 'the rabbit is usually on its own' → 'you mostly catch one hero on their own'.","Round 13: Warp Stone counter note said 'reach Lash or Dynamo before their ult goes off', but Warp Stone can't stop an ult (neither can Rabbit Hex, which doesn't interrupt). Now an escape after the punch.","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 14: Divine Barrier added to rich (Dispel Magic is in Counters; Kieran's build lists it vs Pocket). Notes that only explained the item emptied (Melee Charge, Enduring Speed, Arctic Blast); Cold Front tip corrected (the hex lands after 0.9s, so the slow stops them walking out of it, not 'the rabbit running'); Shadow Weave note cut to the tip; Warp Stone note now a trigger a player can check. Items, order and spikes unchanged.","Round 15: Counters desc was 119 characters (game limit 112): now 'Get after Fortitude … Sell Enduring Speed for it.' (112). Cold Front note said 'Throw it', but Cold Front is a blast around you (StartRadius 2m to EndRadius 10m, no cast range): now 'Use it'.","Round 17: Counters no longer sell Enduring Speed (Slot locked upgrades it to Juggernaut); they sell Cultist Sacrifice, since Sprint Boots goes into Shadow Weave. Indomitable note 'Upgrade of Reactive Barrier.'. Lane sell note standard; Divine Barrier note now 'If you bought Dispel Magic, sell it for this.'.","Round 20: Weighted Shots swap removed (Rabbit Hex and Arctic Blast already catch people). Late list reordered by impact (Echo Shard no longer first) and Phantom Strike added from the rabbit backshots late box; total ~82k.","Round 23: Lifestrike added to the Hollow Point swap. Rabbit Hex leaves targets unable to act for 2-3s and taking +15% damage, so heavy melee lands reliably and Lifestrike heals 120 + 1.75x spirit + 35% of the hit each time. The build had no real healing.","Round 25: ability order 2134244333242111 -> 3321342443124112 (worked out from the kit for this build's playstyle).","Cost audit: Lifestrike swap now replaces Alchemical Fire (not Hollow Point) so the weapon 16k tier is kept. Counters sell Reactive Barrier instead of Cultist Sacrifice, which held weapon 4.8k. Crushing Fists moved before Arctic Blast (32.0k instead of 36.8k)."]},

 changes:["Round 13: new bolt build — sources: lockbuilds CF3 Magic Bolts of Boom V2.1 (18,516, Sep 17) and brady lobby (9,862, Aug 20): Extra Spirit, Extra Charge, Rapid Recharge, Improved Spirit, Trophy Collector, Veil Walker, Mystic Expansion, Duration Extender, Superior Duration, Greater Expansion, Slowing Hex + Vortex Web, Boundless, Diviner's Kevlar, cooldowns, Spirit Burn; tracklock pro Sinclair last 30 days (149 games): Mystic Expansion 74%, Duration Extender 64%, Greater Expansion 81%, Superior Duration 79%, Diviner's Kevlar 40%, Enchanter's Emblem 34%, Veil Walker 28%. Ability order: mobalytics build-stats grid median (Vexing Bolt maxed first in 7.5K games): 2134 then 211214433432.","Round 13: kit numbers: Vexing Bolt has 1 charge in the game files, so Extra Charge makes it 2 and Rapid Recharge 4. Bolt 60–120 (+0.93–1.86 spirit), T3 +126 max and the Assistant's copy goes from 50% to 100%. Mystic Burst (needs >80) works from the first bolt; Tankbuster (>165) at 14.4k with the T3 bolt; Spirit Burn (500 in 5s) is two full bolts.","Round 13 (notes policy): notes cut to tips, situational calls and sells; every remaining claim checked in the game files.","Round 14: Divine Barrier added to rich (Dispel Magic is in Counters). Echo Shard moved from Vexing Bolt to Rabbit Hex (CF3 lists it under 'RABBIT TIME'; the bolt already has 3 charges 2.1s apart, a second hex doubles the Vortex Web combo) and now sells Trophy Collector, so every T2 has a named sell. Counterspell note 'a lift or a long channel' replaced with a plain trigger. Source dates noted: CF3 (Sep 17) predates the Oct 5 Sinclair patch, which didn't touch Vexing Bolt's damage, charges or cooldown (only objective damage), so its item list still holds.","Round 15: Counters desc was 118 characters (game limit 112): Enchanter's Emblem shortened to 'Enchanter's' (111); no other sell target in the build fits.","Round 17: Counters desc names Enchanter's Emblem in full. Lane sell note standard; Divine Barrier note now 'If you bought Dispel Magic, sell it for this.'.","Round 20: Late list filled to ~77k: Mystic Reverb on the bolt, Escalating Exposure, Echo Shard on Rabbit Hex (CF3 Magic Bolts late boxes), then Divine Barrier.","Round 23: kit re-read, no item change (see log).","Round 25: ability order 2134211214433432 -> 1123142213443432 (worked out from the kit for this build's playstyle)."]},
