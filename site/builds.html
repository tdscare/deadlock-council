 changes:["Base = Kieran's in-game Ink Cycler Violet. Items, boxes and notes kept; no Quicksilver Reload (Mercurial Magnum bought straight, per his latest call). Fixes are spike maths, the imbue target, slot count and the 48k total.","Mercurial Magnum now has its imbue target: Living Ink (1). He spams it, so every cast reloads and re-arms the spirit bullets.","Spirit spike was false: Extra Spirit + Extra Charge + Surge (upgrade, +2400) = 4000, not 4.8k. Added Mystic Burst (800) right after Surge, so spirit lands exactly 4.8k at 6.4k souls, and Tankbuster becomes a true upgrade (+2400, same total cost as before). Gun 4.8k on Recharging Rush at 9.6k unchanged.","Health spike pulled earlier inside his Mid box: Spirit Lifesteal moved before Rapid Recharge/Improved Spirit, so health 4.8k lands at 16.8k souls (was 20.8k with spirit already at 11.2k, which the overshoot rule calls wrong). Spirit sits at 7.2k when health spikes.","Improved Spirit note said 'Upgrade' but Extra Spirit is consumed by Surge, so it's a fresh 1600; note now 'Upgrades to Boundless Spirit'. Spirit Burn note said 'Upgrade' but it has no components; reworded. Witchmail reworded (no components).","Core ends at exactly 12 at Infuser, 44.0k (was 62.4k with Lucky Shot at slot 13 and no sell). His three late swap-ins (Lucky Shot, Spiritual Overflow, Escalating Exposure) moved to the top of the rich box with his own sells kept; they're all T4 extras of what the build already does. Superior Duration (T3) stays in rich per his explicit call for Infuser uptime. Every rich item names a sell. Counters box uses the standard wording.","Public check: lockbuilds official and deadlocked Violet are pure spirit (Extra Spirit > Improved > Boundless, Rapid Recharge, Spirit Lifesteal, Tankbuster, Superior Cooldown, Spirit Burn, Escalating Exposure, Spiritual Overflow), which this build has. They go greens first (Extra Regen/Mystic Regeneration/Radiant Regen); his gun-hybrid opener (HV > Opening, Mystic Shot, Recharging Rush, Mercurial Magnum) is his style, so kept.","Ability order: Kieran's order (Living Ink T1, T2, Still Life T1, T2, Living Ink T3, Still Life T3, ult x2, Flow State, Flow State T3 last) over the data order (mobalytics most-likely path 3124313311422442, which maxes Still Life first). His gets Living Ink T3 (+0.4 scaling, +30% bullet multiplier, +1s cooldown per hit) at 9.6k souls instead of 13.6k: each Ink bullet hits 141-160 instead of 103-115 in that window, about +137 per cast. The data order's earlier Still Life T3 (35s to 24s cooldown) is worth roughly +5 damage per second from the sketch; the Ink upgrade is worth about +15.","Item fit: kept every item. All are in Kieran's own in-game Violet (Ink Cycler); kit check: Living Ink 2 charges x 3 shots at 7s between charges and the tether ticking every 0.15s give Infuser and Escalating Exposure lots of separate spirit hits, Flow State max hit 100+1.8x clears Tankbuster's 165, 15-round 0.65s gun with heavy bullets suits Mercurial Magnum on the 1. Public: tracklock Violet probuild Mystic Shot 47%, Tankbuster 68%, Improved Spirit 91%, Rapid Recharge 79%; Healbane/Enchanter's in tracklock situational.","Notes: Mystic Shot, Enchanter's Emblem and Healbane notes no longer restate the card; Enchanter's note no longer claims it upgrades to Witchmail (Witchmail has no component).","Threshold: Mystic Burst was bought at 4.0k souls with 40.8 spirit, so Living Ink hit for 64 vs the 80 it needs. Moved it to right after Surge of Power (imbued on the 1): at 6.4k souls Living Ink hits 35 + 0.7 x (57.1 + 28) = 95 vs 80 (100 with Extra Charge's +7 on charged abilities). Tankbuster was at 12.0k souls with Living Ink at 35 + 0.7 x 106.8 = 110 vs 165; moved it after Enchanter's Emblem, landing at 13.6k with the 1's T3 scaling: 35 + 1.1 x 122.9 = 170 vs 165. Recharging Rush at 9.6k: your gun does 38 base x 1.64 (4.8k gun, Opening Rounds, Rush) = 63 a bullet, 6 bullets in 3.5s = 376 vs 200 before Living Ink's empowered bullets. Spirit Burn at 38.4k: one Living Ink bullet alone 301, three = ~900 vs 500. Witchmail stays a rich-box late buy.","Round 10: Tankbuster moved from before Healbane/Spirit Lifesteal to after them, so the 4.8k health spike lands at 14.4k instead of 16.8k (Violet's only kit sustain is Still Life T1's short regen). Tracklock pro Violet (last 30 days, 78 games) buys Tankbuster late (68%) and takes greens early. Tankbuster still clears its 165 at 16.8k (Living Ink T3 scaling, more spirit than at 13.6k).","Round 11: tier 4 run fixed: was Mercurial Magnum → Boundless → Spirit Burn → Infuser from 27.2k. Rapid Recharge and Tankbuster moved between them, so it's Mercurial, Rapid Recharge, Boundless, Tankbuster, then Spirit Burn and Infuser at the end. No pivot: her damage is bullets from her 1 either way, so there's no second job.","Round 12: Lucky Shot out of the rich box. It procs on bullets, but most of Violet's damage is Living Ink, and the game blocks normal bullets while Ink is up (MODIFIER_STATE_ARTIST_PREVENT_BULLET_CREATION; Ink shots are ability projectiles), so Ink shots can't roll it. That leaves her plain gun: 30 a bullet every 0.65s, so 25% for +100% is about +25% on roughly 46 DPS before items, around +12 DPS for 6.4k. No public Violet list has it (tracklock pro, last 30 days, 78 games; tracklock build, 284 matches), and none has a T4 gun item to put there instead, so nothing replaces it.","Round 13: notes emptied per UPDATE 3 (only sells, swaps, slot locked, counters and verified tips kept); desc shortened to a style label (UPDATE 4).","Round 14: Superior Duration out of rich (T3; the rich box holds T4 only). Transcendent Cooldown now sells Healbane (Spirit Burn already does the anti-heal by then), so every T2 left in the last 12 has a named sell (Escalating Exposure keeps Kieran's Recharging Rush sell). Infuser note emptied and Mystic Regeneration's sell fixed (Infuser is an upgrade, it frees no slot). Bullet Resilience note now a plain condition (it adds resist, it doesn't stop shred). Divine Barrier added as Dispel Magic's pricier version. Sell notes now all read 'for this'.","Round 15: Knockdown note said Violet 'can't sketch' flyers, which nothing in Still Life supports (25m cast, it tethers any hero you look at); now the plain condition: flyers like Vindicta and Grey Talon keep getting away (Knockdown's stun lasts longer on airborne targets and pulls them down).","Round 17: Transcendent Cooldown out of rich (no Superior Cooldown in the build, so it isn't a pricier version of anything here). Healbane keeps a named sell: Divine Barrier now 'If you bought Dispel Magic, sell it for this. Otherwise sell Healbane.' (Spirit Burn covers anti-heal by then). Lane sell 'Sell it once you're out of slots.'.","Round 20: lane Mystic Regeneration → Extra Regen. Late list Escalating Exposure, Witchmail, Spiritual Overflow, Transcendent Cooldown, Refresher; core+late 75.2k.","Round 23: Spellslinger in at #2 of the late list (sells Mystic Shot): casting any ability refreshes Flow State and every Living Ink hit cuts all cooldowns, so ability and item casts keep its 6 stacks up. Transcendent Cooldown out (Living Ink hits already cut ability cooldowns 1.5-2.5s each and item cooldowns by half that). Overflow now sells Recharging Rush and Refresher sells Tankbuster, since Counters already sell Opening Rounds.","Round 25: ability order 3124113313442242 -> 1132141334422234 (worked out from the kit for this build's playstyle)."]},

 changes:["Round 13: new full spirit build (the existing one is the gun hybrid) — style source: lockbuilds official 'MAX SPIRIT VIOLET' (Oct 18: Extra Regen, Extra Spirit, Mystic Regen, Mystic Burst, Extra Charge, Rapid Recharge, Spirit Shielding, Radiant, Healing Booster; core Improved Spirit, Tankbuster, Superior Cooldown, Boundless, Escalating Exposure; optional Enchanter's; late Spirit Burn, Infuser, Transcendent Cooldown), plus Kieran's Surge of Power on her 1. Compress Cooldown, Mystic Vulnerability and Spirit Lifesteal are the components of that build's Superior Cooldown, Escalating Exposure and Infuser. Living Ink has 2 charges, so Extra Charge/Rapid Recharge work. Mystic Burst bought after Surge of Power (ink 35 + 0.7x at ~49 + 28 imbued ≈ 89 > 80); Tankbuster at 22.4k: ink T3 35 + 1.1x(100 + 28) ≈ 176 > 165. No hero-wide pick rates used. Order: mobalytics build-stats most likely path 3124313311422442 (that site's Violet data is mostly spirit: its top items are Extra Charge, Rapid Recharge, Improved Spirit), Still Life maxed first; lockbuilds says her main damage is 3 and 1.","Round 14: spirit no longer overshoots: Mystic Burst and Radiant Regeneration moved after the health spike (was spirit 8k at 8.8k souls with 800 health; now spirit 4.8k at 5.6k, health 4.8k at 9.6k, then spirit). Mystic Burst still clears 80 at its new buy point. Mystic Reverb sold Mystic Vulnerability, which has already turned into Escalating Exposure by then: now sells Healing Booster. Counters sold Mystic Vulnerability too (it becomes Escalating Exposure): now Spirit Shielding. Witchmail added to rich as the pricier Enchanter's Emblem so that T2 has a named sell; Divine Barrier added as Dispel Magic's pricier version.","Round 15: Counters desc was 121 characters (game limit 112): now 'Get after Grit' (6.4k, the first green after the spirit spike; counters are green items themselves). Knockdown note no longer claims she 'can't sketch' flyers.","Round 17: Divine Barrier note 'If you bought Dispel Magic, sell it for this.' (Dispel is in Counters; one wording across builds).","Round 20: late list Mystic Reverb, Witchmail, Spiritual Overflow, Refresher; core+late 75.2k.","Round 23: Witchmail out of the late list (its cooldown cuts overlap Living Ink, which already cuts every cooldown per hero hit), Diviner's Kevlar in at #2 (1000 barrier and +40 spirit for 20s on each Abstract Landscape, which Ink hits bring back sooner; second health step for a low-health build). Witchmail also sold Spirit Shielding, which Counters already sell; Overflow now sells Tankbuster.","Round 25: ability order 3124313311422442 -> 1132341312244324 (worked out from the kit for this build's playstyle).","Cost pass: Improved Spirit added in Mid so Boundless Spirit costs 1.6k less."]},

 changes:["Echo Shard on the cube is now core at 16.8k (first T4, right after the health spike and Trophy) per Kieran's playstyle; THE BASTARD support build on lockbuilds takes it in lane, SleepiJack's and Kieran's Concerns of the Deep build both list it. It replaces Mystic Reverb in core (Reverb moves to rich).","Sprint Boots → Trophy Collector added (800 + 800) replacing Torment Pulse (3.2k, a tank item that doesn't fit a support): pro Viscous buys Sprint Boots 53% / Trophy 48% early, deadlocked.gg core has both, Kieran's played build has them.","Grit is now core in Early (800) so Guardian Ward is an 800 upgrade at 19.2k instead of a fresh T2 (was 17.6k): Grit is core in Kieran's Concerns build and the lane items no longer have to be sold for it. Health 4.8k lands at 9.6k on Rescue Beam (Healing Rite + Grit + Sprint Boots + Rescue Beam), 6.4k on Trophy + Enchanter's, 8k on Guardian Ward.","Spirit 4.8k now at 6.4k (was 5.6k) because Grit sits in Early. Tankbuster waits until Improved Spirit and Spirit Snatch (24k) so Splatter's first hit is big enough.","Core 43.2k (was 44.8k), 12 slots. Rich: Boundless (upgrade), Witchmail (sell Enchanter's), Mystic Reverb (sell Trophy Collector).","Ability order: mobalytics build-stats grid maxes Splatter first and Kieran's in-game Cubin' support build goes 1234, Splatter 5-6, Punch, Cube, ult 14-16; for support with early Echo Shard on cube: Splatter T1 5, Punch T1 charge at 6 for Extra Charge, Cube maxed by 10 before Echo Shard, Punch T3 heavy melee by 12 for Crushing Fists, ult 14-16 as both.","Order: 1123134332224441 (data-first redo, see a7/order_viscous.json).","Threshold: checked on the new order, nothing moved. Mystic Burst at 1.6k (11 spirit, Splatter T1): Splatter 55+36+0.7×11 = 99 vs 80. Tankbuster at 27.2k (130 spirit): Splatter 182, Goo Ball T2 110+70+130 = 310 vs 165. Mystic Reverb (rich, on Splatter): 182+ vs 100. Extra Charge at 4k / Rapid Recharge: Puddle Punch has charges and is unlocked (T1) at 3.2k.","Round 9: melee dropped (Melee Charge → Crushing Fists, Spirit Strike → Spirit Snatch, Melee Lifesteal). Support builds of the same style don't core it: Gooey Louie Thanos (lockbuilds 719577, Sep 21), Time Waster (714738, Sep 17) have no melee; SleepiJack Soft Support (738901, Oct 10) and THE BASTARD (389626, Oct 1) only list it as optional luxuries.","Round 9: lane is now Healing Rite (ally cast, 30m, 300 regen), Extra Charge (2 punches), Compress Cooldown on Cube (-18%: BASTARD lane, Gooey core) and Healing Booster (+20% to cube and Healing Rite heals: SleepiJack lane core), then Improved Spirit. Mystic Burst moves out of lane to the Mid box (7.2k, 4.8k spirit there; Splatter 91+0.7x69 = 139 vs 80).","Round 9: Mystic Expansion moved from lane (4.8k) to Mid (13.6k): +20% cube range (20m → 24m) only matters in fights; pro late 74% (tracklock, last 30 days).","Round 9: Echo Shard on the cube moved from 16.8k to 36.8k (Late): Gooey Louie buys it 5th in 'The Technology', Time Waster in Mid 15-25 min after Compress Cooldown; cooldown is 30s + the cube's (Jul 28).","Round 9: Magic Carpet in core (Kieran's idea, Gooey Louie core Sep 21): +14 spirit, +15% duration, +125 health, 12s flying escape; cube a mate, fly off, Rescue Beam (35m, pull) them to you. Spirit Snatch/Crushing Fists slots went to Healing Booster and Magic Carpet.","Round 9: Tankbuster at 17.6k: Splatter T1 91+0.7x110 = 168 vs 165. Spikes: spirit 4.8k at 7.2k, health 4.8k at 9.6k. Core 41.6k, 12 slots.","Round 11: added 'Another support on your team?' pivot: damage Viscous (Mystic Vulnerability → Escalating Exposure, Enduring Speed, Mystic Reverb on Splatter, Boundless) in place of Healing Booster, Trophy Collector, Magic Carpet, Echo Shard and Divine Barrier. Splatter T1 91 + 0.7x spirit clears Reverb's 100. No early tier 4 run.","Round 12: removed the 'Another support on your team?' role pivot (role pivots become separate builds). That also clears the duplicate Mystic Reverb and Boundless Spirit (rich box and pivot).","Round 13: notes emptied per UPDATE 3 (only sells, swaps, slot locked, counters and verified tips kept); desc shortened to a style label (UPDATE 4).","Round 14: name shortened to 28 chars (Jelly Bodyguard was 34, limit 32); order now Kieran's played support build Concerns of the Deep 'I'm Cubin'' (1234113332221444, Splatter T3 before the ult); Tankbuster moved from 17.6k to 28k (Splatter was 168 vs 165 only with Enchanter's 15 spirit, now 321); Extra Regen lane note emptied (it becomes core Healing Booster, so 'sell it' was wrong); Metal Skin note no longer claims it saves the cubed mate; Counterspell note drops 'long channel' (0.8s parry); Spirit Resilience note made concrete; Divine Barrier given a true note (its empty note showed the site default 'Same job as Counterspell'); Witchmail now sells Rapid Recharge (Enchanter's was already the counters sell); duplicate Enchanter's sell note removed.","Round 15: Counters caption was 118 chars (game limit 112): now 'Get after Grit' (12k, after the 9.6k health spike), still sells Enchanter's Emblem (111). Divine Barrier note emptied (it only existed to cover a site default that's gone; Guardian Ward, the same kind of item, has none).","Round 17: Lane Extra Regen gets 'Sell it once you're out of slots.'. Rich Boundless Spirit note 'Upgrade of Improved Spirit.'. Divine Barrier note left empty (site no longer fills empty notes).","Round 20: Spirit Burn added to the late list; core+late 73.6k. Mystic Expansion on the cube moved from Mid (13.6k) to Late (after Tankbuster, ~27k) for when you roam; Rapid Recharge moved up into its Mid slot (more Puddle Punches in fights now).","Round 23: Healing Tempo moved from Slot locked to the top of the late list: the cube heal (40 + 0.3x spirit per second), Healing Rite and Rescue Beam on a teammate give them +35% fire rate and move speed for 7s. Dispel Magic out of Counters: The Cube T3 purges debuffs and you can cube yourself.","Round 25: ability order 1234113332221444 -> 1123242123434134 (worked out from the kit for this build's playstyle).","Slot locked: Healing Tempo moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: Mystic Expansion moved from Late to Mid (cube imbue was idle for 28k souls); Greater Expansion upgrades it."]},

 changes:["Round 13: new damage build (the existing one is support) — style sources: tracklock pro Viscous last 30 days, an all-damage item set (no support items in any phase) (27 games: Mystic Burst 93%, HV 74%, Mystic Shot 67%, Express Shot 63%, Tankbuster 96%, Spirit Snatch 81%, Spirit Strike 70%, Warp Stone 48%, Extra Charge 41%, Mystic Expansion 74%, Superior Cooldown 74%, Greater Expansion 70%, Compress Cooldown 44%, Spirit Burn 37%, Boundless 26%), deadlocklabs.gg meta consensus 'MB build' (Mystic Burst, Spirit Strike, Mystic Expansion, Extra Spirit, Improved Spirit, Compress/Superior Cooldown, Greater Expansion, Spirit Resilience 7/8), lockbuilds 'Splatter Punch Viscous', 'Spirit Ballin 4.1' (12,401), 'Fistcous' (10,889). Splatter 55 + 0.7x, T1 +36, so Mystic Burst clears 80 from point 2. Puddle Punch has a charge (1, +1 at T1), so Extra Charge/Rapid Recharge work. Order: seemeta most popular (54.2%, 1,298 matches) 1123141322233444, Splatter maxed by point 7. Notes empty per UPDATE 3 except the Warp Stone play tip, counters, sells and slot locked.","Round 14: renamed (old name 33 chars and a copy of a lockbuilds title); Spirit Resilience out of core (its empty note showed the site default 'Haze, Viper...', and it's a counter) and into Counters; Melee Lifesteal -> Lifestrike in its place as the health spike (tracklock Viscous core has Melee Lifesteal; lockbuilds Splatter Punch and Fistcous run Lifestrike), health 4.8k still at 12k with 9 slots; Warp Stone moved to Late and Extra Charge bought right before Rapid Recharge so slot 10 isn't needed before ~25k; counters caption now 'after Lifestrike'; Mystic Reverb sells Rapid Recharge (Mystic Shot is the counters sell); Counterspell note fixed.","Round 15: Divine Barrier added to the rich box with 'If you bought Dispel Magic, sell it for this.' (Dispel Magic is in Counters; Kieran's layout rule).","Round 19: made it the real public Splatter-punch style (Splatter Punch Viscous 691940, Fistcous 275231): added Melee Charge → Crushing Fists (both builds' punch core) and Extra Health → Fortitude (Splatter Punch greens); cut Mystic Shot (Viscous fires every 0.21s, so one bonus bullet every 8s adds little), Express Shot, High-Velocity Rounds and Warp Stone (not in the style's core). Mystic Reverb on Splatter moved from rich to core.","Round 20: late list Escalating Exposure, Witchmail, Refresher; core+late 72k.","Round 23: Puddle Punch damage is 20 + 0.6x light melee damage, and T3 makes it heavy melee (0.6x heavy + 40), so Melee Charge and Crushing Fists also raise the punch; Melee Charge says so. Dispel Magic out of Counters (The Cube T3 purges debuffs on yourself), so its Divine Barrier upgrade is out of the late list.","Round 25: ability order 1123141322233444 -> 1132343131442242 (worked out from the kit for this build's playstyle).","Cost pass: Improved Spirit moved to the start of Mid (was a late buy of a cheap upgrade)."]},

 changes:["Monster Rounds added first for the early-farm style (pro 89%, Strenngth's build Kieran plays starts with it) and sold when Spirit Lifesteal comes in. Tesla still lands the gun spike at 6.4k souls (gun 5.6k).","Quicksilver Reload and Mercurial Magnum moved from Full Auto to Card Trick, as in Strenngth's build: Quicksilver charges up every 18s, and Card Trick is thrown constantly while Full Auto's 45s cooldown wasted most charges. Spirit 4.8k still on Surge of Power, now at 10.4k (was 9.6k) because Monster Rounds sits in front.","Greens rebuilt right after Ricochet (16.8k): Spirit Lifesteal, Bullet Lifesteal, Sprint Boots, Enduring Speed = 4.8k health at 21.6k. Enduring Speed is core in Strenngth's build (kiting), and Bullet Lifesteal makes Leech a 3.2k upgrade instead of 4.8k. Enchanter's Emblem dropped; Battle Vest stays as the 5th green.","Berserker dropped (Wraith kites, it never stacks) for Spirit Shredder → Spirit Rend: Strenngth's core ('rend on wraith is meta'), and Tesla, Magnum, Full Auto and cards are all spirit damage so the shred and 10% spirit lifesteal apply to everything. Spirit Shredder bought mid (26.4k) so it isn't a fresh T2 late.","Core 12 slots, 48.8k (was 48k). Late is Magnum, Leech, Toxic, Capacitor, Spirit Rend, Silencer; no two fresh 6.4k items back to back.","Ability order: Mobalytics Wraith grid (Card Trick T1/T2 at 5-6, Full Auto T1 at 7, Card Trick T3 at 8, Full Auto T2/T3 at 9-11, Project Mind 11-13, Telekinesis last at 54-77%) matches Kieran's old order except that Full Auto T3 (unlimited ammo for the Ricochet/Tesla gun plan) now comes right after Card Trick T3; ult upgrades last like every public order.","Item fit: Battle Vest → Reactive Barrier. Wraith stands still to shoot (Full Auto, Telekinesis channel) and dies to stuns; Reactive Barrier is a 325 (+1.8x spirit) barrier on stun/silence. Battle Vest isn't in any public Wraith list checked (not in lockbuilds' top 30 items, tracklock core/situational, or Strenngth's build Kieran plays); Strenngth's build calls Reactive Barrier the usual survival pick. Same 1.6k green slot, health spike unchanged. Lucky Shot sell note updated.","Order: 1132134332122444 (data-first redo, see a7/order_wraith.json).","Round 8: Frenzy note fixed. Since Jul 28 its 10% bullet lifesteal is always on (game files 6795: BulletLifestealPercent 10, plus 40% fire rate and 4m speed below 50% health). Mercurial Magnum kept on Card Trick after the Sep 16 nerf (20% +0.38): tracklock.gg Wraith pro builds, last 30 days to Oct 19 (all post-Sep 16), have it in 51% of games, Quicksilver Reload 100%, Tesla 66%.","Round 11: 'Lost lane?' box (empty): Ricochet right after Tesla Bullets, before Quicksilver Reload and Surge of Power, so you farm faster. No early tier 4 run.","Round 12: Toxic Bullets → Inhibitor (Kieran). Both cut healing, Inhibitor more (-40% vs -35%), and Inhibitor also cuts the target's damage by 30% for 5s, +150 health and +10% weapon damage. Toxic's bleed is 1.9% max health a second for 4s, only after it builds up. Wraith stands still in Full Auto, so cutting what they do back to her is the bigger gain. Same slot (37.6k, after Leech): it costs 3.2k more and moves 3.2k from gun to green. Walked: gun 4.8k @6.4k, spirit @10.4k, health @21.6k, core 52k.","Round 13: notes emptied per UPDATE 3 (only sells, swaps, slot locked, counters and verified tips kept); desc shortened to a style label (UPDATE 4).","Round 14: renamed Card Shark -> AoE Gun (style wasn't in the name); Capacitor -> Spiritual Overflow (lockbuilds Wraith 25.9% pick/58.9% WR vs Capacitor 23.8%/53.6%, tracklock core, HYPER CARRY core, Strenngth core 'wraith's best item'); Bullet Resist Shredder cut to keep 12 slots (in no current same-style list); Lucky Shot (no Wraith source) -> Boundless Spirit and Frenzy -> Spellslinger in rich (Strenngth: 'sell swift striker for this'); Extra Regen note named Battle Vest, which isn't in the build; Unstoppable note said stuns cancel Full Auto (a buff, not a channel); Dispel/Counterspell/Spirit Resilience notes fixed; duplicate sell notes removed. Walked: gun 4.8k @6.4k, spirit @10.4k, health @21.6k, core 53.6k.","Round 15: Counters caption was 119 chars (game limit 112, no shorter pair fits with Reactive Barrier): now 'Get after Ricochet ... Sell Swift Striker for it.' (110) and Spellslinger sells Reactive Barrier instead, so each item is sold once; Divine Barrier added to the rich box with 'If you bought Dispel Magic, sell it for this.' (Dispel Magic is in Counters; Kieran's layout rule).","Round 20: Tesla Bullets now upgrades to Capacitor and Reactive Barrier to Indomitable in the late list (Reactive Barrier was being sold); core+late 74.4k.","Round 23: Escalating Exposure in at #2 of the late list (sells Spirit Rend, whose spirit-resist cut it replaces), Boundless Spirit out. Wraith's spirit damage is many small hits (cards 85 + 0.95x every 0.6s, Tesla chains, Mercurial and Full Auto spirit bullets), so a stacking +54% spirit amp beats +30 spirit. Spellslinger now sells Enduring Speed, since Counters already sell Swift Striker.","Round 25: ability order 1132134332122444 -> 1132341322314424 (worked out from the kit for this build's playstyle).","Cost pass: removed the Lost lane reorder box (put a lone 6.4k buy at 12.8k and delayed the spirit 4.8k); renamed."]},

 changes:["Rebuilt from the FatherTran build Kieran plays: grapple phase is Melee Lifesteal, Extra Regen, Spirit Strike, Stalker, Improved Spirit, Spirit Snatch, Recharging Rush (pro: Stalker 96%, Melee Lifesteal 90%, Spirit Strike 52%, Recharging Rush 69%). Extra Charge/Rapid Recharge/Compress Cooldown/Echo Shard/Phantom Strike/Arcane Surge all gone. 4.8k spirit lands on Spirit Snatch at 8k.","Mystic Shot cut (FatherTran has it): it was only there to land a 4.8k gun spike that a Power Slash build never uses, and it would be a dead T2 sold later. Recharging Rush stays (Kieran's list) and sells for Refresher.","Health: Extra Regen → Healing Booster (Kieran's list, pro 67%), Spirit Lifesteal, Extra Health = 4.8k at 12.8k, Lifestrike (pro 85%) takes it to 7.2k at 21.6k so Melee Lifesteal isn't a dead 800. Extra Health → Colossus in the rich box (FatherTran and LYSTIC both run Colossus late).","1-build in order: Torment Pulse 16k, Mystic Burst → Tankbuster 19.2k (Power Slash full charge is 145 + 1.85x spirit, 295 + 2.35x at T3, so it clears 165 from mid game), Mystic Reverb on Power Slash 28k, Boundless 32.8k, Spirit Burn 39.2k (a T3 slash at ~150 spirit is ~650, over the 500 it needs), Infuser 44k instead of Spiritual Overflow because Overflow is a gun-slot item that would drop the health spike and needs you shooting heroes to charge.","Core 12 slots, 44k (was 54.4k). Ability order is FatherTran's (Power Slash maxed by point 7, grapple by 10). Lane box is Healing Rite since Extra Regen is now core.","Ability order: Grapple style: Flying Slash maxed first (T1 -18s, T2 +35 spirit, T3 2nd charge) like mobalytics (94-98% at 5-7) and Kieran's in-game In Your Face order (3221242333444111); Crimson T1/T2 (melee amp, 6% heal on hero hit) for the brawl phase, ult T1 at 10, then Power Slash maxed 11-13 for the late Tankbuster/Reverb/Spirit Burn transition (Spirit Burn needs T3 slash). Current FatherTran order maxed Power Slash by 7, which fights the grapple-early plan.","Item fit: Infuser → Colossus (Colossus moved up from the rich box; Spiritual Overflow takes its rich spot). Yamato's spirit damage comes in a few big hits (Power Slash 12s cd, Crimson Slash 16s cd), not many separate hits over 7s, and Infuser isn't in any public Yamato list checked (lockbuilds top 30 items, tracklock core/situational, FatherTran's build Kieran plays). Colossus fits an in-your-face grappler: 14m slow and -22% dash speed keeps them in slash range, +30% melee damage on the Lifestrike/Spirit Snatch heavies, 35% resists for 7s; tracklock Yamato late 25%, in tracklock defensives/actives and FatherTran's situational box. Built from the core Extra Health, so the Late slot stays a pure upgrade (+5.6k, total 44.8k); health now ends at 12.8k. Spirit Lifesteal note now points at Spiritual Overflow (FatherTran's upgrade of it).","Order: 3221242333444111 (data-first redo, see a7/order_yamato.json).","Threshold: checked on the new order, nothing moved. Recharging Rush at 9.6k (level 16, Flying Slash T3 charges in): bullets only, shotgun 5 x (5.31 + 15 x 0.154) x 1.1 = 42 per shot, 9 shots in 3.5s = 377 point blank (~225 at 60% pellets) vs 200, so it stays. Mystic Burst at 16.8k (100 spirit): Power Slash full charge 145+1.85×100 = 330, Crimson Slash T3 55+0.97×100 = 152 vs 80. Tankbuster at 19.2k (109 spirit): Power Slash full charge 347 vs 165 (Crimson Slash 161 doesn't, Power Slash does). Mystic Reverb at 28k (121 spirit, on Power Slash): 369 vs 100. Spirit Burn at 39.2k (171 spirit): Power Slash 461 + Crimson Slash 221 = 682 vs 500.","Round 9: Lifestrike moved from 21.6k to 12.8k, right after Healing Booster, and is now the 4.8k health spike (Melee Lifesteal → Lifestrike 3.2k + Healing Booster 1.6k). Melee Lifesteal sat as an 800 for 13 minutes before; tracklock.gg pro Yamato (last 30 days to Oct 19, 503 games) buys Lifestrike mid in 87% of games. Spirit Lifesteal and Extra Health move one spot later; same items, same total.","Round 9: Worth a try box: Rapid Recharge on Flying Slash (T3 gives the grapple an extra charge; Rapid Recharge adds 2 more, 30% faster charge cooldown and +14 spirit on charged abilities; same idea as Kieran's Rapid Recharge Haze).","Round 10: Restorative Shot added first in lane (800; heals 50 off a hero every 6s, +6% weapon damage). Tracklock pro Yamato (last 30 days to Oct 19, 503 games) buys it early in 97% of games, the joint most-bought item with Stalker, and Yamato's gun fires a spread up close after every grapple (RULES: good on spread guns). Sold for Spirit Burn, the 13th core item. Spirit 4.8k moves 8k → 8.8k, health 12.8k → 13.6k.","Round 10: rich-box notes for Spiritual Overflow and Healing Tempo now say what they upgrade and what they do (were 'Expensive late upgrade to Spirit Lifesteal.' and 'Upgrade.').","Round 11: Mystic Reverb moved before Tankbuster, so the tier 4s no longer run Reverb → Boundless → Spirit Burn → Colossus from 28.8k; Tankbuster sits between, and the late run starts after 30k. No pivot: her kit has one job, grapple in and kill one target.","Round 12: removed the Worth a try box (Rapid Recharge instead of Recharging Rush).","Round 13: notes emptied per UPDATE 3 (only sells, swaps, slot locked, counters and verified tips kept); desc shortened to a style label (UPDATE 4).","Round 14: renamed Sushi Chef -> Spirit Slash (style wasn't in the name), desc 'Spirit Yamato'; order back to FatherTran's (the build Kieran plays and this build's item source) 3112411222344343, so Power Slash, which carries Mystic Reverb, Tankbuster and Spirit Burn, is maxed first instead of last; Healing Booster moved before Lifestrike (health 4.8k at 12k) and Recharging Rush after it (Flying Slash only has charges at T3, reached at 13.6k with this order); Healing Tempo moved from rich to Slot locked (Kieran's rule); Reactive Barrier note no longer claims hooks; Counterspell/Spirit Resilience notes fixed; duplicate sell notes removed.","Round 15: name back to Kieran's own choice 'Rizuhble's Sushi Chef Yamato'; Divine Barrier added to the rich box with 'If you bought Dispel Magic, sell it for this.' (Dispel Magic is in Counters).","Round 17: Dispel Magic note 'Hexes and slows stop you getting in.' (Yamato has no grapple). Rich Spiritual Overflow note 'Upgrade of Spirit Lifesteal.'.","Round 20: late list Witchmail, Spiritual Overflow, Diviner's Kevlar, Refresher (luxury last); core+late 74.4k.","Round 23: kit re-read, no item change (see log).","Round 25: ability order 3112411222344343 -> 1132242332113444 (worked out from the kit for this build's playstyle).","Cost pass: Boundless Spirit and Mystic Reverb swapped so Reverb is bought with more spirit power behind it."]},

 changes:["Round 13: new brawler build (the existing Sushi Chef is grapple into Power Slash spirit) — style sources: tracklock pro Yamato last 30 days, a gun/melee item set (no Power Slash spirit items besides Spirit Snatch) (503 games, 61.4% WR: Restorative Shot 97%, Stalker 97%, Melee Lifesteal 92%, Radiant 72%, Close Quarters 70%, Mystic Regen 64%; mid Lifestrike 87%, Bullet Resist Shredder 86%, Hunter's Aura 75%, Recharging Rush 70%, Healing Booster 67%, Extra Regen 54%; late Express Shot 56%, Berserker 47%, Melee Charge 45%, HV 37%, Crushing Fists 27%, Colossus 25%, Refresher 19%), lockbuilds 'SwoleBenji Melee Tank Brawler', 'wander gunmato'. Flying Slash gets 2 charges at T3 (point 7 in this order), so Recharging Rush has a charge to refill. Restorative Shot and Close Quarters are bought first and sold for Express Shot and Crushing Fists. Order: seemeta most popular (63.4%, 8,182 matches) 3221242333444111, Power Slash upgraded last, which suits a build that doesn't use it.","Round 14: desc 'Gun and melee Yamato'; Extra Health lane note emptied (it becomes core Colossus, so 'sell it' was wrong); Refresher now sells Recharging Rush (same job, every charge back) instead of Colossus; Reactive Barrier note no longer claims hooks; Counterspell note fixed; duplicate sell notes removed. Item set re-sourced from mobalytics Yamato build-stats Flying-Slash-maxed-first view (23.5K matches).","Round 15: Divine Barrier added to the rich box with 'If you bought Dispel Magic, sell it for this.' (Dispel Magic is in Counters; Kieran's layout rule).","Round 17: Dispel Magic note 'Hexes and slows stop you getting in.' (Yamato has no grapple). Desc 'Brawler Yamato' to match the name. Lane Extra Health gets 'Sell it once you're out of slots.'.","Round 20: Mystic Regeneration → Radiant Regeneration replaced by Grit → Reactive Barrier (Yamato isn't a many-cast hero); counter Reactive Barrier → Unstoppable. Late list Indomitable, Witchmail, Leech, Refresher, Cheat Death; core+late 73.6k.","Round 23: kit re-read, no item change (see log).","Round 25: ability order 3221242333444111 -> 3321243324412411 (worked out from the kit for this build's playstyle).","Cost pass: Melee Charge moved to the start of Mid (was bought after 9.6k of gun items); Leech now sells Hunter's Aura instead of Bullet Resist Shredder."]},

 changes:["Dispel Magic back in core at 15.2k (was only a counter): 95% of pro Minas, Kieran's played build says you need it, and his in-game base had it in Mid. Spirit Burn back in core at 32.8k (71% pro late, Kieran mid core); it had slipped into counters.","Spirit 4.8k at 4.8k and health 4.8k at 9.6k unchanged (Extra Spirit, Mystic Burst, Quicksilver, Mystic Expansion, Improved Spirit; Extra Stamina, Grit, Stamina Mastery, Reactive Barrier).","Trimmed from 54.4k to 46.4k: Escalating Exposure, Focus Lens and Mystic Reverb out of core (Mystic Vulnerability cut; Focus Lens and Reverb now rich, Spirit Sap stays core and upgrades there). Superior Cooldown is now an upgrade of Compress Cooldown on Rake instead of a fresh T3.","Kept Kieran's fire-rate pair (Rapid Rounds → Swift Striker), Spirit Lifesteal → Infuser (pop with ult) and Mercurial Magnum on Rake as the last buy. Toxic Bullets added to counters (Kieran: tank shredder with Swift Striker); lane box Mystic Regeneration → Extra Health.","Ability order: Kieran's played jackalacken order, identical to the mobalytics grid (Rake 93/98% at 5-6, Love Bites 7-8, Rake T3 9, Retreat 10-12, ult last): Rake maxed first for Quicksilver/Compress/Expansion on Rake; only change from the current build is the ult unlocked at 4 (99% public) instead of 6.","Item fit: Extra Regen out of the lane box (Extra Health stays). Mina heals off Rake and the bats, and Extra Regen isn't in any public Mina list checked (lockbuilds top 30 items, tracklock core/situational, jackalacken's build Kieran plays, his own in-game Mina), while Extra Health is (lockbuilds 29.8% pick, jackalacken early). No other cheap survival item with public Mina support to put in its place. Every other item checked: Mercurial Magnum kept (lockbuilds 10.1% pick, 52.1% WR, avg 37 min; Rake 16s cd feeds it and +22% fire rate on a 12-round 0.252s gun builds Love Bites faster).","Order: 3112134312223444 (data-first redo, see a7/order_mina.json).","Threshold: checked on the new order, nothing moved. Mystic Burst at 1.6k (25 spirit, Rake T1): Rake 60+60+1.0×25 = 145 vs 80. Tankbuster at 12k (83 spirit, Rake T3): Rake 203 plus missing-health damage vs 165. Spirit Burn at 32.8k (135 spirit): Rake 255 + Love Bites T3 bite 90+1.85×135 = 340 = 595 vs 500. Mystic Reverb (rich, on Rake): 255+ vs 100.","Round 10: Indomitable rich note said only 'Upgrade.'; now names Reactive Barrier (its component) and what it does. Tracklock pro Mina (last 30 days, 306 games) late 17%. Nothing else changed: the build matches pro Mina's top items phase by phase.","Round 13: notes emptied per UPDATE 3 (only sells, swaps, slot locked, counters and verified tips kept); desc shortened to a style label (UPDATE 4).","Round 14: Dispel Magic given a note (its empty note showed the site default naming Yamato grapple); counters now sell Spirit Sap so Swift Striker is only Mystic Reverb's sell; Spirit Resilience and Counterspell notes fixed; lane note trimmed to the sell; duplicate Swift Striker sell note removed.","Round 15: Counters caption was 115 chars (game limit 112): now 'Get after Tankbuster' (12k, after the 9.6k health spike), still sells Spirit Sap (109). Divine Barrier added to the rich box with 'Sell Dispel Magic for this.' (Dispel Magic is core; Kieran's layout rule); Dispel Magic note emptied (it only existed to cover a site default that's gone).","Round 17: Rich Indomitable note 'Upgrade of Reactive Barrier.' like the same upgrade elsewhere. Dispel Magic note left empty (the site no longer fills empty notes).","Round 19: style check, no change. Spirit burst Mina is the only post-patch public style (lockbuilds Max Burst official Oct 19, Mayonese Oct 18, LordNM, FaxFox Oct 19, Kijua; seemeta Oct 6-20).","Round 20: late list to ~85k: Focus Lens, Escalating Exposure (Max Burst official late core), Transcendent Cooldown, Indomitable, Mystic Reverb, Divine Barrier, Cheat Death (both LB Mina builds' super-late pick). Slot locked merged in.","Round 23: Lightning Scroll added to the late list: every bat is ult damage, so everyone the swarm hits gets the slow then the stun. Worth testing.","Round 25: order 3112134312223444 → 3112134312232444: Love Bites T3 (bite every 5s instead of 10s) before Sanguine Retreat T3.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: Tankbuster moved after Boundless Spirit (was the earliest in any Mina build at 12k).","Renamed."]},

 changes:["No mine/vindicta.txt exists, so the style check is against the public pure-gun builds (lockbuilds 'turbo absolute gun vindicta' and 'Witch With a Sniper', tracklock core, pro list). Early/mid kept: HV + Long Range → Sharpshooter (pro 63%), Extra Charge → Rapid Recharge (95%/87%), Quicksilver → Mercurial Magnum on Flight, Swift Striker/Burst Fire, Titanic, Enduring Speed (57%).","Crippling Headshot cut from core (6.4k fresh T4 at 51.2k, in none of the pure-gun builds) and Toxic Bullets swapped for Duration Extender → Superior Duration on Flight (tracklock core, pro 28% late): Flight is 23s at T2, Superior Duration makes it ~29s of air time with Magnum bullets. Duration Extender bought mid (19.2k) so it isn't a fresh T2 late.","Blood Tribute added late (41.6k): 'Witch With a Sniper' and turbo both run it next to Leech, and Leech's 28% bullet lifesteal out-heals the 50/s drain while you shoot. It's the Lucky Shot sell in rich.","Counterspell moved to the top of the counters (pro 71% mid, 'buy it every game' in the Witch build).","Core 12 slots, 48k (was 51.2k). Spikes unchanged: gun 4.8k at 4.8k souls, health at 12.8k, spirit at 14.4k; Leech lands 8k health at 30.4k.","Ability order: Gun style: Flight T1/T2 at 5-6 (+50% ammo flying, +10s for Duration Extender/Quicksilver/Mercurial on Flight), Assassinate T1/T2 at 7-8 like mobalytics (80/64%) for Extra Charge/Rapid Recharge, Flight T3 at 10, ult T3 (+4% weapon damage per kill) at 11, Crow (T3 bullet-resist shred) 12-14, Stake upgrades last; seemeta most-popular (60.9%) also takes the ult early and Crow/Flight upgrades late.","Item fit: Glass Cannon → Lucky Shot (moved up from the rich box). Glass Cannon isn't in any public Vindicta list checked (tracklock core/situational/probuild, lockbuilds top 30 items, turbo absolute gun and Ace's Vindicta Carry builds) and costs 13% max health on a hero who picks from the air; Lucky Shot is in tracklock late situational and both public carry builds, same 6.4k T4 gun slot, +30% mag on her 19-round gun (0.231s per shot, 2.9s reload).","Item fit: Hollow Point → Counterspell (moved up from Counters). Hollow Point isn't in any public Vindicta list checked. Counterspell is the most bought mid item on pro Vindictas (tracklock probuild mid 71%; lockbuilds 28% pick, avg 21 min) and in both public carry builds; Flight makes her an easy target for stuns and ults. Same 3.2k at the same timing, total unchanged at 48k; gun goes 27.2k→24k.","Item fit: rich box removed. Frenzy isn't in any public Vindicta list checked and its lifesteal/fire rate only kicks in under 50% health, which a flying picker avoids; Lucky Shot moved into the core. Lane box Extra Regen → Healing Rite: Extra Regen isn't in any public Vindicta list; Healing Rite is the lane option in Ace's Vindicta Carry, and she pokes from range so she can back off to use it.","Item fit: Leech kept (lockbuilds 5,067 bought, 54.9% WR; tracklock early situational Bullet Lifesteal) since her Flight bullets and Assassinate do spirit damage; note both public carry builds go Bullet Lifesteal → Vampiric Burst and Spiritual Overflow instead, which is an option if Kieran prefers it.","Order: 3221144411332243 (data-first redo, see a7/order_vindicta.json).","Threshold: checked on the new order, nothing moved. Extra Charge (5.6k) and Rapid Recharge (9.6k) work on Assassinate (2 charges), unlocked at 3.2k and T2 by Extra Charge. Flight imbues bought with Flight T1+.","Round 8: (current patch = Oct 16 2026 Violet release; last change to Vindicta's kit Aug 12 2026 (Stake T1 65→45), last change to items here Sep 16 2026 (Mercurial Magnum base bullet bonus 25%→20%, scaling 0.49→0.38; Leech 25→28%); data used is from after Sep 16: tracklock items page, lockbuilds 'Current Patch', builds updated Oct 1-14). 1) Counterspell out of the core into a 'They have Knockdown?' box next to Early (Sexy Feet Oct 14: 'take an anti-CC item (Counterspell or Dispel) early'; Ace's Vindicta Carry Oct 3: 'Pick 1 Vitality: Counterspell/Dispel'). Its core slot: Rapid Rounds now upgrades to Swift Striker in mid (+20% fire rate; tracklock 72.8% usage, 51.0% WR; Ace's Carry runs Rapid Rounds→Swift Striker and Burst Fire), and Burst Fire is bought outright as the first late item (tracklock 74.7%, 51.9% WR). Core 12 slots, 48k → 46.4k. 2) Quicksilver Reload/Mercurial Magnum moved from Flight to Crow Familiar: charge-up is 18s/14s and isn't cut by cooldown reduction, Flight's cooldown is 42s but Crow's is 16s from T2 (Crow is T2 before Quicksilver is bought), so the reload + fire rate (+10%/+22% for 12s) and Mercurial's bullet bonus come every ~16s instead of every 42s, and Crow's bullet-resist shred lands with it. No current-patch source shows imbue targets (lockbuilds/tracklock/deadlocklabs/deadlocked list items only); only older pro data (deadfrag, aidan ~Jan 2026) shows Mercurial on Crow. Duration Extender stays on Flight (+22% of 23s = +5s; Superior Duration is no longer an imbue, +28% to everything); still bought by a minority (tracklock 15.2%/18.5% usage, lockbuilds 10.1%/13.0%; Superior Duration core in Sexy Feet Oct 14). 3) Blood Tribute kept over Fury Trance: Blood Tribute +35% fire rate all the time (50/s drain), Fury Trance +32% for 6.5s every 18s and silences you and blocks stamina while active, so no Assassinate/Crow/Stake and no Spellslinger stacks; tracklock Blood Tribute 8.9% usage 55.5% WR vs Fury Trance 1.6% 50.7%; Blood Tribute is in turbo gun (Oct 11) and Ace's Carry (Oct 3) cores, Fury Trance only in Ace's survival box. 4) Stamina Mastery not added: +2 stamina, +18% stamina recovery, +23% air dash distance, extra air jump/dash, no damage or health; tracklock 6.7% usage 49.9% WR (Extra Stamina 48.1%), not in any of the 4 recent lockbuilds cores (situational only in turbo Oct 1 and Sexy Feet Oct 14). 5) Recharging Rush not added: 200 in 3.5s is easy (her base gun is 53.4 DPS, ~187 in 3.5s before any item, well over with Sharpshooter at range), but it's a fresh 1.6k with no upgrade, refunds the same Assassinate charges Rapid Recharge already gives (4 charges, -14% cooldown), and is 12.9% usage 49.1% WR on tracklock; none of the 4 recent lockbuilds cores have it (optional in Sexy Feet).","Round 9: Worth a try box: Mystic Reverb on Assassinate (shot is 90 + 0.93x spirit, plus 90 + 2.3x under half health, at Spellslinger's slot (36.8k, ~113 spirit) a full shot is ~195, so every shot clears Reverb's 100 minimum; Reverb repeats 50% of it 3s later with a 32% slow; 2 charges, more with Rapid Recharge).","Round 12: Worth a try box removed; Mystic Reverb (Kieran likes it) and Lightning Scroll now sit in a rich box after the 46.4k core. Numbers at ~37k (112 spirit + 14 from Rapid Recharge on Assassinate = 126): a full Assassinate shot is 90 + 0.93x126 = 207, or 587 on a target under half health. Lightning Scroll adds a flat 150 and a 0.75s stun 3s after the hit, plus a 64% slow for 2s, with no cooldown in the game files. Reverb echoes half the shot 3s later (104, or 293 under half health) onto the target and anyone within 16m, with a 32% slow, once every 6.25s, so about 2 echoes per 4-charge volley. Lightning Scroll goes first: the flat 150 beats Reverb's 104 on a low-spirit gun Vindicta, and the stun and slow line up the next shot. Neither item is in current public Vindicta builds (tracklock pro, last 30 days, 139 games; tracklock build page). Lightning Scroll sells Blood Tribute; Reverb sells Burst Fire.","Round 13: notes emptied per UPDATE 3 (only sells, swaps, slot locked, counters and verified tips kept); desc shortened to a style label (UPDATE 4).","Round 14: renamed Sky Gunner (gun is the style; the snipe build is now the separate Pure Sniper). Counterspell into the core as part of the 4.8k health spike (Kieran: pure gun Vindicta still needs Counterspell; in 5 of 6 post-patch gun builds) in place of Duration Extender → Superior Duration (only Sexy Feet's core); 'They have Knockdown?' box removed. Lightning Scroll and Mystic Reverb moved out of the rich box into the Pure Sniper core (they boost Assassinate, not this build's gun); rich box now Divine Barrier (pricier Dispel Magic). Juggernaut slot-locked upgrade added. Blood Tribute note and Titanic note emptied; Swift Striker gets a sell note; Spirit Resilience note made concrete.","Round 15: Counters desc was 119 characters (game limit 112): now 'Get after Leech … Sell Swift Striker for it.' (107); Titanic Magazine takes the 'Sell it for a counter.' note so each is sold once.","Round 20: late list Spiritual Overflow, Vampiric Burst, Ricochet; Divine Barrier note fixed (Dispel Magic is only a counter). Core+late 70.4k.","Round 23: kit re-read, no item change (see log).","Round 25: ability order 3221144411332243 -> 3322124342311441 (worked out from the kit for this build's playstyle).","Cost pass: Spellslinger (needs casts a gun Vindicta rarely makes) replaced by Ricochet in Late; Ricochet removed from the rich box."]},

 changes:["Round 13: new pure sniper build (the existing one is the gun/spirit hybrid with Assassinate charges). No current public build is pure gun: the top gun-labelled ones (lockbuilds 'turbo absolute gun vindicta', Oct 11; deadlocklabs 'One Shot Assassinate') still open with spirit. So the gun items come from the gun half of those builds (turbo: Long Range, HV, Rapid Rounds, Counterspell, Sharpshooter, Burst Fire, Bullet Lifesteal → Vampiric Burst, Lucky Shot; deadlocklabs: HV, Long Range, Burst Fire, Crippling Headshot), and the rest is picked by kit for a style with no spirit: Headhunter (sustain off headshots from range), Hollow Point and Battle Vest (she fights from the air above 65% health), Extended → Titanic Magazine (Flight T1 +50% ammo while flying), Glass Cannon (snowball off picks once health is in). No hero-wide pick rates used. Order: seemeta most popular (61.0%, 2,910 matches) 3221144411332243; nothing in it depends on spirit items, Flight T1 at point 3 and ult early.","Round 14: rebuilt as the snipe (Assassinate) build. 'Sniper' Vindicta builds post-patch are Assassinate spirit builds (lockbuilds MAX SNIPE DMG Sep 17, pentagram 'snipe' Oct 18, turbo absolute Oct 1 spirit/util way), while the round-13 version was a second gun build with Headhunter (metabot 6795: 1.2% pick, 47.3% WR), Battle Vest (41.4% WR), Hollow Point and Glass Cannon, which no post-patch Vindicta build uses together. Items now: Extra Spirit → Improved Spirit → Boundless, Mystic Burst → Tankbuster, Extra Charge → Rapid Recharge, Sprint Boots → Enduring Speed, Counterspell, Mystic Vulnerability → Escalating Exposure, Compress → Superior Cooldown, Surge of Power, Diviner's Kevlar, Mystic Reverb and Lightning Scroll (both work off Assassinate), Spirit Lifesteal → Spiritual Overflow. Ability order maxes Assassinate first. Renamed Pure Sniper.","Round 17: Divine Barrier rich note 'If you bought Dispel Magic, sell it for this.' (Dispel Magic is in Counters). Name 'Pure Sniper Vindicta'  changes:["Style change bomb → gun/tank hybrid, built from Kieran's in-game copy of Dew's build and the tracklock hybrid/pro data (Monster Rounds 96%, Extra Regen 93%, Radiant Regen 93%, Kinetic Dash 93%, Berserker 92%, Spirit Resilience 87%, Healing Booster 74%, Spellslinger 63%). Renamed.","Gun 4.8k at 6.4k souls: Monster Rounds + Kinetic Dash + Cultist (~8 min). Kieran's list buys Radiant Regen and Bullet Resist Shredder before Cultist/Kinetic; moved them after the gun spike so damage comes first. Mystic Regen (800) covers lane.","Health 4.8k at 12.8k: Healing Booster + Spirit Resilience (bomb self-damage is spirit, so 30% spirit resist cuts it). Geist has drain sustain, so 12.8k is inside the 14-16k window. Spirit lands 4.8k at 19.2k with Bullet Resist Shredder.","Core 12 slots, 41.6k: Kinetic Dash, Cultist, Radiant, Healing Booster, Spirit Resilience, Berserker, Fleetfoot, BRS, Spellslinger, Blood Tribute, Leech, Refresher. Kieran's other late picks (Inhibitor, Silencer, Ricochet, Armor Piercer, Crippling Headshot, Unstoppable) don't fit 12 slots; Crippling and Ricochet are the rich box, Unstoppable a counter.","Dropped the whole bomb core (Mystic Burst, Compress/Superior Cooldown, Mystic Vulnerability/Escalating Exposure, Expansion, Duration, Reverb, Infuser, Boundless). Ability order changed to Kieran's played one: Life Drain maxed first, then ult, Malice, bomb last.","Ability order: Kieran's played order (Dew) kept: Life Drain maxed first (sustain, T3 charges) instead of the bomb points mobalytics shows at 5-6 (bomb style, not ours), ult T1/T2 at 8-9 and T3 (+40% fire rate, +60 spirit, +50% spirit resist) at 12 for the gun/tank fights, Malice 10-13 (T3 +8% amp), bomb last as mobalytics' point 16 (74%).","Order: 1132131433424224 (data-first redo, see a7/order_geist.json).","Round 9: Worth a try: Healing Tempo (upgrade of Healing Booster, +4.8k). +35% fire rate and +1.25m speed for 7s on any heal; Radiant Regeneration heals on every cast and Malice is on a 3s cooldown, so it's up the whole fight. Core kept: matches tracklock.gg pro builds, last 30 days, checked 2026-10-19 (Monster 96%, Radiant 93%, Kinetic Dash 93%, Berserker 92%, Spirit Resilience 87%, Spellslinger 63%).","Round 10: rich-box notes for Crippling Headshot and Ricochet now say what they do (they only named the sell). Crippling Headshot is the pricier shred job of Bullet Resist Shredder (-16% bullet and spirit resist vs -10%).","Round 11: added 'Team full of gun heroes?' pivot (and its late box): bomb Geist (Arcane Surge, Surge of Power and Compress Cooldown on the bomb, Mystic Vulnerability → Escalating Exposure, Superior Cooldown) in place of Kinetic Dash, Berserker, Fleetfoot, Bullet Resist Shredder, Spellslinger and Blood Tribute. Main build stays gun. No early tier 4 run.","Round 12: removed the 'Team full of gun heroes?' role pivot and its late box (role pivots become separate builds; bomb Geist comes next round), and the Worth a try box (Healing Tempo). Blood Tribute's note says 'turn it on' (it's a toggle, not something you pop).","Round 13: notes emptied per UPDATE 3 (only sells, swaps, slot locked, counters and verified tips kept); desc shortened to a style label (UPDATE 4).","Round 14: ability order back to Kieran's played Dew order 1234222443343111 (Life Drain maxed first, bomb last); the stored order maxed the bomb first like the bomb build. Ricochet out of the rich box (not a pricier version of anything in the build), Divine Barrier added as the pricier Dispel Magic, Healing Tempo slot-locked upgrade of Healing Booster. Counters sell Fleetfoot, Kinetic Dash gets a sell note. Counter notes fixed: Dispel (silence doesn't stop an active drain; it blocks casts), Counterspell (concrete ults), Spellbreaker (not only when low), Cheat Death (Curse is now Cursed Relic).","Round 15: Counters desc was 115 characters (game limit 112): now 'Get after Berserker … Sell Fleetfoot for it.' (107); Berserker is the first buy after the 4.8k health spike.","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: Late list filled to ~72k from Kieran's in-game Dew Geist late box: Inhibitor, Silencer, Crippling Headshot, Ricochet, then Divine Barrier, each selling the weakest item left.","Round 23: Fleetfoot out, Extra Charge in, upgraded to Rapid Recharge after Leech: Life Drain has 3 charges once maxed (it is maxed first), so these take it to 4 then 5 drains, each a 5s heal.","Round 25: order 1234222443343111 → 3231224233444111: Malice unlocked first with T1 early, Life Drain still maxed by 8.8k, then Malice T2/T3 (up to +75% damage taken from you) before the ult tiers; bomb last.","Cost pass: Bullet Lifesteal and Spirit Lifesteal added in Mid so Leech costs 3.2k less and sustain comes earlier; renamed."]},

 changes:["Round 13: new bomb build — style sources: lockbuilds official 'Spirit Geist' (Oct 18: Extra Regen, Mystic Burst, Extra Spirit, Mystic Regen, Mystic Expansion, Radiant, Compress Cooldown, Healing Booster, Spirit Lifesteal → Greater Expansion, Improved Spirit, Tankbuster, Leech, Superior Cooldown, Mystic Vulnerability → Mystic Reverb, Spirit Burn, Escalating Exposure, Transcendent Cooldown, Boundless, Echo Shard; optional Spirit Resilience, Healing Tempo) and deadlocklabs.gg's 'SPIRIT GEIST' path (Spirit Resilience 8/8, Leech 7/8, Greater Expansion 7/8, Escalating Exposure 7/8, Boundless 7/8). Every item is in one of those two spirit builds; no hero-wide pick rates used. Spirit Resilience lands the health spike: her bomb self damage is spirit (game text: 'Self damage type is Spirit and can be mitigated'). Mystic Burst: bomb 90 + 1.22x clears 80 at buy (103); Tankbuster: 140 + 1.22x ≈ 258 at 13.6k vs 165. Order: seemeta most popular 113213413342422 + ult (bomb maxed by point 8, matching deadlocklabs' highest-WR opening Bomb, Bomb, Malice).","Round 14: ability order is now seemeta's current most popular (Oct 5-19, 55.0% WR, 2,353 matches; its items are the bomb set: Mystic Burst 81%, Tankbuster 64%) 1131334242232414; the stored one didn't match any source. Counters sold Mystic Vulnerability, which is gone once it becomes Escalating Exposure: now Healing Booster. Divine Barrier added as the pricier Dispel Magic. Counter notes fixed (Dispel, Counterspell, Cheat Death: Curse is now Cursed Relic).","Round 15: ability order 1131334242232414 did not match seemeta: its most popular (Oct 5-19, 55.0% WR, 2,353 matches) is Bomb 1/2/5/8, Malice 3/6/9/10, Life Drain 4/12/14/15, ult 7/11/13 = 1132134133424224 (the round-13 order); restored. Counters desc was 121 characters (game limit 112): now 'Get after Leech … Sell Healing Booster for it.' (109); the official build says to get Leech first if you can't survive.","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: Late list: Witchmail and Indomitable added (official Spirit Geist MAXED late box) for a second and third health step on a hero who pays health for every bomb; total ~77k.","Round 25: order 1132134133424224 → 1132134133224424: Life Drain T1/T2 (the heal) before the ult tiers; Soul Exchange T2 silence before Life Drain T3.","Cost pass: Boundless Spirit moved to right after Leech (was nearly last); renamed."]},

 changes:["Style change turret/spirit → gun, built from the tracklock pro data (45 games, 62% WR): Intensifying Magazine 98%, Monster Rounds 98%, Extended Magazine 87%, Swift Striker 78%, Rapid Rounds 71%; Quicksilver Reload 89%, Fleetfoot 84%, Mercurial Magnum 82%, Escalating Resilience 67%, Enduring Speed 64%, Bullet Lifesteal 42%; Spiritual Overflow 38%, Spirit Lifesteal 36%, Spirit Resilience 36%, Berserker 36%, Vampiric Burst 24%. Same core as deadlocked.gg and the lockbuilds gun builds. Renamed.","Gun 4.8k at 4.8k souls (Monster Rounds, Extended, Intensifying, Rapid Rounds → Swift Striker). Cultist at ~8 min on top. Health 4.8k at 13.6k (Enduring Speed, Bullet Lifesteal, Grit → Reactive Barrier); Medicinal Specter is kit sustain, so that timing is fine.","Quicksilver Reload → Mercurial Magnum imbued on Mini Turret: turret is an 18s-cooldown cast with charges, so it procs the reload and spirit bullets every fight. Magnum counts as a gun item.","Battle Vest (62% pro early) is a lane option, not core, because it never upgrades. Intensifying Magazine also has no upgrade and is kept all game as in 98% of pro builds. Cultist is the sell slot for counters and for Crippling Headshot.","Dropped the whole turret core (Extra Charge/Rapid Recharge, Compress/Superior Cooldown, Expansion, Mystic Vulnerability/Escalating Exposure, Duration, Infuser, Diviner's Kevlar, Echo Shard, Spirit Burn, Boundless). Core 12 slots, 40k (was 54.4k). Ability order now takes Spectral Wall T1 (+20% damage amp on hit) early.","Ability order: Gun style on the public frame (mobalytics/seemeta unlock 3-2-1-4): Spectral Wall T1 (+20% damage amp on hit) at 5 for the gun, Mini Turret T1/T2 at 6-7 so the +2 charges land with Quicksilver/Mercurial on the turret, Wall maxed 8-9 (mobalytics 77-80%), Turret T3 10, Specter 11-12, Barrage 13-15 as public, Specter T3 last.","Order: 3211134332221444 (data-first redo, see a7/order_mcginnis.json).","Round 9: Cultist Sacrifice dropped; Monster Rounds stays and is sold for Crippling Headshot. tracklock.gg pro builds, last 30 days, checked 2026-10-19: Monster Rounds 98% but Cultist 12%. McGinnis farms fine with turrets, so the 2.4k upgrade was spent on farm she doesn't need.","Round 9: Battle Vest from the lane box into Early core (6.4k): tracklock.gg pro builds, last 30 days, checked 2026-10-19 64% early; +18% weapon damage, +7% fire rate and 18% bullet resist above 65% health win her gun trades. It's a damage item too, so it doesn't belong in the survival-only lane box.","Round 9: Grit into Reactive Barrier dropped (pros: Grit 43% mid, Reactive Barrier not in the top 24); health spike now Sprint Boots, Enduring Speed, Battle Vest, Bullet Lifesteal = 4.8k at 11.2k (was 13.6k). Indomitable removed from the rich box (its Reactive Barrier is gone). Counters now sell Battle Vest. Core 40.0k to 37.6k, still 12 slots.","Round 9: Worth a try: Ballistic Enchantment on Mini Turret. +20 weapon damage per hero the turret hits, for 20s; the turret shoots every 0.2s from 30m, so it stays up the whole fight. Also +22% turret range.","Round 10: Crippling Headshot rich note now says what it does (it only named the sell). Nothing else changed: the core matches tracklock pro McGinnis (last 30 days, 42 games) phase by phase.","Round 12: removed the Worth a try box (Ballistic Enchantment on the turret).","Round 13: notes emptied per UPDATE 3 (only sells, swaps, slot locked, counters and verified tips kept); desc shortened to a style label (UPDATE 4).","Round 14: renamed (old name was 34 characters). Crippling Headshot out of the rich box (not a pricier version of anything in the build); Divine Barrier in as the pricier Dispel Magic. Spirit Resilience note had Haze (no ticking spirit damage) and 'Viper': now says when to buy it earlier. Monster Rounds, Fleetfoot and Swift Striker sell for counters. Counterspell and Ethereal Shift notes made concrete.","Round 15: Counters desc was 116 characters (game limit 112): now 'Get after Fleetfoot … Sell Battle Vest for it.' (109). Intensifying Magazine was the only T1/T2 with no upgrade or named sell: now 'Sell it last for a counter.'","Round 19: style check, no change. Gun McGinnis is a real public style (lockbuilds FaxFox Mcg, Phantom VI, Oct 8: Monster Rounds, Extended/Intensifying Magazine, Swift Striker, Quicksilver, Enduring Speed, Fleetfoot, Mercurial Magnum, Berserker, Escalating Resilience) and Kieran's main.","Round 20: Late list filled to ~74k from FaxFox's late box: Ricochet, Lucky Shot, Crippling Headshot, Silencer, Inhibitor, then Divine Barrier, each selling the weakest item left.","Round 25: order 3211134332221444 → 3231114223231444: Spectral Wall T1 (+20% damage) 3rd, Medicinal Specter T1/T2 before Wall T2, Specter T3 before Wall T3."]},

 changes:["Round 13: new turret build — style source: lockbuilds official 'MAX TURRETS McGinnis' (Oct 18, from the top 10 McGinnis players: Monster Rounds, Extra Stamina, Mystic Regen, Extra Charge, Mystic Slow, Radiant, Enchanter's Emblem, Mystic Expansion, Compress Cooldown → Mystic Vulnerability, Escalating Exposure, Heroic Aura, Enduring Speed, Stamina Mastery, Greater Expansion → Superior/Transcendent Cooldown, Spirit Burn, Rapid Recharge, Refresher, Boundless). Every item is in that build. Mini Turret has a charge (1, +2 at T3), so Extra Charge and Rapid Recharge add turrets. Spirit Burn at 37.6k: turret 24 + 10 + 0.42x ≈ 86 a second each at T3 attack speed, 2-3 turrets clear 500 in 5s. No hero-wide pick rates used. Order: seemeta highest WR (60.7%, 257 matches) 321113433222144 + ult: turret maxed by point 5, wall T3 (2 extra turrets) by 9.","Round 14: Mystic Expansion moved from Spectral Wall to Mini Turret: only the wall's cast range scales with it, while the turret's attack range and cast range both do (game files). Sprint Boots → Enduring Speed moved from Late (fresh T1/T2 at 30k) to Mid. Heroic Aura note: only with gun heroes on your team. Counters sell Enchanter's Emblem (was Heroic Aura, a T3), Mystic Slow sells for a counter, Monster Rounds note dropped (Spirit Burn already says it). Divine Barrier added as the pricier Dispel Magic. Counterspell note made concrete.","Round 15: Heroic Aura was a core item with a skip-it note (Kieran: only when the team has gun carries), leaving an 11-slot core without them: it moves to a 'Gun carries on your team?' box (sells Mystic Slow), and Healbane takes its core slot right after Mystic Vulnerability, as in MAX TURRETS mid core (Mystic Vulnerability, Escalating Exposure, Healbane, Heroic Aura). Counters desc was 122 characters (game limit 112): now 'Get after Stamina Mastery … Sell Healbane for it.' (112); Enchanter's Emblem now 'Sell it for a counter.'","Round 17: Heroic Aura box renamed 'Swap for Mystic Slow' and moved out of the Mid row to its own row after Counters; note 'Instead of Mystic Slow when your team has gun heroes.'. Divine Barrier rich note unified ('If you bought Dispel Magic, sell it for this.'). Pair check vs mcginnis_ult: this build keeps the turret items (Extra Charge → Rapid Recharge for turret charges, Enchanter's Emblem, Mystic → Radiant Regeneration, Healbane, Spirit Burn, Transcendent Cooldown) from lockbuilds' MAX/INFINITE TURRETS McGinnis (Oct 17-18); the ult build no longer shares the charge items or Spirit Burn.","Round 19: style check, no change. Turret/spirit McGinnis is the main public style (lockbuilds MAX TURRETS official Oct 18, Heavy Turret Focus, stevie b., happex). It is now the only spirit McGinnis (Ult McGinnis removed as an invented half-style).","Round 20: Late list filled to ~81k: Lightning Scroll (Mystic Slow now upgrades), Indomitable, Echo Shard on the turret, Refresher last, then Divine Barrier; Refresher sells Healbane (Spirit Burn already cuts healing) and Enduring Speed now upgrades to Juggernaut in Slot locked.","Round 23: Superior Duration added to the late list: turret lifetime scales with duration, so +28% duration keeps about 28% more turrets up at once. Refresher now sells Radiant Regeneration.","Round 25: order 3211134332221444 → 1312141332232444: turret unlocked first and maxed by ~7k (2 extra charges, fire rate, lifetime); Specter T1/T2 before Wall T3.","Cost pass: Heroic Aura swap now replaces Healbane (was Mystic Slow, which broke the spirit 4.8k); Transcendent Cooldown moved to Slot locked; Improved Spirit added at the start of Mid so Boundless Spirit costs 1.6k less; renamed."]},

 changes:["Round 13: new ult build — style sources: kami-labs 'Spirit McGinnis' (Heavy Barrage maxed first: Monster Rounds, Sprint Boots, Extra Stamina, Extra Charge, Extra Spirit, Mystic Slow, Compress Cooldown, Enduring Speed, Stamina Mastery, Mystic Expansion, Improved Spirit, Boundless, Escalating Exposure, Superior Duration, Superior Cooldown, Greater Expansion, Rapid Recharge, Diviner's Kevlar, Infuser; situational Spirit Burn) and seemeta's most popular order (55.7%, 594 matches), which maxes Heavy Barrage at points 7-10. Kit-justified additions: Lightning Scroll (Mystic Slow's upgrade; it only works on ultimate damage: 64% slow, 150 damage and a 0.75s stun), Duration Extender (component of kami's Superior Duration; barrage fires 6 rockets a second for 8s, +6s at T2), Mystic Vulnerability (component of Escalating Exposure), Spirit Lifesteal (component of Infuser). Turret keeps 1 charge (+2 at T3), so Extra Charge/Rapid Recharge still add turrets. Enchanter's Emblem and Mystic/Radiant Regeneration dropped: not in any ult-style build. No hero-wide pick rates used.","Round 14: Mystic Expansion moved after Mystic Slow so it isn't imbued before Heavy Barrage unlocks (3.2k souls). Counters sold Mystic Vulnerability, which is gone once it becomes Escalating Exposure: now Superior Duration. Monster Rounds note dropped (Lightning Scroll already says it). Divine Barrier added as the pricier Dispel Magic. Counterspell note made concrete. Kami-labs source is from March (pre-patch); items re-sourced to post-patch builds (lockbuilds MAX TURRETS Oct 18, Juukbra's Janitor Jamboree Oct 18).","Round 17: Made a clearly different build from Turret McGinnis (they shared Extra Charge → Rapid Recharge, which only add turret charges, and Spirit Burn): Extra Charge → Debuff Reducer (Mid) and Rapid Recharge → Unstoppable (Late): Heavy Barrage is a channel that a stun interrupts (abilities.vdata m_bitsInterruptingStates = STUNNED) and it runs 8s (+6s at T2) while you're slowed, so Unstoppable keeps the whole barrage going; it moves out of Counters. Spirit Burn → Refresher (out of rich into Late core): it resets the 200s (155s at T2) ult for a second barrage, the core job of this build (fresh 12th slot, no sell needed). Counters now sell Mystic Slow (was Superior Duration, the ult duration item this build is built on). Divine Barrier rich note unified ('If you bought Dispel Magic, sell it for this.').","Round 21: put back (Kieran likes it); style unchanged. Mystic Slow out of lane (keeping people in the barrage isn't a lane problem; it's only bought for Lightning Scroll) into Mid; Duration Extender on the ult moves into lane in its place and Extra Stamina moves ahead of the ult imbues so they are bought after Heavy Barrage unlocks (spirit 4.8k at 6.4k souls, was 5.6k). Late list to ~72k net: Transcendent Cooldown (moved up from Slot locked), Spirit Burn (the 8s barrage deals 6 rockets a second, far past 500 in 5s), Divine Barrier only with Dispel Magic; Juggernaut added to Slot locked so Enduring Speed upgrades.","Round 25: order 3221114444313322 → 3213244443212311: Wall T1 (+20% damage on everyone the wall hits, then the barrage) before the ult, turret upgrades last.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost audit: Renamed from Make It Rain McGinnis. Boundless Spirit now right after Unstoppable (8.8k souls earlier); Lightning Scroll, Superior Duration, Greater Expansion follow."]},

 changes:["Lucky Shot (6.4k at 51.2k) out of core into the rich box; Slowing Hex (1.6k at 17.6k) in its place. Pros buy Slowing Hex 61% in the mid game and it keeps a target in your Carbine line (16% slow, -26% dash). Core drops from 51.2k to 46.4k, 12 slots.","Slowing Hex is now the counter sell (was Superior Cooldown, which is the cooldown on a 28s Carbine); Lucky Shot in rich also sells it.","Rest unchanged from last round and matches the pro build: Long Range 85%, HVR 79%, Sharpshooter 85%, Express Shot 85%, Mystic Burst 76%, Tankbuster 90%, Veil Walker 44%, Stamina Mastery 28%. 6.4k gun at 6.4k (Sharpshooter + Headhunter), 4.8k health at 12k.","Restorative Shot (71% pro lane) still skipped per Kieran's rule.","Ability order: mobalytics build-stats grid: unlocks 1-3-2-4, Grenade T1 at 5, Carbine 6-7, Swap 8-9, Wall 10-12, Grenade last; for the carbine/gun style Carbine is maxed by 8 (T3 +55% damage scaling), then Swap T1-T2, Wall, Swap T3, Grenade last as public.","Item fit: Bullet Lifesteal (1.6k) -> Grit + Reactive Barrier (800+800, same 1.6k and same 4.8k health spike at Veil Walker). Bullet Lifesteal/Vampiric Burst aren't on the tracklock pro list, tracklock build page or the top lockbuilds Paradox builds (Axiom 697940, fargareko 544492); Grit is 38% pro, Reactive Barrier and Indomitable are in Axiom's survivability box. Kit: Kinetic Carbine is a 2.5s max charge that a stun or silence cancels, which is what Reactive Barrier answers.","Item fit: Vampiric Burst (+4.8k upgrade, late) -> Indomitable (+4.8k upgrade of Reactive Barrier). Same price and timing.","Item fit: Veil Walker moved to the top of Mid so Early stays at 8 items (order unchanged).","Item fit: rich Leech removed (it was the pricier version of Vampiric Burst, which is gone; no public Paradox build buys it). Counters: Metal Skin and Unstoppable removed (on none of the public Paradox lists; Indomitable now covers getting locked down). Kept: Mystic Burst 76%/Tankbuster 90% pro, Sharpshooter/Express Shot 85%, Long Range 85%, HVR 79%, Headshot Booster 59%/Headhunter 46%, Slowing Hex 61%, Extra Stamina 38%/Stamina Mastery 28%, Superior Cooldown 30%, Hollow Point and Glass Cannon on the tracklock late list and Axiom's build, Crippling Headshot and Lucky Shot in Axiom/fargareko late.","Order: ability order set to the a7 data-first order 1324133424324121.","Threshold: checked with the new order. Mystic Burst at 7.2k souls, 20.2 spirit, Swap at T2: 150 + 1.1 x 20.2 = 172 vs 80. Tankbuster at 17.6k (after the 4.8k gun and health spikes), 50.3 spirit, Swap T3: 150 + 1.1 x 50.3 = 205 (+10% max health) vs 165. Nothing moved.","Round 9: Worth a try: Ballistic Enchantment on Kinetic Carbine. +20 weapon damage per hero hit for 20s and +22% Carbine range; Carbine's bonus damage is 5 + 125x weapon power, so the buff also feeds the next charged shot. Core kept: matches tracklock.gg pro builds, last 30 days, checked 2026-10-19 (Long Range 85%, Sharpshooter 85%, Express Shot 85%, Mystic Burst 76%, Tankbuster 90%, Slowing Hex 61%).","Round 10: Veil Walker note fixed: it said 'walk through your wall', but the heal and stealth come from the map's veils, not Time Wall.","Round 11: added 'Team full of gun heroes?' (Time Wall support: Heroic Aura, Duration Extender → Superior Duration, Disarming Hex). Wall gives friendly bullets +30% (+65% at T2), so with gun carries on the team it does more than your own Carbine. No T4 fix: Indomitable → Glass Cannon → Crippling Headshot starts at 33.6k, after the build is done.","Round 12: Worth a try box removed (Ballistic Enchantment: not an item Kieran picked).","Round 12: 'Team full of gun heroes?' role-pivot box removed: Time Wall support Paradox becomes its own build next round.","Round 12: Hollow Point note said 'while you pick from range'; its bonus (+35% weapon damage, -10% bullet resist) works while you're above 65% health, not by range. Note fixed. Item kept: Paradox shoots from range (Long Range/Sharpshooter 85% in tracklock pro Paradox, 198 games, last 30 days), so it isn't a range item on a close-range hero.","Round 13 (notes policy): notes that restated the item, said 'Upgrades to X' or marked spikes are now empty; kept only tips, situational calls and sells, each checked in the game files.","Round 14: Mystic Reverb on Kinetic Carbine added to Late core (Carbine deals spirit damage, so it procs; mobalytics late 64%, Axiom/CallMeKimbo/eido carbine builds); Crippling Headshot now sells Slowing Hex past 12 slots. Rich Lucky Shot out (not a pricier version of anything in the build), Divine Barrier in (Dispel Magic is in Counters), Transcendent Cooldown added as Slot locked. Spirit Resilience and Counterspell notes made concrete. Ability order 1324133424324121 -> 1324133442234211, the per-point best fit of the mobalytics Archon+ grid (Carbine maxed first in 21.8K of 28K games): Swap 8-9, Wall 10-11, Carbine T3 at 12, Swap T3 13, Wall T3 14, Grenade last; Carbine T3 still lands before Tankbuster.","Round 15: Slowing Hex was sold twice (Counters and Crippling Headshot): Counters now sell Hollow Point. Divine Barrier now sells Dispel Magic (it replaces it) instead of Express Shot.","Round 19: style check, no change. Carbine sniper Paradox is the main public style (lockbuilds Sniper Mommy, eido para Oct 7, real paradox Oct 18; seemeta Oct 6-20).","Round 20: Slowing Hex (T2 bought only to be sold) replaced by Compress Cooldown on the Carbine, which now upgrades into Superior Cooldown (Sniper Mommy core). Late list to ~82k: Spirit Burn, Transcendent, Lucky Shot (Sniper Mommy late), Divine Barrier, Cheat Death (real paradox). Slot locked merged in.","Round 23: kit check, no changes.","Round 25: points reordered for the long-range gun: Carbine T1/T2 by L7, Swap T1 barrier and Time Wall T1 before Carbine T3, Time Wall T2 (+35% bullet damage through the wall, silence) before Swap T2, grenade T2/T3 last.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost audit: Mystic Burst bought together with Tankbuster instead of sitting alone; health 4.8k and the Express Shot spike land about 800 souls earlier."]},

 changes:["Round 13: new bomb build — sources: lockbuilds Very Big Pulse (Crafekster, 14,290, Oct 6), SOLVED BOMB BUILD (Oct 15), Puppydox (Oct 2); seemeta Oct 5–19 Paradox items (Duration Extender 15.6%, Superior Duration 16.7%, Mystic Expansion 13.4%, Echo Shard 11.4%, Greater Expansion 10.8%, Arcane Surge 7.7%); ability order: mobalytics build-stats grid, Pulse Grenade maxed first in 3.2K matches, rest by the same grid (Swap and Wall before the Carbine upgrades, which this build doesn't use).","Round 13: kit numbers: Pulse Grenade 35 + 0.3 spirit per pulse every 0.8s for 3.2s (T2 55 + 0.8, T3 +4% amp per stack and +1.6s = 6 pulses). Duration Extender (+22%) gives a 7th pulse once T3 is in (5.9s), Arcane Surge (+15%) an 8th. No Mystic Burst/Tankbuster: pulses only clear 165 at about 140 spirit power.","Round 13 (notes policy): notes cut to tips, situational calls and sells; every remaining claim checked in the game files.","Round 14: Refresher now sells Arcane Surge (the only T2 left in the final build) instead of Warp Stone, which Counters already sells; Divine Barrier added to rich (Dispel Magic is in Counters). Vortex Web how-to note emptied. Counterspell note made concrete.","Round 15: Infuser note emptied (how-to, not an allowed note). Divine Barrier now sells Dispel Magic (it replaces it) instead of Veil Walker.","Round 19: style check, no change. Spirit/utility Paradox is a real public style (lockbuilds top 1 paradox eu, fargareko Phantom VI: Slowing Hex, Superior Duration, Echo Shard, Compress, Greater Expansion, Superior Cooldown, Escalating Exposure, Spirit Burn, Vortex Web).","Round 20: late list to ~85k: Transcendent, Divine Barrier, Focus Lens (CallMeKimbo), Cheat Death (fargareko), Refresher moved last (luxury). Slot locked merged in.","Round 23: kit check, no changes.","Round 25: points reordered for the bomb: Time Wall unlocked second with T1 (bigger, longer wall that holds people in the pulses), Swap T1/T2 earlier, Swap T3 (multi-swap, +10% max-health damage) before Wall T3, Carbine untouched until last.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost audit: Spirit Lifesteal moved after Duration Extender so spirit 4.8k lands at 4.8k instead of 6.4k. Focus Lens now sells Warp Stone and Cheat Death sells Veil Walker, so health never drops below 9,600."]},
