 changes:["Base = Kieran's in-game Overdue Fees Paige. All his items, order, boxes and notes kept; the core was only 9 slots and the spirit spike missed, so the fixes below.","Spirit spike: swapped Improved Spirit before Duration Extender. Extra Charge + Extra Spirit + Mystic Expansion + Compress = 4000, Improved Spirit (+800) lands exactly 4.8k at 7.2k souls, so his 'your spirit spike' note is now true (before it went 5.6k at Duration Extender, 6.4k at Improved Spirit). Health 4.8k still on Fortitude at 12k.","Core filled to 12 slots with three items from his own boxes/style: Enduring Speed (1600, mid, kiting hero with no move speed in the build; rule says Enduring Speed over Sprint Boots), Surge of Power on Bookwyrm (3200, his first rich pick, but it's T3 and it builds from Extra Spirit not Improved Spirit, so rich/upgrade wording was wrong; +28 spirit on the dragon = +36 damage per hit at 1.3x), Knockdown (3200, his rich pick, T3 so can't be rich; tracklock 60% WR build has it core), Mystic Reverb on Bookwyrm (6400, his second rich pick; dragon hit 60+1.3x spirit clears the 100 threshold from mid game). High-Velocity now has a named sell (Mystic Reverb) instead of 'once you need the slot'.","Late split into Late · L-R and Late · cont. (9 items). T4 spacing: Escalating Exposure 34.4k, Mystic Reverb 40.8k, Boundless 45.6k. Core total 45.6k (was 31.2k at 9 slots).","Rich box is T4 only now (Echo Shard, Refresher, Spirit Burn) with sells; Spirit Burn note dropped the 'needs Tankbuster' proc talk (dragon + Read clear 500 in 5s without it late). Divine Barrier stays his first counter pick (tracklock/deadlocked both core it; left as his choice). Counters box renamed and uses the standard wording.","Public check: tracklock/deadlocked both open HV, Grit > Guardian Ward, Extra Spirit, Extra Charge, Mystic Expansion and run Compress/Superior Cooldown, Rapid Recharge, Greater Expansion, Superior Duration, Boundless, Divine Barrier: matches. They add Sprint Boots > Trophy Collector early; this build takes Enduring Speed instead because it's a damage build, not support.","Ability order: Players unlock 2, 3, 1, then ult, and nearly all (95%) put the next point in Plot Armor T1. After that we take Kieran's pattern (Captivating Read T1, Bookwyrm T1 and T2) before Plot Armor T2, because our early Extra Charge, Mystic Expansion and Compress Cooldown all go on the dragon. The rest follows the data, and Bookwyrm isn't maxed until point 14.","Rebuilt to Kieran's Paige (Oct 19): early gun invest in lane (High-Velocity → Opening Rounds → Express Shot = 4.8k gun) because Bookwyrm's cooldown is long; Grit in lane; Sprint Boots → Trophy Collector because she roams with her team. No Mystic Vulnerability (Escalating Exposure bought outright), Tankbuster core, Knockdown and duration items out of core. Opening Rounds out of Slot locked (it's a lane buy). Two pivot paths like Danny's: 'Lots of dashers?' (Slowing Hex → Vortex Web, Knockdown) and 'No other support?' (Heroic Aura or Alchemical Fire, Weapon/Spirit Shielding, Rescue Beam, Disarming Hex, Superior Duration, Divine Barrier, then Lightning Scroll and Refresher). Gun items are the late sells.","Round 11: Pivots already there ('No other support?' full support, 'Lots of dashers?'). Late support box renamed 'No other support? · late' to match. No 6.4k run.","Round 12: 'No other support?' and '· late' role-pivot boxes removed (support Paige becomes its own build next round). 'Lots of dashers?' trigger now concrete: 2+ heroes who dash or fly out of the trail (Shiv, Lash, Infernus, Vindicta); 'dash Infernus' and Mina were not things a new player can check. Slowing Hex note says what it does. Checked all 10 types: all imbues on Bookwyrm (charges, cast most, 1.3 scaling like Read), thresholds met, no duplicates, no colour-changing swaps left.","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability). Extra Charge checked: Bookwyrm has charges in the files (1, 7s between).","Round 14: ability order now maxes Bookwyrm first (2314231113342244: unlock 2/3/1/ult, T1 Plot Armor, T1 Read, then Bookwyrm T1-T3 by point 9, Read T2/T3, Plot Armor T2/T3, ult) - Kieran's pattern 'unlock 2, T1 Plot Armor, T1 on the 3, then the 1' and the Bookwyrm-max-first players on mobalytics (11.5K matches); the old order left Bookwyrm T3 (+100 damage, +30 DPS) to point 14, a support order. HV note emptied (it explained the item). Counter notes fixed: Bullet Resilience said Haze/Wraith/Vindicta shred bullet resist (they don't; the item is just bullet resist), Counterspell example now confirmed parryable (Lash ult, Mo & Krill Combo), Unstoppable says 'your ult'. Lots of dashers? swaps now same cost/slot and no fresh T2 late: Slowing Hex instead of Mystic Burst (16k, was instead of Surge at 24k), Knockdown instead of Surge of Power (was 'sell Express Shot', clashing with Echo Shard's sell), Vortex Web instead of Escalating Exposure.","Round 15: ability order 2314231323141424 follows Kieran's Paige rule (unlock 2/3/1/ult, T1 Plot Armor, T1 Read, then T1 Bookwyrm; nobody maxes the 1 first) and maxes Read next as mobalytics' most-picked mid points do (Read 33/31/42/40% at points 7,8,10,11); round 14 had maxed Bookwyrm by point 9. Grit/Express Shot notes emptied (they repeated the Counters/Echo Shard sell info). Vortex Web note cut to the swap.","Round 19: style check, no change. Kieran's own style (Speedy AoE Paige); public damage-Paige items match (seemeta Oct 5-19; lockbuilds EVIL PAIGE early core HV, Opening Rounds, Grit, Express Shot, Trophy Collector, Extra Charge).","Round 20: Mystic Expansion moved to Captivating Read (Kieran; deadlocked.gg/tracklock/ITw1xI Paige builds put it on the 3). Grit now upgrades to Guardian Ward in Late (second health step, 6.4k). Rich box is now the full late list to ~86k: Mystic Reverb, Spirit Burn, Transcendent Cooldown, Divine Barrier, Lightning Scroll, Cheat Death, Refresher, Echo Shard last (Kieran). Slot locked merged into it.","Round 23: kit check. Captivating Read's root, the ult stun and the dragon's burning trail all scale with duration (tech_duration in the files), so Superior Duration goes into the late list after Divine Barrier (root 2s to 2.56s from T2, ult stun 1.5s to 1.92s at T3, trail 5s to 6.4s from T2), selling Tankbuster. Refresher now sells Surge of Power and Echo Shard sells Rapid Recharge.","Round 25: points reordered for the dragon build: Bookwyrm T1/T2 straight after the cheap T1s (its 2nd charge stacks with Extra Charge), Bookwyrm T3 before Captivating Read T3, Plot Armor T2 after the damage tiers.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: Surge of Power before Guardian Ward; counters and Mystic Reverb sell Greater Expansion and Spirit Burn sells Escalating Exposure (gun 4.8k holds); Slowing Hex and Vortex Web swaps merged so the swap stays 12 slots."]},

list to ~77k: Transcendent Cooldown, Echo Shard, Vortex Web, Cheat Death, Refresher last (luxury). Slot locked merged in.","Round 23: kit check, no changes.","Round 25: points reordered for support: Plot Armor T2 at L6-7, ult T1 (+150 team heal) right at unlock, Captivating Read T2 (longer root, which Duration Extender scales) before Plot Armor T3, dragon tiers last.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked)."]},

 changes:["Base = Kieran's in-game Pest Control Rat King. All his core items, order and notes kept; Return Fire added as a must, Close Quarters moved into core, lane box trimmed to survival only.","Return Fire (1600) added in Mid after Cultist Sacrifice: ROUND 5 says it's a must for this style; +10 bullet resist always and the active throws 65% of bullet damage back for 6.5s while you sit in the ult. lockbuilds' top Rat King build (26k views) has it as the last required early item; tracklock lists it in actives. Health goes 4.8k (Enduring Speed, 8.8k souls) to 6.4k after the gun spike.","Close Quarters (800) moved from the lane box into Early (6th): the lane box can only hold survival items, and Point Blank was flagged as 'Upgrade' with no Close Quarters owned. Grenade is 70 per shrapnel +0.6x weapon damage, Close Quarters is +20 weapon power inside 15m where the grenade lands, so it's a real grenade item. It also lands the gun spike earlier: HV + Monster + Close Quarters + Opening Rounds = 3200, Fleetfoot (+1600) = exactly 4.8k gun at 10.4k souls (was 13.6k at Cultist).","Core ends at exactly 12: Glass Cannon sells Fleetfoot (6% weapon damage, weakest gun item at 39k). Core total 39.2k (was 37.6k).","Rich box is T4 only now: dropped Arcane Surge (T2, and Rat King's spirit scaling is poor per lockbuilds annotated build) and Heroic Aura (T3 fire rate, not weapon damage, fights the grenade style). Colossus/Lucky Shot/Refresher each name a sell. Counters box renamed with the standard wording.","Public check: tracklock 64% WR build and lockbuilds official both run HV > Opening Rounds, Monster > Cultist, Sprint > Enduring Speed, Fleetfoot, Ballistic Enchantment, Berserker, Siphon Bullets, Fortitude; lockbuilds official also cores Glass Cannon and Return Fire and buys Witchmail/Colossus late. Nobody runs Point Blank, but it's +50 weapon power at grenade range, so it stays as his pick.","Ability order: Consensus: unlock 1, 3, 2, ult, Grenade T1/T2 (90%+), then Pestments T1/T2, then Grenade max, then ult, with Rat Swarm last. Ours is that path exactly.","Item fit: Glass Cannon → Colossus (core, last 6.4k). Kieran's standing rule is no Glass Cannon on Rat King. Colossus keeps the same price and slot, and it suits a grenade tank: the grenade is 70 per shrapnel +0.6x weapon damage, so Colossus's +15% weapon damage feeds it, and the cape barrier is 15% of max health, so +25% base health makes it bigger. It was in Kieran's in-game Unkillable Rat King Late core. Tracklock lists it under defensives/actives (that page shows no buy rate for it). Fleetfoot's sell note now names Colossus.","Item fit: Lucky Shot (rich) → Witchmail. Lucky Shot only empowers bullets (25% proc, no weapon damage stat), so it does nothing for the grenade, and it's not in any public Rat King list. Witchmail has 22% spirit resist and cuts cooldowns when he takes heavy hits (75+). It's in Kieran's in-game build ('your main tank item into spirit') and tracklock pro buys it 13% late. Colossus left the rich box because it's core now.","Round 8: ult-centred notes fixed after the Oct 5 Rule, Ratannia! nerf (cooldown 130 to 160, T1 no longer -20s, so 110 to 160 with T1; damage reduction 15%, T3 25%; radius 20m). Superior Cooldown 'Ult up for every fight' was false (160s x 0.8 = 128s): now 'Grenade, cape and ult all come back faster'. Return Fire, Berserker, Siphon Bullets, Point Blank and Fleetfoot no longer say 'in the ult'.","Round 8: items kept. Post-nerf lockbuilds builds updated Oct 17 (ANGADXO rank 50 annotated; Lockbuilds 'THE TANKIEST GUNNER') still run HV > Opening Rounds, Monster > Cultist, Extra Health > Fortitude, Enduring Speed, Fleetfoot, Ballistic Enchantment, Berserker, Siphon Bullets, Witchmail, Colossus, Return Fire and Superior Cooldown (ANGADXO: 'cooldown is very good' on the ult). Ballistic Enchantment duration 14s to 20s (Sep 16) is a buff. tracklock Rat King page could not be read.","Round 10: Cultist Sacrifice moved from 14.4k to 8k souls, straight after Opening Rounds, so the gun spike comes first (gun 4.8k at 8k, landing 5.6k; health 4.8k still right after on Enduring Speed, 11.2k, was 8.8k). tracklock.gg pro Rat King (last 30 days to Oct 19, 290 games, after the Oct 5 ult nerf): Cultist 61% and Monster Rounds 92% early, Fortitude 96% mid. Buying it 6k souls sooner gets an extra use or two of the 170% soul camp (270s cooldown) and the +10% weapon damage feeds the grenade (70 per shrapnel + 0.6x weapon damage). The rules put Cultist around 8 min with health straight after.","Round 11: Tank only, no role pivot. Empty 'Lost lane?' box: Cultist Sacrifice before Opening Rounds so you farm back faster (gun 4.8k lands on Cultist at 7.2k). No 6.4k run.","Round 12: Extra Charge replaced by Mystic Expansion on the grenade (same 800 spirit, same spot at 4k souls). Extra Charge only adds charges to abilities that already have them (game files: Scrap Grenade AbilityCharges 0, like Haze's dagger; Rat Swarm 1; the game's own Omnicharge Signet text says non-charged abilities need it to get charges), so 'two grenades in the pocket' never happened - it only gave Rat Swarm, maxed last, a charge. Mystic Expansion makes the grenade blasts 20% wider and upgrades into the Ballistic Enchantment the build already buys (pros: Mystic Expansion 60% mid, Ballistic 72% mid, tracklock last 30 days, 290 games), so Ballistic now costs 2400 instead of 3200. Rapid Recharge removed from Slot locked (it upgraded Extra Charge). Restorative Shot removed from the lane box (it was for trading shots from range; you walk up to them, and Extra Regen already covers a bad lane). Opening Rounds/Close Quarters notes now claim only what the item does (their conditional bonuses are on your gun; the flat +8% feeds the grenade). Counter notes made concrete (who to buy them against). Mystic Expansion merges into Ballistic, so the core was one slot short: Witchmail (Kieran's own in-game core item, 'your main tank item into spirit') moves from the rich box to the last core buy (44.8k). Spikes unchanged: gun 4.8k at 8k, health 4.8k at 11.2k.","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability). Checked: no Extra Charge (Scrap Grenade has no charges).","Round 14: Opening Rounds and Cultist Sacrifice moved into Early ahead of Close Quarters, so gun 4.8k lands exactly on Cultist at 7.2k (was 5.6k at 8k with Close Quarters first); health 4.8k still 11.2k. Divine Barrier added to rich (Dispel Magic is in Counters, so it must be there); Refresher now sells Opening Rounds (Enduring Speed upgrades to the Slot locked Juggernaut). Dispel note had 'Yamato grapple' (Dispel can't stop it; wiki lists Yamato only from Power Slash T1) - now Knockdown, Slowing Hex, Disarming Hex. Bullet Resilience note claimed Haze/Wraith/Vindicta shred bullet resist (false); Counterspell example now confirmed parryable. HV/Fortitude notes cut to the interaction, Fleetfoot's sell note dropped (Colossus says it), Return Fire's how-to sentence dropped. Lost lane? reorder now moves Cultist 1.6k sooner (5.6k) without delaying gun 4.8k.","Round 15: sells made unique - Fleetfoot was named by both Counters and Colossus, and Opening Rounds by both Colossus' fallback and Refresher. Now Counters sell Fleetfoot, Colossus sells Opening Rounds, Refresher sells Cultist Sacrifice (Kieran's in-game build sells the Monster Rounds line late), Divine Barrier sells Dispel Magic.","Round 17: name now 'Rizuhble's Tanky Rat King' (matches its desc and the other tank builds' wording). Rich sell notes use 'for this' (Refresher; Divine Barrier now 'If you bought Dispel Magic, sell it for this.', Dispel being a counter). Items unchanged: the grenade variant was made the ranged grenade-spam build instead, so this stays the close-range tank.","Round 19: style check, no change. Tanky gunner is the only public Rat King style (lockbuilds THE TANKIEST GUNNER official Oct 17, ABL, ANGADXO Oct 17, reezowaka, LIGHTBRINGER; seemeta Oct 5-19). Grenade Spam and Gun Rat King were removed: one invented, one the same style as this build.","Round 20: Late list filled to ~72k: Glass Cannon (official Tankiest Gunner core, Kieran's in-game last buy), Leech, then Refresher as the luxury, then Divine Barrier, each selling the weakest item left.","Round 23: kit check. Royal Pestments' barrier is a % of max health (15%, 25% at T3), so Siphon Bullets' stolen max health also grows the cape; note added. No item changes.","Round 25: points reordered for the tank: Royal Pestments unlocked first with T1 (+4s cape) at L2, Pestments T2 at L7 and T3 (250 damage cap, +10% max-health barrier) before Grenade T3.","Audit 1: Glass Cannon out of the rich box for Echo Shard. Glass Cannon is -13% max health (Kieran: contradicts a tank build, and the cape barrier is 15% of max health, 25% at T3); Echo Shard recasts the grenade, the build's only damage source, and stacks with the Mystic Expansion and Compress Cooldown already on it."]},

 changes:["Round 13: new grenade-spam build — sources (grenade style only): lockbuilds 'BOMB ISLAND ICED TEA [Echo Shard Scrap Bomb]' (Oct 8): High-Velocity, Monster Rounds, Cultist Sacrifice, Battle Vest, Enduring Speed, Long Range, Sharpshooter ('increases the damage nicely on the bomb, since you're often away from enemies'); 'make it bigger' Superior Cooldown, Mystic Expansion, Ballistic Enchantment; Echo Shard 'when you're ready'; more damage Glass Cannon, Berserker; more health Witchmail, Juggernaut, Colossus. lockbuilds 'Ratm Bomb' (Oct 7): Monster Rounds, Opening Rounds, Cultist; greens Extra Health, Sprint Boots, Enduring Speed, Fortitude; Compress Cooldown, Superior Cooldown. Kit: Scrap Grenade does bullet damage (70 + 0.6x weapon damage bonus per detonation, +70 at T2, +1 detonation and a 300 big blast at T3, cooldown 26s to 18s at T1), so weapon damage items scale it and spirit lifesteal doesn't heal off it. No Extra Charge: the grenade has no charges in the files (only Rat Swarm does). Order: kit-based, grenade maxed first (its T1 cooldown, T2 damage and T3 big blast are the whole build), then cape, ult, rats; no grenade-build order is published.","Round 14: Glass Cannon out (Kieran's standing rule: no Glass Cannon on Rat King; not in mobalytics' Rat King late items either) for Colossus, the BOMB ISLAND build's 'more health' pick (+15% weapon damage feeds the grenade, +25% base health grows the cape). Long Range and Sharpshooter moved before Battle Vest: gun 4.8k now 5.6k souls (was 8.8k) and lands 6.4k exactly on Sharpshooter at 6.4k; health 4.8k now on Fortitude at 12.8k (lands 6.4k). Ability order now the mobalytics grenade-max-first grid path 1324113313444222 (was a kit-only guess). Siphon Bullets out for Greater Expansion (BOMB ISLAND's 'make it bigger' group; Siphon isn't in any grenade build checked and its steal needs bullet hits): +30% radius on an 8m grenade, so it hits more heroes and Ballistic Enchantment stacks per hero hit. Counterspell example now confirmed parryable.","Round 15: verified, no changes.","Round 17: made clearly the ranged grenade build: Berserker (needs you to soak 120 damage a stack, the tank build's item) → Hollow Point, same 3.2k gun slot: +35% weapon damage while above 65% health, which a thrower standing 15m+ back (Long Range/Sharpshooter) keeps, so +21 per detonation on the grenade (70 + 0.6x weapon damage). Spikes unchanged.","Round 21: put back (Kieran plays and likes this build); style and core unchanged. New full late list to ~73k net: Transcendent Cooldown (moved up from Slot locked: the grenade is the build, 26s→18s at T1), Glass Cannon (+80% weapon damage, the grenade does 70 + 0.6x weapon damage per detonation; Kieran's own Pest Control last big buy), Mystic Reverb on the grenade (imbue: hits of 100+ add 50% of the damage again in 16m, 6.25s cooldown; 140+ per detonation from grenade T2), Cheat Death and Refresher as luxuries last. Each sells the weakest item left (Battle Vest, Cultist Sacrifice, Hollow Point, Greater Expansion). Counters caption in the required format.","Round 23: base kept (Kieran's tested build). New swap box: Bullet Resist Shredder for Battle Vest when you keep dropping under 65% health (Battle Vest's bonus turns off there). Rat bites are spirit damage, so they apply the shredder's -10% bullet resist, and the grenade and ult deal bullet damage.","Round 25: points reordered for the grenade build: Grenade T1, T2 and T3 by about L13, Pestments T1/T2 after, ult tiers next, rats last.","Slot locked: Transcendent Cooldown moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Relevance pass (Kieran Oct 22: range items don't raise grenade damage): game files give Scrap Grenade 70 per detonation + 0.6x EBaseWeaponDamageIncrease (ult 200 + 1.2x), and that stat is only the plain Weapon Damage % (BaseAttackDamagePercent) plus the soul-investment bonus. Long Range's 40 and Sharpshooter's 60 are a separate long-range bullet bonus (MODIFIER_VALUE_LONG_RANGE_BULLET_DAMAGE_INCREASE), and High-Velocity's bullet speed doesn't touch the grenade (its own 1300/1500 projectile), so High-Velocity (+4.8 per detonation), Long Range (+0) and Sharpshooter (+6) out. Close Quarters (+20) and Point Blank (+50) were checked as Kieran suggested and rejected: their bonus is the same kind of separate range bonus (MODIFIER_VALUE_CLOSE_RANGE_WEAPON_DAMAGE_INCREASE), not Weapon Damage %, so the grenade formula gives them +0 too; whether either range bonus applies to grenade hits at all is untested (sandbox scenario ratking_grenade_range_bonus, no evidence file yet: inconclusive, so neither goes in). In: Extended Magazine → Titanic Magazine (+14% = +8.4 per detonation for 1.6k, vs Sharpshooter's +10% for 3.2k), Hollow Point moved to right after Fortitude. Gun 4.8k at 4.8k souls (was 5.6k), health 4.8k at 11.2k (was 12.8k), gun 8k exactly on Hollow Point at 14.4k; Weapon Damage at 6.4k souls 88% (was 74%), at 14.4k 139% (was 92%). Core 43.2k (was 44.8k), 12 slots."]},

 changes:["Base: Kieran's in-game build, items and order untouched. Consolidated his 14 boxes into Lane / Early / Mid / Late / Counters / Swaps / rich: 'Lane · L-R' is really the Early box (8 items), so renamed to 'Early · L-R' — core now counts as 12 slots (Rapid Rounds→Swift Striker, Extended→Titanic, Extra Health→Fortitude, Extra Charge→Rapid Recharge, Bullet Lifesteal→Vampiric Burst, Healing Booster→Healing Tempo are upgrades).","Counters (8): his four armours + Cheat Death/Unstoppable/Indomitable boxes and anti-Metal-Skin boxes split by role — Spirit/Bullet Resilience, Plated Armor, Spellbreaker, Counterspell, Unstoppable, Cursed Relic, Armor Piercer go in Counters; Frenzy, Crippling, Cheat Death, Indomitable, Mercurial Magnum, Spiritual Overflow, Inhibitor, Divine Barrier (all T4) go in the rich box. Box-title meanings (anti metal skin, debuff spreading) moved into the item notes so nothing is lost.","Leech + Blood Tribute merged into one Swaps box; notes name what they replace (Vampiric Burst / Burst Fire).","Sell notes added everywhere the core is full (12 at Silencer): counters sell Active Reload (1600, never upgrades), rich items sell Active Reload / Burst Fire / Titanic Magazine; Healing Tempo marked as the upgrade of Healing Booster it is (components checked).","Note wording: Extra Charge 'buy once smoke has 2 charges' → 'more smokes. Upgrades to Rapid Recharge.' (smoke T2 is point 8 of his ability order, long before Extra Charge at ~29k souls, so the condition is guaranteed — rule: notes don't explain proc conditions). Siphon/Healing Tempo notes no longer claim Siphon 'procs Healing Tempo' (Healing Tempo text: does not apply on passive lifesteal; Siphon's steal isn't a heal) — now 'farm until this, then start fighting' and 'more healing, and fire rate every time you heal'.","Spikes unchanged: gun 4.8k at Titanic Magazine (4.8k souls), Ricochet at 12k (farm exception, greens straight after: Healing Booster then Fortitude), health lands exactly 4.8k at Fortitude (16k souls) → 11.2k at Siphon (22.4k), gun 11.2k at Ricochet, 20.8k at Lucky Shot. Core ends 12 slots at 52.8k, over the ~48k target — all six T4s are his; the one cut that gets it under 48k is moving Silencer to the rich box, left for him to decide.","Ability order: Near-unanimous: unlock Fixation, then 1, 2, ult, Fixation T1/T2, max Dagger at points 7-9, then Smoke Bomb, then Fixation T3, ult last. Ours is that path exactly.","Round 9: Golden Goose Egg removed (Sep 16: -15% damage, 80/min, stored souls count as bounty; not in tracklock pro top 8, last 30 days, 361 games). No replacement item: current farm builds reach Ricochet with the same gun items you already buy (pro early Swift Striker 100%, Rapid Rounds 86%, Active Reload 78%; FIRST TRUE CARRY fargareko, lockbuilds 759041, Sep 25, buys Ricochet 6th; Sanya_Sniper 832086, Oct 18, buys it right after Titanic Magazine). Ricochet stays at 12k.","Round 9: Worth a try box. Surge of Power on Bullet Dance: +28 spirit adds 0.84s to the 3.5s ult (+0.03 per spirit) and +20% fire rate after the cast; pro mid 68%; replaces Burst Fire. Phantom Strike (Kieran's idea): 25m teleport + 3s slow keeps them inside Bullet Dance's 16m; replaces Silencer. Rapid Recharge, Healing Tempo and Siphon Bullets kept as Kieran's picks.","Round 11: Kieran: a lost lane means Ricochet before Fortitude. So the normal order now has Fortitude first (8k souls, then Ricochet 14.4k, health 4.8k at Healing Booster 16k), and an empty 'Lost lane?' box says to swap the two. No item box: it's the same items. No 6.4k run of 3 before 30k.","Round 12: Surge of Power moves out of the banned 'Worth a try' box into the core on Sleep Dagger (Kieran: dagger, not ult), in Burst Fire's slot (25.6k souls, same 3.2k price). Numbers (1v1 sim at that point: lvl 28, Fixation T3, gun 11.2k invest = +74%, Titanic +14%, Siphon +15%, Swift Striker + Ricochet = +38% fire rate, 5.3 base bullet, Fixation 0.31 + 0.00035 x weapon bonus per stack up to 80, proc 40 + 0.8 x spirit every 20 stacks; Sleep Dagger 65 + 2.2 x spirit, 13s cooldown at T3): Burst Fire 1876 / 3070 / 4274 damage in a 4 / 6 / 8s fight vs Surge of Power 1760 / 2927 / 4238 (-6% / -5% / -1%); after Rapid Recharge (36.8k) 1983/3196/4438 vs 1900/3091/4451. So the gun damage is a wash, and Surge also gives the ult +0.57s at 25.6k and +0.78s after Rapid Recharge (3.5s base, +0.03 per spirit: about +16-22% ult damage), +1.9-2.6s smoke and the 4.8k spirit spike at Rapid Recharge (spirit 6.4k, 45 spirit power instead of 19), which the build never reached before. On the ult it would buff once per 100-165s; on the dagger its 14s buff matches the 13s dagger. Pros: Surge of Power 68% mid, Burst Fire 86% (tracklock, last 30 days, 354 games). Blood Tribute swap now replaces Surge of Power (gun for spirit: walked: gun 4.8k at 4.8k and health 4.8k at 16k unchanged, spirit stays at 3.2k as before); trigger named (2+ stun heroes). Phantom Strike (Kieran's idea) moves to Swaps instead of Silencer (health for gun at 48k: walked, gun 17.6k and health 24k at that point, every spike unchanged). Rich sells that named Burst Fire now name Surge of Power. Leech note named 'Vamp Burst's' (not an item).","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability). Kieran 00:05: Burst Fire back in the core where Surge of Power was (same 3.2k price); Surge of Power moves to Swaps as 'Buy instead of Burst Fire', imbued on Sleep Dagger; Blood Tribute now replaces Burst Fire; rich sells name Burst Fire again. Extra Charge checked: Smoke Bomb gets charges at T2, which this order has long before 28k.","Round 14: Mid box title back to 'Mid · L-R' (the farm-to-Siphon tip is already on Ricochet and Siphon). Lucky Shot note emptied (proc explanation). 'grapples' cut from the smoke-dispel note and the Divine Barrier note (not verifiable; hex and burn are non-ult debuffs). Counters: Bullet Resilience note no longer claims Wraith/Vindicta shred resist; Plated Armor note no longer points at Metal Skin (not in this build) and names on-hit gun heroes; Spellbreaker no longer says Kelvin/Geist stun; Armor Piercer no longer claims it beats Plated Armor. Leech gets a concrete trigger (enemy anti-heal, which Leech reduces). Rich: Inhibitor's false 'whole team' claim replaced by a condition; sell lines spread with fallbacks so two items never sell the same thing and Swift Striker (dead-end T2) has a named sell; Mercurial names Titanic Magazine.","Round 15: rich sells made distinct (Active Reload sold by Counters only, Burst Fire was named by four rich items and Titanic by two, so later buys had nothing left to sell): Frenzy sells Swift Striker, Crippling Burst Fire or its swap, Cheat Death Fortitude, Indomitable Healing Tempo, Spiritual Overflow is the either/or of Mercurial (both Titanic), Inhibitor Silencer/Phantom Strike, Divine Barrier Counterspell or Rapid Recharge. Blood Tribute and Phantom Strike notes cut under 120 chars.","Round 19: checked against current public builds of this style; it is a real style, no changes.","Round 20: Kieran's own build; checked (late list reaches 104k, health 22.4k, imbues on Sleep Dagger), no changes.","Round 23 (kit): Kieran's tested lifesteal build, base kept. Checked: Smoke Bomb T3 +50% bullet lifesteal 5s after invis and dispel (ab.py), Healing Booster/Healing Tempo amp it, Extra Charge/Rapid Recharge give more smokes; Fixation gives flat damage per stack so fire rate items (Burst Fire) beat flat weapon power (Ballistic Enchantment on the dagger considered and rejected). No item changes; Blood Tribute swap note cut to 112 characters (was 114).","Round 25: ability order 3124331112223444 -> 3311234222341144 (playstyle-based; see a25/log/haze.md)."]},

Zerggy 809232 'chud' box) after Lucky Shot, health 4.8k → 11.2k; it sells Fleetfoot.","Round 20: late list to 75.2k: Siphon Bullets and Silencer added (zerggy 809232 late T4s), Juggernaut moved in as the health step, Phantom Strike dropped (no same-style build uses it).","Round 23 (kit): checked Sleep Dagger (doesn't break invisibility, T2 15 Fixation stacks, 13s at T3), Smoke Bomb (2 charges at T2, so Recharging Rush refunds a smoke), items usable in smoke without breaking it (Capacitor from stealth). Ballistic Enchantment on the dagger considered as a swap for Bullet Resist Shredder and rejected: walked, it loses the 4.8k spirit spike the dagger and Surge rely on. No changes.","Round 25: ability order 3124332221113444 -> 3311234422141432 (playstyle-based; see a25/log/haze_assassin.md).","Slot locked: Juggernaut moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: renamed Night Night Haze; Crippling Headshot sells Swift Striker so spirit 4.8k holds."]},

 changes:["Heroic Aura added at 29.6k (Kieran: support with Heroic Aura; pro Rem buys it 34% late). It takes the weapon slot by selling Opening Rounds, and Tag Along T2 makes its radius and 7s active 35% bigger while you nap.","High-Velocity Rounds now upgrades to Opening Rounds in lane (+800): pro Rem buys HV 96% and Opening Rounds 88% early, and Rem's lane is the type the rules say to fix first. Spirit 4.8k slides to 7.2k (was 6.4k).","Healing Booster now upgrades to Healing Tempo at 46.4k (it was in slot-locked in Kieran's in-game build): Tag Along's burst heal, every hop and Healing Nova all count, so the mate you nap on gets 35% fire rate and move speed. Healing Booster no longer gets sold.","Trophy Collector (1.6k at 17.6k, Kieran's 'maybe') and Enchanter's Emblem (1.6k at 19.2k) replace Refresher and Spirit Burn in core; Refresher goes to rich, Spirit Burn is out (Mystic Reverb keeps the pillow damage in rich). Health lands 4.8k at 11.2k (Nova), 6.4k at 16k, 8k at 17.6k.","Divine Barrier moved up to 26.4k, right after Tankbuster (was 34.4k; pro Rem buys it 83% in mid game, before 20 min). Core 46.4k (was 53.6k), 12 slots: Rapid Recharge, Divine Barrier, Boundless, Tankbuster, Superior Cooldown, Nova, Healing Tempo, Greater Expansion, Trophy, Enchanter's, Heroic Aura, Superior Duration.","Ability order: Consensus: unlock 2, 1, 3, ult, spread T1s (Tag Along, Pillow, Helpers), max Tag Along by point 10, Helpers next, ult at points 12-14, Pillow T2/T3 last. Ours is that path exactly. Kieran's old order is almost the same.","Item fit: Enchanter's Emblem → Restorative Locket (1.6k T2 green, same slot at 19.2k). Emblem's bonus is just 15 spirit and 5% cooldown while above 65% health, and it isn't in tracklock pro Rem's buys, in lockbuilds' top-30 Rem items (lowest shown is 11.1%) or in Kieran's in-game Rem. Restorative Locket is a 32m ally heal that stores up to 25 stacks of 16 heal (+0.45x) from enemy casts nearby, plus 8% spirit resist. Tag Along T2 gives +35% item range while napping, and pro Rem buys it 40% early (tracklock). The Counters and Refresher sell notes now name the Locket.","Healing Tempo moved from core to Slot locked (Kieran: small gain over Healing Booster for a lot of money).","Round 9: Guardian Ward moved from the start of Mid (8k) into Early, right after Opening Rounds (4k). It's the lane item that helps your partner (250 barrier + 2.75m speed on a mate, 40m range, half cooldown when cast on others); tracklock.gg pro Rem, last 30 days to Oct 19, buys it early in 97% of games. Compress Cooldown (the 4.8k spirit item) moves to the start of Mid to keep Early at 8; spirit spike moves from 7.2k to 8k; health 4.8k still lands on Healing Nova.","Round 9: Worth a try box: Scourge (Tag Along T2 gives +35% item duration while napping and self-casts land on your ally, so Scourge's 10s aura of 2.3% max health per second plus 40% spirit resist runs 13.5s on the mate; tracklock pro Rem late 25%) and Ethereal Shift (same self-cast redirect: 4s invulnerable on the ally, untested).","Round 10: Divine Barrier and Tankbuster swapped: Divine Barrier now 24k (was 26.4k), Tankbuster 26.4k (was 21.6k). Saving your mate is the job, and tracklock.gg pro Rem (last 30 days to Oct 19, 95 games) buys Divine Barrier 83% mid; Tankbuster isn't in their top 8 in any phase. Tankbuster still clears 165 on the pillow (75 + 1.6x spirit = 258 at 26.4k).","Round 11: Support already, so no role pivot. Empty 'Team full of gun heroes?' box: Heroic Aura (17% bullet resist, +26% fire rate for the team) moves up to right after Healing Nova (14.4k instead of 29.6k). No 6.4k run.","Round 12: Echo Shard on Tag Along (Kieran: 'the whole point') moves into the core, bought right after Healing Nova and Trophy Collector at 19.2k souls (first 6.4k of the build, spirit 4.8k already at 8k and health at 11.2k). Restorative Locket (fresh 1.6k at 19.2k that you sold for a counter, not Kieran's pick) leaves the core for the slot. Trophy Collector moved from 17.6k to 12.8k so the assist souls stack for longer. 'Worth a try' box removed (Scourge, Ethereal Shift: not Kieran's picks). Reorder box title made concrete: '3+ gun heroes on your team?'. Sells re-pointed (counters: Trophy Collector; Refresher: Superior Duration; Mystic Reverb: Tankbuster). Refresher note: it resets the ult (Naptime), 'two naps' read like Tag Along.","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability). Echo Shard on Tag Along (Kieran: the whole point) moved to straight after Compress Cooldown, so it's the first big buy after the spirit spike. Extra Charge checked: Pillow Toss has charges in the files (1, 8s between).","Round 14: Healing Nova moved before Echo Shard: health 4.8k now 11.2k (was 17.6k, too late for a support who has to stay alive next to his mate); Echo Shard on Tag Along still the first 6.4k, now 17.6k (was 14.4k, which also broke 'no 6.4k before ~20 min'). Renamed 'Bedtime Story' -> 'Babysitter' (the old name restated Rem's sleep theme instead of the support style). Heroic Aura now says it's only for a team with gun heroes (Kieran's rule). Echo Shard note said to hop to a second mate, which Tag Along already does on its own; it now says what Echo adds (reset after the nap). Opening Rounds' duplicate sell note emptied (Heroic Aura says it). Dispel note had 'Yamato grapple' (not dispellable) - now Disarming Hex; Unstoppable note dropped vague 'CC'; Counterspell example now confirmed parryable. Divine Barrier gets the napping tip (self-casts go to your mate) instead of the site's default note, which called it 'same job as Counterspell'.","Round 15: name 'Rizuhble's Piggyback Healer Rem' (Babysitter was already Dynamo's name). Counters desc was 117 chars (game limit 112): now ends 'Sell Trophy Collector.' (110).","Round 17: Desc '' (only Rem build, always played support). Lane Extra Regen gets 'Sell it once you're out of slots.'. Core Heroic Aura (already 'Only if your team has gun heroes.') now has a 'Swap for Heroic Aura' box: Rescue Beam (same 3.2k): 20% max-health heal on your mate and you, and Tag Along T2 gives +35% item range while napping, so the core works without gun heroes.","Round 19: style check, no change. Support Rem is the only public style (lockbuilds bebungo Oct 18, THETA ZERO, Deathy, Drakyn, Adge; seemeta Oct 5-19).","Round 20: late list to ~80k: Transcendent Cooldown, Healing Tempo, Lightning Scroll (Naptime's wake-up damage carries it), Mystic Reverb, Witchmail (second health step), Refresher moved last (luxury). Slot locked merged in.","Round 23: kit check. Tag Along makes every self-cast item land on the ally and gives +35% item duration while napping (T2), so Scourge (40% spirit resist, 20% debuff resist and a max-health damage aura on your mate) replaces Mystic Reverb in the late list, selling Tankbuster. Lightning Scroll now sells Echo Shard. Superior Duration stays: Naptime's sleep scales with duration (4.75s to 6.1s).","Round 25: points reordered for support: Tag Along T2 (+35% item barrier/duration while napping) at L6-7 and T3 at point 8, ult tiers before Helpers T3. Compress Cooldown moved from the ult to Tag Along.","Slot locked: Transcendent Cooldown, Healing Tempo moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: Opening Rounds kept (Heroic Aura no longer sells it) and Superior Duration dropped from core, so gun 4.8k lands at 34.4k; Echo Shard moved after Healing Booster; Trophy Collector right after Compress Cooldown; Spirit Rend (gun) replaces Rescue Beam in the Heroic Aura swap."]},

 changes:["Style changed to Kieran's early-farm ult build (his in-game Burgercat copy): Extra Stamina → Arcane Surge and Extra Spirit → Surge of Power on Power Surge replace Duration Extender/Improved Spirit/Mystic Vulnerability in lane. 4.8k spirit still lands at 5.6k souls, now on Surge of Power (Burgercat's 1st power spike; pro Arcane Surge 66%). Cultist Sacrifice stays at 8k (pro 66%).","Health spike moved earlier and rebuilt: Spirit Lifesteal, Sprint Boots, Healbane, Enduring Speed = 4.8k at 12.8k (was Spirit Lifesteal/Healbane/Debuff Reducer at 12.8k). Burgercat runs Sprint Boots + Enduring Speed core; Seven has no kit sustain so greens come straight after Cultist.","Mystic Vulnerability (pro 91% mid), Duration Extender, Compress Cooldown and Mystic Expansion all on the ult now sit after the health spike (14.4k–18.4k), so no 8k+ spirit before any green.","Escalating Exposure at 23.2k (Burgercat's biggest spike, pro 71%), Unstoppable bought fresh at 31.2k instead of via Debuff Reducer (no fresh T2 late), Infuser at 37.6k, Refresher at 46.4k. Boundless Spirit and Diviner's Kevlar dropped from core; Boundless goes in the rich box (sells Arcane Surge, as Burgercat does).","Core 12 slots, 46.4k (was 56k). Ability order now maxes Power Surge by point 7 for the farm phase and the ult by point 11 (was ult by 9).","Ability order: Mobalytics Seven grid (79% Power Surge first, maxed 5-7, Static Charge last at 15-16) and Kieran's in-game BurgerCat order both max Power Surge first, which is where Surge of Power/Arcane Surge go; ball T1 at 8 for the extra farm charge, then Storm Cloud maxed 9-11 for the ult style (public ult points at 9 and 11), ball and Static Charge after.","Order: 3321324143114422 (data-first redo, see a7/order_seven.json).","Threshold: checked on the new order, nothing moved. Spirit Burn (rich, after the 46k core, ~145 spirit): Storm Cloud 95+65+0.6×145 = 247 per second, 1,235 in 5s vs 500. Arcane Surge only needs a dash-jump. Surge of Power on Power Surge (unlocked T2 at 5.6k), ult imbues bought after the ult is unlocked (16k, ult T1).","Round 8: Spirit Burn note fixed. Since Jul 28 the explosion (110 to 50) hits only the burned enemy, not a 12m area; each enemy procs it on its own (game files 6795: ExplosionRadius 3m, per-enemy cooldown).","Round 9: Worth a try box: Lightning Scroll (ult damage applies a 64% slow and a 0.75s stun 3s later; Storm Cloud hits everyone in a 30m cloud every 0.3s, so the whole team gets it; in BurgerCat's ult-maxing list Kieran plays) and Rapid Recharge on Lightning Ball (ball has 1 charge +1 at T1; Rapid Recharge adds 2 charges, 30% faster charges and +14 spirit on charged abilities, for the farm plan).","Round 11: Farm hero, so no role pivot: empty 'Lost lane?' box says Mystic Vulnerability (more damage on camps) goes before Cultist and the greens (spirit 6.4k at 7.2k souls; Escalating Exposure left where it is so spirit doesn't hit 11k with no health). Spirit Burn note: one target since Jul 28, so 'anyone the storm hits' became 'whoever the storm hits hardest'. No 6.4k run.","Round 12: 'Worth a try' box removed (Lightning Scroll; not Kieran's pick). Checked all 10 types: Surge of Power and Arcane Surge on Power Surge (Kieran's stated style); Duration Extender, Compress Cooldown and Mystic Expansion on the 205s Storm Cloud channel; Monster Rounds/Cultist, Mystic Vulnerability, Healbane, Spirit Lifesteal, Escalating Exposure and Superior Duration all in pro Seven lists (tracklock, last 30 days, 35 games); no duplicates, no colour-changing swaps; 'Lost lane?' reorder is Kieran's own (damage before greens and Cultist) and correct.","Round 13: notes cut to what a player wouldn't know (UPDATE 3), desc is a short style label (UPDATE 4), Counters notes name the right heroes (Spirit Resilience: real spirit-damage heroes, no Haze; Counterspell: a parryable ability). Duration Extender on the ult checked: Storm Cloud's 7s channel uses the game's duration scaling.","Round 14: Juggernaut added to Slot locked so Enduring Speed (dead-end T2) has an upgrade (BurgerCat lists it as the Enduring Speed upgrade). Dispel Magic note no longer names Yamato's grapple (not a verifiable debuff). Boundless and Divine Barrier no longer both sell Arcane Surge. Order verified: seemeta Seven most popular (Oct 5-19, 3,715 games, 59.3%) is exactly 3321324143114422.","Round 15: Arcane Surge note no longer claims extra range on Power Surge (not shown in the files); rich sells made distinct (Cultist was the fallback of both Boundless and Divine Barrier): Boundless sells Cultist, Divine Barrier sells Dispel Magic or Surge of Power.","Round 17: Divine Barrier note in the standard wording ('If you bought Dispel Magic, sell it for this.'), keeping the Surge of Power fallback. Pair check: Gun Seven now opens gun-first with Burst Fire and Toxic Bullets; this build stays the early-farm ult build.","Round 20: Lightning Scroll added to the late list (BurgerCat's ult-maxing box): every storm hit slows then stuns. Total ~80k.","Round 23: kit check. Storm Cloud is a 14s channel that scales with duration, so Diviner's Kevlar replaces Refresher in core: on cast you get 1000 barrier and +40 spirit for 20s (+24 storm DPS), +15% duration adds about 2s of storm (14s x 1.43 = 20s vs 17.9s with Superior Duration alone), and -10% ult cooldown. Refresher moves to the end of the late list as the luxury, selling Infuser (Kevlar covers its job by then). Arcane Surge note: its +15% duration, +12% radius and +20 spirit also work on the storm.","Round 25: points reordered for the ult build: Storm Cloud T1 and T2 right after unlocking it (L9-L11), ult T3 before Power Surge T3. Compress Cooldown moved from the ult to Power Surge."]},

 changes:["Round 13: new gun build (Kieran: gun Seven around his 3 that turns into ult Seven late) — sources (gun/Power Surge style only): lockbuilds official 'GUN/SPIRIT SEVEN' (Oct 18, from GVS, the top Seven player): lane Monster Rounds, Extra Regen, High-Velocity, Opening Rounds, Extra Spirit, Enchanter's Emblem, Cultist Sacrifice, Duration Extender ('rushing the 4.8k spirit'); mid Surge of Power, Spirit Lifesteal, Mystic Vulnerability, Enduring Speed, Escalating Exposure, Infuser, Toxic Bullets; late Unstoppable ('rush it, you're an easy target every time you ult'), Superior Duration, Spirit Burn, Refresher optional. lockbuilds 'The Thunder Lord Rises Again!' (Sep 30, Power Surge + gun, pivot to Storm Cloud late; 'ALWAYS GET ESCALATING EXPOSURE', Infuser or Spiritual Overflow) and sparkz 'surge+ult seven' (Oct 1, Power Surge and ult, shifting into full ult). Kit: Power Surge procs on every burst shot for 10s (20s at T3) and bounces to 4 enemies, damage 10 + 0.14x and 10 + 0.32x spirit, so Duration Extender and Surge of Power go on it. Order: seemeta's most popular Seven order (59.0% WR, 3,747 games), which maxes Power Surge first.","Round 14: ability order changed to seemeta's current most popular Seven order 3321324143114422 (Oct 5-19, 3,715 games, 59.3% WR; Power Surge first, maxed at point 10): the old order's cited seemeta path is not on the page. Refresher note emptied (restated the card), Witchmail note cut to the sell, Dispel Magic note no longer names Yamato's grapple.","Round 15: Counters description was 121 chars (game limit 112): now 'Get after Toxic Bullets ... Sell Opening Rounds.'","Round 17: desc 'Gun Seven' (was 'Gun Seven into ult'). Gun now comes before spirit, so it's a different build from Ult Seven: Monster Rounds, High-Velocity, Opening Rounds, Cultist = gun 4.8k at 4.8k souls (was spirit first at 7.2k, gun 9.6k); greens next (health 4.8k at 9.6k); then Rapid Rounds into Burst Fire (review's GVS gun core; Power Surge shocks once per burst, so more fire rate = more shocks) before Duration Extender/Surge of Power on Power Surge (spirit 4.8k at 16k), Toxic Bullets after. Ult late: Escalating Exposure, Unstoppable, Infuser, Refresher. Spirit Burn out of the core (13 items with Burst Fire; Toxic Bullets already cuts healing). Counters after Burst Fire.","Round 19: rebuilt as the real public gun/spirit Seven (lockbuilds official GUN/SPIRIT SEVEN by GVS 773087, Oct 19; GVS #1 EU SEVEN 416982, Oct 5): High-Velocity → Opening Rounds and Cultist gun spike, Duration Extender/Surge of Power on Power Surge, Enchanter's, Tesla Bullets (GVS: 'the best item u can buy'), Toxic Bullets, Mystic Vulnerability → Escalating Exposure, Spirit Lifesteal → Spiritual Overflow, Unstoppable, Boundless. Cut the invented Rapid Rounds → Burst Fire line, Superior Duration, Infuser and Refresher (Infuser/Refresher are the ult build's items, so the pair no longer looks the same).","Round 20: Duration Extender now upgrades to Superior Duration (official Gun-Spirit late core) instead of being sold; Spirit Burn sells Opening Rounds; Lightning Scroll added. Total ~77k.","Round 23: kit check. Power Surge shocks once per burst, so fire rate means more shocks. Ricochet (+18% fire rate, bounces apply bullet procs like Tesla Bullets) goes into the late list after Spirit Burn, selling Toxic Bullets, whose anti-heal Spirit Burn's -70% already covers.","Round 25: points reordered for gun-spirit: Power Surge maxed by point 8 (T3 = 20s duration and -15% spirit resist), ball T1 early for farm, Static Charge T1 before ult tiers.","Cost pass: Enchanter's Emblem moved after Cultist Sacrifice (gun 4.8k lands earlier); Improved Spirit added in Mid after Enduring Speed so Boundless Spirit costs 1.6k less."]},

 changes:["Heroic Aura added (Kieran: heal support with Heroic Aura) in place of Long Range → Sharpshooter: same 3.2k, so the gun spike still lands at 4.8k (Opening Rounds 1.6k + Heroic Aura 3.2k) at 14.4k, and it gives 26% fire rate to you plus 17% bullet resist to everyone near you instead of long-range gun damage.","Extra Stamina → Stamina Mastery added (800 + 2.4k): pro Solomon buys Extra Stamina 55% early and Stamina Mastery 29% mid, it's in tracklock's and deadlocked.gg's core and in Kieran's played YaBoyCJ build; it fills the slot Spirit Burn held.","Grit added early (800, pro 70%) so Guardian Ward is an 800 upgrade at 16.8k. Health 4.8k now lands at 11.2k on Healing Nova (Extra Stamina + Grit + Nova), 6.4k on Enchanter's at 16k, 9.6k after Guardian Ward + Stamina Mastery.","Spirit Burn moved to rich (sell Enchanter's Emblem); the core now ends at exactly 48k instead of 51.2k, still 12 slots. Spikes: spirit 4.8k at 6.4k, health 4.8k at 11.2k, gun 4.8k at 14.4k.","Everything else matches tracklock pro: HV → Opening Rounds 87-92%, Extra Spirit 90%, Mystic Expansion 82%, Superior Cooldown 90%, Guardian Ward 69%, Greater Expansion 75%, Tankbuster 54%, Boundless 42%.","Ability order: mobalytics build-stats grid: Bishop 5-6, Knight 7-8, Queen 9, Rook 10-12, Queen 14-15, Bishop last; Kieran's in-game YaBoyCJ order is similar (Rook 10-12). Heal-support tweak: Knight maxed by 9 (T3 two allies + cleanse), Queen T1-T2 10-11 (execute), Rook 12-14, Queen T3, Bishop T3 last.","Item fit: Healing Nova → Rescue Beam (same 3.2k T3 green, same slot, so 4.8k health still lands at 11.2k; also built from Healing Rite). Solomon has no heal of his own and plays back placing pieces from 20m+ (Bishop 20m, Queen 30m). Nova only heals in an 18m circle around him, and it's in no public Solomon list (not tracklock pro or build, not lockbuilds top-30 where the lowest is 8.4%, not deadlocked). Rescue Beam heals a mate and yourself for 20% max health from 35m and can pull them in. It was in Kieran's in-game Chess Club Solomon. The Healing Rite and Counters notes are updated.","Order: 1123144223332441 (data-first redo, see a7/order_solomon.json).","Threshold: checked on the new order, nothing moved. Mystic Burst at 6.4k (75 spirit): Setup Bishop impact 70+2.0×75 = 220, Rook Battery 50+1.3×75 = 148 vs 80. Tankbuster at 30.4k (150 spirit): Rook Battery 245, Bishop impact 370 vs 165. Spirit Burn (rich, after the 48k core, 150+ spirit): Bishop 370 + Rook 245 = 615 in one combo vs 500.","Round 9: Mystic Expansion on the bishop moved out of lane (3.2k) to the start of Mid: extra placing range does little in a 1v1 lane, and tracklock.gg pro Solomon (last 30 days, 255 games, all after his Oct 9 release) buys it mid in 82% of games, never early. Mystic Burst moved from the 6.4k spike to just before Tankbuster in Late (pro: late 48%, Tankbuster late 54%). The spirit spike is now Extra Spirit, Improved Spirit, Compress Cooldown, Superior Cooldown = 4.8k at 8k souls (pro: Superior Cooldown 90% mid, Improved Spirit 76%). Grit and Extra Stamina moved into lane (pro early 70% and 55%), so 4.8k health now lands on Rescue Beam at 12k. Same items, same 48k.","Round 9: Worth a try box: Magic Carpet (12s flight at 7m/s, slow immune, +15% ability duration, +14 spirit; Solomon has no escape of his own; in YaBoyCJ's build Kieran plays) and Scourge (35m ally cast, 10s aura of 2.3% max health per second plus 40% spirit resist; Kingside Knight already throws that ally 13m into them; YaBoyCJ: 'insane with Kingside Knight').","Round 10: Echo Shard (6.4k, last core) out, Warp Stone (3.2k) in at the end of Mid. Since Jul 28 Echo Shard's cooldown is 30s + the rook's 21s, so one extra rook pair (about 245 damage at 150 spirit) every 51s; it's in no tracklock pro Solomon list (last 30 days, 255 games). Warp Stone is bought mid in 56% of pro games and Solomon has no escape of his own. Core 44.8k, 12 slots.","Round 11: added 'Another support on your team?' pivot: damage Solomon (Mystic Vulnerability, Mystic Reverb on the bishop, Escalating Exposure, Spirit Burn) in place of Heroic Aura, Guardian Ward, Divine Barrier and Refresher. Bishop impact 70 + 2.0x spirit clears Reverb's 100 at 17.6k. No early tier 4 run (Divine Barrier → Refresher is 38k+).","Round 12: default flipped to AoE damage (Kieran: Solomon default is AoE damage; support Solomon becomes its own build). Out of the core: Rescue Beam, Heroic Aura, Enchanter's Emblem. In: Mystic Vulnerability → Escalating Exposure (every bishop square, rook and queen tick stacks it), Slowing Hex (pro mid 32%), Mystic Reverb on the bishop (impact 70 + 2.0x spirit, cast every 3s via Move). Warp Stone moved up to land 4.8k health at 12k (Grit + Extra Stamina + Warp Stone). Tracklock pro Solomon (last 30 days, 255 games) is this build: Extra Spirit 90%, Superior Cooldown 90%, Mystic Expansion 82%, Guardian Ward 69%, Warp Stone 56%, Tankbuster 54%, no Rescue Beam or Heroic Aura.","Round 12: removed the old 'Another support on your team?' pivot box (role pivots become separate builds), the Worth a try box (Scourge) and with them the duplicate Spirit Burn.","Round 12: Mystic Burst/Tankbuster moved from Late to the end of Mid (16.8k/19.2k): bishop impact there is 70 + 2.0x 101 spirit = 272 (vs 80) and 70 + 2.0x 110 = 290 (vs 165).","Round 13: notes emptied per UPDATE 3 (only sells, swaps, slot locked, counters and verified tips kept); desc shortened to a style label (UPDATE 4).","Round 14: name 'Come Here My Pawns' (37 chars, style not obvious) -> 'Rizuhble's AoE Damage Solomon'. Slowing Hex out of the core (only one same-style source, as an early optional); Spirit Burn moves from the rich box (where it was the 'pricier version' of nothing in the build) into Late after Boundless Spirit: it is in all four same-style lockbuilds lists checked (official Spirit/Gun Hybrid Oct 19, Die Chance Oct 12, Queens Gambit Oct 17, Rook Assault Oct 11); bishop 370 + rook 245 at ~150 spirit clears 500. Rich box removed (nothing left that fits). Healing Rite out of the lane box (Kieran prefers Extra Regen; one clear pick). Counters notes made concrete and true (Dispel Magic doesn't stop piece placement; named heroes).","Round 15: name restored to 'Rizuhble's Come Here My Pawns Solomon' (Kieran cited it as a good style name; the code generator drops the prefix when too long), desc stays 'AoE damage Solomon'. Divine Barrier had an empty note, which the site and code generator fill with the default 'Expensive late upgrade to Guardian Ward. Same job as Counterspell...' (not allowed, and not the same job): now a real tip (CooldownReductionPctOnOthers 50). Counters description was 113 chars: 'for it' dropped.","Round 20: Refresher moved from core to the end of the late list (luxury); Echo Shard on Rook Battery takes its core slot (Echo can't imbue ults). New late list Diviner's Kevlar, Cheat Death, Refresher with sells; core+late 78.4k.","Round 23: Dispel Magic out of Counters. Kingside Knight T3 self-cast removes all debuffs after the move (RemoveDebuffs), and this build maxes Knight by point 13, so the kit already does Dispel's job.","Round 25: ability order 1123144223332441 -> 1123144123343242 (worked out from the kit for this build's playstyle). Compress Cooldown imbue 4 -> 3.","Cost pass: Hollow Point added after Warp Stone so gun reaches 4.8k (was a token 1.6k); Echo Shard moved to the rich box; counters now sell Grit (not Opening Rounds).","Relevance pass: Hollow Point (added in the cost pass only to land gun 4.8k) out for Alchemical Fire, same gun colour, same 3.2k, same spot, so every spike is unchanged. Hollow Point's +35% Weapon Damage and bullet-resist cut only work through your bullets, and every Solomon damage ability scales with spirit (Bishop 70 + 2.0x, Fork 50 + 1.3x, Queen 120 + 1.4x; none uses weapon damage). Alchemical Fire is a thrown 10m fire zone, 45 → 95 damage a second over 5s (+0.2x → +0.4x spirit), +10 spirit power and -7% bullet resist on enemies inside: AoE spirit damage for an AoE build."]},

 changes:["Round 13: new support build (the round 12 default is AoE damage) — sources: Kieran's earlier in-game heal support (a6/m/solomon: Heroic Aura, Guardian Ward → Divine Barrier, Enchanter's, Warp Stone, Refresher, same lane opener), seemeta Solomon highest-WR order (57.9%, 354 matches) 1122314422144333 which maxes Kingside Knight by point 10 (T2 +80 barrier and stamina, T3 two allies). Rescue Beam dropped: Kingside Knight already moves a mate (13m, invulnerable while moving), so its pull does nothing extra; Healing Nova (same Healing Rite parent, AoE 325 heal) heals the team instead. Trophy Collector for the support role. Compress Cooldown goes on the knight (25s, cast every fight) instead of the queen. Every item is from Kieran's support build or a kit swap (Healing Nova for Rescue Beam); Mystic Burst → Tankbuster as in his build (bishop impact 70 + 2.0x clears 80/165 at buy). No hero-wide pick rates used.","Round 14: Heroic Aura gets Kieran's condition (only with gun heroes on your team). Echo Shard now sells Trophy Collector (dead-end T2 needed a named sell; Heroic Aura is a support core item). Counters notes made concrete and true (Dispel Magic doesn't stop piece placement; named heroes).","Round 15: Divine Barrier empty note was filled by the default 'Expensive late upgrade...' text: now a real tip. Counters description was 123 chars: now after Healing Nova (the 4.8k health spike), 'Sell Enchanter's Emblem.' Extra Regen note no longer repeats the box title.","Round 17: the damage line is gone so it no longer shares the AoE build's core (Mystic Burst → Tankbuster bought fresh at 20k, Mystic Expansion → Greater Expansion on the bishop). In their place: Healing Booster right after Healing Nova (+20% to your Nova, Rite and Divine Barrier heals; Healing Tempo is its Slot locked upgrade, as on support Dynamo) and Cursed Relic late (a 3.25s silence/disarm on their carry while your team kills it). Heroic Aura note now 'Only if your team has gun heroes.' and a 'Swap for Heroic Aura' box (Knockdown, same 3.2k) keeps the core whole without it. Spikes: spirit 4.8k at 8.8k, health 4.8k at 11.2k unchanged; Cursed Relic leads Late (26.4k) for the next spirit step; core 48k, 12 slots.","Round 20: Refresher moved from core to last in the late list (luxury); Opening Rounds now stays until then. Late list Echo Shard, Witchmail, Cheat Death, Refresher; core+late 75.2k.","Round 23: Healing Tempo moved from Slot locked to the top of the late list. It triggers on any heal you apply to an ally (Healing Nova 18m, Healing Rite), giving them +35% fire rate and move speed for 7s, so it is a real support item here, not a tiny upgrade.","Round 25: ability order 1122314422144333 -> 1122324432413431 (worked out from the kit for this build's playstyle).","Slot locked: Healing Tempo moved out of the rich box (Kieran rule: tiny-gain expensive upgrades are Slot locked).","Cost pass: Heroic Aura swap is now Hollow Point (same gun colour and price, gun 4.8k kept); Knockdown moved to Counters; Refresher sells Enchanter's Emblem instead of Opening Rounds.","Relevance pass: Heroic Aura swap is now Alchemical Fire instead of Hollow Point (same gun colour and 3.2k, so gun 4.8k holds; same item Support Doorman uses here). Hollow Point's +35% Weapon Damage only adds to your own bullets, and this support's damage and healing scale with spirit; Alchemical Fire is a 10m fire zone that scales with spirit (45 → 95 a second, +0.2x → +0.4x spirit), +10 spirit power, and needs no gun."]},

 changes:["Round 13: new grenade build — style source: lockbuilds 'Possibly Solved Venator Dopamine Maxxing' (Oct 18, 'Rush T2 Gutshot always into Ult into Nade Max'): Restorative Shot, Close Quarters, Battle Vest, Extra Health, Fortitude; mid Berserker, Hollow Point, Extra Charge, Recharging Rush, Ballistic Enchantment, Rapid Recharge, Vampiric Burst ('charge items timed for T3 nades'); Cultist route optional (taken: farm); late Silencer, Crippling Headshot, Siphon Bullets. Its Opening Rounds and Weakening Headshot are left out (Kieran dislikes Weakening Headshot; Cultist covers the gun spike). Kit: grenade 35 + 1.0x weapon damage, so Battle Vest, Hollow Point and Berserker feed it; it only gets charges at T3 and the trap has 2, so Extra Charge, Recharging Rush and Rapid Recharge come after grenade T3 (point 12). Order follows that build's text: Gutshot T2, then the ult, then grenade max: 2213244441112333. No hero-wide pick rates used.","Round 14: Cultist and Extra Charge notes emptied (Cultist's extra charge only lasts while its buff is up; the grenade is already T3 when Extra Charge is bought). Metal Skin note trimmed to the condition. Counters now sell Battle Vest and Ricochet sells Recharging Rush, so both T2s left in the last 12 have a named sell. Divine Barrier added to rich as Dispel Magic's pricier version.","Round 15: ability points 13-16 now trap T1-T3 before Gutshot T3 (2213244441113332). The mobalytics source for Gutshot T3 at 13 couldn't be re-checked, and by kit the trap wins: T3 adds a charge (feeds Extra Charge/Rapid Recharge) and +30% damage to revealed targets, while Gutshot T3 only blesses a heavy melee, which this build never uses. Points 1-12 still follow 'Rush T2 Gutshot always into Ult into Nade Max'.","Round 16: Restorative Shot (Kieran: only on shotgun heroes; Venator's gun fires 1 bullet) → High-Velocity Rounds: same 800 gun slot, +8% weapon damage feeds the grenade (35 + 1.0x weapon damage); it's the first half of Opening Rounds in the source build's early game. Still bought first and sold for Crippling Headshot. Spikes unchanged.","Round 17: made clearly grenade-focused: Berserker (shared with the gun build) → Compress Cooldown on Consecrating Grenade (Mid, after Hollow Point; Recharging Rush now before Extra Charge so Extra Charge still lands with the grenade at T3, 16.8k), upgraded to Superior Cooldown at the start of Late, so the grenade (25s, 20s with T1) comes back every ~13s and its charges refill faster, on top of Extra Charge/Rapid Recharge. Transcendent Cooldown added to Slot locked as its upgrade. Lane sell note standard; Divine Barrier note now 'If you bought Dispel Magic, sell it for this.'.","Round 18: made clearly different from the new Melee Venator and checked against post-Sep 16 grenade builds (lockbuilds 'Possibly Solved Venator Dopamine Maxxing' Oct 18, 'JonJon' Sep 23, 'GUNATOR' Oct 1): Compress/Superior Cooldown and Mystic Expansion out (in none of them; they are melee-build items), Berserker back in Mid (Dopamine), Siphon Bullets out for Inhibitor (in all 3), Transcendent Cooldown slot-locked box removed with Superior. Ability order now Dopamine's 2134224441113 then trap T2/T3, Gutshot T3 last (JonJon): 2134224441113332. Gun 4.8k at Cultist (4.8k), 8k on Berserker, health 4.8k on Fortitude (9.6k), grenade T3 before Extra Charge (17.6k). Moved to first: grenade is by far the most-played Venator style on lockbuilds.","Round 20: late list extended with Siphon Bullets, Spellslinger, Colossus (Goysenberg's late items); core+late 75.2k.","Round 23: Spellslinger out of the late list, Glass Cannon in (sells Hollow Point). Consecrating Grenade (35 + 1.0x weapon damage), Gutshot (60 + 0.7x, wall bonus 30 + 0.8x) and Ira Domini stakes (120 + 1.5x) scale with weapon damage, not fire rate, so +80% weapon damage raises all of them and the gun (33-round magazine).","Round 25: ability order 2134224441113332 -> 1123141322443423 (worked out from the kit for this build's playstyle).","Cost pass: Bullet Lifesteal added in Mid (mid-game sustain) so Vampiric Burst costs 1.6k less."]},

 changes:["Rapid Rounds to Swift Striker added (Parzelion's build Kieran plays has it in lane core; 62% pick on Venator, the most-bought gun T2). Rapid Rounds is bought right after Cultist and Swift Striker right after the greens, so gun lands 6.4k exactly on Swift Striker and 8k exactly on Recharging Rush (before it sat at 6.4k then 9.6k).","Siphon Bullets moved from core to rich (sell Berserker): it was the last 6.4k and the build was 53.6k. Total is now 48.8k, core 12 slots: Cultist, Point Blank, Swift Striker, Enduring Speed, Vampiric Burst, Recharging Rush, Ballistic Enchantment, Spellslinger, Berserker, Hollow Point, Ricochet (sells Restorative Shot), Silencer (sells Battle Vest).","Health 4.8k now lands at 10.4k instead of 9.6k because Rapid Rounds goes first; Venator has no kit sustain, so that is still inside the 11-12k window. Everything else (Restorative Shot opener, Cultist by 8 minutes, Enduring Speed/Bullet Lifesteal/Battle Vest greens, grenade items, Silencer 55.5% WR / Ricochet 53.8% / Spellslinger 58.8%) kept from the base.","Not taken from Parzelion: Extended/Titanic Magazine and Fortitude (Battle Vest and Enduring Speed already cover weapon damage and speed; Fortitude only 48.8% WR and Kieran's no-default rule), Fleetfoot and Weighted Shots (no slot left; Fleetfoot is a 51% pick, 50.6% WR option if he wants to swap Hollow Point).","Ability order: Mobalytics Venator grid and Kieran's Parzelion build both go Gutshot T1/T2 then Ira Domini maxed 7-9, grenade 10-12, trap 14-15; for the grenade style grenade T1/T2 are taken with Gutshot T1 at 5-7, and grenade T3 is pulled to 10 because only T3 makes Consecrating Grenade work with charge items (Recharging Rush is the first Mid item), ult T3 right after, trap/Gutshot T3 last.","Item fit: Recharging Rush → Fleetfoot (same 1.6k T2 gun item, same slot at 12.8k, so gun still lands 8k there). Recharging Rush isn't in tracklock pro Venator's buys, tracklock's build page, lockbuilds' top-30 Venator items (lowest is 13.1%) or either of Kieran's Venator builds. Fleetfoot is 61% pro mid-game (tracklock) and 24.6% on lockbuilds, and it's core in the Parzelion build Kieran plays. Venator has to walk into close range for his gun, so no move penalty while shooting, 40% slow resist and the +3m/s active fit him. The Counters sell note now names Fleetfoot.","Order: 2213244441211333 (data-first redo, see a7/order_venator.json).","Round 8: Ricochet moved from third to first in Late (36k souls, was 42.4k). Sep 16 made Ira Domini work with Ricochet (all stakes bounce, 65% damage to 2 more heroes in 13m). Lockbuilds 'Gun Devil VENATOR' (official, updated Oct 17, after Venator's last change Jul 28 and the Sep 16 item patch) has it in mid game; tracklock last 30 days (311 games) late 18%. Restorative Shot sell moved to Hollow Point, which now takes slot 13.","Round 9: Spellslinger (6.4k at 29.6k) → Extra Charge → Rapid Recharge (3.2k), bought right after Ricochet (now 29.6k, was 36k) at 30.4k-32.8k, once the grenade is T3 and gets charges (sp.js on the current order: grenade T3 at 29.6k). For grenade Venator this means 2 extra grenades and traps with 30% faster charges and +14 spirit on charged abilities (the trap is 80 + 2.2x spirit). Tracklock.gg pro Venator (last 30 days to Oct 19, 311 games): Rapid Recharge 39% late, Extra Charge 28% mid; Spellslinger is in no pro list and not in Parzelion's build (Kieran's). Core 45.6k (was 48.8k). Vampiric Burst note no longer mentions Spellslinger. Cultist note fixed: its extra charge only works on abilities with charges, so it's a spare trap (2 charges), not a grenade, until grenade T3.","Round 10: Rapid Rounds → Swift Striker swapped for Extended Magazine → Titanic Magazine (same 800 + 1.6k, same slots, gun still 6.4k at 11.2k). The grenade (35 + 1.0x weapon damage), Gutshot (60 + 0.7x) and Ira Domini (120 + 1.5x) all scale with weapon damage, not fire rate, so +14% weapon damage feeds the whole kit while 20% fire rate only feeds the gun. Tracklock pro Venator (last 30 days, 311 games): Extended Magazine 65%, Titanic Magazine 55% early; Rapid Rounds and Swift Striker are in no phase list.","Round 11: 'Lost lane?' box (empty): Ricochet right after Battle Vest so you clear camps faster. Extra Charge and Rapid Recharge moved before Ricochet so Vampiric Burst and Ricochet aren't back to back. Restorative Shot note now names Hollow Point as its sell (Hollow Point already said so).","Round 12: Hollow Point (3.2k gun, 39.2k) out, Siphon Bullets (6.4k green) in from the rich box. Hollow Point isn't in tracklock pro Venator at all (last 30 days, 311 games) and only works above 65% health, which a hero who has to walk into shotgun range often isn't; Siphon is bought late in 35% of pro games and steals max health off every target he shoots up close. Lucky Shot (rich) now sells Berserker; Restorative Shot is sold for Siphon. Health spike unchanged at 10.4k.","Round 13: notes emptied per UPDATE 3 (only sells, swaps, slot locked, counters and verified tips kept); desc shortened to a style label (UPDATE 4).","Round 14: ability order now Kieran's played gun build (Parzelion) 2213244441113332: grenade maxed before Gutshot T3, so the grenade is T3 (gets charges) before Extra Charge/Rapid Recharge, and Gutshot T3 (a blessed heavy melee) comes last on a gun build. Desc says gun. Cultist note emptied (its extra charge only lasts while the buff is up). Metal Skin note trimmed to the condition. Lucky Shot now sells Titanic Magazine (a T2 left in the last 12 with no named sell). Divine Barrier added to rich as Dispel Magic's pricier version.","Round 16: Restorative Shot (Kieran: only on shotgun heroes; Venator's gun fires 1 bullet) → Melee Lifesteal, the lane-sustain pick in lockbuilds 'Venator - Gun Devil' (Oct 18) early optional. Still bought first and sold for Siphon Bullets. Gun 4.8k now at 5.6k (Extended Magazine), health 4.8k still at 10.4k.","Round 17: lane sell note standard ('Sell it once you're out of slots.'); Divine Barrier note now 'If you bought Dispel Magic, sell it for this.'. Items unchanged: the grenade variant was made the grenade build instead.","Round 18: rebuilt as Melee Venator (Kieran: close-range isn't a playstyle, melee is). Items from lockbuilds melee builds after the Sep 16 patch: 'Blessed Melee Venator' (Wapple, Sep 26), 'GODS STRONGEST SOLDIER (MELEE VENATOR)' (Sep 30), 'Stake Thy Neighbor' (Oct 12): Melee Lifesteal, Close Quarters, Melee Charge, Lifestrike, Battle Vest, Point Blank, Enduring Speed, Crushing Fists, Echo Shard, Juggernaut in all 3; Hunter's Aura, Warp Stone, Compress/Superior Cooldown, Mystic/Greater Expansion, Spirit Resilience in 2 (core in Wapple and GODS); Monster Rounds/Cultist and Extra Regen from GODS. Gun 4.8k at Cultist (5.6k), health 4.8k at Lifestrike (10.4k souls), gun 16k on Crushing Fists. Order 2134222444331113: Gutshot maxed first (Wapple T3 at 7, Stake at 8), ult next (GODS, Stake), grenade last.","Round 20: late list Colossus, Phantom Strike, Diviner's Kevlar, Cheat Death (each with a sell); core+late 75.2k.","Round 23: kit re-read, no item change (see log).","Round 25: ability order 2134222444331113 -> 2231243234414311 (worked out from the kit for this build's playstyle)."]},

 changes:["Round 13: new spirit tank build (the existing one is the gun hybrid) — style source: deadlocklabs.gg Victor meta consensus, a pure spirit/vitality path (Extra Spirit, Extra Regen, Improved Spirit, Mystic Regen, Extra Charge, Healing Booster, Spirit Lifesteal, Enduring Speed, Mystic Vulnerability, Escalating Exposure, Transcendent Cooldown, Healing Tempo; Infuser among its popular items). Kit-justified: Torment Pulse (hits the 2 closest every 1.4s, 25 + 0.23x, he sits in them), Mystic Burst → Tankbuster (battery 100 + 1.6x per bolt clears 80 and 165 at buy), Mystic Expansion on the aura (8m radius), Compress Cooldown on the 240s revive, Scourge (self-cast aura, 2.3% max health a second in 10m, +40% spirit resist), Spirit Burn (aura up to 58 + 0.72x a second plus a battery clears 500 in 5s at 46k). Jumpstart has 1 charge (+1 at T3), so Extra Charge adds one. Hero-wide win rates are not used to justify items. Order: seemeta most popular (57.2%, 6,414 matches) 1123144134422233; Victor's public data is almost all spirit builds.","Round 14: renamed Spirit Victor (the build ends with no more health than the gun hybrid, so 'tank' was a false claim). Mystic Burst → Tankbuster out (in no spirit Victor list: RawDawger, Eido's, mobalytics Archon+; only the battery clears 80/165 and it needs 40% of your health lost per charge); Warp Stone in at the same 3.2k (RawDawger mid core, mobalytics late 35%), gets you into aura range. Healing Tempo moved to Slot locked (Kieran's rule; RawDawger rates it last-buy). Witchmail out of rich (not a pricier version of a build item); Juggernaut added to Slot locked; Divine Barrier added as Dispel Magic's pricier version. Counters now sell Torment Pulse (Mystic Vulnerability turns into Escalating Exposure). Order now RawDawger/mobalytics 1234114134422233. Notes trimmed to the condition.","Round 15: rebuilt as a real spirit tank (Kieran asked for a spirit tank Victor; the round-14 rename to Spirit Victor dropped his style). Same-style sources: lockbuilds 638121 UNGA BUNGA VICTOR ('Frontliner', Oct 16), 629760 30:00 EGG's Frontline Victor (Oct 5), 569180 Frankensteins Looksmaxxer ('a frontliner build', Sep 28). Juggernaut (core in all three), Plated Armor (UNGA core, EGG luxury) and Witchmail (UNGA core, late) moved into the core; Scourge kept (EGG core: +40% spirit resist, damage from enemy max health). Extra Charge/Rapid Recharge, Spirit Burn and Plated Armor's counter slot out. Health invest 12.8k -> 30.4k (gun hybrid stays 12.8k); spirit 4.8k at 5.6k, health 4.8k at 9.6k unchanged. Name 'Rizuhble's Spirit Tank Victor', desc 'Spirit tank Victor'. Counters after Infuser, sell Warp Stone (desc now fits 112). Refresher sells Torment Pulse. Order alternates spirit and health after the 4.8k spikes (damage, health, damage...). Plated Armor carries a swap note because an empty note would show the site's default counter text.","Round 17: Counterspell added to Counters (none in the build). Lane sells now 'Sell it once you're out of slots.'; Divine Barrier note 'If you bought Dispel Magic, sell it for this.' (Dispel is in Counters). Pair check: the gun hybrid main now opens gun-first (Close Quarters, Extended Magazine, Titanic, Point Blank) with Spiritual Overflow; this build stays spirit + tank (Torment Pulse, Juggernaut, Scourge, Plated Armor, Witchmail).","Round 19: this full Spirit Victor (Kieran's Aura Brawler: Torment Pulse, Infuser early) is now the MAIN build in id victor, moved from victor_spirit, because it is the common public style (lockbuilds Victor item stats: Infuser 44.2%, Torment Pulse 41.1%, Opening Rounds 7.0%). Rebuilt to the public spirit core (RawDawger Oct 18, Eido's Oct 19, cropdust Oct 4, YOU CAN'T KILL ME Oct 14, tauva Sep 30, apacycle spirit Oct 9): Infuser moved up to 16.8k right after Mystic Expansion (RawDawger core order); Plated Armor and Witchmail out of the core (tank add-ons, not in the spirit core lists; Plated Armor back to Counters); Ethereal Shift and Refresher into the core (RawDawger mid, cropdust mid, Eido's final form). Spirit Burn in rich as Healbane's pricier version. Name 'Rizuhble's Aura Brawler Victor', desc 'Spirit Victor'. Spirit 4.8k at 5.6k, health 4.8k at 9.6k, Infuser 16.8k.","Round 20: Mystic Regeneration out of the lane box. Ethereal Shift and Refresher moved from core to the end of the late list (luxuries); Spirit Burn and Witchmail take their core slots. Core+late 80k.","Round 23: kit re-read, no item change (see log).","Round 25: ability order 1234114134422233 -> 3312341312214424 (worked out from the kit for this build's playstyle). Compress Cooldown imbue 4 -> 2.","Cost pass: Boundless Spirit moved to right after Scourge (was the last buy)."]},

 changes:["Round 19: new Gun Victor (Kieran: 'Opening Rounds, Titanic Mag, Rapid Rounds, Swift Striker, Spellslinger'), replacing the invented 'Gun Hybrid' that was in id victor. Same-style public builds: Mast Nailbiter Victor (lockbuilds 698892, Oct 5), CITYPOP hybrid gun path (715412, Oct 12), apacycle - gun (611933, Sep 4), rina Carry Victor (mobalytics, Sep 3; mobalytics' starter build). Gun 4.8k at 5.6k (High-Velocity > Opening Rounds, Extended > Titanic Magazine, Rapid Rounds > Swift Striker), health 4.8k at 9.6k (Healing Booster, Enduring Speed, Bullet Lifesteal), then Quicksilver on Jumpstart, Berserker, Mercurial Magnum, Spiritual Overflow, Spellslinger, Leech, Healing Tempo. No Mystic Shot (8s cooldown on a gun that fires every 0.198s).","Round 20: Mystic Regeneration out of the lane box. Ethereal Shift moved from core to the late list (luxury), Frenzy takes its core slot. Late list Lucky Shot, Ethereal Shift, Refresher; core+late 78.4k.","Round 23: kit re-read, no item change (see log).","Round 25: ability order 1234114134422233 -> 2213241231443143 (worked out from the kit for this build's playstyle). Compress Cooldown imbue 4 -> 2."]},
