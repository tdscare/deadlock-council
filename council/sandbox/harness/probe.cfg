// probe.cfg  exec in the Sandbox (hero testing map). Each step prints "SBXMARK PROBE n ..." so you can see it in the log.
// Run: exec probe     then read the console and answer the YES/NO list in HARNESS.md. A command that does not exist prints "Unknown command" (good: then you know).
sv_cheats true
citadel_hero_testing_enabled true
echo SBXMARK PROBE 1 echo+alias
alias probe_alias "echo SBXMARK PROBE 1 alias_ok"
probe_alias
echo SBXMARK PROBE 2 logging: trying con_logfile
con_logfile sbx_probe.log
echo SBXMARK PROBE 2 con_logfile_line_after_set
// check <Deadlock>\game\citadel\ (or game\bin\win64\) for sbx_probe.log. If absent: relaunch with -condebug and look for console.log.
echo SBXMARK PROBE 3 names
dump_hero_names
echo SBXMARK PROBE 4 giveitem
resetme
giveitem upgrade_improved_spirit
giveitem upgrade_magic_reach 2
// expect: item appears in inventory; magic_reach (Mystic Expansion) imbued on ability 3 (index 2)
echo SBXMARK PROBE 5 souls_level
citadel_give_gold 5000
givelevelupgold 5
// note souls/level now. Then: resetme again and see what is cleared
echo SBXMARK PROBE 6 enemy
citadel_create_unit hero_haze 3
// expect: enemy Haze in front of you. If it is allied, try team 2 / 1. Then:
citadel_bot_brain_disable_movement true
citadel_bot_brain_disable_attacks true
// expect: bot stands still and does not shoot
echo SBXMARK PROBE 7 damage_readout
debug_takedamage_summaries true
hud_damagemeter true
// NOW shoot the bot for ~5s, then run:  condump   and open the file: do damage lines appear with numbers?
echo SBXMARK PROBE 8 position
getpos
// copy the printed values, move away, then:  setpos <those values>   -> did you return?
echo SBXMARK PROBE 9 hurt_heal
hurtme
healthpct 100
echo SBXMARK PROBE 10 cooldowns
citadel_enable_fast_cooldowns
echo SBXMARK PROBE END
condump
